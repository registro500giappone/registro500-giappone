name: クロール FD Ricambi（週2回）

on:
  workflow_dispatch:  # 手動実行のみ（GitHub Actions IPがfdricambi.comにブロックされるため自動スケジュール停止）

# AI翻訳（ai_marathon_final_v9.py）を呼ぶ6本は同じグループで順番に走らせる（同じ行の二重翻訳＝Gemini の無駄を防ぐ）。
# 時刻は変えない。同時刻に重なるのは最大2本＝待ちは1本まで（GitHub は待ちを1本しか持たず、3本目が来ると待ちの方が取り消される）。
concurrency:
  group: parts-translate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # 2026-06-02のNode 24強制移行を先取り

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Store API版: 推定2〜5分で完了

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r py/requirements.txt

      - name: .env 作成
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > py/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> py/.env

      - name: FD Ricambi クロール
        run: python py/parts_search_v2.py

      - name: AI翻訳（新規レコードのみ）
        if: success()
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> py/.env
          python py/ai_marathon_final_v9.py

      - name: 価格・在庫スナップショット記録
        if: always()
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/take_parts_snapshot" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json"
