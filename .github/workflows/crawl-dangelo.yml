name: クロール D'Angelo Motori（週2回）

# 2026-08-08: 定期実行を停止した。
# dangelomotori.it が SiteGround のボット保護を有効にしたらしく、Store API も
# robots.txt も HTTP 202 + `sg-captcha: challenge` を返してデータセンターIPからの
# アクセスを遮断している。リトライでは通らないので、走らせるだけ失敗通知が出る。
# CAPTCHAの回避はしない（相手が明示的に拒否しているため）。
# 再開するには、ショップにクロールの可否を確認し、許可が得られる場合に
# Bot UA/送信元の許可リスト登録を依頼したうえで cron を戻すこと。
# 状況確認用に手動実行だけは残してある。
on:
  # schedule:
  #   - cron: '0 12 * * 2,6'  # 火・土 JST 21:00 (UTC 12:00)
  workflow_dispatch:          # 手動実行ボタン

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # 2026-06-02のNode 24強制移行を先取り

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # Store API版: 通常2〜5分。最悪ケース（外部リトライ23分待機）に余裕を持たせる

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r py/requirements.txt

      - name: .env 作成
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > py/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> py/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> py/.env

      - name: D'Angelo Motori クロール
        run: python py/dangelo_recon.py

      - name: AI翻訳（新規レコードのみ）
        if: success()
        run: python py/ai_marathon_final_v9.py

      - name: 価格・在庫スナップショット記録
        if: always()
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/take_parts_snapshot" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json"
