name: YouTubeポータル AI要約 生成（夜間/手動）

on:
  schedule:
    - cron: '0 17 * * *'   # 毎日 JST 02:00 (UTC 17:00) — steps_ja未生成の動画を少しずつバックフィル（手順=howto/要点=見る系）
  workflow_dispatch:
    inputs:
      limit:
        description: '1回の処理件数上限（Gemini無料枠のトークン上限回避）'
        required: false
        default: '30'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 動画sitemapを再生成してコミットするため

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r py/requirements.txt

      - name: .env 作成
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > py/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> py/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> py/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> py/.env

      - name: AI要約 生成（手順カード＋要点まとめ・v2再生成／新着補完）
        run: python py/youtube_steps.py --regenerate --limit ${{ github.event.inputs.limit || '30' }}

      - name: 動画sitemap 再生成
        run: python py/gen_video_sitemap.py

      - name: sitemap-videos.xml に差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-videos.xml
          if git diff --cached --quiet; then
            echo "sitemap 変更なし — スキップ"
          else
            git commit -m "chore(sitemap): 動画sitemap再生成 [skip ci]"
            git push
          fi
