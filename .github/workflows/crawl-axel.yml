name: クロール Axel Gerstl（週1回）

on:
  schedule:
    - cron: '0 12 * * 0'  # 日曜 JST 21:00 (UTC 12:00)
  workflow_dispatch:        # 手動実行ボタン

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 再構築後の推定120〜160分 + 余裕（Selenium不要になったため大幅短縮）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r py/requirements.txt

      - name: .env 作成
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > py/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> py/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> py/.env

      - name: Axel Gerstl クロール
        run: python py/axel_full_search.py

      - name: AI翻訳（新規レコードのみ）
        if: success()
        run: python py/ai_marathon_final_v9.py
