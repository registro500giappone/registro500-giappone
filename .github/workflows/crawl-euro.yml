name: クロール EuroItalia500（週3回）

on:
  schedule:
    - cron: '0 12 * * 1,3,5'  # 月・水・金 JST 21:00 (UTC 12:00)
  workflow_dispatch:            # 手動実行ボタン

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # 2026-06-02のNode 24強制移行を先取り

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # クロールはStore API化で数分。初回はAI翻訳バックログ(約2,800件)に余裕を持たせる

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r py/requirements.txt

      - name: .env 作成
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > py/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> py/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> py/.env

      - name: EuroItalia500 クロール
        run: python py/euroitalia500_recon.py

      - name: AI翻訳（新規レコードのみ）
        if: success()
        run: python py/ai_marathon_final_v9.py

      - name: 価格・在庫スナップショット記録
        if: always()
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/take_parts_snapshot" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json"
