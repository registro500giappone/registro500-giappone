<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-27SHHC4JYH');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイ500ストーリー - Registro500 Giappone</title>
  <meta name="description" content="500 ＆ 126オーナーたちの愛車にまつわるストーリー。入手のきっかけ、トラブル、チューン、ドライブ記録。">
  <meta property="og:title" content="マイ500ストーリー - Registro500 Giappone">
  <meta property="og:description" content="500 ＆ 126オーナーたちの愛車にまつわる物語。">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://www.registro500.com/stories.html">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0" integrity="sha384-NFPmVbJvc91cC9zbheWJA+qZKj0Kod2IEMvGnxVKB5A7wLgRNA6Aobu8neZmQ19J" crossorigin="anonymous"></script>
  <script>const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
  <style>
    :root {
      --cream:      #FAFAF7;
      --warm-white: #F4F6F1;
      --ink:        #1A1A18;
      --ink-light:  #484844;
      --ink-faint:  #888880;
      --border:     #DDD8CE;
      --accent:     #4D6B3C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--cream); scroll-behavior: smooth; }
    body { font-family: 'Noto Serif JP', 'Georgia', serif; color: var(--ink); line-height: 1.9; background: var(--cream); }

    /* ナビ */
    .st-nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--ink);
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 14px 24px; gap: 12px;
    }
    .st-nav-back {
      font-size: 0.75rem; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.8); text-decoration: none;
    }
    .st-nav-back:hover { color: #fff; }
    .st-nav-series {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.68rem; letter-spacing: 0.3em;
      color: rgba(255,255,255,0.45); text-align: center; white-space: nowrap;
    }
    .st-nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem; letter-spacing: 0.3em;
      color: rgba(255,255,255,0.65); text-decoration: none;
      text-transform: uppercase; text-align: right;
    }
    @media (max-width: 600px) { .st-nav-series { display: none; } .st-nav { grid-template-columns: 1fr 1fr; } }

    /* ページヘッダー */
    .st-header {
      text-align: center;
      padding: 72px 24px 56px;
      border-bottom: 1px solid var(--border);
    }
    .st-header-kicker {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem; letter-spacing: 0.5em;
      text-transform: uppercase; color: var(--accent);
      display: block; margin-bottom: 20px;
    }
    .st-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 300; letter-spacing: 0.1em;
      line-height: 1.2; margin-bottom: 16px;
    }
    .st-header-sub {
      font-size: 0.88rem; color: var(--ink-faint);
      letter-spacing: 0.08em; font-weight: 300;
    }

    /* フィルター */
    .st-filter-wrap {
      max-width: 860px; margin: 0 auto;
      padding: 28px 28px 0;
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    .st-filter-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border: 1px solid var(--border);
      background: none; cursor: pointer;
      color: var(--ink-faint); border-radius: 0;
      transition: all 0.15s;
    }
    .st-filter-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
    .st-filter-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    /* 記事リスト */
    .st-list {
      max-width: 860px; margin: 0 auto;
      padding: 0 28px 100px;
    }

    /* フィーチャー（最初の1件） */
    .st-feature {
      padding: 56px 0 48px;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      display: block;
    }
    .st-feature:hover .st-feature-title { text-decoration: underline; text-decoration-color: var(--border); }
    .st-feature-img-wrap {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      margin-bottom: 28px;
    }
    .st-feature-img {
      width: auto; max-width: 100%;
      height: auto; max-height: 520px;
      display: block;
    }
    .st-feature-img-placeholder {
      width: 100%; aspect-ratio: 16/7;
      background: var(--warm-white);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: var(--border);
      margin-bottom: 28px;
    }
    .st-feature-meta {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 14px;
    }
    .st-type-label {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.82rem; letter-spacing: 0.15em;
      color: var(--accent); font-weight: 500;
    }
    .st-date {
      font-size: 0.88rem; color: var(--ink-light);
      letter-spacing: 0.04em;
    }
    .st-new-badge {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.68rem; letter-spacing: 0.2em;
      background: #e11d48; color: #fff;
      padding: 2px 8px; border-radius: 10px;
      font-weight: 500;
    }
    .st-feature-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 400; line-height: 1.35;
      letter-spacing: 0.04em; margin-bottom: 14px;
    }
    .st-feature-excerpt {
      font-size: 0.92rem; color: var(--ink-light);
      line-height: 1.9; font-weight: 300;
      max-width: 600px;
    }
    .st-feature-owner {
      margin-top: 18px;
      font-size: 0.88rem; color: var(--ink-light);
      letter-spacing: 0.04em;
    }

    /* 通常記事（横並び） */
    .st-article {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 28px;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      align-items: start;
    }
    .st-article:hover .st-article-title { text-decoration: underline; text-decoration-color: var(--border); }
    @media (max-width: 600px) {
      .st-article { grid-template-columns: 120px 1fr; gap: 16px; }
    }
    .st-article-img {
      width: 100%; aspect-ratio: 1/1;
      object-fit: cover; object-position: center top;
      display: block;
    }
    .st-article-img-placeholder {
      width: 100%; aspect-ratio: 1/1;
      background: var(--warm-white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: var(--border);
    }
    .st-article-meta {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 10px;
    }
    .st-article-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      font-weight: 400; line-height: 1.4;
      letter-spacing: 0.03em; margin-bottom: 10px;
    }
    .st-article-excerpt {
      font-size: 0.85rem; color: var(--ink-light);
      line-height: 1.8; font-weight: 300;
    }
    .st-article-owner {
      margin-top: 12px;
      font-size: 0.82rem; color: var(--ink-light);
      letter-spacing: 0.04em;
    }

    .st-loading { text-align: center; padding: 5rem 0; color: var(--ink-faint); font-family: 'Cormorant Garamond', serif; letter-spacing: 0.2em; font-size: 0.85rem; }
    .st-empty  { text-align: center; padding: 5rem 0; color: var(--ink-faint); font-size: 0.9rem; }
  </style>
</head>
<body>

  <nav class="st-nav">
    <a class="st-nav-back" id="stNavBack" href="index.html">← ガレージに戻る</a>
    <span class="st-nav-series" id="stNavSeries">Registro500 Giappone</span>
    <a class="st-nav-logo" id="stNavLogo" href="index.html">Registro500</a>
  </nav>

  <header class="st-header">
    <span class="st-header-kicker">Owner's Stories</span>
    <h1 class="st-header-title" id="stPageTitle">オーナーズストーリー</h1>
    <p class="st-header-sub">500 ＆ 126オーナーたちの愛車にまつわる物語</p>
  </header>

  <div class="st-filter-wrap" id="carFilterRow">
    <button class="st-filter-btn active" data-car="">All</button>
    <button class="st-filter-btn" data-car="500">FIAT 500</button>
    <button class="st-filter-btn" data-car="126">FIAT 126</button>
  </div>

  <div class="st-filter-wrap" id="filterRow" style="padding-top: 12px;">
    <button class="st-filter-btn active" data-type="">すべて</button>
    <button class="st-filter-btn" data-type="acquisition">入手</button>
    <button class="st-filter-btn" data-type="trouble">トラブル</button>
    <button class="st-filter-btn" data-type="tuning">チューン</button>
    <button class="st-filter-btn" data-type="drive">ドライブ</button>
    <button class="st-filter-btn" data-type="event">イベント</button>
    <button class="st-filter-btn" data-type="other">その他</button>
  </div>

  <main class="st-list">
    <div id="stLoading" class="st-loading">Loading…</div>
    <div id="stContent"></div>
    <div id="stEmpty" class="st-empty" style="display:none;">まだストーリーがありません。</div>
  </main>

  <script>
    const TYPE_LABELS = { acquisition:'入手', trouble:'トラブル', tuning:'チューン', drive:'ドライブ', event:'イベント', other:'その他' };

    function esc(s) {
      if (!s) return '';
      return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatEpisodeDate(dateStr, precision, approx) {
      if (!dateStr) return '';
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
      if (!m) return dateStr;
      const y = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      const d = parseInt(m[3], 10);
      let base = '';
      if (precision === 'year') base = `${y}年`;
      else if (precision === 'month') base = `${y}年${mo}月`;
      else base = `${y}年${mo}月${d}日`;
      if (approx && precision !== 'day') base += '頃';
      return base;
    }

    let allEpisodes = [];
    const params = new URLSearchParams(location.search);
    const carFilter  = params.get('car')  || '';   // 特定の車両IDで絞り込み
    const typeParam  = params.get('type') || '';   // '500' or '126' で車種絞り込み

    // URLパラメータによる初期フィルター設定
    let activeCarType = typeParam; // '' / '500' / '126'
    let activeEpType  = '';

    function initFilters() {
      // car_typeフィルターの初期選択
      if (typeParam) {
        document.querySelectorAll('#carFilterRow .st-filter-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.car === typeParam);
        });
        // ページタイトル変更
        if (typeParam === '500') document.getElementById('stPageTitle').textContent = 'マイ500ストーリー';
        if (typeParam === '126') document.getElementById('stPageTitle').textContent = 'マイ126ストーリー';
      }
      // 126モード時はナビとブランドを126側に切り替え
      if (typeParam === '126') {
        document.getElementById('stNavBack').href = '126/index.html';
        document.getElementById('stNavLogo').href = '126/index.html';
        document.getElementById('stNavLogo').textContent = 'Registro126';
        document.getElementById('stNavSeries').textContent = 'Registro126 Giappone';
        document.title = 'マイ126ストーリー - Registro126 Giappone';
      }
    }

    async function fetchStories() {
      let query = supabaseClient
        .from('car_episodes')
        .select('id, car_id, type, title, content, cover_url, episode_date, date_precision, is_approximate, source_url, source_label, created_at')
        .eq('is_published', true)
        .order('created_at', { ascending: false, nullsFirst: false })
        .limit(100);
      if (carFilter) query = query.eq('car_id', carFilter);

      const { data, error } = await query;
      document.getElementById('stLoading').style.display = 'none';
      if (error || !data) { document.getElementById('stEmpty').style.display = 'block'; return; }

      const carIds = [...new Set(data.map(e => e.car_id))];
      const { data: cars } = await supabaseClient.from('cars').select('document_id, handle_name, model_display_c, year, car_type').in('document_id', carIds);
      const carMap = {};
      (cars || []).forEach(c => { carMap[c.document_id] = c; });

      allEpisodes = data.map(ep => ({ ...ep, car: carMap[ep.car_id] || null }));
      applyFilters();
    }

    function applyFilters() {
      let filtered = allEpisodes;
      if (activeCarType) filtered = filtered.filter(ep => (ep.car?.car_type || '500') === activeCarType);
      if (activeEpType)  filtered = filtered.filter(ep => ep.type === activeEpType);
      renderStories(filtered);
    }

    function renderStories(episodes) {
      const content = document.getElementById('stContent');
      const empty   = document.getElementById('stEmpty');
      if (!episodes.length) { content.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      let html = '';
      episodes.forEach((ep, i) => {
        const label    = TYPE_LABELS[ep.type] || ep.type;
        const dateStr  = ep.episode_date
          ? formatEpisodeDate(ep.episode_date, ep.date_precision || 'day', !!ep.is_approximate)
          : (ep.created_at ? ep.created_at.slice(0,10).replace(/-/g,'.') : '');
        const car      = ep.car;
        const owner    = car ? (car.handle_name || '') : '';
        const carName  = car ? ((car.year ? car.year + '年 ' : '') + (car.model_display_c || '')) : '';
        const carType  = car?.car_type || '500';
        const carBadge = carType === '126'
          ? `<span style="font-family:'Cormorant Garamond',serif;font-size:0.62rem;letter-spacing:0.2em;color:var(--ink-faint);border:1px solid var(--border);padding:1px 6px;">126</span>`
          : '';
        const sourceBadge = ep.source_url
          ? `<span style="font-family:'Cormorant Garamond',serif;font-size:0.62rem;letter-spacing:0.15em;color:var(--ink-faint);background:#f1ede4;padding:2px 8px;border-radius:10px;">🔗 外部掲載</span>`
          : '';
        const isNew = ep.created_at
          && (Date.now() - new Date(ep.created_at).getTime()) / 86400000 < 7;
        const newBadge = isNew ? `<span class="st-new-badge">NEW</span>` : '';
        const coverImg  = ep.cover_url || null;
        const excerpt   = ep.content ? (ep.content.length > 120 ? ep.content.slice(0,120) + '…' : ep.content) : '';
        const href      = `episode.html?ep=${esc(ep.id)}`;

        if (i === 0) {
          // フィーチャー（最初の1件・縦/正方形もそのまま表示）
          const imgHtml = coverImg
            ? `<div class="st-feature-img-wrap"><img class="st-feature-img" src="${esc(coverImg)}" loading="lazy" onerror="this.parentNode.outerHTML='<div class=&quot;st-feature-img-placeholder&quot;>🚗</div>'"></div>`
            : `<div class="st-feature-img-placeholder">🚗</div>`;
          html += `<a class="st-feature" href="${href}">
            ${imgHtml}
            <div class="st-feature-meta">
              ${newBadge}
              ${carBadge}
              <span class="st-type-label">${esc(label)}</span>
              <span class="st-date">${esc(dateStr)}</span>
              ${sourceBadge}
            </div>
            <h2 class="st-feature-title">${esc(ep.title)}</h2>
            ${excerpt ? `<p class="st-feature-excerpt">${esc(excerpt)}</p>` : ''}
            <div class="st-feature-owner">${esc(owner)}${carName ? ' &nbsp;·&nbsp; ' + esc(carName) : ''}</div>
          </a>`;
        } else {
          // 通常記事（横並び）
          const imgHtml = coverImg
            ? `<img class="st-article-img" src="${esc(coverImg)}" loading="lazy" onerror="this.outerHTML='<div class=st-article-img-placeholder>🚗</div>'">`
            : `<div class="st-article-img-placeholder">🚗</div>`;
          const shortExcerpt = ep.content ? (ep.content.length > 80 ? ep.content.slice(0,80) + '…' : ep.content) : '';
          html += `<a class="st-article" href="${href}">
            ${imgHtml}
            <div>
              <div class="st-article-meta">
                ${newBadge}
                ${carBadge}
                <span class="st-type-label">${esc(label)}</span>
                <span class="st-date">${esc(dateStr)}</span>
                ${sourceBadge}
              </div>
              <h3 class="st-article-title">${esc(ep.title)}</h3>
              ${shortExcerpt ? `<p class="st-article-excerpt">${esc(shortExcerpt)}</p>` : ''}
              <div class="st-article-owner">${esc(owner)}${carName ? ' · ' + esc(carName) : ''}</div>
            </div>
          </a>`;
        }
      });
      content.innerHTML = html;
    }

    // 車種フィルター
    document.getElementById('carFilterRow').addEventListener('click', e => {
      const btn = e.target.closest('.st-filter-btn');
      if (!btn) return;
      activeCarType = btn.dataset.car;
      document.querySelectorAll('#carFilterRow .st-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      // タイトル変更
      const titleEl = document.getElementById('stPageTitle');
      if (activeCarType === '500') titleEl.textContent = 'マイ500ストーリー';
      else if (activeCarType === '126') titleEl.textContent = 'マイ126ストーリー';
      else titleEl.textContent = 'オーナーズストーリー';
      applyFilters();
    });

    // 種類フィルター
    document.getElementById('filterRow').addEventListener('click', e => {
      const btn = e.target.closest('.st-filter-btn');
      if (!btn) return;
      activeEpType = btn.dataset.type;
      document.querySelectorAll('#filterRow .st-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      applyFilters();
    });

    initFilters();
    fetchStories();
  </script>
</body>
</html>
