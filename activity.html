  <style>
    :root {
      --bg-main: #f5f0e6; --card-bg: #fffefb; --border-soft: #d6c9b0;
      --shadow-soft: 0 2px 8px rgba(70,58,40,.10); --text-main: #2e2a24; --text-sub: #7a705f;
      --accent: #1f5c3d; --accent-soft: #e7efe7;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #1a1714; --card-bg: #2b2721; --border-soft: #403a30;
        --shadow-soft: 0 2px 10px rgba(0,0,0,.35); --text-main: #ece6d9; --text-sub: #a89e8c;
        --accent: #7fb894; --accent-soft: #24382c;
      }
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
    body { font-family: var(--font-sans); margin: 0; padding: 20px 16px 60px; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }
    .page { max-width: 640px; margin: 0 auto; }
    .back-link { display: inline-block; font-size: .85rem; color: var(--text-sub); text-decoration: none; margin-bottom: 12px; }
    .back-link:hover { color: var(--accent); }
    h1 { font-size: 1.35rem; margin: .2em 0; }
    .lead { font-size: .88rem; color: var(--text-sub); margin: 0 0 12px; }
    .chips { display: flex; gap: 6px; margin: 14px 0 6px; }
    .chip { flex: none; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); border-radius: 999px; padding: 5px 13px; font-size: .8rem; cursor: pointer; font-family: inherit; }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (prefers-color-scheme: dark) { .chip.on { color: #10261a; } }
    .day { font-size: .78rem; font-weight: 700; color: var(--text-sub); margin: 18px 0 6px; padding-left: 2px; }
    .item { display: flex; gap: 10px; align-items: center; background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; box-shadow: var(--shadow-soft); color: inherit; text-decoration: none; }
    .item:hover { border-color: var(--accent); }
    .thumb { flex: none; width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--accent-soft); display: block; }
    .thumb.blank { display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .body { min-width: 0; flex: 1; }
    .what, .car { display: block; }
    .what { font-size: .9rem; line-height: 1.45; word-break: break-word; }
    .quote { display: block; font-size: .82rem; color: var(--text-sub); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .car { font-size: .72rem; color: var(--text-sub); margin-top: 2px; }
    .more { display: block; width: 100%; margin-top: 12px; padding: 10px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--card-bg); color: var(--accent); font-size: .85rem; cursor: pointer; font-family: inherit; }
    .status { font-size: .85rem; color: var(--text-sub); text-align: center; padding: 30px 0; }
    .note { font-size: .74rem; color: var(--text-sub); margin-top: 22px; line-height: 1.6; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="page">
    <a href="/" class="back-link" id="backLink">← トップへ戻る</a>
    <h1>オーナーの更新情報</h1>
    <p class="lead">オーナーのみなさんが、愛車の記録を更新したり、車載手帳やストーリーを書いたりした動きです。新しい順に、直近60日ぶんを並べています。</p>
    <div class="chips" id="chips">
      <button type="button" class="chip on" data-type="">すべて</button>
      <button type="button" class="chip" data-type="500">500</button>
      <button type="button" class="chip" data-type="126">126</button>
    </div>
    <div id="list"><p class="status">読み込んでいます…</p></div>
    <p class="note">新しく登録された車は、トップページの新着でご覧いただけます。</p>
  </div>

  <script>
    const DAYS = 60;
    const PAGE_SIZE = 40;
    const DAY_MS = 24 * 60 * 60 * 1000;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 126 のトップから来た人は 126 のトップへ戻す
    const params = new URLSearchParams(location.search);
    if (params.get('type') === '126') document.getElementById('backLink').href = '/126/';

    // detail.html の「この1台の歩み」と同じ対応表。更新された列から「（写真・こだわり）」を作る。
    // 対応表に無い列は出さない＝最大3語まで
    const FIELD_LABELS = [
      { test: c => c.indexOf('photo_') === 0, label: '写真' },
      { test: c => c === 'highlights', label: 'こだわり' },
      { test: c => c.indexOf('tire_') === 0, label: 'タイヤ' },
      { test: c => c === 'carburetor_name', label: 'キャブレター' },
      { test: c => c === 'engine_cc', label: '排気量' },
      { test: c => c === 'wheel', label: 'ホイール' },
      { test: c => c === 'body_color', label: 'ボディカラー' },
      { test: c => c === 'plug_name', label: 'プラグ' },
      { test: c => c === 'coil_name', label: 'コイル' },
      { test: c => c === 'year', label: '年式' }
    ];
    const PHOTO_COLS = ['photo_main', 'photo_front', 'photo_side', 'photo_rear', 'photo_interior', 'photo_engine', 'photo_steering_cluster'];

    function jstDayKey(d) {
      const j = new Date(new Date(d).getTime() + 9 * 60 * 60 * 1000);
      return `${j.getUTCFullYear()}-${String(j.getUTCMonth() + 1).padStart(2, '0')}-${String(j.getUTCDate()).padStart(2, '0')}`;
    }
    function dayHeading(key) {
      const today = jstDayKey(Date.now());
      const yesterday = jstDayKey(Date.now() - DAY_MS);
      const [y, m, d] = key.split('-').map(Number);
      const wd = '日月火水木金土'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
      const base = `${m}月${d}日（${wd}）`;
      if (key === today) return `今日・${base}`;
      if (key === yesterday) return `昨日・${base}`;
      return base;
    }
    function trim(s, n) {
      const flat = String(s || '').replace(/\s+/g, ' ').trim();
      return flat.length > n ? flat.slice(0, n) + '…' : flat;
    }

    let allRows = [];
    let typeFilter = '';
    let shown = PAGE_SIZE;

    async function load() {
      const since = new Date(Date.now() - DAYS * DAY_MS).toISOString();
      const [carsRes, histRes, recRes, expRes, epiRes, partRes, slugsRes] = await Promise.allSettled([
        supabaseClient.from('cars').select('document_id, handle_name, car_type, year, model_display_c, is_sold, created_at, ' + PHOTO_COLS.join(', ')),
        supabaseClient.from('car_history').select('car_id, fields, occurred_at').eq('kind', 'updated').gte('occurred_at', since),
        // 公開されていて、車に紐づき、名前を伏せていない手帳だけ
        supabaseClient.from('equipment_records').select('vehicle_id, created_at, updated_at, is_anonymous')
          .eq('is_public', true).not('vehicle_id', 'is', null).or(`created_at.gte."${since}",updated_at.gte."${since}"`),
        supabaseClient.from('equipment_experiences').select('body, created_at, equipment_records!inner(vehicle_id, is_public, is_anonymous)')
          .eq('equipment_records.is_public', true).gte('created_at', since),
        // ログイン中は下書きまで読めてしまうので、公開済みの条件は必ず付ける
        supabaseClient.from('car_episodes').select('car_id, title, created_at').eq('is_published', true).gte('created_at', since),
        supabaseClient.from('event_participants').select('event_id, car_id, created_at').not('car_id', 'is', null).gte('created_at', since),
        fetch('/event-slugs.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {})
      ]);
      const ok = r => (r.status === 'fulfilled' && r.value && !r.value.error && r.value.data) || [];

      const cars = new Map();
      ok(carsRes).forEach(c => cars.set(c.document_id, c));
      // 手放された車の動きは出さない
      const carOf = id => { const c = cars.get(id); return c && !c.is_sold ? c : null; };

      // 1台・1日・1種類で1行に畳む（同じ日に何度保存しても1行）
      const byKey = new Map();
      const add = (kind, carId, at, extra) => {
        const car = carOf(carId);
        if (!car || !at) return;
        const day = jstDayKey(at);
        const key = `${kind}|${carId}|${day}`;
        const row = byKey.get(key);
        if (row) {
          if (new Date(at) > new Date(row.at)) row.at = at;
          if (extra && extra.fields) extra.fields.forEach(f => { if (row.fields.indexOf(f) === -1) row.fields.push(f); });
          if (extra && extra.texts) extra.texts.forEach(t => row.texts.push(t));
          return;
        }
        byKey.set(key, Object.assign({ kind, car, day, at, fields: [], texts: [] }, extra || {}));
      };

      ok(histRes).forEach(h => {
        const car = carOf(h.car_id);
        // 登録した日の保存は「新規登録」の一部なので出さない（トップの新着と重ねない）
        if (!car || (car.created_at && jstDayKey(car.created_at) === jstDayKey(h.occurred_at))) return;
        const fields = String(h.fields || '').split(',').map(s => s.trim()).filter(Boolean);
        add('updated', h.car_id, h.occurred_at, { fields });
      });

      ok(recRes).forEach(r => {
        if (r.is_anonymous) return;
        const sinceT = new Date(since).getTime();
        if (new Date(r.created_at).getTime() >= sinceT) add('notebook_new', r.vehicle_id, r.created_at);
        // 作った日のうちの保存し直しは「更新」にしない
        if (r.updated_at && new Date(r.updated_at).getTime() >= sinceT && new Date(r.updated_at) - new Date(r.created_at) >= DAY_MS) {
          add('notebook_upd', r.vehicle_id, r.updated_at);
        }
      });

      ok(expRes).forEach(e => {
        const rec = e.equipment_records;
        if (!rec || rec.is_anonymous || !rec.vehicle_id || !e.body) return;
        add('experience', rec.vehicle_id, e.created_at, { texts: [e.body] });
      });

      ok(epiRes).forEach(ep => add('story', ep.car_id, ep.created_at, { texts: [ep.title || ''] }));

      // イベント参加は開催名を引いてから
      const parts = ok(partRes);
      if (parts.length) {
        const ids = [...new Set(parts.map(p => p.event_id).filter(Boolean))];
        let events = new Map();
        try {
          const { data } = await supabaseClient.from('events').select('id, event_name').in('id', ids);
          (data || []).forEach(ev => events.set(ev.id, ev));
        } catch (e) { /* 開催名が取れなければ参加行は出さない */ }
        const slugs = (slugsRes.status === 'fulfilled' && slugsRes.value) || {};
        // 同じ日・同じイベントへの参加表明は1行にまとめ、「◯◯さんほか2人」と書く
        // （1人ずつ並べると、募集中のイベントがあるだけで一覧が埋まる）
        parts.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach(p => {
          const ev = events.get(p.event_id);
          const car = carOf(p.car_id);
          if (!ev || !car || !p.created_at) return;
          const key = `event|${ev.id}|${jstDayKey(p.created_at)}`;
          const row = byKey.get(key);
          if (row) {
            if (row.cars.indexOf(car) === -1) row.cars.push(car);
            if (new Date(p.created_at) > new Date(row.at)) row.at = p.created_at;
            return;
          }
          byKey.set(key, { kind: 'event', car, cars: [car], day: jstDayKey(p.created_at), at: p.created_at, fields: [], texts: [ev.event_name || 'イベント'], slug: slugs[ev.id] || null });
        });
      }

      allRows = [...byKey.values()].sort((a, b) => new Date(b.at) - new Date(a.at));
      render();
    }

    function rowHtml(r) {
      const name = esc(r.car.handle_name || r.car.model_display_c || 'オーナー');
      let icon = '✏️', what = '', quote = '', hash = '', href = null;
      if (r.kind === 'updated') {
        const labels = [];
        r.fields.forEach(col => {
          const hit = FIELD_LABELS.find(f => f.test(col));
          if (hit && labels.indexOf(hit.label) === -1) labels.push(hit.label);
        });
        what = `${name}さんが愛車の記録を更新` + (labels.length ? `（${esc(labels.slice(0, 3).join('・'))}）` : '');
      } else if (r.kind === 'notebook_new') {
        icon = '🧰'; what = `${name}さんが車載手帳をつくりました`; hash = '#equipment-notebook';
      } else if (r.kind === 'notebook_upd') {
        icon = '🧰'; what = `${name}さんが車載手帳を更新`; hash = '#equipment-notebook';
      } else if (r.kind === 'experience') {
        icon = '🧰'; what = `${name}さんが車載手帳に経験談`; hash = '#equipment-notebook';
        quote = `「${esc(trim(r.texts[0], 60))}」`;
      } else if (r.kind === 'story') {
        icon = '📖'; what = `${name}さんがストーリーを投稿`;
        quote = r.texts[0] ? `「${esc(trim(r.texts[0], 60))}」` : '';
      } else if (r.kind === 'event') {
        const others = r.cars.length - 1;
        icon = '🎪'; what = `${name}さん${others > 0 ? `ほか${others}人` : ''}が「${esc(r.texts[0])}」に参加表明`;
        if (r.slug) href = `/event/${encodeURIComponent(r.slug)}/`;
      }
      if (!href) href = `/detail?doc=${encodeURIComponent(r.car.document_id)}${hash}`;

      // 写真を更新した行は、その写真を出す。それ以外は車の代表写真
      const updatedPhoto = r.fields.find(f => PHOTO_COLS.indexOf(f) !== -1 && r.car[f]);
      const photo = (updatedPhoto && r.car[updatedPhoto]) || r.car.photo_main;
      const thumb = photo
        ? `<img class="thumb" src="${esc(photo)}" alt="" loading="lazy">`
        : `<span class="thumb blank">${icon}</span>`;
      const yearM = String(r.car.year || '').match(/\d{4}/);
      const carMeta = [r.car.car_type === '126' ? 'FIAT 126' : 'FIAT 500', yearM ? yearM[0] + '年' : ''].filter(Boolean).join(' · ');

      return `<a class="item" href="${href}" data-kind="${r.kind}">
        ${thumb}
        <span class="body">
          <span class="what">${icon} ${what}</span>
          ${quote ? `<span class="quote">${quote}</span>` : ''}
          <span class="car">${esc(carMeta)}</span>
        </span>
      </a>`;
    }

    function render() {
      const list = document.getElementById('list');
      const rows = allRows.filter(r => !typeFilter || String(r.car.car_type) === typeFilter);
      if (rows.length === 0) {
        list.innerHTML = '<p class="status">この期間の動きはまだありません。</p>';
        return;
      }
      let html = '';
      let lastDay = null;
      rows.slice(0, shown).forEach(r => {
        if (r.day !== lastDay) { html += `<div class="day">${esc(dayHeading(r.day))}</div>`; lastDay = r.day; }
        html += rowHtml(r);
      });
      if (rows.length > shown) html += '<button type="button" class="more" id="moreBtn">もっと見る</button>';
      list.innerHTML = html;
      const more = document.getElementById('moreBtn');
      if (more) more.onclick = () => { shown += PAGE_SIZE; render(); };
    }

    document.getElementById('chips').addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      typeFilter = btn.dataset.type;
      shown = PAGE_SIZE;
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c === btn));
      render();
    });

    document.getElementById('list').addEventListener('click', e => {
      const a = e.target.closest('.item');
      if (a && typeof gtag === 'function') gtag('event', 'activity_click', { kind: a.dataset.kind });
    });

    load().catch(() => {
      document.getElementById('list').innerHTML = '<p class="status">読み込めませんでした。時間をおいて開き直してください。</p>';
    });
  </script>
</body>
