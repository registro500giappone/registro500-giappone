<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #f5f5f7; color: #333;
        }
        header {
            background-color: #fff; padding: 15px; text-align: center;
            border-bottom: 1px solid #e1e1e1; position: sticky; top: 0; z-index: 100;
        }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: #333; }
        
        .back-link {
            display: inline-block; margin-top: 8px; color: #007aff;
            text-decoration: none; font-size: 0.85rem; padding: 4px 12px;
        }

        .container {
            max-width: 1000px; margin: 0 auto; padding: 20px 10px; text-align: center;
        }
        p.desc { font-size: 0.85rem; color: #888; margin-bottom: 10px; }

        /* 地図エリア */
        #map-wrapper {
            width: 100%; height: auto; max-width: 800px;
            margin: 0 auto; position: relative;
        }
        .japan-map-svg {
            width: 100%; height: auto;
            /* リアルな白地図の質感 */
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.05));
        }
        
        /* 都道府県パスの設定 */
        .pref {
            fill: #ffffff; 
            stroke: #a0a0a0; 
            stroke-width: 0.8; 
            stroke-linejoin: round;
            stroke-linecap: round;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .pref:hover { fill: #eeeeee; z-index: 10; stroke: #666; }

        /* 登録あり（グリーン） */
        .active { fill: #009688 !important; stroke: #00796b; }
        /* 選択中（赤） */
        .selected { fill: #e53935 !important; stroke: #b71c1c; stroke-width: 1.5; transform: scale(1.01); transform-origin: center; }

        /* 沖縄の枠 */
        .okinawa-frame { fill: none; stroke: #ddd; stroke-width: 1; }
        .okinawa-text { font-size: 14px; fill: #aaa; font-weight: bold; pointer-events: none; }

        /* リストエリア */
        #garage-area {
            display: none; margin-top: 20px; background: white; padding: 25px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: left;
        }
        .area-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;
        }
        .area-name { font-size: 1.2rem; font-weight: bold; color: #333; }
        
        .garage-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 20px; justify-items: center;
        }
        
        .garage-item {
            width: 100%; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .garage-icon {
            width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
            border: 3px solid #f0f0f0; transition: transform 0.2s; background: #eee;
        }
        .garage-item:hover .garage-icon { transform: scale(1.1); border-color: #009688; }
        .garage-name {
            font-size: 0.75rem; margin-top: 8px; text-align: center;
            width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555;
        }

        .close-btn { 
            border: none; background: #f0f0f0; border-radius: 20px; 
            padding: 5px 15px; cursor: pointer; color: #555; font-size: 0.9rem;
        }
        #loading { margin: 60px 0; color: #888; }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO MAPPA</h1>
    <a href="index.html" class="back-link">← 一覧に戻る</a>
</header>

    <p class="desc">地図上の色付きエリアをタップしてください</p>
    
    <div id="loading">Loading Map...</div>

    <div id="map-wrapper" style="display:none;">
        <!-- SVG地図はJSで描画します -->
    </div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title" class="area-name">AREA</span>
            <button onclick="closeGarage()" class="close-btn">閉じる</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

        "沖縄県": "M10,10" // 位置はプログラムで調整
    };

    // ==========================================
    // 3. ロジック
    // ==========================================
    async function init() {
        if(GAS_API_URL.includes("★")) {
            alert("GASのURLを設定してください");
            return;
        }
        
        // 地図を描画
        renderMap();

        try {
            const response = await fetch(GAS_API_URL);
            const data = await response.json();
            const cars = Array.isArray(data) ? data : (data.data || []);
            applyData(cars);
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "Load Error";
        }
    }

    function renderMap() {
        // SVGのベースを作成（ビューボックスは日本全体が入る座標系）
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "510 50 300 340"); // 本州中心のビューボックス
        svg.setAttribute("class", "japan-map-svg");

        // 沖縄の枠（インセット）
        const okinawaGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        okinawaGroup.setAttribute("transform", "translate(520, 60)"); // 左上に配置
        
        const frame = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        frame.setAttribute("width", "50");
        frame.setAttribute("height", "40");
        frame.setAttribute("class", "okinawa-frame");
        okinawaGroup.appendChild(frame);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "5");
        text.setAttribute("y", "15");
        text.setAttribute("class", "okinawa-text");
        text.textContent = "OKINAWA";
        okinawaGroup.appendChild(text);

        // パスの生成
        for (const [name, pathData] of Object.entries(MAP_PATHS)) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            if (name === "沖縄県") {
                // 沖縄だけ特別なパスデータと位置調整
                path.setAttribute("d", "M10,25 l8,-2 l4,2 l6,-1 l4,2 l-4,2 l-10,0 l-6,-2 z");
                path.setAttribute("class", "pref");
                path.setAttribute("data-name", name);
                okinawaGroup.appendChild(path);
            } else {
                path.setAttribute("d", pathData);
                path.setAttribute("class", "pref");
                path.setAttribute("data-name", name);
                svg.appendChild(path);
            }
        }
        
        svg.appendChild(okinawaGroup);
        document.getElementById('map-wrapper').appendChild(svg);
    }

    function applyData(cars) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('map-wrapper').style.display = 'block';

        const prefData = {};
        const normalize = (input) => {
            if (!input) return null;
            // 既存の都道府県リストからマッチング
            const prefs = Object.keys(MAP_PATHS);
            for (const p of prefs) {
                if (input.includes(p) || input.includes(p.slice(0, -1))) return p;
            }
            // 英語対応
            const enMap = {'TOKYO':'東京都', 'OSAKA':'大阪府', 'AICHI':'愛知県', 'KANAGAWA':'神奈川県', 'CHIBA':'千葉県', 'SAITAMA':'埼玉県'};
            if(enMap[input.toUpperCase()]) return enMap[input.toUpperCase()];
            return null;
        };

        cars.forEach(car => {
            const pName = normalize(car.Prefecture || car.prefecture || "");
            if (pName) {
                if (!prefData[pName]) prefData[pName] = [];
                prefData[pName].push(car);
            }
        });

        // データ反映
        document.querySelectorAll('.pref').forEach(path => {
            const pName = path.getAttribute('data-name');
            if (prefData[pName]) {
                path.classList.add('active'); // 色をつける
                
                // クリックイベント
                path.addEventListener('click', function(e) {
                    // 選択状態リセット
                    document.querySelectorAll('.selected').forEach(p => p.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    showGarage(pName, prefData[pName]);
                });
            }
        });
    }

    function showGarage(name, cars) {
        const area = document.getElementById('garage-area');
        const list = document.getElementById('garage-list');
        document.getElementById('area-title').innerText = `${name} (${cars.length}台)`;
        
        area.style.display = 'block';
        list.innerHTML = '';

        cars.forEach(car => {
            const imgUrl = car.PhotoMain || car.car_image || 'https://placehold.co/100x100?text=No+Img';
            const handleName = car.HandleName || "No Name";
            
            const item = document.createElement('div');
            item.className = 'garage-item';
            
            // アイコン
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'garage-icon';
            img.loading = "lazy";
            
            // 名前
            const nameDiv = document.createElement('div');
            nameDiv.className = 'garage-name';
            nameDiv.innerText = handleName;
            
            // クリックで詳細へ
            if(car.DocumentID) {
                item.onclick = () => window.location.href = `detail.html?doc=${car.DocumentID}`;
            }

            item.appendChild(img);
            item.appendChild(nameDiv);
            list.appendChild(item);
        });
        
        // スクロール
        area.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function closeGarage() {
        document.getElementById('garage-area').style.display = 'none';
        document.querySelectorAll('.selected').forEach(p => p.classList.remove('selected'));
    }

    // 開始
    init();
</script>

</body>
</html>
