<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        /* ヘッダー */
        header {
            background-color: #fff;
            color: #333;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: #009688; }
        
        .back-link {
            display: inline-block;
            margin-top: 5px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 5px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            transition: 0.3s;
        }
        .back-link:hover { background: #e0e0e0; }

        /* メインコンテナ */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 10px;
            text-align: center;
        }
        
        p.desc { font-size: 0.85rem; color: #888; margin-bottom: 10px; }

        /* 日本地図エリア */
        #map-container {
            width: 100%;
            height: auto;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        /* SVGの設定 */
        .japan-map-svg {
            width: 100%;
            height: auto;
            /* 影をつけて地図っぽさを出す */
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }
        
        .pref-path {
            fill: #fff;        /* デフォルト：白 */
            stroke: #aaa;      /* 境界線：グレー */
            stroke-width: 0.5px;
            cursor: pointer;
            transition: fill 0.3s ease;
        }
        .pref-path:hover {
            fill: #f0f0f0;     /* ホバー時 */
        }

        /* 登録がある県（グリーン） */
        .pref-active { 
            fill: #009688 !important; 
            stroke: #00796b;
        }
        /* 選択中の県（赤＋強調） */
        .pref-selected {
            fill: #e53935 !important;
            stroke: #b71c1c;
            stroke-width: 1px;
        }

        /* エリア別リスト表示エリア */
        #garage-area {
            display: none;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            text-align: left;
        }
        .area-header {
            border-left: 5px solid #009688;
            padding-left: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .garage-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            justify-items: center;
        }
        
        .garage-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            cursor: pointer;
        }
        .garage-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #eee;
            transition: transform 0.2s;
        }
        .garage-item:hover .garage-icon {
            transform: scale(1.1);
            border-color: #009688;
        }
        .garage-name {
            font-size: 0.7rem;
            margin-top: 5px;
            text-align: center;
            color: #555;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        #loading { margin: 60px 0; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO MAPPA</h1>
    <a href="index.html" class="back-link">← 一覧に戻る</a>

<div class="container">

    <div id="loading">地図データを読み込んでいます...</div>

    <!-- 地図表示エリア -->
    <div id="map-container" style="display:none;">
        <!-- JSでここにSVGを流し込みます -->

    <!-- 選択したエリアのリスト -->
    <div id="garage-area">
        <div class="area-header">
            <span id="area-title">AREA</span>
            <button onclick="closeGarage()" class="close-btn">×</button>
        </div>
        <div id="garage-list" class="garage-list"></div>

</div>

    // ==========================================
    // 3. ロジック（前回と同じ機能を維持）
    // ==========================================
    async function fetchData() {
        if(GAS_API_URL.includes("★")) {
            alert("エラー：GASのURLが設定されていません。コードを修正してください。");
            return;
        }
        try {
            const response = await fetch(GAS_API_URL);
            const data = await response.json();
            const cars = Array.isArray(data) ? data : (data.data || []);
            
            // 地図描画
            document.getElementById('map-container').innerHTML = mapSVG;
            initMap(cars);
            
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "データの読み込みに失敗しました";
        }
    }

    function normalizePrefecture(input) {
        if (!input) return null;
        const enToJp = { 'TOYAMA': '富山県', 'TOKYO': '東京都', 'AICHI': '愛知県', 'OSAKA': '大阪府', 'KANAGAWA': '神奈川県' };
        if (enToJp[input.toUpperCase()]) return enToJp[input.toUpperCase()];
        const prefs = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
        for (const pref of prefs) {
            if (input.includes(pref) || input.includes(pref.slice(0, -1))) return pref;
        }
        return null;
    }

    function initMap(dataList) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('map-container').style.display = 'block';

        const prefData = {};
        dataList.forEach(car => {
            const rawPref = car.Prefecture || car.prefecture || "";
            const prefName = normalizePrefecture(rawPref);
            if (prefName) {
                if (!prefData[prefName]) prefData[prefName] = [];
                prefData[prefName].push(car);
            }
        });

        let activePaths = [];
        
        document.querySelectorAll('.pref-path').forEach(path => {
            const pName = path.getAttribute('data-name');
            if (prefData[pName]) {
                path.classList.add('pref-active');
                path.addEventListener('click', function() {
                    activePaths.forEach(p => p.classList.remove('pref-selected'));
                    this.classList.add('pref-selected');
                    activePaths.push(this);
                    showGarageList(pName, prefData[pName]);
                });
            }
        });
    }

    function showGarageList(prefName, cars) {
        const area = document.getElementById('garage-area');
        const title = document.getElementById('area-title');
        const list = document.getElementById('garage-list');
        
        area.style.display = 'block';
        title.innerText = `${prefName} (${cars.length}台)`;
        list.innerHTML = '';

        cars.forEach(car => {
            const imgUrl = car.PhotoMain || car.car_image || 'https://placehold.co/100x100?text=No+Img';
            const name = car.HandleName || "No Name";
            
            const item = document.createElement('div');
            item.className = 'garage-item';
            
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'garage-icon';
            img.loading = "lazy";
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'garage-name';
            nameDiv.innerText = name;
            
            if(car.DocumentID) {
                item.onclick = () => {
                   window.location.href = `detail.html?doc=${car.DocumentID}`;
                };
            }

            item.appendChild(img);
            item.appendChild(nameDiv);
            list.appendChild(item);
        });
        
        setTimeout(() => {
            area.scrollIntoView({behavior: "smooth", block: "start"});
        }, 100);
    }
    
    function closeGarage() {
        document.getElementById('garage-area').style.display = 'none';
        document.querySelectorAll('.pref-selected').forEach(p => p.classList.remove('pref-selected'));
    }

    fetchData();
</script>

</body>
</html>
