<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://www.registro500.com/mappa">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa</title>
    <meta name="description" content="日本全国のFIAT 500オーナーの分布を地図で確認。都道府県別に登録車両を閲覧できます。">
    <meta property="og:title" content="Registro Mappa - Registro500 Giappone">
    <meta property="og:description" content="日本全国のFIAT 500オーナーの分布を地図で確認。都道府県別に登録車両を閲覧できます。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.registro500.com/logo_horizontal.png">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0" integrity="sha384-NFPmVbJvc91cC9zbheWJA+qZKj0Kod2IEMvGnxVKB5A7wLgRNA6Aobu8neZmQ19J" crossorigin="anonymous"></script>
    <script>
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f5f5f7; color: #333; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; }
        .back-link { display: inline-block; margin-top: 8px; color: #2856a8; text-decoration: none; font-size: 0.85rem; padding: 4px 12px; border: 1px solid #ddd; border-radius: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px; text-align: center; }

        #map-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            position: relative;
            aspect-ratio: 1 / 1; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        svg { width: 100%; height: 100%; display: block; }

        .prefecture {
            fill: #f9f9f9; stroke: #bbb; stroke-width: 0.5px; cursor: pointer; transition: fill 0.2s;
        }
        .prefecture:hover { fill: #eee; }

        /* 元の濃い青色を復活 */
        .active-pref { fill: #2856a8 !important; stroke: #1e4285 !important; }
        .selected-pref { fill: #e11d48 !important; stroke: #9f1239 !important; }

        /* 126カラー */
        body.type-126 .active-pref { fill: #D4541A !important; stroke: #B8421A !important; }
        body.type-126 .pref-label { stroke: #D4541A; }
        body.type-126 #info-panel { border-left-color: #D4541A; }

        /* 車種切り替えボタン */
        .type-toggle { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
        .toggle-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid #ddd; text-decoration: none; font-size: 0.8rem; color: #666; }
        .toggle-btn.active-500 { background: #2856a8; color: #fff; border-color: #2856a8; }
        .toggle-btn.active-126 { background: #D4541A; color: #fff; border-color: #D4541A; }

        /* 数字を大きく、白抜きにして視認性を向上 */
        .pref-label {
            fill: #fff; 
            font-size: 14px; /* 11pxから拡大 */
            font-weight: 900; 
            font-family: sans-serif;
            text-anchor: middle; 
            dominant-baseline: central; 
            pointer-events: none;
            /* 縁取りをつけてさらに読みやすく */
            paint-order: stroke; 
            stroke: #2856a8; 
            stroke-width: 3px; 
            stroke-linecap: round; 
            stroke-linejoin: round;
        }
        .selected-pref + .pref-label { stroke: #e11d48; }

        .inset-box { fill: #fff; stroke: #ddd; stroke-width: 2; }

        #info-panel {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); color: #333;
            padding: 10px 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-weight: bold; font-size: 14px;
            border-left: 5px solid #2856a8;
            pointer-events: none; opacity: 0; transition: opacity 0.2s;
            z-index: 20; min-width: 120px; text-align: center;
        }

        #garage-area { display: none; margin-top: 20px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: left; }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .garage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 15px; justify-items: center; }
        .garage-item { width: 100%; cursor: pointer; text-align: center; }
        .garage-icon-lg { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #f0f0f0; background: #eee; }
        .garage-name { font-size: 0.7rem; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-btn { border: none; background: #eee; padding: 5px 15px; border-radius: 15px; cursor: pointer; }
        
        #loading { margin: 50px 0; color: #777; }

        /* ダークモード */
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            header { background: #1e293b; border-bottom-color: #334155; }
            h1 { color: #e2e8f0; }
            .back-link { color: #60a5fa; border-color: #334155; }
            #map-container { background: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
            .prefecture { fill: #334155; stroke: #475569; }
            .prefecture:hover { fill: #475569; }
            .inset-box { fill: #1e293b; stroke: #334155; }
            #info-panel { background: rgba(30, 41, 59, 0.95); color: #e2e8f0; border-left-color: #60a5fa; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
            #garage-area { background: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
            .area-header { border-bottom-color: #334155; }
            .close-btn { background: #334155; color: #e2e8f0; }
            .garage-icon-lg { border-color: #334155; background: #334155; }
            #loading { color: #94a3b8; }
            .active-pref { fill: #3b82f6 !important; stroke: #2563eb !important; }
            .pref-label { stroke: #3b82f6; }
        }
    </style>
</head>
<body>

<header>
    <h1 id="pageTitle">REGISTRO MAPPA</h1>
    <a id="backLink" href="index.html" class="back-link">← ガレージに戻る</a>
    <div class="type-toggle">
        <a href="mappa.html" class="toggle-btn" id="btn500">Fiat 500</a>
        <a href="mappa.html?type=126" class="toggle-btn" id="btn126">Fiat 126</a>
    </div>
</header>

<div class="container">
    <div id="loading">地図データを取得中...</div>

    <div id="map-container">
        <div id="info-panel"></div>
    </div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title" style="font-weight:bold;">AREA</span>
            <button onclick="closeGarage()" class="close-btn">閉じる</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

<script>
    const CACHE_KEY_MAP = 'registro500_map_cars_v5';
    const MAP_FILE_URL = "prefectures.json";

    function esc(s) {
      if (!s) return '';
      return s.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    const ID_MAP = {
        1:"北海道",2:"青森県",3:"岩手県",4:"宮城県",5:"秋田県",6:"山形県",7:"福島県",
        8:"茨城県",9:"栃木県",10:"群馬県",11:"埼玉県",12:"千葉県",13:"東京都",14:"神奈川県",
        15:"新潟県",16:"富山県",17:"石川県",18:"福井県",19:"山梨県",20:"長野県",21:"岐阜県",
        22:"静岡県",23:"愛知県",24:"三重県",25:"滋賀県",26:"京都府",27:"大阪府",28:"兵庫県",
        29:"奈良県",30:"和歌山県",31:"鳥取県",32:"島根県",33:"岡山県",34:"広島県",35:"山口県",
        36:"徳島県",37:"香川県",38:"愛媛県",39:"高知県",40:"福岡県",41:"佐賀県",42:"長崎県",
        43:"熊本県",44:"大分県",45:"宮崎県",46:"鹿児島県",47:"沖縄県"
    };

    const EN_MAP = {
        'TOKYO':'東京都', 'OSAKA':'大阪府', 'AICHI':'愛知県', 'KANAGAWA':'神奈川県', 'CHIBA':'千葉県', 'SAITAMA':'埼玉県', 'TOYAMA':'富山県',
        'KYOTO':'京都府', 'FUKUOKA':'福岡県', 'HYOGO':'兵庫県', 'HOKKAIDO':'北海道', 'NAGANO':'長野県', 'SHIZUOKA':'静岡県',
        'IBARAKI':'茨城県', 'GUNMA':'群馬県', 'TOCHIGI':'栃木県', 'MIE':'三重県', 'GIFU':'岐阜県', 'FUKUSHIMA':'福島県',
        'HIROSHIMA':'広島県', 'OKAYAMA':'岡山県', 'NARA':'奈良県', 'SHIGA':'滋賀県'
    };

    // URLパラメータで500/126を切り替え
    const urlCarType = new URLSearchParams(window.location.search).get('type') || '500';
    if (urlCarType === '126') {
      document.body.classList.add('type-126');
      document.getElementById('pageTitle').textContent = 'REGISTRO126 MAPPA';
      document.getElementById('backLink').href = '126/index.html';
      document.title = 'Registro126 - Mappa';
      document.getElementById('btn126').classList.add('active-126');
    } else {
      document.getElementById('btn500').classList.add('active-500');
    }

    async function init() {
        try {
            const mapRes = await fetch(MAP_FILE_URL);
            const mapData = await mapRes.json();

            const cached = localStorage.getItem(CACHE_KEY_MAP);
            if (cached) {
                drawMap(mapData, JSON.parse(cached));
            }

            const { data: cars, error } = await supabaseClient
              .from('cars')
              .select(`
                DocumentID:document_id,
                HandleName:handle_name,
                Prefecture:prefecture,
                CarType:car_type,
                Model_DisplayC:model_display_c,
                PhotoMain:photo_main
              `)
              .eq('car_type', urlCarType);

            if (error) throw error;
            
            if (cars) {
                localStorage.setItem(CACHE_KEY_MAP, JSON.stringify(cars));
                drawMap(mapData, cars);
            }

        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "エラーが発生しました";
        }
    }

    function drawMap(mapData, cars) {
        document.getElementById('loading').style.display = 'none';
        const prefData = {};
        cars.forEach(car => {
            let pName = (car.Prefecture || "").trim();
            if(EN_MAP[pName.toUpperCase()]) pName = EN_MAP[pName.toUpperCase()];
            if(!prefData[pName]) prefData[pName] = [];
            prefData[pName].push(car);
        });

        const width = 800, height = 800;
        const container = d3.select("#map-container");
        container.select("svg").remove();
        const svg = container.append("svg").attr("viewBox", `0 0 ${width} ${height}`);
        const panel = document.getElementById('info-panel');

        let objKey = mapData.objects.japan ? "japan" : (mapData.objects.prefectures ? "prefectures" : Object.keys(mapData.objects)[0]);
        const allFeatures = topojson.feature(mapData, mapData.objects[objKey]).features;
        const okinawaFeatures = allFeatures.filter(d => d.id == 47 || d.properties.id == 47);
        const mainFeatures = allFeatures.filter(d => d.id != 47 && d.properties.id != 47);

        const mainProjection = d3.geoMercator().center([137.5, 38.3]).scale(2300).translate([width / 2, height / 2]);
        const mainPath = d3.geoPath().projection(mainProjection);
        renderFeatures(svg, mainFeatures, mainPath, prefData, panel);

        if (okinawaFeatures.length > 0) {
            const boxX = 20, boxY = 20, boxW = 160, boxH = 120;
            const insetProjection = d3.geoMercator().center([127.8, 26.5]).scale(6000).translate([boxX + boxW/2, boxY + boxH/2]);
            const insetPath = d3.geoPath().projection(insetProjection);
            svg.append("rect").attr("x", boxX).attr("y", boxY).attr("width", boxW).attr("height", boxH).attr("class", "inset-box");
            renderFeatures(svg, okinawaFeatures, insetPath, prefData, panel);
        }
    }

    function renderFeatures(svg, features, path, prefData, panel) {
        svg.append("g")
            .selectAll("path")
            .data(features)
            .enter()
            .append("path")
            .attr("class", "prefecture")
            .attr("d", path)
            .each(function(d) {
                const p = d.properties;
                const candidates = [p.nam_ja, p.name, p.nam, ID_MAP[d.id], String(d.id)].map(v => String(v));
                const matchKey = Object.keys(prefData).find(key => candidates.some(val => val && (val.includes(key) || key.includes(val))));
                if(matchKey) {
                    d3.select(this).classed("active-pref", true);
                    d.carList = prefData[matchKey];
                    d.displayName = matchKey;
                }
                d.dispName = (p.nam_ja || p.name || p.nam || (d.id ? ID_MAP[d.id] : "Unknown"));
            })
            .on("click", function(event, d) {
                if(d.carList) {
                    d3.selectAll(".selected-pref").classed("selected-pref", false);
                    d3.select(this).classed("selected-pref", true);
                    showGarage(d.displayName, d.carList);
                }
            })
            .on("mouseover", function(event, d) {
                panel.style.opacity = 1;
                panel.innerText = d.dispName + (d.carList ? ` (${d.carList.length}台)` : "");
            })
            .on("mouseout", function() { panel.style.opacity = 0; });

        svg.append("g")
            .selectAll("text")
            .data(features)
            .enter()
            .append("text")
            .attr("class", "pref-label")
            .attr("transform", function(d) {
                const centroid = path.centroid(d);
                if (isNaN(centroid[0])) return "translate(-999,-999)";
                let x = centroid[0], y = centroid[1];
                if (d.dispName.includes("東京")) { y -= 26; x -= 5; }
                if (d.dispName.includes("長崎")) x += 5;
                if (d.dispName.includes("鹿児島")) y -= 10;
                if (d.dispName.includes("兵庫")) y -= 5;
                return `translate(${x},${y})`;
            })
            .text(d => (d.carList && d.carList.length > 0) ? d.carList.length : "");
    }

    function showGarage(name, cars) {
        const area = document.getElementById('garage-area');
        const list = document.getElementById('garage-list');
        document.getElementById('area-title').innerText = `${name} (${cars.length}台)`;
        area.style.display = 'block';
        list.innerHTML = '';
        cars.forEach(car => {
            const item = document.createElement('div');
            item.className = 'garage-item';
            item.innerHTML = `<img src="${car.PhotoMain || 'https://placehold.co/100x100?text=No+Img'}" class="garage-icon-lg" loading="lazy"><div class="garage-name">${esc(car.HandleName || "No Name")}</div>`;
            item.onclick = () => window.location.href = `${urlCarType === '126' ? '126/' : ''}detail.html?doc=${car.DocumentID}`;
            list.appendChild(item);
        });
        setTimeout(() => { area.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }

    function closeGarage() { document.getElementById('garage-area').style.display = 'none'; }
    init();
</script>
<footer style="margin-top:48px;padding:20px 16px;border-top:1px solid #e5e7eb;text-align:center;">
</footer>
</body>
</html>
