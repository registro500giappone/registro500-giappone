<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #f9f9f9; color: #333;
        }
        header {
            background-color: #fff; padding: 15px; text-align: center;
            border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: #333; }
        
        .back-link {
            display: inline-block; margin-top: 8px; color: #666;
            text-decoration: none; font-size: 0.85rem; padding: 4px 12px;
            border: 1px solid #ddd; border-radius: 4px; transition: 0.3s;
        }
        .back-link:hover { background: #f0f0f0; }

        .container {
            max-width: 1000px; margin: 0 auto; padding: 20px 10px; text-align: center;
        }
        p.desc { font-size: 0.85rem; color: #888; margin-bottom: 10px; }

        /* 地図エリア */
        #map-container {
            width: 100%; height: auto; max-width: 800px;
            margin: 0 auto; position: relative;
        }
        
        .japan-map-svg {
            width: 100%; height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }
        
        /* 地図の塗り設定 */
        .pref-path {
            fill: #ffffff; stroke: #888; stroke-width: 1px; stroke-linejoin: round;
            cursor: pointer; transition: fill 0.2s;
        }
        .pref-path:hover { fill: #f0f0f0; }

        /* 登録あり・選択中 */
        .pref-active { fill: #009688 !important; stroke: #00695c; }
        .pref-selected { fill: #e53935 !important; stroke: #b71c1c; }

        /* リストエリア */
        #garage-area {
            display: none; margin-top: 20px; background: white; padding: 20px;
            border-top: 3px solid #009688; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .area-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 10px;
        }
        
        .garage-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px; justify-items: center;
        }
        
        .garage-item {
            width: 100%; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .garage-icon {
            width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
            border: 2px solid #eee; transition: transform 0.2s; background: #eee;
        }
        .garage-item:hover .garage-icon { transform: scale(1.1); border-color: #009688; }
        .garage-name {
            font-size: 0.7rem; margin-top: 5px; text-align: center;
            width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .close-btn { border: none; background: #eee; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; color: #555; }
        #loading { margin: 60px 0; color: #888; }
        
        /* 沖縄の枠ラベル */
        .okinawa-label { font-size: 10px; fill: #aaa; pointer-events: none; }
        .okinawa-box { fill: none; stroke: #ddd; stroke-width: 1; }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO MAPPA</h1>
    <a href="index.html" class="back-link">一覧に戻る</a>
</header>

<div class="container">
    <p class="desc">都道府県をタップして詳細を表示</p>
    
    <div id="loading">地図データを読み込んでいます...</div>

    <div id="map-container" style="display:none;"></div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title">AREA</span>
            <button onclick="closeGarage()" class="close-btn">×</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

<!-- ステップ1で作った地図データを読み込み -->
<script src="map_data.js"></script>

<script>
    // ==========================================
    // 設定：GASのURL
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz0BJpaG-AcK3T6YYtav-nfd3gqGlkEWu3AvpW5uRT52N9jW8pBKLrpLSqvXqyD2ghwCA/exec";
    
    // ==========================================
    // メイン処理
    // ==========================================
    async function init() {
        if(GAS_API_URL.includes("★")) {
            alert("GASのURLを設定してください");
            return;
        }
        
        // 地図データの描画
        renderMapSVG();

        try {
            const response = await fetch(GAS_API_URL);
            const data = await response.json();
            const cars = Array.isArray(data) ? data : (data.data || []);
            applyDataToMap(cars);
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "データの読み込みに失敗しました";
        }
    }

    // 地図SVGの生成
    function renderMapSVG() {
        if (typeof JAPAN_MAP_DATA === 'undefined') {
            document.getElementById('loading').innerText = "地図データ(map_data.js)が見つかりません";
            return;
        }

        const { viewBox, paths } = JAPAN_MAP_DATA;
        let svgHtml = `<svg viewBox="${viewBox}" class="japan-map-svg" xmlns="http://www.w3.org/2000/svg">`;
        
        // 沖縄の枠
        svgHtml += `<rect x="250" y="70" width="40" height="25" class="okinawa-box" />`;
        svgHtml += `<text x="252" y="78" class="okinawa-label">OKINAWA</text>`;

        // 各県のパスを描画
        for (const [prefName, d] of Object.entries(paths)) {
            svgHtml += `<path d="${d}" class="pref-path" data-name="${prefName}" />`;
        }
        svgHtml += `</svg>`;
        
        document.getElementById('map-container').innerHTML = svgHtml;
    }

    // データ反映
    function applyDataToMap(cars) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('map-container').style.display = 'block';

        const prefData = {};
        const normalize = (input) => {
            if (!input) return null;
            const prefs = Object.keys(JAPAN_MAP_DATA.paths);
            for (const p of prefs) {
                if (input.includes(p) || input.includes(p.slice(0, -1))) return p;
            }
            // 英語対応
            const enMap = {'TOKYO':'東京都', 'OSAKA':'大阪府', 'AICHI':'愛知県', 'KANAGAWA':'神奈川県', 'CHIBA':'千葉県', 'SAITAMA':'埼玉県'};
            if(enMap[input.toUpperCase()]) return enMap[input.toUpperCase()];
            return null;
        };

        cars.forEach(car => {
            const pName = normalize(car.Prefecture || car.prefecture || "");
            if (pName) {
                if (!prefData[pName]) prefData[pName] = [];
                prefData[pName].push(car);
            }
        });

        // 色付けとイベント
        document.querySelectorAll('.pref-path').forEach(path => {
            const pName = path.getAttribute('data-name');
            if (prefData[pName]) {
                path.classList.add('pref-active');
                path.addEventListener('click', function() {
                    document.querySelectorAll('.pref-selected').forEach(p => p.classList.remove('pref-selected'));
                    this.classList.add('pref-selected');
                    showGarageList(pName, prefData[pName]);
                });
            }
        });
    }

    function showGarageList(prefName, cars) {
        const area = document.getElementById('garage-area');
        const title = document.getElementById('area-title');
        const list = document.getElementById('garage-list');
        
        area.style.display = 'block';
        title.innerText = `${prefName} (${cars.length}台)`;
        list.innerHTML = '';

        cars.forEach(car => {
            const imgUrl = car.PhotoMain || car.car_image || 'https://placehold.co/100x100?text=No+Img';
            const name = car.HandleName || "No Name";
            
            const item = document.createElement('div');
            item.className = 'garage-item';
            
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'garage-icon';
            img.loading = "lazy";
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'garage-name';
            nameDiv.innerText = name;
            
            if(car.DocumentID) {
                item.onclick = () => window.location.href = `detail.html?doc=${car.DocumentID}`;
            }

            item.appendChild(img);
            item.appendChild(nameDiv);
            list.appendChild(item);
        });
        
        area.scrollIntoView({behavior: "smooth", block: "center"});
    }

    function closeGarage() {
        document.getElementById('garage-area').style.display = 'none';
        document.querySelectorAll('.pref-selected').forEach(p => p.classList.remove('pref-selected'));
    }

    init();
</script>

</body>
</html>
