    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f5f0e6; color: #2e2a24; }
        header { background: #fffefb; padding: 15px; text-align: center; border-bottom: 1px solid #d6c9b0; position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; }
        .back-link { display: inline-block; margin-top: 8px; color: #1f5c3d; text-decoration: none; font-size: 0.85rem; padding: 4px 12px; border: 1px solid #d6c9b0; border-radius: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px 40px; }

        .card { background: #fffefb; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; }

        /* 地図 */
        .map-wrap { position: relative; max-width: 620px; margin: 0 auto; }
        .map-wrap svg { width: 100%; height: auto; display: block; }
        .pref-shape { stroke: #d6c9b0; stroke-width: 0.5px; transition: opacity 0.15s; }
        .pref-shape.has-cars { cursor: pointer; }
        .pref-shape.has-cars:hover { opacity: 0.75; }
        .pref-shape.selected { stroke: #2e2a24; stroke-width: 2px; }
        /* 文字色(fill)と縁取り色(stroke)は塗りの濃さに応じてJS側で1県ずつ指定する。
           ここで fill を書くとCSSが属性に勝ってしまうので指定しない。 */
        .pref-count { font-size: 13px; font-weight: 900; font-family: sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
        .map-inset-box { fill: none; stroke: #d6c9b0; stroke-width: 2; }
        .map-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 12px; font-size: 0.75rem; color: #7a705f; }
        .map-legend span { display: inline-flex; align-items: center; gap: 4px; }
        .map-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,0.1); }
        .map-note { text-align: center; font-size: 0.75rem; color: #7a705f; margin-top: 10px; }

        /* 都道府県の一覧。スマホでは首都圏の県が小さすぎて地図を押せないので、
           ここが実質の操作面になる。 */
        .pref-list-title { font-size: 0.8rem; color: #7a705f; text-align: center; margin: 24px 0 10px; }
        .pref-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
        .pref-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #d6c9b0; background: #fffefb; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: #2e2a24; font-family: inherit; text-align: left; }
        .pref-btn:hover { background: #f0ece0; }
        .pref-btn.selected { border-color: #1f5c3d; background: #e7efe7; font-weight: bold; }
        .pref-btn .n { color: #7a705f; font-size: 0.8rem; white-space: nowrap; }

        /* オーナー一覧 */
        #garage-area { display: none; margin-top: 20px; background: #fffefb; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #d6c9b0; padding-bottom: 10px; }
        .garage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 15px; justify-items: center; }
        .garage-item { width: 100%; cursor: pointer; text-align: center; }
        .garage-icon-lg { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #faf6ec; background: #faf6ec; }
        .garage-name { font-size: 0.7rem; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-btn { border: none; background: #faf6ec; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-family: inherit; }

        /* 車種切り替えボタン */
        .type-toggle { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
        .toggle-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid #d6c9b0; text-decoration: none; font-size: 0.8rem; color: #7a705f; }
        .toggle-btn.active-500 { background: #1f5c3d; color: #fff; border-color: #1f5c3d; }
        .toggle-btn.active-126 { background: #D4541A; color: #fff; border-color: #D4541A; }

        body.type-126 .pref-btn.selected { border-color: #D4541A; background: #fbe6d8; }

        #loading { margin: 50px 0; color: #777; text-align: center; }

        /* ダークモード */
        @media (prefers-color-scheme: dark) {
            body { background: #1a1714; color: #ece6d9; color-scheme: dark; }
            header { background: #2b2721; border-bottom-color: #403a30; }
            h1 { color: #ece6d9; }
            .back-link { color: #7fb894; border-color: #403a30; }
            .card { background: #2b2721; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
            .pref-shape { stroke: #4d453a; }
            .pref-shape.selected { stroke: #ece6d9; }
            .map-inset-box { stroke: #403a30; }
            .map-legend, .map-note, .pref-list-title { color: #a89e8c; }
            .map-legend i { border-color: rgba(255,255,255,0.15); }
            .pref-btn { background: #2b2721; border-color: #403a30; color: #ece6d9; }
            .pref-btn:hover { background: #403a30; }
            .pref-btn.selected { border-color: #7fb894; background: #33413a; }
            .pref-btn .n { color: #a89e8c; }
            #garage-area { background: #2b2721; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
            .area-header { border-bottom-color: #403a30; }
            .close-btn { background: #403a30; color: #ece6d9; }
            .garage-icon-lg { border-color: #403a30; background: #403a30; }
            #loading { color: #a89e8c; }
            .toggle-btn { border-color: #403a30; color: #a89e8c; }
            .toggle-btn.active-500 { background: #7fb894; border-color: #7fb894; color: #1a1714; }
            body.type-126 .pref-btn.selected { border-color: #f97316; background: #46332a; }
        }
    </style>
  <!-- 左下「一つ前に戻る」（ホーム画面起動時のみ）／右下「先頭へ」の浮かぶボタン -->

<body>

<header>
    <h1 id="pageTitle">REGISTRO MAPPA</h1>
    <a id="backLink" href="/" class="back-link">← ガレージに戻る</a>
    <div class="type-toggle">
        <a href="/mappa" class="toggle-btn" id="btn500">Fiat 500</a>
        <a href="/mappa?type=126" class="toggle-btn" id="btn126">Fiat 126</a>
    </div>
</header>

<div class="container">
    <div id="loading">地図データを取得中...</div>

    <div class="card" id="map-card" style="display:none;">
        <div class="map-wrap" id="mapWrap"></div>
        <div class="map-legend" id="mapLegend"></div>
        <div class="map-note" id="mapNote"></div>
        <div class="pref-list-title">都道府県を選ぶとオーナーが表示されます</div>
        <div class="pref-list" id="prefList"></div>
    </div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title" style="font-weight:bold;">AREA</span>
            <button onclick="closeGarage()" class="close-btn">閉じる</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

<script>
    function esc(s) {
      if (!s) return '';
      return s.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    const urlCarType = new URLSearchParams(window.location.search).get('type') || '500';
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (urlCarType === '126') {
      document.body.classList.add('type-126');
      document.getElementById('pageTitle').textContent = 'REGISTRO126 MAPPA';
      document.getElementById('backLink').href = '/126/';
      document.title = 'Registro126 - Mappa';
      document.getElementById('btn126').classList.add('active-126');
    } else {
      document.getElementById('btn500').classList.add('active-500');
    }

    // 県名 → その県の車の配列
    let carsByPref = {};

    async function init() {
        try {
            const { data: cars, error } = await supabaseClient
              .from('cars')
              .select(`
                DocumentID:document_id,
                HandleName:handle_name,
                Prefecture:prefecture,
                CarType:car_type,
                Model_DisplayC:model_display_c,
                PhotoMain:photo_main
              `)
              .eq('car_type', urlCarType)
              .eq('is_sold', false);

            if (error) throw error;

            carsByPref = {};
            (cars || []).forEach(car => {
                const p = normalizePrefecture(car.Prefecture);
                if (!p) return;
                if (!carsByPref[p]) carsByPref[p] = [];
                carsByPref[p].push(car);
            });

            const counts = {};
            Object.keys(carsByPref).forEach(p => { counts[p] = carsByPref[p].length; });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('map-card').style.display = '';

            await drawChoropleth({
                container: '#mapWrap',
                counts: counts,
                carType: urlCarType,
                dark: isDark,
                legendEl: document.getElementById('mapLegend'),
                noteEl: document.getElementById('mapNote'),
                onClick: (name) => selectPref(name)
            });

            renderPrefList(counts);

        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "エラーが発生しました";
        }
    }

    function renderPrefList(counts) {
        const entries = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
        document.getElementById('prefList').innerHTML = entries.map(([name, n]) =>
            `<button type="button" class="pref-btn" data-pref="${esc(name)}">` +
            `<span>${esc(name)}</span><span class="n">${n}台</span></button>`).join('');
        document.querySelectorAll('.pref-btn').forEach(btn => {
            btn.addEventListener('click', () => selectPref(btn.dataset.pref));
        });
    }

    function selectPref(name) {
        const cars = carsByPref[name];
        if (!cars) return;
        document.querySelectorAll('.pref-shape.selected').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('.pref-btn.selected').forEach(el => el.classList.remove('selected'));
        // 地図側は沖縄インセットも含めて同名の図形が複数ありうるので title で引く
        document.querySelectorAll('.pref-shape').forEach(el => {
            const t = el.querySelector('title');
            if (t && t.textContent.indexOf(name + ' ') === 0) el.classList.add('selected');
        });
        const btn = document.querySelector(`.pref-btn[data-pref="${CSS.escape(name)}"]`);
        if (btn) btn.classList.add('selected');
        showGarage(name, cars);
    }

    function showGarage(name, cars) {
        const area = document.getElementById('garage-area');
        const list = document.getElementById('garage-list');
        document.getElementById('area-title').innerText = `${name} (${cars.length}台)`;
        area.style.display = 'block';
        list.innerHTML = '';
        cars.forEach(car => {
            const item = document.createElement('div');
            item.className = 'garage-item';
            item.innerHTML = `<img src="${car.PhotoMain || 'https://placehold.co/100x100?text=No+Img'}" class="garage-icon-lg" loading="lazy"><div class="garage-name">${esc(car.HandleName || "No Name")}</div>`;
            // 126の車も車両ページは同じ /detail を使う（126/detail.html は存在しない）
            item.onclick = () => window.location.href = `/detail?doc=${encodeURIComponent(car.DocumentID)}`;
            list.appendChild(item);
        });
        setTimeout(() => { area.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }

    function closeGarage() { document.getElementById('garage-area').style.display = 'none'; }
    init();
</script>
<footer style="margin-top:48px;padding:20px 16px;border-top:1px solid #e5e7eb;text-align:center;">
</footer>
