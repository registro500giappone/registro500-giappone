<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-27SHHC4JYH');
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa</title>
    
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        :root {
            /* フィアット500のアイボリーをイメージした背景色 */
            --map-bg: #f5f2eb; 
            --pref-none: #fdfdfc;
            --pref-stroke: #cfc8bd;
            --fiat-red: #c1272d; /* クラシックフィアットの赤 */
            --fiat-blue: #2856a8;
        }

        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; margin: 0; padding: 0; background: var(--map-bg); color: #333; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 2px; color: var(--fiat-blue); font-weight: 900; }
        .back-link { display: inline-block; margin-top: 8px; color: var(--fiat-blue); text-decoration: none; font-size: 0.85rem; padding: 4px 15px; border: 1.5px solid var(--fiat-blue); border-radius: 20px; font-weight: bold; transition: 0.2s; }
        .back-link:hover { background: var(--fiat-blue); color: #fff; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 20px 10px; text-align: center; }

        #map-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            position: relative;
            aspect-ratio: 1 / 1; 
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e0ddd5;
            overflow: hidden;
        }

        svg { width: 100%; height: 100%; display: block; }

        .prefecture {
            fill: var(--pref-none);
            stroke: var(--pref-stroke);
            stroke-width: 0.8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* 車がいる県: 落ち着いた赤 */
        .active-pref {
            fill: #fca5a5; /* 薄い赤（背景） */
        }
        .active-pref:hover {
            fill: var(--fiat-red);
        }

        /* 選択中の県 */
        .selected-pref {
            fill: var(--fiat-red) !important;
            stroke: #7f1d1d !important;
            stroke-width: 1.5px !important;
        }

        .pref-label {
            fill: #450a0a;
            font-size: 13px;
            font-weight: 900;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            /* 数字を浮き立たせる加工 */
            paint-order: stroke;
            stroke: #fff;
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .inset-box { fill: #fff; stroke: #cfc8bd; stroke-width: 1; stroke-dasharray: 4; }

        #info-panel {
            position: absolute; bottom: 25px; left: 25px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px; border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: 900; font-size: 15px;
            border: 2px solid var(--fiat-blue);
            pointer-events: none; opacity: 0; transition: 0.2s;
            z-index: 20; color: var(--fiat-blue);
        }

        #garage-area { display: none; margin-top: 30px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.12); text-align: left; border-top: 5px solid var(--fiat-red); }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #area-title { font-weight: 900; font-size: 1.2rem; color: #1e293b; border-bottom: 3px solid var(--fiat-red); padding-bottom: 5px; }
        .garage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 20px; justify-items: center; }
        .garage-item { width: 100%; cursor: pointer; text-align: center; }
        .garage-icon-lg { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; border: 2px solid #eee; transition: 0.2s; }
        .garage-item:hover .garage-icon-lg { transform: translateY(-5px); border-color: var(--fiat-red); box-shadow: 0 5px 15px rgba(193, 39, 45, 0.2); }
        .garage-name { font-size: 0.75rem; margin-top: 8px; font-weight: bold; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-btn { border: none; background: #eee; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #666; }
        
        #loading { margin: 100px 0; font-weight: bold; color: var(--fiat-blue); font-size: 1.2rem; letter-spacing: 2px; }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO 500 MAPPA</h1>
    <a href="index.html" class="back-link">TORNA AL GARAGE</a>
</header>

<div class="container">
    <div id="loading">CARICAMENTO...</div>

    <div id="map-container">
        <div id="info-panel"></div>
    </div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title">AREA</span>
            <button onclick="closeGarage()" class="close-btn">CHIUDI</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

<script>
    const CACHE_KEY_MAP = 'registro500_map_cars_v3';
    const MAP_FILE_URL = "prefectures.json"; 

    // 台数に応じた色（2段階のみでシンプルに）
    function getColor(count) {
        if (!count || count === 0) return "var(--pref-none)";
        if (count >= 5) return "#fee2e2"; // 5台以上: 少し濃い赤背景
        return "#fef2f2"; // 1-4台: ごく薄い赤背景
    }

    const ID_MAP = {
        1:"北海道",2:"青森県",3:"岩手県",4:"宮城県",5:"秋田県",6:"山形県",7:"福島県",
        8:"茨城県",9:"栃木県",10:"群馬県",11:"埼玉県",12:"千葉県",13:"東京都",14:"神奈川県",
        15:"新潟県",16:"富山県",17:"石川県",18:"福井県",19:"山梨県",20:"長野県",21:"岐阜県",
        22:"静岡県",23:"愛知県",24:"三重県",25:"滋賀県",26:"京都府",27:"大阪府",28:"兵庫県",
        29:"奈良県",30:"和歌山県",31:"鳥取県",32:"島根県",33:"岡山県",34:"広島県",35:"山口県",
        36:"徳島県",37:"香川県",38:"愛媛県",39:"高知県",40:"福岡県",41:"佐賀県",42:"長崎県",
        43:"熊本県",44:"大分県",45:"宮崎県",46:"鹿児島県",47:"沖縄県"
    };

    const EN_MAP = {
        'TOKYO':'東京都', 'OSAKA':'大阪府', 'AICHI':'愛知県', 'KANAGAWA':'神奈川県', 'CHIBA':'千葉県', 'SAITAMA':'埼玉県', 'TOYAMA':'富山県',
        'KYOTO':'京都府', 'FUKUOKA':'福岡県', 'HYOGO':'兵庫県', 'HOKKAIDO':'北海道', 'NAGANO':'長野県', 'SHIZUOKA':'静岡県',
        'IBARAKI':'茨城県', 'GUNMA':'群馬県', 'TOCHIGI':'栃木県', 'MIE':'三重県', 'GIFU':'岐阜県', 'FUKUSHIMA':'福島県',
        'HIROSHIMA':'広島県', 'OKAYAMA':'岡山県', 'NARA':'奈良県', 'SHIGA':'滋賀県'
    };

    async function init() {
        try {
            const mapRes = await fetch(MAP_FILE_URL);
            const mapData = await mapRes.json();

            const cached = localStorage.getItem(CACHE_KEY_MAP);
            if (cached) {
                drawMap(mapData, JSON.parse(cached));
            }

            const { data: cars, error } = await supabaseClient
              .from('cars')
              .select(`
                DocumentID:document_id,
                HandleName:handle_name,
                Prefecture:prefecture,
                Model_DisplayC:model_display_c,
                PhotoMain:photo_main
              `);

            if (error) throw error;
            
            if (cars) {
                localStorage.setItem(CACHE_KEY_MAP, JSON.stringify(cars));
                drawMap(mapData, cars);
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "ERROR";
        }
    }

    function drawMap(mapData, cars) {
        document.getElementById('loading').style.display = 'none';
        const prefData = {};
        cars.forEach(car => {
            let pName = (car.Prefecture || "").trim();
            if(EN_MAP[pName.toUpperCase()]) pName = EN_MAP[pName.toUpperCase()];
            if(!prefData[pName]) prefData[pName] = [];
            prefData[pName].push(car);
        });

        const width = 800;
        const height = 800;
        const container = d3.select("#map-container");
        container.select("svg").remove();
        const svg = container.append("svg").attr("viewBox", `0 0 ${width} ${height}`);
        const panel = document.getElementById('info-panel');

        let objKey = mapData.objects.japan ? "japan" : (mapData.objects.prefectures ? "prefectures" : Object.keys(mapData.objects)[0]);
        const allFeatures = topojson.feature(mapData, mapData.objects[objKey]).features;
        const okinawaFeatures = allFeatures.filter(d => d.id == 47 || d.properties.id == 47);
        const mainFeatures = allFeatures.filter(d => d.id != 47 && d.properties.id != 47);

        const mainProjection = d3.geoMercator().center([137.5, 38.3]).scale(2300).translate([width / 2, height / 2]);
        const mainPath = d3.geoPath().projection(mainProjection);
        renderFeatures(svg, mainFeatures, mainPath, prefData, panel);

        if (okinawaFeatures.length > 0) {
            const boxX = 20, boxY = 20, boxW = 160, boxH = 120;
            const insetProjection = d3.geoMercator().center([127.8, 26.5]).scale(6000).translate([boxX + boxW/2, boxY + boxH/2]);
            const insetPath = d3.geoPath().projection(insetProjection);
            svg.append("rect").attr("x", boxX).attr("y", boxY).attr("width", boxW).attr("height", boxH).attr("class", "inset-box");
            renderFeatures(svg, okinawaFeatures, insetPath, prefData, panel);
        }
    }

    function renderFeatures(svg, features, path, prefData, panel) {
        svg.append("g")
            .selectAll("path")
            .data(features)
            .enter()
            .append("path")
            .attr("class", d => {
                const p = d.properties;
                const candidates = [p.nam_ja, p.name, p.nam, ID_MAP[d.id], String(d.id)].map(v => String(v));
                const matchKey = Object.keys(prefData).find(key => candidates.some(val => val && (val.includes(key) || key.includes(val))));
                return matchKey ? "prefecture active-pref" : "prefecture";
            })
            .attr("d", path)
            .style("fill", d => {
                const p = d.properties;
                const candidates = [p.nam_ja, p.name, p.nam, ID_MAP[d.id], String(d.id)].map(v => String(v));
                const matchKey = Object.keys(prefData).find(key => candidates.some(val => val && (val.includes(key) || key.includes(val))));
                if(matchKey) {
                    d.carList = prefData[matchKey];
                    d.displayName = matchKey;
                    return getColor(d.carList.length);
                }
                return "var(--pref-none)";
            })
            .on("click", function(event, d) {
                if(d.carList) {
                    d3.selectAll(".selected-pref").classed("selected-pref", false);
                    d3.select(this).classed("selected-pref", true);
                    showGarage(d.displayName, d.carList);
                }
            })
            .on("mouseover", function(event, d) {
                const name = d.displayName || d.properties.nam_ja || d.properties.name || ID_MAP[d.id] || "Unknown";
                panel.style.opacity = 1;
                panel.innerText = name + (d.carList ? ` : ${d.carList.length}台` : "");
            })
            .on("mouseout", function() { panel.style.opacity = 0; });

        svg.append("g")
            .selectAll("text")
            .data(features)
            .enter()
            .append("text")
            .attr("class", "pref-label")
            .attr("transform", function(d) {
                const centroid = path.centroid(d);
                if (isNaN(centroid[0])) return "translate(-999,-999)";
                let x = centroid[0], y = centroid[1];
                const name = d.displayName || d.properties.nam_ja || d.properties.name || "";
                if (name.includes("東京")) { y -= 24; x -= 4; }
                return `translate(${x},${y})`;
            })
            .text(d => (d.carList && d.carList.length > 0) ? d.carList.length : "");
    }

    function showGarage(name, cars) {
        const area = document.getElementById('garage-area');
        const list = document.getElementById('garage-list');
        document.getElementById('area-title').innerText = `${name} / ${cars.length}台`;
        area.style.display = 'block';
        list.innerHTML = '';
        cars.forEach(car => {
            const item = document.createElement('div');
            item.className = 'garage-item';
            item.innerHTML = `<img src="${car.PhotoMain || 'https://placehold.co/100x100?text=No+Img'}" class="garage-icon-lg" loading="lazy"><div class="garage-name">${car.HandleName || "---"}</div>`;
            item.onclick = () => window.location.href = `detail.html?doc=${car.DocumentID}`;
            list.appendChild(item);
        });
        setTimeout(() => { area.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
    }

    function closeGarage() { document.getElementById('garage-area').style.display = 'none'; }
    init();
</script>
</body>
</html>
