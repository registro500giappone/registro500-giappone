<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>みんなのおすすめ工具 | Registro500 Giappone</title>
  <meta name="description" content="空冷クラシックFiat 500・126オーナーが、実際に使っている工具を写真と一言つきで紹介します。車に積む工具も、ガレージで使う工具も。">
  <link rel="canonical" href="https://www.registro500.com/tools">
  <meta property="og:title" content="みんなのおすすめ工具">
  <meta property="og:description" content="空冷Fiat 500・126オーナーが、実際に使っている工具を写真と一言つきで紹介します。">
  <meta property="og:url" content="https://www.registro500.com/tools">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Registro500 Giappone">
  <meta property="og:image" content="https://www.registro500.com/og/site-ja.png">
  <meta name="twitter:card" content="summary_large_image">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-27SHHC4JYH');
  </script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0" integrity="sha384-NFPmVbJvc91cC9zbheWJA+qZKj0Kod2IEMvGnxVKB5A7wLgRNA6Aobu8neZmQ19J" crossorigin="anonymous"></script>
  <script>const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
  <style>
    :root {
      --bg-main: #f5f0e6; --card-bg: #fffefb; --border-soft: #d6c9b0;
      --shadow-soft: 0 2px 8px rgba(70,58,40,.10); --text-main: #2e2a24; --text-sub: #7a705f;
      --accent: #1f5c3d; --accent-soft: #e7efe7; --amber: #b8700f; --danger: #a33a2a;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #1a1714; --card-bg: #2b2721; --border-soft: #403a30;
        --shadow-soft: 0 2px 10px rgba(0,0,0,.35); --text-main: #ece6d9; --text-sub: #a89e8c;
        --accent: #7fb894; --accent-soft: #24382c; --amber: #c98a2c; --danger: #e08a7a;
      }
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
    body { font-family: var(--font-sans); margin: 0; padding: 20px 16px 60px; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }
    .page { max-width: 640px; margin: 0 auto; }
    .back-link { display: inline-block; font-size: .85rem; color: var(--text-sub); text-decoration: none; margin-bottom: 12px; }
    .back-link:hover { color: var(--accent); }
    h1 { font-size: 1.35rem; margin: .2em 0; }
    .lead { font-size: .88rem; color: var(--text-sub); margin: 0 0 12px; }
    .btn-main { display: block; width: 100%; text-align: center; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 700; text-decoration: none; cursor: pointer; font-family: inherit; }
    @media (prefers-color-scheme: dark) { .btn-main { color: #10261a; } }
    .hidden { display: none !important; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 14px 0 10px; }
    .chip { flex: none; border: 1px solid var(--border-soft); background: var(--card-bg); color: var(--text-main); border-radius: 999px; padding: 5px 11px; font-size: .8rem; cursor: pointer; font-family: inherit; }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (prefers-color-scheme: dark) { .chip.on { color: #10261a; } }
    .tool { background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow-soft); }
    .tphoto { width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; background: var(--accent-soft); display: block; margin-bottom: 10px; }
    .tname { font-weight: 700; font-size: 1rem; line-height: 1.35; }
    .meta { font-size: .75rem; color: var(--text-sub); margin-top: 3px; }
    .badge { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 6px; font-size: .7rem; font-weight: 700; margin-right: 4px; }
    .voice { border-left: 3px solid var(--accent-soft); padding: 4px 0 4px 10px; margin: 9px 0 0; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .who { display: block; font-size: .72rem; color: var(--text-sub); margin-top: 2px; white-space: normal; }
    .who a { color: var(--accent); }
    .more { font-size: .78rem; color: var(--accent); margin-top: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
    .buy { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .amz { background: var(--amber); color: #fff; border-radius: 8px; padding: 7px 12px; font-size: .8rem; font-weight: 700; text-decoration: none; }
    .pr { font-size: .65rem; border: 1px solid var(--border-soft); border-radius: 3px; padding: 0 4px; color: var(--text-sub); }
    .metoo-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .metoo { font-family: inherit; font-size: .8rem; font-weight: 700; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
    .metoo.on { background: var(--accent); color: #fff; }
    .metoo:disabled { opacity: .6; cursor: default; }
    .metoo-note { font-size: .75rem; color: var(--text-sub); }
    .metoo-note a { color: var(--accent); }
    .also { font-size: .75rem; color: var(--text-sub); margin-top: 8px; line-height: 1.6; }
    .also a { color: var(--accent); }
    .empty, #loading { text-align: center; color: var(--text-sub); padding: 36px 0; }
    .empty p { margin: 0 0 14px; }
    .affiliate-disclosure { font-size: .72rem; color: var(--text-sub); margin-top: 24px; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 8px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="page">
  <a href="/" class="back-link">&larr; ガレージに戻る</a>
  <h1>🔧 みんなのおすすめ工具</h1>
  <p class="lead">空冷500・126オーナーが、実際に使っている工具を一言つきで紹介しています。車に積む工具も、ガレージで使う工具も。</p>
  <a class="btn-main" href="/tools-edit">＋ わたしの一本を紹介する（写真つき）</a>
  <div class="chips" id="chips"></div>
  <div id="loading">読み込み中…</div>
  <div id="list"></div>
  <div id="disclosure" class="affiliate-disclosure hidden">
    このページにはAmazonアソシエイトのリンクが含まれています（PR）。<br>
    リンク経由でご購入いただいた場合、Amazonからわずかな報酬がこのサイトに入りますが、商品の価格は変わりません。紹介文は各オーナーが書いたもので、広告主からの依頼ではありません。<br>
    <small>Amazonアソシエイトとして、<span id="affiliate-tag"></span>はAmazon.co.jpの適格販売に伴う収入を得ています。</small>
  </div>
</div>
<script>
(function () {
  const CATS = [
    ['all', 'すべて'], ['turn', '回す'], ['grip', 'つかむ・切る・叩く'], ['measure', '測る・調べる'], ['lift', '持ち上げる・支える'], ['special', '専用工具'], ['light', '照らす・手を守る'], ['repair', '応急・補修']
  ];
  const CAT_LABEL = Object.fromEntries(CATS);
  const USAGE_LABEL = { carry: '車に積む', garage: 'ガレージで使う', both: '車に積む・ガレージで使う' };
  const SHOW_VOICES = 3;
  let groups = [];
  let curCat = 'all';
  let carMap = {};
  let myCars = null;   // null＝未ログイン／[]＝車なし
  let busy = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // tool_key が同じ投稿を1枚にまとめる（NULL は単独カード）
  function buildGroups(rows, users) {
    const map = new Map();
    rows.forEach(r => {
      const key = r.tool_key ? 'k:' + r.tool_key : 'id:' + r.id;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    const out = [];
    map.forEach(items => {
      const asc = items.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const first = asc[0];
      const withPhoto = asc.find(i => i.photo_url);
      const withAmz = asc.find(i => i.amazon_url);
      const usages = new Set(asc.map(i => i.usage));
      const postIds = new Set(asc.map(i => i.id));
      const authorCars = new Set(asc.map(i => i.car_id));
      const metoo = users.filter(u => postIds.has(u.tool_id));
      const metooCars = [...new Set(metoo.map(u => u.car_id))];
      // 見出しは購入リンクの付いた投稿の名前を優先し、無ければいちばん詳しい（長い）名前
      const longest = asc.reduce((a, b) => (b.name.length > a.name.length ? b : a));
      out.push({
        name: (withAmz || longest).name,
        category: first.category,
        usage: usages.size === 1 ? first.usage : 'both',
        photo: withPhoto ? withPhoto.photo_url : null,
        amazon: withAmz ? withAmz.amazon_url : null,
        carCount: new Set([...authorCars, ...metooCars]).size,
        repId: first.id,
        authorCars: authorCars,
        metoo: metoo,
        alsoCars: metooCars.filter(id => !authorCars.has(id)),
        latest: new Date(asc[asc.length - 1].created_at).getTime(),
        voices: asc.slice().reverse().map(i => ({ comment: i.comment, car: carMap[i.car_id] || null }))
      });
    });
    out.sort((a, b) => b.latest - a.latest);
    return out;
  }

  // GA4 のイベント（失敗しても画面の動きは止めない）
  function track(name, params) {
    try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {}
  }

  function carLabel(car) {
    return (car.handle_name || 'オーナー') + ' さん' + (car.modelDisplay ? '・' + car.modelDisplay : '');
  }

  // 「🔧 わたしも使ってる」— 登録オーナーが自分の車をこの工具の使用者に加える（人気の数ではなく、使っている車の数）
  function metooEl(g) {
    const row = el('div', 'metoo-row');
    if (myCars === null) {
      const b = el('button', 'metoo', '🔧 わたしも使ってる');
      b.type = 'button';
      b.addEventListener('click', () => {
        track('tool_metoo_guest');
        b.remove();
        const n = el('span', 'metoo-note', '登録オーナーとしてログインすると押せます。');
        const a = el('a', null, 'ログインする');
        a.href = '/tools-edit';
        n.appendChild(document.createTextNode(' '));
        n.appendChild(a);
        row.appendChild(n);
      });
      row.appendChild(b);
      return row;
    }
    if (!myCars.length) return null;
    const eligible = myCars.filter(c => !g.authorCars.has(c.document_id));
    if (!eligible.length) return null; // 自分の紹介には押さない
    const mine = g.metoo.filter(u => eligible.some(c => c.document_id === u.car_id));
    if (mine.length) {
      const b = el('button', 'metoo on', '✅ 使ってる（取り消す）');
      b.type = 'button';
      b.addEventListener('click', () => act(b, async () => {
        const { error } = await supabaseClient.from('owner_tool_users').delete().in('id', mine.map(u => u.id));
        if (error) throw error;
        track('tool_metoo', { action: 'remove', category: g.category });
      }));
      row.appendChild(b);
      return row;
    }
    const press = car => async () => {
      const { error } = await supabaseClient.from('owner_tool_users').insert({ tool_id: g.repId, car_id: car.document_id });
      if (error) throw error;
      track('tool_metoo', { action: 'add', category: g.category });
    };
    const b = el('button', 'metoo', '🔧 わたしも使ってる');
    b.type = 'button';
    if (eligible.length === 1) {
      b.addEventListener('click', () => act(b, press(eligible[0])));
      row.appendChild(b);
    } else {
      b.addEventListener('click', () => {
        b.remove();
        row.appendChild(el('span', 'metoo-note', 'どの車で？'));
        eligible.forEach(car => {
          const cb = el('button', 'metoo', carLabel(car));
          cb.type = 'button';
          cb.addEventListener('click', () => act(cb, press(car)));
          row.appendChild(cb);
        });
      });
      row.appendChild(b);
    }
    return row;
  }

  async function act(btn, fn) {
    if (busy) return;
    busy = true;
    btn.disabled = true;
    try {
      await fn();
      await loadData();
      renderList();
    } catch (err) {
      console.error('[tools metoo]', err);
      alert('保存できませんでした。時間をおいてもう一度お試しください。');
      btn.disabled = false;
    } finally {
      busy = false;
    }
  }

  function voiceEl(v) {
    const d = el('div', 'voice', v.comment);
    const who = el('span', 'who');
    if (v.car) {
      const a = el('a', null, carLabel(v.car));
      a.href = '/detail?doc=' + encodeURIComponent(v.car.document_id);
      who.appendChild(a);
    } else {
      who.textContent = 'オーナー';
    }
    d.appendChild(who);
    return d;
  }

  function cardEl(g) {
    const c = el('div', 'tool');
    if (g.photo) {
      const img = el('img', 'tphoto');
      img.referrerPolicy = 'no-referrer'; img.src = g.photo; img.alt = g.name; img.loading = 'lazy';
      img.addEventListener('error', () => img.remove());
      c.appendChild(img);
    }
    c.appendChild(el('div', 'tname', g.name));
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'badge', '👥 ' + g.carCount + '台が使用'));
    meta.appendChild(document.createTextNode((CAT_LABEL[g.category] || '') + ' ／ ' + (USAGE_LABEL[g.usage] || '')));
    c.appendChild(meta);
    g.voices.slice(0, SHOW_VOICES).forEach(v => c.appendChild(voiceEl(v)));
    const rest = g.voices.slice(SHOW_VOICES);
    if (rest.length) {
      const box = el('div', 'hidden');
      rest.forEach(v => box.appendChild(voiceEl(v)));
      const btn = el('button', 'more', '＋ ほか' + rest.length + '人の声');
      btn.type = 'button';
      btn.addEventListener('click', () => { box.classList.remove('hidden'); btn.remove(); });
      c.appendChild(box);
      c.appendChild(btn);
    }
    const also = g.alsoCars.map(id => carMap[id]).filter(Boolean);
    if (also.length) {
      const d = el('div', 'also', 'ほかに ');
      also.forEach((car, i) => {
        if (i) d.appendChild(document.createTextNode('、'));
        const a = el('a', null, carLabel(car));
        a.href = '/detail?doc=' + encodeURIComponent(car.document_id);
        d.appendChild(a);
      });
      d.appendChild(document.createTextNode(' も使用'));
      c.appendChild(d);
    }
    const mt = metooEl(g);
    if (mt) c.appendChild(mt);
    if (g.amazon) {
      const buy = el('div', 'buy');
      const a = el('a', 'amz', 'Amazonで見る');
      a.href = g.amazon;
      a.target = '_blank';
      a.rel = 'nofollow sponsored noopener';
      buy.appendChild(a);
      buy.appendChild(el('span', 'pr', 'PR'));
      c.appendChild(buy);
    }
    return c;
  }

  function renderChips() {
    const box = document.getElementById('chips');
    box.textContent = '';
    CATS.forEach(([k, label]) => {
      const b = el('button', 'chip' + (k === curCat ? ' on' : ''), label);
      b.type = 'button';
      b.addEventListener('click', () => { curCat = k; track('tool_filter', { category: k }); renderChips(); renderList(); });
      box.appendChild(b);
    });
  }

  function renderList() {
    const box = document.getElementById('list');
    box.textContent = '';
    const disc = document.getElementById('disclosure');
    if (!groups.length) {
      const e = el('div', 'empty');
      e.appendChild(el('p', null, 'まだ紹介がありません。最初の一本を紹介してください。'));
      const a = el('a', 'btn-main', '＋ わたしの一本を紹介する');
      a.href = '/tools-edit';
      e.appendChild(a);
      box.appendChild(e);
      document.getElementById('chips').classList.add('hidden');
      disc.classList.add('hidden');
      return;
    }
    const list = groups.filter(g => curCat === 'all' || g.category === curCat);
    if (!list.length) box.appendChild(el('div', 'empty', 'この分類の紹介はまだありません。'));
    list.forEach(g => box.appendChild(cardEl(g)));
    // 開示文：Amazonリンクが1件でもあれば出し、IDはリンクの tag= から取る
    const withAmz = groups.find(g => g.amazon);
    const m = withAmz ? /[?&]tag=([^&#]+)/.exec(withAmz.amazon) : null;
    if (withAmz && m) {
      document.getElementById('affiliate-tag').textContent = decodeURIComponent(m[1]);
      disc.classList.remove('hidden');
    } else {
      disc.classList.add('hidden');
    }
  }

  function toCar(c) {
    return {
      document_id: c.document_id, handle_name: c.handle_name, car_type: c.car_type,
      modelDisplay: c.model_display_c || [c.model_display_a || '', c.model_display_b || ''].filter(Boolean).join(' ')
    };
  }
  const CAR_COLS = 'document_id, handle_name, model_display_a, model_display_b, model_display_c, car_type';

  async function loadData() {
    const { data: rows, error } = await supabaseClient.from('owner_tools')
      .select('id, car_id, name, category, usage, comment, photo_url, tool_key, amazon_url, created_at')
      .eq('is_hidden', false).order('created_at', { ascending: false }).limit(1000);
    if (error) throw error;
    const toolIds = (rows || []).map(r => r.id);
    let users = [];
    if (toolIds.length) {
      const { data: u, error: eu } = await supabaseClient.from('owner_tool_users')
        .select('id, tool_id, car_id').in('tool_id', toolIds);
      if (eu) throw eu;
      users = u || [];
    }
    const ids = [...new Set([...(rows || []).map(r => r.car_id), ...users.map(u => u.car_id)])];
    carMap = {};
    if (ids.length) {
      const { data: cars, error: e2 } = await supabaseClient.from('cars').select(CAR_COLS).in('document_id', ids);
      if (e2) throw e2;
      (cars || []).forEach(c => { carMap[c.document_id] = toCar(c); });
    }
    groups = buildGroups(rows || [], users);
  }

  async function loadMyCars() {
    const { data } = await supabaseClient.auth.getSession();
    const user = data && data.session && data.session.user;
    if (!user) { myCars = null; return; }
    const { data: cars, error } = await supabaseClient.from('cars').select(CAR_COLS).eq('owner_user_id', user.id);
    if (error) { console.error('[tools] my cars', error); myCars = []; return; }
    myCars = (cars || []).map(toCar);
  }

  async function init() {
    renderChips();
    const loading = document.getElementById('loading');
    try {
      await Promise.all([loadData(), loadMyCars().catch(err => { console.error(err); myCars = null; })]);
      loading.remove();
      renderList();
    } catch (err) {
      console.error('[tools]', err);
      loading.textContent = '読み込みに失敗しました。時間をおいて再読み込みしてください。';
    }
  }
  init();
})();
</script>
</body>
</html>
