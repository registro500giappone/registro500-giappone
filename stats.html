<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計データ | Registro500 Giappone</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.1.0"></script>
  <script src="config.js"></script>
  <style>
    :root { --accent: #2856a8; --bg: #f4f4f7; --card: #fff; --radius: 12px; }
    body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
    .page { max-width: 1000px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: var(--accent); margin: 0; }
    .note { font-size: 0.8rem; color: #d32f2f; margin-top: 10px; }
    .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 18px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .tab-btn.active { background: var(--accent); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .tab-content.active { grid-template-columns: 1fr 1fr; } .full { grid-column: span 2; } }
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .chart-title { font-size: 1rem; font-weight: bold; border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
    .chart-container { position: relative; height: 320px; width: 100%; }
    #loading { text-align: center; padding: 50px; font-weight: bold; }
    .back { display: block; text-align: center; margin-top: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="page">
  <div class="header">
    <h1>Registro500 Statistics</h1>
    <p>現在の登録車両: <span id="totalCount">-</span> 台</p>
    <div class="note">※「未記入」データを除いた有効回答のみを集計しています。</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="basic">基本情報</button>
    <button class="tab-btn" data-tab="powertrain">機関・電装</button>
    <button class="tab-btn" data-tab="maintenance">メンテナンス</button>
    <button class="tab-btn" data-tab="footwork">足回り</button>
  </div>

  <div id="loading">データを読み込み中...</div>

  <!-- タブ1: 基本情報 -->
  <div id="basic" class="tab-content active">
    <div class="chart-card full"><div class="chart-title">🚗 モデル別分布</div><div class="chart-container"><canvas id="modelChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎨 ボディカラー</div><div class="chart-container"><canvas id="colorChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎡 ハンドル位置</div><div class="chart-container"><canvas id="steeringChart"></canvas></div></div>
  </div>

  <!-- タブ2: 機関・電装 -->
  <div id="powertrain" class="tab-content">
    <div class="chart-card"><div class="chart-title">⚙️ 排気量(cc)</div><div class="chart-container"><canvas id="engineChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">⚡ 点火方式</div><div class="chart-container"><canvas id="ignitionChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🔋 発電機</div><div class="chart-container"><canvas id="generatorChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🕹️ 変速機・シンクロ</div><div class="chart-container"><canvas id="transChart"></canvas></div></div>
  </div>

  <!-- タブ3: メンテナンス -->
  <div id="maintenance" class="tab-content">
    <div class="chart-card"><div class="chart-title">🛢️ エンジンオイル ブランド</div><div class="chart-container"><canvas id="eOilBrandChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">📅 オイル交換サイクル</div><div class="chart-container"><canvas id="eOilCycleChart"></canvas></div></div>
    <div class="chart-card full"><div class="chart-title">⚙️ ミッションオイル ブランド</div><div class="chart-container"><canvas id="mOilBrandChart"></canvas></div></div>
  </div>

  <!-- タブ4: 足回り -->
  <div id="footwork" class="tab-content">
    <div class="chart-card"><div class="chart-title">🏁 タイヤ ブランド</div><div class="chart-container"><canvas id="tireBrandChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">📏 タイヤ サイズ</div><div class="chart-container"><canvas id="tireSizeChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🛞 ホイール</div><div class="chart-container"><canvas id="wheelChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">↔️ リム径/幅</div><div class="chart-container"><canvas id="rimChart"></canvas></div></div>
  </div>

  <a href="index.html" class="back">← ガレージに戻る</a>
</div>

<script>
  let chartInstances = {};
  const CACHE_KEY = 'registro500_stats_v17';
  const COLOR_PALETTE = {
    '白/アイボリー系': '#f5f5f5', '赤系': '#D32F2F', '黄系': '#FBC02D', 'ブルー系': '#1976D2', '水色系': '#81D4FA', '緑系': '#388E3C', 'グレー系': '#757575', 'ベージュ系': '#D7CCC8', '黒系': '#212121', 'その他': '#CFD8DC'
  };

  window.addEventListener('DOMContentLoaded', () => {
    Chart.register(ChartDataLabels);
    initTabs();
    fetchData();
  });

  function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });
  }

  async function fetchData() {
    try {
      const res = await fetch(API_URL + '?mode=index');
      const json = await res.json();
      if (!json.success) throw new Error(json.error);
      document.getElementById('loading').style.display = 'none';
      renderAllCharts(json.data);
    } catch (err) {
      document.getElementById('loading').innerText = "エラー: データの取得に失敗しました。";
    }
  }

  function renderAllCharts(cars) {
    document.getElementById('totalCount').innerText = cars.length;
    Object.values(chartInstances).forEach(ins => ins.destroy());

    // --- 各グラフ描画 ---
    renderBar('modelChart', cars, c => (c.Model_DisplayC || '').split('(')[0].trim(), '#2856a8');
    renderPie('colorChart', cars, c => getColorGroup(c.BodyColor), true);
    renderPie('steeringChart', cars, c => {
      if (String(c.Steering).includes('左')) return '左ハンドル';
      if (String(c.Steering).includes('右')) return '右ハンドル';
      return null;
    });

    renderBar('engineChart', cars, c => c.EngineCC ? String(c.EngineCC).replace('cc','') + 'cc' : null, '#ff9800');
    renderPie('ignitionChart', cars, c => c.IgnitionType);
    renderPie('generatorChart', cars, c => c.Generator);
    renderBar('transChart', cars, c => c.Transmission ? (c.Transmission + (c.Synchro ? `(${c.Synchro})` : '')) : null, '#673ab7');

    renderBar('eOilBrandChart', cars, c => getBrandJa(c.EngineOil), '#e91e63');
    renderBar('eOilCycleChart', cars, c => getCycleJa(c.EngineOilInterval), '#795548');
    renderBar('mOilBrandChart', cars, c => getBrandJa(c.TransmissionOil), '#607d8b');

    renderBar('tireBrandChart', cars, c => getBrandJa(c.TireBrandName), '#2196f3');
    renderBar('tireSizeChart', cars, c => String(c.TireSize || '').replace(/\s/g, '').toUpperCase(), '#00bcd4');
    renderPie('wheelChart', cars, c => c.Wheel);
    renderBar('rimChart', cars, c => c.RimDiameter_in ? c.RimDiameter_in + 'インチ(' + (c.RimWidth_in || '-') + 'J)' : null, '#9e9e9e');
  }

  // --- 集計ロジック (ガードレール付) ---
  function getBrandJa(t) {
    if (!t) return null;
    const v = String(t).toLowerCase();
    if (v.match(/motul|モチュール/)) return 'モチュール';
    if (v.match(/michelin|ミシュラン/)) return 'ミシュラン';
    if (v.match(/pirelli|ピレリ/)) return 'ピレリ';
    if (v.match(/bridgestone|ブリヂストン|bs/)) return 'ブリヂストン';
    if (v.match(/yokohama|ヨコハマ/)) return 'ヨコハマ';
    if (v.match(/dunlop|ダンロップ/)) return 'ダンロップ';
    if (v.match(/lubross|ルブロス/)) return 'ルブロス';
    if (v.match(/meister|マイスター/)) return 'マイスター';
    if (v.match(/castrol|カストロール/)) return 'カストロール';
    if (v.match(/wako|ワコーズ/)) return 'ワコーズ';
    return 'その他';
  }

  function getColorGroup(t) {
    if (!t) return null;
    const v = String(t).toLowerCase();
    if (v.match(/白|white|bianco|ホワイト|アイボリー|ivory/)) return '白/アイボリー系';
    if (v.match(/赤|red|rosso|レッド/)) return '赤系';
    if (v.match(/黄|yellow|giallo|イエロー|クリーム|positano/)) return '黄系';
    if (v.match(/水色|light blue|azur|アクア|celeste|volare|ターコイズ|空色/)) return '水色系';
    if (v.match(/青|blue|blu|ブルー|ネイビー|紺/)) return 'ブルー系';
    if (v.match(/緑|green|verde|グリーン/)) return '緑系';
    if (v.match(/灰|grey|grigio|グレー|シルバー/)) return 'グレー系';
    return 'その他';
  }

  function getCycleJa(t) {
    if (!t) return null;
    const v = String(t);
    if (v.match(/3000|2000|2500/)) return '3,000km以下';
    if (v.match(/5000/)) return '5,000km目安';
    if (v.match(/半年|6ヶ月/)) return '半年ごと';
    if (v.match(/1年/)) return '1年ごと';
    if (v.match(/車検/)) return '車検ごと';
    return 'その他';
  }

  function aggregate(cars, extractor) {
    const counts = {};
    cars.forEach(c => {
      const val = extractor(c);
      if (val && val !== '未記入' && val !== '不明' && val !== 'undefined') {
        counts[val] = (counts[val] || 0) + 1;
      }
    });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  function renderBar(id, cars, extractor, color) {
    const data = aggregate(cars, extractor);
    if (data.length === 0) return;
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'bar',
      data: { labels: data.map(d => d[0]), datasets: [{ data: data.map(d => d[1]), backgroundColor: color }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'end', formatter: v => v + '台' } } }
    });
  }

  function renderPie(id, cars, extractor, usePalette = false) {
    const data = aggregate(cars, extractor);
    if (data.length === 0) return;
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'pie',
      data: {
        labels: data.map(d => d[0]),
        datasets: [{
          data: data.map(d => d[1]),
          backgroundColor: usePalette ? data.map(d => COLOR_PALETTE[d[0]] || '#CFD8DC') : ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' }, datalabels: { color: usePalette ? '#000' : '#fff', font: { weight: 'bold' } } } }
    });
  }
</script>
</body>
</html>
