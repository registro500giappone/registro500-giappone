<script>
  Chart.register(ChartDataLabels);
  const CACHE_KEY = 'registro500_stats_v11'; // JS側のキャッシュも更新
  let chartInstances = {};

  // ブランド名の日本語マッピング
  const BRAND_MAP = {
    'motul': 'モチュール', 'michelin': 'ミシュラン', 'pirelli': 'ピレリ',
    'bridgestone': 'ブリヂストン', 'bs': 'ブリヂストン', 'yokohama': 'ヨコハマ',
    'dunlop': 'ダンロップ', 'castrol': 'カストロール', 'lubross': 'ルブロス',
    'meister': 'マイスター', 'gulf': 'ガルフ', 'nutec': 'ニューテック',
    'pennzoil': 'ペンズオイル', 'valvoline': 'バルボリン', 'wakos': 'ワコーズ'
  };

  init();

  async function init() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) draw(JSON.parse(cached));
    try {
      const res = await fetch(API_URL + '?mode=index');
      const json = await res.json();
      if (json.success) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(json.data));
        draw(json.data);
      }
    } catch (e) { console.error("Fetch error:", e); }
  }

  function draw(cars) {
    console.log("集計対象データ:", cars[0]); // デバッグ用: 1台目のデータの中身をコンソールに表示
    document.getElementById('totalCount').innerText = cars.length;
    document.getElementById('loading').style.display = 'none';
    Object.values(chartInstances).forEach(ins => ins.destroy());

    // --- 各グラフの描画 (空文字を除外) ---
    renderBar('modelChart', cars, c => (c.Model_DisplayC||'').split('(')[0].trim(), '#2856a8');
    renderColorPie('colorChart', cars);
    renderPie('steeringChart', cars, c => (c.Steering === '左' ? '左ハンドル' : (c.Steering === '右' ? '右ハンドル' : '')));
    renderBar('prefChart', cars, c => c.Prefecture, '#4caf50');

    renderBar('engineChart', cars, c => (c.EngineCC ? c.EngineCC+'cc' : ''), '#ff9800');
    renderPie('ignitionChart', cars, c => c.IgnitionType);
    renderPie('generatorChart', cars, c => c.Generator);
    renderBar('transChart', cars, c => c.Transmission ? (c.Transmission + (c.Synchro ? `(${c.Synchro})` : '')) : '', '#673ab7');

    renderBar('eOilBrandChart', cars, c => getBrand(c.EngineOil), '#e91e63');
    renderPie('eOilVisChart', cars, c => getViscosity(c.EngineOil));
    renderBar('eOilCycleChart', cars, c => getInterval(c.EngineOilInterval), '#795548');
    renderBar('mOilBrandChart', cars, c => getBrand(c.TransmissionOil), '#607d8b');

    renderBar('tireBrandChart', cars, c => getBrand(c.TireBrandName), '#2196f3');
    renderBar('tireSizeChart', cars, c => normalizeTire(c.TireSize), '#00bcd4');
    renderPie('wheelChart', cars, c => c.Wheel);
    renderBar('rimWidthChart', cars, c => (c.RimWidth_in ? c.RimWidth_in+'J' : ''), '#9e9e9e');
  }

  function getBrand(txt) {
    if(!txt || txt.match(/不明|未記入/)) return '';
    const t = txt.toLowerCase().replace(/\s+/g, '');
    for (const [key, jaName] of Object.entries(BRAND_MAP)) {
      if (t.includes(key)) return jaName;
    }
    return 'その他';
  }

  function aggregate(cars, extractor) {
    const counts = {};
    cars.forEach(c => {
      const v = extractor(c);
      if (v && v !== '未記入' && v !== '不明') {
        counts[v] = (counts[v] || 0) + 1;
      }
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  }

  function renderBar(id, cars, extractor, color) {
    const data = aggregate(cars, extractor);
    if (data.length === 0) return; // データがない場合は描画しない (白紙回避)
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'bar',
      data: { labels: data.map(d=>d[0]), datasets: [{ data: data.map(d=>d[1]), backgroundColor: color }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'end', formatter: v=>v+'台' } },
        scales: { x: { beginAtZero: true } }
      }
    });
  }
  // ※他の renderPie, getInterval 等の関数は前回のロジックを継承
</script>
