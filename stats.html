<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計データ | Registro500 Giappone</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-27SHHC4JYH');</script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <style>
    :root { --accent: #2856a8; --bg: #f4f4f7; --card: #fff; --radius: 12px; }
    body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .page { max-width: 1000px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: var(--accent); margin-bottom: 5px; }
    .note { font-size: 0.8rem; color: #666; margin-bottom: 15px; }
    .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 16px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .tab-btn.active { background: var(--accent); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .tab-content.active { grid-template-columns: 1fr 1fr; } .full { grid-column: span 2; } }
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .chart-title { font-size: 1rem; font-weight: bold; border-bottom: 2px solid var(--bg); padding-bottom: 8px; margin-bottom: 15px; text-align: center; }
    .chart-container { position: relative; height: 320px; width: 100%; }
    #loading { text-align: center; padding: 50px; font-weight: bold; }
    .back { display: block; text-align: center; margin-top: 20px; color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Registro500 Statistics</h1>
    <p>登録車両: <span id="totalCount">-</span>台 / 集計対象: <span id="activeCount">-</span>台</p>
    <div class="note">※「未記入」データを除いた有効回答のみを集計しています。</div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('basic')">基本情報</button>
    <button class="tab-btn" onclick="switchTab('powertrain')">機関・電装</button>
    <button class="tab-btn" onclick="switchTab('maintenance')">メンテ・オイル</button>
    <button class="tab-btn" onclick="switchTab('footwork')">足回り</button>
  </div>
  <div id="loading">データを集計中...</div>
  
  <div id="basic" class="tab-content active">
    <div class="chart-card full"><div class="chart-title">🚗 モデル別</div><div class="chart-container"><canvas id="modelChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎨 ボディカラー</div><div class="chart-container"><canvas id="colorChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎡 ハンドル位置</div><div class="chart-container"><canvas id="steeringChart"></canvas></div></div>
    <div class="chart-card full"><div class="chart-title">📍 都道府県</div><div class="chart-container"><canvas id="prefChart"></canvas></div></div>
  </div>
  <div id="powertrain" class="tab-content">
    <div class="chart-card"><div class="chart-title">⚙️ 排気量(cc)</div><div class="chart-container"><canvas id="engineChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">⚡ 点火方式</div><div class="chart-container"><canvas id="ignitionChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🔋 発電機</div><div class="chart-container"><canvas id="generatorChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🕹️ 変速機・シンクロ</div><div class="chart-container"><canvas id="transChart"></canvas></div></div>
  </div>
  <div id="maintenance" class="tab-content">
    <div class="chart-card"><div class="chart-title">🛢️ エンジンオイル ブランド</div><div class="chart-container"><canvas id="eOilBrandChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">💧 エンジンオイル 粘度</div><div class="chart-container"><canvas id="eOilVisChart"></canvas></div></div>
    <div class="chart-card full"><div class="chart-title">📅 エンジンオイル交換サイクル</div><div class="chart-container"><canvas id="eOilCycleChart"></canvas></div></div>
    <div class="chart-card full"><div class="chart-title">⚙️ ミッションオイル ブランド</div><div class="chart-container"><canvas id="mOilBrandChart"></canvas></div></div>
  </div>
  <div id="footwork" class="tab-content">
    <div class="chart-card"><div class="chart-title">🏁 タイヤ ブランド</div><div class="chart-container"><canvas id="tireBrandChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">📏 タイヤ サイズ</div><div class="chart-container"><canvas id="tireSizeChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">⭕ ホイール</div><div class="chart-container"><canvas id="wheelChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">↔️ リム幅(J)</div><div class="chart-container"><canvas id="rimWidthChart"></canvas></div></div>
  </div>
  <a href="index.html" class="back">← ガレージに戻る</a>
</div>

<script>
  Chart.register(ChartDataLabels);
  const CACHE_KEY = 'registro500_stats_v10';
  let chartInstances = {};

  const COLOR_PALETTE = {
    '白/アイボリー系': '#f5f5f5', '赤系': '#D32F2F', '黄系': '#FBC02D',
    'ブルー系': '#1976D2', '水色系': '#81D4FA', '緑系': '#388E3C',
    'グレー系': '#757575', 'ベージュ系': '#D7CCC8', '黒系': '#212121',
    'オレンジ系': '#F57C00', 'その他': '#CFD8DC'
  };

  init();

  async function init() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) draw(JSON.parse(cached));
    try {
      const res = await fetch(API_URL + '?mode=index');
      const json = await res.json();
      if (json.success) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(json.data));
        draw(json.data);
      }
    } catch (e) { console.error(e); }
  }

  function draw(cars) {
    document.getElementById('totalCount').innerText = cars.length;
    document.getElementById('loading').style.display = 'none';
    Object.values(chartInstances).forEach(ins => ins.destroy());

    // 基本情報
    renderBar('modelChart', cars, c => (c.Model_DisplayC||'').split('(')[0].trim(), '#2856a8');
    renderColorPie('colorChart', cars);
    renderPie('steeringChart', cars, c => (c.Steering === '左' ? '左ハンドル' : (c.Steering === '右' ? '右ハンドル' : '')));
    renderBar('prefChart', cars, c => c.Prefecture, '#4caf50');

    // 機関・電装
    renderBar('engineChart', cars, c => (c.EngineCC ? c.EngineCC+'cc' : ''), '#ff9800');
    renderPie('ignitionChart', cars, c => c.IgnitionType);
    renderPie('generatorChart', cars, c => c.Generator);
    renderBar('transChart', cars, c => (c.Transmission ? (c.Transmission + (c.Synchro ? `(${c.Synchro})` : '')) : ''), '#673ab7');

    // メンテ
    renderBar('eOilBrandChart', cars, c => getBrand(c.EngineOil), '#e91e63');
    renderPie('eOilVisChart', cars, c => getViscosity(c.EngineOil));
    renderBar('eOilCycleChart', cars, c => getInterval(c.EngineOilInterval), '#795548');
    renderBar('mOilBrandChart', cars, c => getBrand(c.TransmissionOil), '#607d8b');

    // 足回り
    renderBar('tireBrandChart', cars, c => getBrand(c.TireBrandName), '#2196f3');
    renderBar('tireSizeChart', cars, c => normalizeTire(c.TireSize), '#00bcd4');
    renderPie('wheelChart', cars, c => c.Wheel);
    renderBar('rimWidthChart', cars, c => (c.RimWidth_in ? c.RimWidth_in+'J' : ''), '#9e9e9e');
  }

  // 名寄せロジック (日本語化)
  function getBrand(txt) {
    if(!txt) return '';
    const t = txt.toLowerCase();
    if(t.match(/motul|モチュール/)) return 'モチュール';
    if(t.match(/michelin|ミシュラン/)) return 'ミシュラン';
    if(t.match(/pirelli|ピレリ/)) return 'ピレリ';
    if(t.match(/bridgestone|ブリヂストン|ブリジストン|bs/)) return 'ブリヂストン';
    if(t.match(/yokohama|ヨコハマ|横浜/)) return 'ヨコハマ';
    if(t.match(/dunlop|ダンロップ/)) return 'ダンロップ';
    if(t.match(/castrol|カストロール/)) return 'カストロール';
    if(t.match(/lubross|ルブロス/)) return 'ルブロス';
    if(t.match(/meister|マイスター/)) return 'マイスター';
    if(t.match(/gulf|ガルフ/)) return 'ガルフ';
    if(t.match(/nutec|ニューテック/)) return 'ニューテック';
    if(t.match(/pennzoil|ペンズオイル/)) return 'ペンズオイル';
    return 'その他';
  }

  function getViscosity(txt) {
    const m = (txt||'').match(/\d+W-\d+/i);
    return m ? m[0].toUpperCase() : '';
  }

  function getInterval(txt) {
    if(!txt) return '';
    const t = txt.toLowerCase();
    if(t.match(/3000|2500|2000/)) return '3,000km以下';
    if(t.match(/5000/)) return '5,000km目安';
    if(t.match(/車検/)) return '車検ごと';
    if(t.match(/半年|6ヶ月|6ケ月/)) return '半年ごと';
    if(t.match(/1年|12ヶ月/)) return '1年ごと';
    return 'その他/随時';
  }

  function normalizeTire(txt) {
    if(!txt) return '';
    return txt.replace(/\s+/g,'').toUpperCase();
  }

  function getColorGroup(colorTxt) {
    const t = (colorTxt||'').toLowerCase();
    if(t.match(/白|white|bianco|ホワイト|アイボリー|ivory|avorio|パール/)) return '白/アイボリー系';
    if(t.match(/赤|red|rosso|レッド/)) return '赤系';
    if(t.match(/黄|yellow|giallo|イエロー|クリーム|positano/)) return '黄系';
    if(t.match(/水色|light blue|azur|アズール|パステルブルー|アクア|celeste|volare|ターコイズ|空色/)) return '水色系';
    if(t.match(/青|blue|blu|ブルー|ネイビー|紺/)) return 'ブルー系';
    if(t.match(/緑|green|verde|グリーン|ミント/)) return '緑系';
    if(t.match(/灰|grey|grigio|グレー|シルバー|銀/)) return 'グレー系';
    if(t.match(/ベージュ|beige|茶|brown|sabbia/)) return 'ベージュ系';
    if(t.match(/黒|black|nero/)) return '黒系';
    return 'その他';
  }

  // 集計関数 (空文字＝未記入を除外)
  function aggregate(cars, extractor) {
    const counts = {};
    let active = 0;
    cars.forEach(c => {
      const v = extractor(c);
      if (v && v !== '未記入' && v !== '不明') {
        counts[v] = (counts[v] || 0) + 1;
        active++;
      }
    });
    return { data: Object.entries(counts).sort((a,b)=>b[1]-a[1]), total: active };
  }

  function renderBar(id, cars, extractor, color) {
    const agg = aggregate(cars, extractor);
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'bar',
      data: { labels: agg.data.map(d=>d[0]), datasets: [{ data: agg.data.map(d=>d[1]), backgroundColor: color }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'end', formatter: v=>v+'台' } },
        scales: { x: { beginAtZero: true } }
      }
    });
  }

  function renderPie(id, cars, extractor) {
    const agg = aggregate(cars, extractor);
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'pie',
      data: {
        labels: agg.data.map(d=>d[0]),
        datasets: [{ data: agg.data.map(d=>d[1]), backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF','#FF9F40','#8BC34A','#9E9E9E'] }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, datalabels: { color: '#fff', font: { weight: 'bold' }, formatter: v=>v } }
      }
    });
  }

  function renderColorPie(id, cars) {
    const agg = aggregate(cars, c => getColorGroup(c.BodyColor));
    document.getElementById('activeCount').innerText = agg.total; // ボディカラーを基準に有効数を表示
    chartInstances[id] = new Chart(document.getElementById(id), {
      type: 'pie',
      data: {
        labels: agg.data.map(d=>d[0]),
        datasets: [{
          data: agg.data.map(d=>d[1]),
          backgroundColor: agg.data.map(d=>COLOR_PALETTE[d[0]] || '#CFD8DC'),
          borderColor: '#fff', borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, datalabels: { color: '#000', font: { weight: 'bold' } } }
      }
    });
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`).classList.add('active');
  }
</script>
</body>
</html>
