<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計データ | Registro500 Giappone</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script src="config.js"></script>
  <style>
    :root { --accent: #2856a8; --bg: #f4f4f7; --card: #fff; --radius: 12px; }
    body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .page { max-width: 1000px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 16px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .tab-content.active { grid-template-columns: 1fr 1fr; } .full { grid-column: span 2; } }
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .chart-title { font-size: 1rem; font-weight: bold; border-bottom: 2px solid var(--bg); padding-bottom: 8px; margin-bottom: 15px; text-align: center; }
    .chart-container { position: relative; height: 320px; width: 100%; }
    #loading { text-align: center; padding: 50px; font-weight: bold; }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Registro500 Statistics</h1>
    <p>全登録車両: <span id="totalCount">-</span>台</p>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('basic')">基本情報</button>
    <button class="tab-btn" onclick="switchTab('powertrain')">機関・電装</button>
    <button class="tab-btn" onclick="switchTab('maintenance')">メンテ・オイル</button>
    <button class="tab-btn" onclick="switchTab('footwork')">足回り</button>
  </div>
  <div id="loading">データを読み込み中...</div>
  <div id="basic" class="tab-content active">
    <div class="chart-card full"><div class="chart-title">🚗 モデル別</div><div class="chart-container"><canvas id="modelChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎨 ボディカラー</div><div class="chart-container"><canvas id="colorChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🎡 ハンドル位置</div><div class="chart-container"><canvas id="steeringChart"></canvas></div></div>
  </div>
  <div id="powertrain" class="tab-content">
    <div class="chart-card"><div class="chart-title">⚙️ 排気量(cc)</div><div class="chart-container"><canvas id="engineChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">⚡ 点火方式</div><div class="chart-container"><canvas id="ignitionChart"></canvas></div></div>
  </div>
  <!-- メンテ・足回りも同様の構造 -->
</div>

<script>
  let chartInstances = {};
  const CACHE_KEY = 'registro500_stats_v13';

  window.onload = function() {
    if (typeof Chart !== 'undefined') {
      Chart.register(ChartDataLabels);
      init();
    } else {
      setTimeout(window.onload, 100);
    }
  };

  async function init() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) draw(JSON.parse(cached));
    try {
      // GASのfetchはリダイレクトが発生するため、ブラウザの標準設定に任せます
      const res = await fetch(API_URL + '?mode=index');
      const json = await res.json();
      if (json.success) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(json.data));
        draw(json.data);
      }
    } catch (e) {
      console.error("Fetch error:", e);
      document.getElementById('loading').innerText = "エラー: データの取得に失敗しました。";
    }
  }

  function draw(cars) {
    document.getElementById('totalCount').innerText = cars.length;
    document.getElementById('loading').style.display = 'none';
    Object.values(chartInstances).forEach(ins => ins.destroy());
    
    // 描画ロジック (有効データのみ)
    renderBar('modelChart', cars, c => (c.Model_DisplayC||'').split('(')[0].trim(), '#2856a8');
    renderPie('steeringChart', cars, c => (c.Steering === '左' ? '左ハンドル' : (c.Steering === '右' ? '右ハンドル' : '')));
    // 他の項目も同様に render... 
  }

  function aggregate(cars, extractor) {
    const counts = {};
    cars.forEach(c => {
      const v = extractor(c);
      if (v && v !== '未記入' && v !== '不明') counts[v] = (counts[v] || 0) + 1;
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  }

  function renderBar(id, cars, extractor, color) {
    const data = aggregate(cars, extractor);
    const ctx = document.getElementById(id);
    if (!ctx || data.length === 0) return;
    chartInstances[id] = new Chart(ctx, {
      type: 'bar',
      data: { labels: data.map(d=>d[0]), datasets: [{ data: data.map(d=>d[1]), backgroundColor: color }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
    });
  }

  function renderPie(id, cars, extractor) {
    const data = aggregate(cars, extractor);
    const ctx = document.getElementById(id);
    if (!ctx || data.length === 0) return;
    chartInstances[id] = new Chart(ctx, {
      type: 'pie',
      data: { labels: data.map(d=>d[0]), datasets: [{ data: data.map(d=>d[1]), backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0'] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
  }
</script>
</body>
</html>
