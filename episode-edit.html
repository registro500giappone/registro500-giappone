<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-27SHHC4JYH');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストーリーを書く - Registro500 Giappone</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js" integrity="sha384-HLJUgAQ2oo6rdMC4QW+Oz2qQfPOtu/lzncKG4sZiq8+2W9uOa3K0b3UGpckKqv7H" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js" integrity="sha384-oFrOL1TiREYNET0lsYF3LjQuyi2gL7vhjH1X8vFr+umcmzAdPELopeSgbcrv4uRm" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0" integrity="sha384-NFPmVbJvc91cC9zbheWJA+qZKj0Kod2IEMvGnxVKB5A7wLgRNA6Aobu8neZmQ19J" crossorigin="anonymous"></script>
  <script>const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
  <style>
    body { line-height: 1.7; padding-top: 85px; padding-bottom: 120px; }
    .ep-page { max-width: 680px; margin: 0 auto; padding: 0 1rem; }
    .ep-card { background: var(--rg-surface); border-radius: var(--rg-radius-card); border: 1px solid var(--rg-border); padding: 1.5rem; margin-bottom: 1rem; }
    .ep-card-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
    .badge-required { background: #e11d48; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; font-weight: normal; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 0.65rem 0.75rem; border-radius: 0.5rem;
      border: 1px solid #d1d5db; font-size: 1rem; box-sizing: border-box;
      margin-bottom: 1rem; background: var(--rg-surface); color: var(--rg-text);
    }
    textarea { min-height: 10em; resize: vertical; }

    /* カバー写真 */
    .ep-cover-area { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 0.6rem; overflow: hidden; background: var(--rg-surface-sub); border: 2px dashed var(--rg-border); cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .ep-cover-area.has-image { border-style: solid; }
    .ep-cover-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ep-cover-placeholder { text-align: center; color: var(--rg-muted); font-size: 0.9rem; pointer-events: none; }
    .ep-cover-placeholder span { font-size: 2rem; display: block; margin-bottom: 0.3rem; }
    .ep-cover-change { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.8rem; padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; }

    /* 追加写真グリッド */
    .ep-photos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1rem; }
    .ep-photo-cell { position: relative; aspect-ratio: 1; border-radius: 0.5rem; overflow: hidden; background: var(--rg-surface-sub); border: 1px solid var(--rg-border); }
    .ep-photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ep-photo-del { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .ep-photo-add { display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--rg-muted); font-size: 1.5rem; border: 2px dashed var(--rg-border); border-radius: 0.5rem; aspect-ratio: 1; background: none; }
    .ep-photo-add:hover { border-color: var(--rg-accent); color: var(--rg-accent); }
    .ep-photos-hint { font-size: 0.8rem; color: var(--rg-muted); margin-bottom: 0.5rem; }

    /* アップロード中 */
    .ep-uploading { font-size: 0.85rem; color: var(--rg-muted); text-align: center; padding: 0.5rem; }

    /* 保存ボタン */
    .ep-save-row { display: flex; gap: 0.75rem; }
    .ep-btn { flex: 1; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; }
    .ep-btn-draft { background: #f1f5f9; color: #475569; }
    .ep-btn-publish { background: var(--rg-accent); color: #fff; }
    .ep-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ログインオーバーレイ */
    .ep-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .ep-overlay-box { background: var(--rg-surface); border-radius: 12px; padding: 2rem; max-width: 320px; width: 90%; text-align: center; }
    .ep-overlay.hidden { display: none; }

    @media (prefers-color-scheme: dark) {
      input[type="text"], input[type="date"], select, textarea { border-color: #334155; background: #1e293b; }
      .ep-btn-draft { background: #334155; color: #94a3b8; }
    }
  </style>
</head>
<body>
  <header class="rg-header-bar">
    <div class="rg-back-link"><a href="#" id="backLink"><div>←</div><div class="back-text">ガレージ<br class="back-br">に戻る</div></a></div>
    <div class="rg-header-logo"><img src="logo_horizontal.png" alt="Registro500"></div>
    <div class="rg-header-right"></div>
  </header>

  <div id="loginOverlay" class="ep-overlay">
    <div class="ep-overlay-box">
      <p style="font-weight:700;margin-bottom:1rem;">ストーリーを書くにはログインが必要です</p>
      <button class="ep-btn ep-btn-publish" onclick="loginWithGoogle()" style="flex:none;width:100%;">Googleでログイン</button>
    </div>
  </div>

  <main>
    <div class="ep-page">

      <!-- 基本情報 -->
      <div class="ep-card">
        <h1 class="ep-card-title">ストーリーを書く</h1>

        <label>タイトル <span class="badge-required">必須</span></label>
        <input type="text" id="epTitle" placeholder="例：フリマで一目惚れした1968年式の話">

        <label>日付（出来事の日付）</label>
        <input type="date" id="epDate">

        <label>種類 <span class="badge-required">必須</span></label>
        <select id="epType">
          <option value="acquisition">入手ストーリー</option>
          <option value="trouble">トラブル</option>
          <option value="tuning">チューン・カスタム</option>
          <option value="drive">ドライブ・旅</option>
          <option value="event">イベント</option>
          <option value="other">その他</option>
        </select>
      </div>

      <!-- カバー写真 -->
      <div class="ep-card">
        <label>カバー写真</label>
        <div class="ep-cover-area" id="coverArea" onclick="document.getElementById('coverInput').click()">
          <div class="ep-cover-placeholder" id="coverPlaceholder">
            <span>📷</span>カバー写真を選択
          </div>
          <img id="coverPreview" style="display:none;">
          <button class="ep-cover-change" id="coverChangeBtn" style="display:none;" onclick="event.stopPropagation();document.getElementById('coverInput').click()">写真を変更</button>
        </div>
        <input type="file" id="coverInput" accept="image/*" style="display:none;">
        <div id="coverUploading" class="ep-uploading" style="display:none;">アップロード中...</div>
      </div>

      <!-- 本文 -->
      <div class="ep-card">
        <label>本文 <span class="badge-required">必須</span></label>
        <textarea id="epContent" placeholder="この車との出会いを自由に書いてください。どこで見つけたか、何に惹かれたか、手に入れるまでの経緯など。"></textarea>
      </div>

      <!-- 追加写真 -->
      <div class="ep-card">
        <label>写真を追加（最大7枚）</label>
        <p class="ep-photos-hint">カバー写真以外に見せたい写真を追加できます。</p>
        <div class="ep-photos-grid" id="photosGrid"></div>
        <div id="photosUploading" class="ep-uploading" style="display:none;">アップロード中...</div>
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
      </div>

      <!-- 保存 -->
      <div class="ep-card" style="padding: 1rem 1.5rem;">
        <div class="ep-save-row">
          <button class="ep-btn ep-btn-draft" id="draftBtn" onclick="saveEpisode(false)">下書き保存</button>
          <button class="ep-btn ep-btn-publish" id="publishBtn" onclick="saveEpisode(true)">公開する</button>
        </div>
        <div id="saveMsg" style="font-size:0.85rem;text-align:center;margin-top:0.5rem;color:var(--rg-muted);"></div>
      </div>

    </div>
  </main>

  <script>
  (function() {
    if (firebase.apps.length === 0) firebase.initializeApp(FIREBASE_CONFIG);
    const storage = firebase.storage();

    const params = new URLSearchParams(location.search);
    const carId = params.get('car');
    const epId  = params.get('ep');
    let currentUser = null;
    let coverUrl = '';
    let photoUrls = [];   // 追加写真（最大7枚）
    const MAX_PHOTOS = 7;

    function esc(s) {
      if (!s) return '';
      return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── 認証 ──
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      currentUser = session?.user ?? null;
      if (currentUser) {
        document.getElementById('loginOverlay').classList.add('hidden');
        if (epId) loadEpisode();
        updateBackLink();
      } else {
        document.getElementById('loginOverlay').classList.remove('hidden');
      }
    });

    window.loginWithGoogle = async () => {
      await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } });
    };

    function updateBackLink() {
      if (carId) document.getElementById('backLink').href = `detail.html?doc=${encodeURIComponent(carId)}`;
    }
    updateBackLink();

    // ── 編集モード読み込み ──
    async function loadEpisode() {
      const { data } = await supabaseClient.from('car_episodes').select('*').eq('id', epId).single();
      if (!data) return;
      document.getElementById('epTitle').value   = data.title || '';
      document.getElementById('epDate').value    = data.episode_date || '';
      document.getElementById('epType').value    = data.type || 'other';
      document.getElementById('epContent').value = data.content || '';
      if (data.cover_url) setCoverPreview(data.cover_url);
      photoUrls = Array.isArray(data.photo_urls) ? data.photo_urls : [];
      renderPhotosGrid();
    }

    // ── カバー写真 ──
    document.getElementById('coverInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      document.getElementById('coverUploading').style.display = 'block';
      document.getElementById('coverArea').style.pointerEvents = 'none';
      try {
        const url = await uploadImage(file, 'cover');
        coverUrl = url;
        setCoverPreview(url);
      } catch(err) {
        alert('写真のアップロードに失敗しました。再度お試しください。');
      }
      document.getElementById('coverUploading').style.display = 'none';
      document.getElementById('coverArea').style.pointerEvents = '';
    });

    function setCoverPreview(url) {
      const img = document.getElementById('coverPreview');
      const placeholder = document.getElementById('coverPlaceholder');
      const changeBtn = document.getElementById('coverChangeBtn');
      const area = document.getElementById('coverArea');
      img.src = url;
      img.style.display = 'block';
      placeholder.style.display = 'none';
      changeBtn.style.display = 'block';
      area.classList.add('has-image');
    }

    // ── 追加写真 ──
    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || photoUrls.length >= MAX_PHOTOS) return;
      document.getElementById('photosUploading').style.display = 'block';
      try {
        const url = await uploadImage(file, 'photo_' + Date.now());
        photoUrls.push(url);
        renderPhotosGrid();
      } catch(err) {
        alert('写真のアップロードに失敗しました。再度お試しください。');
      }
      document.getElementById('photosUploading').style.display = 'none';
    });

    function renderPhotosGrid() {
      const grid = document.getElementById('photosGrid');
      let html = photoUrls.map((url, i) => `
        <div class="ep-photo-cell">
          <img src="${esc(url)}" loading="lazy">
          <button class="ep-photo-del" onclick="removePhoto(${i})" title="削除">✕</button>
        </div>
      `).join('');
      if (photoUrls.length < MAX_PHOTOS) {
        html += `<button class="ep-photo-add" onclick="document.getElementById('photoInput').click()" title="写真を追加">＋</button>`;
      }
      grid.innerHTML = html;
    }
    renderPhotosGrid();

    window.removePhoto = function(idx) {
      photoUrls.splice(idx, 1);
      renderPhotosGrid();
    };

    // ── 画像アップロード共通（リサイズ→Firebase Storage）──
    async function uploadImage(file, suffix) {
      const epIdForPath = epId || ('new_' + Date.now());
      const path = `episodes/${carId}/${epIdForPath}/${suffix}.jpg`;
      const ref = storage.ref().child(path);
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        img.onload = () => {
          const MAX = 1200;
          let w = img.width, h = img.height;
          if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(async blob => {
            try {
              await ref.put(blob);
              resolve(await ref.getDownloadURL());
            } catch(err) { reject(err); }
          }, 'image/jpeg', 0.85);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ── 保存 ──
    window.saveEpisode = async function(publish) {
      const title   = document.getElementById('epTitle').value.trim();
      const type    = document.getElementById('epType').value;
      const date    = document.getElementById('epDate').value || null;
      const content = document.getElementById('epContent').value.trim();
      if (!title)   { alert('タイトルを入力してください。'); return; }
      if (!content) { alert('本文を入力してください。'); return; }
      if (!carId)   { alert('車両IDが取得できません。マイガレージからやり直してください。'); return; }

      const draftBtn = document.getElementById('draftBtn');
      const publishBtn = document.getElementById('publishBtn');
      draftBtn.disabled = publishBtn.disabled = true;
      const msg = document.getElementById('saveMsg');
      msg.textContent = '保存中...';

      const payload = {
        car_id:       carId,
        type,
        title,
        content,
        cover_url:    coverUrl || null,
        photo_urls:   photoUrls,
        blocks:       [],   // 旧カラム（空で保持）
        episode_date: date,
        is_published: publish,
        updated_at:   new Date().toISOString()
      };

      try {
        let error;
        if (epId) {
          ({ error } = await supabaseClient.from('car_episodes').update(payload).eq('id', epId));
        } else {
          ({ error } = await supabaseClient.from('car_episodes').insert(payload));
        }
        if (error) throw error;
        msg.textContent = publish ? '公開しました！' : '下書きを保存しました。';
        setTimeout(() => {
          location.href = `detail.html?doc=${encodeURIComponent(carId)}`;
        }, 1000);
      } catch(e) {
        msg.textContent = '保存に失敗しました: ' + e.message;
        draftBtn.disabled = publishBtn.disabled = false;
      }
    };
  })();
  </script>
</body>
</html>
