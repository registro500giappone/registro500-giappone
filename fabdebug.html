<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 他ページと同条件にするため viewport-fit=cover は付けない -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!-- 既存ページに導線を足さずに standalone を再現するため、このページ単体を
     「ホーム画面に追加」できるようにする。manifest.json は読み込まない
     （start_url が "/" なのでトップに飛んでしまうため）。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>固定ボタン位置の診断</title>
<style>
  html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif; margin: 0;
    padding: 12px 16px 40px; background: #f5f0e6; color: #2e2a24; line-height: 1.5;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .lead { font-size: .82rem; color: #6b6357; margin: 0 0 16px; }
  .diag {
    background: #fffefb; border: 2px solid #1f5c3d; border-radius: 10px;
    padding: 10px 12px; margin: 18px 0; font-family: ui-monospace, monospace;
    font-size: .72rem; white-space: pre-wrap; word-break: break-all;
  }
  .diag b { color: #1f5c3d; }
  .filler {
    background: #fffefb; border: 1px solid #d6c9b0; border-radius: 10px;
    padding: 26px 14px; margin: 12px 0; color: #8a8072; font-size: .85rem;
  }
  /* env() の実値を測るための隠し要素 */
  #safeProbe {
    position: absolute; visibility: hidden; height: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1714; color: #ece6d9; color-scheme: dark; }
    .diag { background: #2b2721; border-color: #7fb894; }
    .diag b { color: #7fb894; }
    .filler { background: #2b2721; border-color: #403a30; }
  }
</style>
</head>
<body>
<div id="safeProbe"></div>

<h1>固定ボタン位置の診断</h1>
<p class="lead">
  下までスクロールし、ボタンがずれている状態で緑枠のスクリーンショットを撮って送ってください。
  枠の数値は常に更新されています。どの枠でも中身は同じです。
</p>

<div class="diag" data-diag>測定中…</div>

<script>
(function () {
  function px(v) { return Math.round(v); }

  function measure() {
    var probe = document.getElementById('safeProbe');
    var cs = probe ? getComputedStyle(probe) : null;
    var vv = window.visualViewport;
    var lines = [];

    lines.push('■ ビューポート');
    lines.push('  innerHeight      = ' + px(window.innerHeight));
    lines.push('  outerHeight      = ' + px(window.outerHeight));
    lines.push('  clientHeight     = ' + px(document.documentElement.clientHeight));
    lines.push('  scrollY          = ' + px(window.scrollY));
    if (vv) {
      lines.push('  visualViewport   h=' + px(vv.height) + ' offsetTop=' + px(vv.offsetTop) +
                 ' pageTop=' + px(vv.pageTop) + ' scale=' + (Math.round(vv.scale * 100) / 100));
    } else {
      lines.push('  visualViewport   = なし');
    }

    lines.push('■ safe-area(env)');
    lines.push('  bottom = ' + (cs ? cs.paddingBottom : '?') + ' / top = ' + (cs ? cs.paddingTop : '?'));

    lines.push('■ 表示モード');
    lines.push('  standalone(media) = ' +
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
    lines.push('  navigator.standalone = ' + window.navigator.standalone);
    lines.push('  devicePixelRatio = ' + window.devicePixelRatio);

    lines.push('■ 固定ボタン(.rg-fab)');
    var fabs = document.querySelectorAll('.rg-fab');
    if (!fabs.length) {
      lines.push('  見つからない（fab-nav.js が動いていない）');
    }
    fabs.forEach(function (el) {
      var r = el.getBoundingClientRect();
      var s = getComputedStyle(el);
      var gap = window.innerHeight - r.bottom;
      lines.push('  ' + (el.className.replace('rg-fab ', '')) +
                 ' : top=' + px(r.top) + ' bottom=' + px(r.bottom));
      lines.push('    画面下端との差 = ' + px(gap) + 'px  ← 16前後なら正常');
      lines.push('    position=' + s.position + ' bottom(css)=' + s.bottom +
                 ' transform=' + (s.transform === 'none' ? 'none' : 'あり'));
      // fixed の基準になっている祖先を探す
      var anc = el.parentElement, culprit = 'なし(=viewport基準)';
      while (anc && anc !== document.documentElement) {
        var a = getComputedStyle(anc);
        if (a.transform !== 'none' || a.filter !== 'none' ||
            a.perspective !== 'none' || a.contain.indexOf('paint') >= 0 ||
            a.willChange.indexOf('transform') >= 0 || a.backdropFilter && a.backdropFilter !== 'none') {
          culprit = anc.tagName + '.' + (anc.className || '(無名)');
          break;
        }
        anc = anc.parentElement;
      }
      lines.push('    包含ブロックを奪う祖先 = ' + culprit);
    });

    lines.push('■ html / body');
    var h = getComputedStyle(document.documentElement), b = getComputedStyle(document.body);
    lines.push('  html: overflow-x=' + h.overflowX + ' height=' + h.height + ' position=' + h.position);
    lines.push('  body: overflow-x=' + b.overflowX + ' height=' + b.height + ' position=' + b.position);
    lines.push('  scrollHeight html=' + document.documentElement.scrollHeight +
               ' body=' + document.body.scrollHeight);

    lines.push('■ 端末');
    lines.push('  screen = ' + screen.width + 'x' + screen.height);
    lines.push('  UA = ' + navigator.userAgent);

    var text = lines.join('\n');
    document.querySelectorAll('[data-diag]').forEach(function (d) { d.textContent = text; });
  }

  // 読みやすいよう、長いページにして診断枠を点在させる
  var host = document.body;
  for (var i = 1; i <= 8; i++) {
    var f = document.createElement('div');
    f.className = 'filler';
    f.textContent = 'ここはスクロール用の余白です（' + i + ' / 8）。'
      + 'この下にも同じ診断枠があります。ボタンがずれている状態で撮ってください。';
    host.appendChild(f);
    var d = document.createElement('div');
    d.className = 'diag';
    d.setAttribute('data-diag', '');
    d.textContent = '測定中…';
    host.appendChild(d);
  }

  setInterval(measure, 400);
  window.addEventListener('scroll', measure, { passive: true });
  measure();
})();
</script>
<script src="fab-nav.js?v=debug"></script>
</body>
</html>
