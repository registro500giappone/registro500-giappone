  function norm(s){
    s = String(s||'').normalize('NFKC').toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
    s = s.replace(/[ぁぃぅぇぉっゃゅょゎゕゖ]/g, function(c){ return SMALL[c]; });

    e.weak = (e.weak || '').split(/\s+/).map(norm).filter(function(n){ return n.length >= 2; });

    var m = 0, used = {};
    A.forEach(function(x){ for (var j=0;j<B.length;j++){ if(!used[j] && B[j]===x){ used[j]=1; m++; break; } } });

    return s * (e.w || 1);

    if (!q) return [];
    var is126 = FROM126 || q.indexOf('126') !== -1;
    // トルクの部位（110件）は「トルク」「締め」「ボルト」などを含む質問のときだけ上位に出す。
    var torqueIntent = /とるく|締|しめ|nm|kgf|ぼると|なつと/.test(q);
    var scored = entries.map(function(e){
      var s = score(e,q);
      if (e.cap === 'torque' && !torqueIntent) s *= 0.4;
      return {e:e, s:s};
    }).filter(function(x){ return x.s > 0; });
    if (!scored.length) {
      scored = entries.map(function(e){ return {e:e, s:fuzzy(e,q)}; }).filter(function(x){ return x.s > 0; });
    }
    scored.sort(function(a,b){ return b.s - a.s; });
    var out = [], used = {};
    scored.forEach(function(x){
      if (out.length >= LIMIT) return;
      var c = x.e.cap;
      if (c) { used[c] = (used[c]||0) + 1; if (used[c] > CAPS[c]) return; }
      out.push(x.e);
    });
    return out.map(function(e){
      return {e:e, url:(is126 && e.u126) ? e.u126 : e.u};
    });
  }

  // ============================================================
  // 描画
  // ============================================================
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // 126サイトのメニューから来たとき（?type=126）は、126向けのページを優先して開く。
  var FROM126 = new URLSearchParams(location.search).get('type') === '126';
  if (FROM126) document.getElementById('back').href = '/126/';
  var $q = document.getElementById('q'), $r = document.getElementById('results'), $m = document.getElementById('more');
  var missTimer = null, lastMiss = '';

  // 比べ太郎はログインしたオーナー限定＝ゲストには押す前に「限定」と分かる形で出す。
  // 判定は rg-join-cta.js と同じ（supabase-js が残すセッションキーの有無）。
  function isLoggedIn(){
    try {
      for (var i=0;i<localStorage.length;i++){ if (/^sb-.*-auth-token$/.test(localStorage.key(i) || '')) return true; }
    } catch(_) {}
    return false;
  }

  function render(){
    var raw = $q.value.trim();
    var hits = search(raw);
    $r.innerHTML = hits.map(function(h){
      var e = h.e;
      return '<li class="r"><a href="'+esc(h.url)+'" data-to="'+esc(h.url)+'">'
        + '<span class="ic">'+e.i+'</span><span><div class="t">'+esc(e.t)+'</div>'
        + '<div class="d"><span class="k">'+esc(e.g)+'</span>'+esc(e.d)+'</div></span></a></li>';
    }).join('');
    if (!raw) { $m.innerHTML = ''; }
    else {
      var enc = encodeURIComponent(raw);
      $m.innerHTML = (hits.length ? '' : '<p class="empty">ぴったりのページが見つかりませんでした。言い方を変えるか、下の検索を試してください。</p>')
        + '<div class="more"><p>部品や作業の名前なら、こちらでも探せます</p>'
        + (isLoggedIn()
          ? '<a href="/parts?q='+enc+'" data-to="/parts?q=">🔍 「'+esc(raw)+'」の部品を比べ太郎で探す</a>'
          : '<a href="/parts?q='+enc+'" data-to="/parts?q=(guest)">🔒 「'+esc(raw)+'」の部品価格を比べる<span class="note">登録オーナー限定・登録は無料</span></a>'
            + '<a href="/parts-shops" data-to="/parts-shops(guest)">🏪 部品を買える店の一覧（パーツ調達ガイド）</a>')
        + '<a href="/videos?q='+enc+'" data-to="/videos?q=">🎬 「'+esc(raw)+'」の整備動画を探す</a></div>';
    }
    var qs = (FROM126 ? ['type=126'] : []).concat(raw ? ['q='+encodeURIComponent(raw)] : []);
    history.replaceState(null, '', qs.length ? '?' + qs.join('&') : location.pathname);

    // 外れた言葉だけを記録する＝辞書を育てる材料。打ち終わって少し止まったときに1回だけ送る。
    clearTimeout(missTimer);
    if (raw && !hits.length && norm(raw).length >= 2) {
      missTimer = setTimeout(function(){
        if (raw === lastMiss) return;
        lastMiss = raw;
        try { gtag('event', 'finder_miss', {q: raw.slice(0,100)}); } catch(_) {}
      }, 1500);
    }
  }

  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[data-to]');
    if (!a) return;
    try { gtag('event', 'finder_click', {q: $q.value.trim().slice(0,100), to: a.getAttribute('data-to'), transport_type: 'beacon'}); } catch(_) {}
  });
  $q.addEventListener('input', render);

  var CHIPS = ['ライトが点かない','エンジンがかからない','ボルトの締め付けトルク','イベントに行きたい','スマホの待ち受け','愛車を登録したい','整備の動画を見たい'];
  document.getElementById('chips').innerHTML = CHIPS.map(function(c){ return '<button type="button" class="chip">'+esc(c)+'</button>'; }).join('');
  document.getElementById('chips').addEventListener('click', function(ev){
    var b = ev.target.closest('.chip'); if (!b) return;
    $q.value = b.textContent; render(); $q.focus();
  });

  function addEntries(list){
    list.forEach(function(e){ entries.push(prep(e)); });
    if ($q.value.trim()) render();
  }

  // ============================================================
  // 深い場所：旅手帳の各回・トルクの部位・これからのイベント（読めなくても本体は動く）
  // ============================================================
  var today = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); // JST
  function md(d){ return Number(d.slice(5,7)) + '/' + Number(d.slice(8,10)); }

  fetch('/journey-schedule.json').then(function(r){ return r.json(); }).then(function(js){
    var list = [];
    (js.issues || []).concat(js.extras || []).forEach(function(it){
      var open = it.public && it.public <= today;
      list.push({
        u: open ? '/wiring-journey-' + it.slug : '/wiring-journey',
        i: '🧭', t: it.title, g: open ? '旅手帳' : '旅手帳・' + md(it.public) + ' 公開予定',
        d: open ? (it.lead || '') : '公開前の回です。目次で予定を見られます',
        kw: (it.short || '') + ' ' + (JOURNEY_KW[it.slug] || ''),
        weak: '点かない つかない 消えない 動かない 故障 電装',
        w: open ? 1.1 : 0.8
      });
    });
    addEntries(list);
  }).catch(function(){});

  fetch('/torque-data.json').then(function(r){ return r.json(); }).then(function(td){
    addEntries((td.items || []).map(function(it){
      // 片側にしか無い部位は、その側で開かないと早見帳の絞り込みで消える（fits の判定と対）。
      var f = it.fits || {}, side = f.chassis || (f.engine || []).map(function(x){ return x.replace(/^e/, ''); });
      var only = side.length === 1 ? side[0] : '';
      var tag = only ? '（' + only + (f.engine ? '系エンジン' : '') + '）' : '';
      var enc = encodeURIComponent(it.name);
      return {
        u: '/torque?type=' + (only || '500') + '&q=' + enc,
        u126: '/torque?type=' + (only || '126') + '&q=' + enc,
        i: '🔩', t: it.name + tag + ' の締め付けトルク', g: 'トルク', d: '締め付けトルク早見帳でこの部位を開く',
        kw: [it.name].concat(it.aliases || []).join(' '), cap: 'torque', w: 0.85
      };
    }));
  }).catch(function(){});

  if (typeof SUPABASE_URL !== 'undefined') {
    var since = new Date(Date.now() - 24*3600*1000).toISOString();
    Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/events?select=id,event_name,event_date,location&event_date=gte.' + encodeURIComponent(since) + '&order=event_date&limit=40',
        {headers: {apikey: SUPABASE_ANON_KEY}}).then(function(r){ return r.json(); }),
      fetch('/event-slugs.json').then(function(r){ return r.json(); })
    ]).then(function(res){
      var evs = res[0] || [], slugs = res[1] || {};
      addEntries(evs.filter(function(ev){ return slugs[ev.id]; }).map(function(ev){
        var d = new Date(new Date(ev.event_date).getTime() + 9*3600*1000).toISOString().slice(0,10);
        var loc = String(ev.location || '').split('\n')[0].replace(/〒?\d{3}-?\d{4}\s*/, '');
        var month = Number(d.slice(5,7)) + '月';
        return {
          u: '/event/' + slugs[ev.id] + '/', i: '📅', t: ev.event_name, g: 'イベント・' + md(d),
          d: loc, kw: ev.event_name + ' ' + loc + ' ' + month + ' イベント ミーティング 参加 開催',
          cap: 'event', w: 0.7
        };
      }));
    }).catch(function(){});
  }

  var q0 = new URLSearchParams(location.search).get('q');
  if (q0) { $q.value = q0; }
  render();
  // メニューから来たときはすぐ打てるように。検索語付きで開いたときは結果を見せたいので触らない。
  if (!q0) { try { $q.focus(); } catch(_) {} }
})();
</script>
</body>
</html>
