<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro 500 - Mappa (Inset Layout)</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f7; color: #333; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; }
        .back-link { display: inline-block; margin-top: 8px; color: #2856a8; text-decoration: none; font-size: 0.85rem; padding: 4px 12px; border: 1px solid #ddd; border-radius: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px; text-align: center; }

        #map-container {
            width: 100%;
            height: auto;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            position: relative;
            /* 地図のアスペクト比を固定（高さを確保） */
            aspect-ratio: 4/3; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .prefecture {
            fill: #f9f9f9;
            stroke: #bbb;
            stroke-width: 0.5px;
            cursor: pointer;
            transition: fill 0.2s;
        }
        .prefecture:hover { fill: #eee; }

        /* 登録ありの色 */
        .active-pref { 
            fill: #2856a8 !important; 
            stroke: #1e4285 !important; 
        }
        /* 選択中の色 */
        .selected-pref { 
            fill: #e11d48 !important; 
            stroke: #9f1239 !important; 
        }

        /* 数字ラベルのスタイル強化 */
        .pref-label {
            fill: #fff;
            font-size: 11px;
            font-weight: 800; /* 極太 */
            font-family: sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            /* 文字の周りに強い影（縁取り）をつけて読みやすく */
            paint-order: stroke;
            stroke: #2856a8; 
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* 選択された県の数字は赤枠にする */
        .selected-pref + .pref-label, 
        .pref-label.selected-label { 
            stroke: #e11d48; 
        }

        /* 沖縄の枠線 */
        .inset-box {
            fill: none;
            stroke: #ddd;
            stroke-width: 1;
        }
        .inset-label {
            font-size: 10px;
            fill: #aaa;
            font-family: sans-serif;
        }

        #tooltip {
            position: absolute; top: 0; left: 0;
            padding: 6px 10px; background: rgba(0,0,0,0.9); color: #fff;
            border-radius: 4px; font-size: 12px; pointer-events: none;
            opacity: 0; transition: opacity 0.2s; white-space: nowrap; z-index: 20;
        }

        #garage-area { display: none; margin-top: 20px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: left; }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .garage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 15px; justify-items: center; }
        .garage-item { width: 100%; cursor: pointer; text-align: center; }
        .garage-icon-lg { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #f0f0f0; background: #eee; }
        .garage-name { font-size: 0.7rem; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-btn { border: none; background: #eee; padding: 5px 15px; border-radius: 15px; cursor: pointer; }
        
        #loading { margin: 50px 0; color: #777; }
    </style>
</head>
<body>

<header>
    <h1>REGISTRO MAPPA (Test)</h1>
    <a href="index.html" class="back-link">一覧に戻る</a>
</header>

<div class="container">
    <div id="loading">地図データを取得中...</div>

    <div id="map-container"></div>
    <div id="tooltip"></div>

    <div id="garage-area">
        <div class="area-header">
            <span id="area-title" style="font-weight:bold;">AREA</span>
            <button onclick="closeGarage()" class="close-btn">閉じる</button>
        </div>
        <div id="garage-list" class="garage-list"></div>
    </div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz0BJpaG-AcK3T6YYtav-nfd3gqGlkEWu3AvpW5uRT52N9jW8pBKLrpLSqvXqyD2ghwCA/exec";
    const MAP_FILE_URL = "prefectures.json"; 

    const EN_MAP = {
        'TOKYO':'東京都', 'OSAKA':'大阪府', 'AICHI':'愛知県', 'KANAGAWA':'神奈川県', 'CHIBA':'千葉県', 'SAITAMA':'埼玉県', 'TOYAMA':'富山県',
        'KYOTO':'京都府', 'FUKUOKA':'福岡県', 'HYOGO':'兵庫県', 'HOKKAIDO':'北海道', 'NAGANO':'長野県', 'SHIZUOKA':'静岡県',
        'IBARAKI':'茨城県', 'GUNMA':'群馬県', 'TOCHIGI':'栃木県', 'MIE':'三重県', 'GIFU':'岐阜県', 'FUKUSHIMA':'福島県',
        'HIROSHIMA':'広島県', 'OKAYAMA':'岡山県', 'NARA':'奈良県', 'SHIGA':'滋賀県'
    };

    async function init() {
        if(GAS_API_URL.includes("★")) { alert("GASのURLを設定してください"); return; }
        
        try {
            const mapRes = await fetch(MAP_FILE_URL);
            if(!mapRes.ok) throw new Error("Map load failed");
            const mapData = await mapRes.json();

            const carsRes = await fetch(GAS_API_URL);
            const carsData = await carsRes.json();
            const cars = Array.isArray(carsData) ? carsData : (carsData.data || []);

            drawMap(mapData, cars);

        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "エラーが発生しました";
        }
    }

    function drawMap(mapData, cars) {
        document.getElementById('loading').style.display = 'none';

        // 集計
        const prefData = {};
        cars.forEach(car => {
            let pName = (car.Prefecture || car.prefecture || "").trim();
            if(EN_MAP[pName.toUpperCase()]) pName = EN_MAP[pName.toUpperCase()];
            if(!prefData[pName]) prefData[pName] = [];
            prefData[pName].push(car);
        });

        // D3設定
        const width = 800;
        const height = 600;
        const container = d3.select("#map-container");
        container.html(""); 

        const svg = container.append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        // TopoJSONデータ抽出
        let objKey = "japan";
        if(!mapData.objects[objKey] && mapData.objects.prefectures) objKey = "prefectures";
        if(!mapData.objects[objKey]) objKey = Object.keys(mapData.objects)[0];
        const features = topojson.feature(mapData, mapData.objects[objKey]).features;

        // ★データを「沖縄」と「それ以外（本州など）」に分ける
        const okinawaFeature = features.filter(d => {
            const n = d.properties.nam || d.properties.name || d.properties.nam_ja;
            return n.includes("沖縄");
        });
        const mainFeatures = features.filter(d => {
            const n = d.properties.nam || d.properties.name || d.properties.nam_ja;
            return !n.includes("沖縄");
        });

        // 1. 本州エリアの描画（画面いっぱいに拡大）
        // .fitSize を使って、本州データだけで画面の95%を使うように計算
        // 投影法を作成
        const mainProjection = d3.geoMercator().fitExtent([[20, 20], [width - 20, height - 20]], {type: "FeatureCollection", features: mainFeatures});
        const mainPath = d3.geoPath().projection(mainProjection);

        drawFeatures(svg, mainFeatures, mainPath, prefData, false);


        // 2. 沖縄エリアの描画（左上の小窓）
        // 左上(x=20, y=20)から 幅150, 高さ120 のエリアに沖縄を表示
        const insetX = 20;
        const insetY = 20;
        const insetW = 150;
        const insetH = 120;

        // 沖縄用の投影法を作成
        const insetProjection = d3.geoMercator().fitExtent([[insetX + 10, insetY + 20], [insetX + insetW - 10, insetY + insetH - 10]], {type: "FeatureCollection", features: okinawaFeature});
        const insetPath = d3.geoPath().projection(insetProjection);

        // 枠線とラベル
        svg.append("rect")
            .attr("x", insetX).attr("y", insetY)
            .attr("width", insetW).attr("height", insetH)
            .attr("class", "inset-box");
        
        svg.append("text")
            .attr("x", insetX + 5).attr("y", insetY + 15)
            .text("OKINAWA")
            .attr("class", "inset-label");

        // 沖縄を描画
        drawFeatures(svg, okinawaFeature, insetPath, prefData, true);
    }

    // 描画共通関数
    function drawFeatures(svg, features, pathGenerator, prefData, isInset) {
        // パス描画
        svg.append("g")
            .selectAll("path")
            .data(features)
            .enter()
            .append("path")
            .attr("class", "prefecture")
            .attr("d", pathGenerator)
            .each(function(d) {
                const p = d.properties;
                const pNameMap = p.nam || p.name || p.nam_ja; 
                if(!pNameMap) return;
                
                const matchKey = Object.keys(prefData).find(key => pNameMap.includes(key) || key.includes(pNameMap));
                if(matchKey) {
                    d3.select(this).classed("active-pref", true);
                    d.carList = prefData[matchKey];
                    d.displayName = matchKey;
                }
            })
            .on("click", function(event, d) {
                if(d.carList) {
                    d3.selectAll(".selected-pref").classed("selected-pref", false);
                    d3.select(this).classed("selected-pref", true);
                    
                    // ラベルの色も変えたいのでクラスを操作
                    d3.selectAll(".pref-label").classed("selected-label", false);
                    // (ラベルの特定は少し難しいので、今回は地図の色替えのみで対応)
                    
                    showGarage(d.displayName, d.carList);
                }
            })
            .on("mouseover", function(event, d) {
                const tooltip = document.getElementById('tooltip');
                tooltip.style.opacity = 1;
                const p = d.properties;
                const name = p.nam || p.name || p.nam_ja;
                tooltip.innerText = name + (d.carList ? ` (${d.carList.length}台)` : "");
                
                // 位置調整
                const rect = event.target.getBoundingClientRect();
                const cRect = document.getElementById('map-container').getBoundingClientRect();
                tooltip.style.top = (rect.top - cRect.top - 30) + "px";
                tooltip.style.left = (rect.left - cRect.left + rect.width/2) + "px";
                tooltip.style.transform = "translateX(-50%)";
            })
            .on("mouseout", function() {
                document.getElementById('tooltip').style.opacity = 0;
            });

        // 数値ラベル描画
        svg.append("g")
            .selectAll("text")
            .data(features)
            .enter()
            .append("text")
            .attr("class", "pref-label")
            .attr("transform", function(d) {
                return "translate(" + pathGenerator.centroid(d) + ")";
            })
            .text(function(d) {
                if (d.carList && d.carList.length > 0) {
                    return d.carList.length;
                }
                return "";
            });
    }

    function showGarage(name, cars) {
        const area = document.getElementById('garage-area');
        const list = document.getElementById('garage-list');
        document.getElementById('area-title').innerText = `${name} (${cars.length}台)`;
        area.style.display = 'block';
        list.innerHTML = '';
        cars.forEach(car => {
            const imgUrl = car.PhotoMain || car.car_image || 'https://placehold.co/100x100?text=No+Img';
            const handleName = car.HandleName || "No Name";
            const item = document.createElement('div');
            item.className = 'garage-item';
            const img = document.createElement('img');
            img.src = imgUrl; img.className = 'garage-icon-lg'; img.loading = "lazy";
            const nameDiv = document.createElement('div');
            nameDiv.className = 'garage-name'; nameDiv.innerText = handleName;
            if(car.DocumentID) { item.onclick = () => window.location.href = `detail.html?doc=${car.DocumentID}`; }
            item.appendChild(img); item.appendChild(nameDiv);
            list.appendChild(item);
        });
        setTimeout(() => { area.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }

    function closeGarage() { document.getElementById('garage-area').style.display = 'none'; }
    init();
</script>

</body>
</html>
