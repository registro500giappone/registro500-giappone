<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>キャッシュ削除 | Registro500 Giappone</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px;
      color: #111827;
      line-height: 1.7;
    }
    h1 { font-size: 1.3rem; }
    button {
      display: inline-block;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin: 16px 0;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    a { color: #2856a8; }
  </style>
</head>
<body>
  <h1>🔧 キャッシュ削除（緊急用）</h1>
  <p>サイトの表示がどうしてもおかしい・更新が反映されない場合に使用します。</p>
  <p>以下のボタンを押すと、このサイトの <strong>Service Worker と全キャッシュを削除</strong> します。削除後、自動でトップページに戻ります。</p>

  <button id="nukeBtn">Service Worker とキャッシュを全削除</button>

  <pre id="log">待機中...</pre>

  <p><a href="/">← トップページに戻る</a></p>

  <script>
    const btn = document.getElementById('nukeBtn');
    const log = document.getElementById('log');

    function appendLog(msg) {
      log.textContent += '\n' + msg;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      log.textContent = '削除中...';

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
            appendLog('✓ SW 登録解除: ' + (reg.scope || '(scope不明)'));
          }
          if (regs.length === 0) appendLog('SW なし');
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
            appendLog('✓ キャッシュ削除: ' + key);
          }
          if (keys.length === 0) appendLog('キャッシュなし');
        }

        try { localStorage.clear(); appendLog('✓ localStorage クリア'); } catch(e) {}
        try { sessionStorage.clear(); appendLog('✓ sessionStorage クリア'); } catch(e) {}

        appendLog('\n完了。3秒後にトップへ戻ります。');
        setTimeout(() => { window.location.href = '/'; }, 3000);
      } catch (err) {
        appendLog('エラー: ' + err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
