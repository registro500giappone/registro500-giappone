<script>
// 「あと何日」「終了しました」は今日を基準に変わる。6時間おきの生成で焼き込むと
// 日付をまたいだ瞬間に嘘になるので、表示時に出す。
function rgCountdown() {
  var hero = document.getElementById('hero');
  var cd = document.getElementById('countdown');
  var p = hero.dataset.lastDay.split('-');
  var last = new Date(+p[0], +p[1] - 1, +p[2]);   // 開催最終日のローカル(JST)0時
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var days = Math.round((last - today) / 86400000);
  hero.classList.toggle('past', days < 0);
  if (days < 0) { cd.textContent = '終了しました'; }
  else if (days === 0) { cd.textContent = '本日開催'; }
  else if (days === 1) { cd.textContent = '明日開催'; }
  else { cd.textContent = 'あと' + days + '日'; }
  cd.hidden = false;
  return days < 0;
}
var rgIsPast = rgCountdown();
// 終わったイベントでは「ページを」共有すると明示する（下の参加者の共有スペースの写真・動画を共有するボタンに見えないように）
if (rgIsPast) { const sb = document.getElementById('shareBtn'); if (sb) sb.textContent = 'このイベントのページを共有する'; }

const EVENT_ID = "EVT_1770295396880";
var EVENT_NAME = "2026 Historic & classic car meeting in Sendai";

// ── 本文はDBの最新で上書きする（2026-11-21 ユーザー決裁「修正が入れば即時反映が基本」）──
// このHTMLは共有カード（LINE・X）と検索のために6時間おきに作り直す静的ページで、
// 書き込まれた本文はその時点のもの。主催者が編集画面で直しても次の生成まで古いまま＝
// 「保存したのに反映されない」と困惑させる。そこで開くたびにDBを読み、名前・日時・場所・
// 費用・説明・URLを置き換える（参加表明の顔ぶれと同じハイブリッド）。
// 書き出す形は Python 側の render() と同じにそろえる（片方だけ直すと見た目がずれる）。
// ⚠️ここは Python の f-string の中＝JSの正規表現・文字列のバックスラッシュは二重に書く（一重だと改行に化けて JS が止まる）。
function rgEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;' }[c];
  });
}
function rgJst(ts) {   // DBのタイムスタンプ → JSTの年月日時分（Python の to_jst と同じ）
  if (!ts) return null;
  var d = new Date(ts); if (isNaN(d)) return null;
  var j = new Date(d.getTime() + 9 * 3600000);
  return { y: j.getUTCFullYear(), m: j.getUTCMonth() + 1, d: j.getUTCDate(), w: '日月火水木金土'[j.getUTCDay()],
           hh: j.getUTCHours(), mm: j.getUTCMinutes() };
}
function rgPad(n) { return (n < 10 ? '0' : '') + n; }
async function refreshFromDb() {
  try {
    const { data: ev, error } = await supabaseClient.from('events')
      .select('event_name, event_date, event_date_end, location, fee, url, description, target_car_type')
      .eq('id', EVENT_ID).maybeSingle();
    if (error || !ev) return;   // 読めなければ書き込み済みの内容のまま
    const s = rgJst(ev.event_date); if (!s) return;
    const en = rgJst(ev.event_date_end);
    const hasTime = !(s.hh === 0 && s.mm === 0);   // JST 00:00 ちょうど＝開催時刻の入力なし
    let hero = '<div class="hero-y">' + s.y + '年</div>'
      + '<div class="hero-d">' + s.m + '月' + s.d + '日<span class="wd">（' + s.w + '）</span></div>';
    if (en && !(en.y === s.y && en.m === s.m && en.d === s.d))
      hero += '<div class="hero-sub">' + rgEsc('〜 ' + en.m + '月' + en.d + '日（' + en.w + '）') + '</div>';
    if (hasTime) hero += '<div class="hero-sub">' + rgPad(s.hh) + ':' + rgPad(s.mm) + '〜</div>';
    document.getElementById('heroDate').innerHTML = hero;
    const last = en || s;
    document.getElementById('hero').dataset.lastDay = last.y + '-' + rgPad(last.m) + '-' + rgPad(last.d);
    rgIsPast = rgCountdown();

    const badge = ev.target_car_type === '500' ? '<span class="badge b500">500</span>'
      : ev.target_car_type === '126' ? '<span class="badge b126">126</span>' : '';
    EVENT_NAME = ev.event_name || 'イベント';
    document.getElementById('evName').innerHTML = rgEsc(EVENT_NAME) + badge;

    let rows = '';
    [['開催場所', ev.location], ['費用', ev.fee]].forEach(function (kv) {
      if (kv[1]) rows += '<div class="row"><span class="lbl">' + rgEsc(kv[0]) + '</span><div class="val">'
        + rgEsc(kv[1]).replace(/\n/g, '<br>') + '</div></div>';
    });
    const loc = (ev.location || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    if (loc.length) rows += '<a class="btn btn-map" href="https://www.google.com/maps/search/?api=1&amp;query='
      + encodeURIComponent(loc.join(' ')) + '" target="_blank" rel="noopener">Googleマップで開く</a>';
    document.getElementById('evRows').innerHTML = rows;

    let desc = '';
    if (ev.description) {
      desc = rgEsc(ev.description).replace(/\n/g, '<br>')
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>');
      desc = '<div class="desc">' + desc + '</div>';
    }
    document.getElementById('evDesc').innerHTML = desc;

    let link = '';
    if (ev.url && /^https?:\/\//i.test(ev.url)) {   // http(s) 以外は href に書き出さない
      let host = '';
      try { host = new URL(ev.url).host.replace('www.', ''); } catch (e) {}
      link = '<a class="btn btn-ext" href="' + rgEsc(ev.url) + '" target="_blank" rel="noopener nofollow">詳しい情報を見る</a>'
        + '<p class="ext-host">' + rgEsc(host) + '</p>';
    }
    document.getElementById('evLink').innerHTML = link;
  } catch (e) { /* 失敗しても書き込み済みの内容が見えているので何もしない */ }
}
refreshFromDb();

// 共有。スマホでは共有シート（LINE等が並ぶ）、対応していない環境ではリンクをコピーする。
// alert を出さずボタンの文字で結果を伝える＝押した指の近くで完結し、閉じる操作が要らない。
// 配るURLは canonical と同じ /event/<slug>/ に固定する（クエリやハッシュが付いた状態で
// 共有されると、同じページが別URLとして出回りSNSのシェア数も分散するため）。
function shareThisEvent() {
  const url = location.origin + location.pathname;
  const btn = document.getElementById('shareBtn');
  if (navigator.share) {
    navigator.share({ title: EVENT_NAME, url: url }).catch(function () {});
    return;   // 共有をやめた場合も含め、ここで完了
  }
  navigator.clipboard.writeText(url).then(function () {
    const before = btn.textContent;
    btn.textContent = 'リンクをコピーしました';
    setTimeout(function () { btn.textContent = before; }, 2000);
  }).catch(function () {
    prompt('このリンクをコピーしてください:', url);
  });
}

let currentUser = null;
let myCarId = null;
let myCarHandle = null;

// ── ログインモーダルを開く・閉じる。中のログイン欄（メールの確認コード）は共通の rg-login.js ──
let loginUi = null;
function openLoginModal(){
  // 成功 → onAuthStateChange が参加ボタンを更新。モーダルを閉じる
  if (!loginUi) loginUi = RG.login.mount('rgLogin', { sb: supabaseClient, google: false, onVerified: closeLoginModal });
  loginUi.loadSaved();
  const m = document.getElementById('loginModal'); if (m) m.style.display = 'flex';
}
function closeLoginModal(){
  const m = document.getElementById('loginModal'); if (m) m.style.display = 'none';
  if (loginUi) loginUi.reset();
}

// ── 参加表明。event_participants は匿名読み取り可（一覧ページと同じ扱い）──
async function checkMyCar(user){
  // 2026-02 以前に登録してまだ結び付いていない車（owner_user_id が空）を、登録アドレスで自分のアカウントへ結び付ける。
  // 他のページ（index・edit など）と同じ。これが無いと、イベントページから初めてログインした人に参加ボタンが出なかった（2026-11-24）。
  try { await supabaseClient.rpc('link_owner_car'); } catch (e) { console.error(e); }
  try {
    const { data: cars } = await supabaseClient.from('cars')
      .select('document_id, handle_name').eq('owner_user_id', user.id);
    if (cars && cars.length > 0) { myCarId = cars[0].document_id; myCarHandle = cars[0].handle_name; }
    else { myCarId = null; myCarHandle = null; }
  } catch (e) { myCarId = null; myCarHandle = null; }
}

function updateJoinButton(rows){
  const btn = document.getElementById('joinBtn');
  const hint = document.getElementById('joinHint');
  if (!btn || rgIsPast) return;  // 終了したイベントには参加ボタンを出さない
  hint.style.display = 'none';
  if (!currentUser) {
    btn.textContent = '✋ 参加する';
    btn.classList.remove('joined');
    btn.onclick = openLoginModal;
    btn.style.display = 'block';
    return;
  }
  // event_participants は car_id だけで人を見分けており、車両未登録だと
  // 全員が同じ値に集約されて互いの参加表明を消せてしまう。ここでは登録を促す。
  if (!myCarId) {
    btn.style.display = 'none';
    hint.innerHTML = '愛車を登録すると参加表明できます。<a href="/edit">車両を登録する</a>';
    hint.style.display = 'block';
    return;
  }
  const joined = rows.some((r) => r.car_id === myCarId);
  btn.textContent = joined ? '✅ 参加予定です' : '✋ 参加する';
  btn.classList.toggle('joined', joined);
  btn.onclick = toggleJoin;
  btn.style.display = 'block';
}

async function refreshParticipants(){
  const box = document.getElementById('participants');
  const head = document.getElementById('joinHead');
  try {
    const { data: rows, error } = await supabaseClient.from('event_participants')
      .select('car_id, handle_name').eq('event_id', EVENT_ID)
      // 並びは参加表明した順。指定しないと索引の順＝登録番号の文字順
      // （DOC_1, DOC_10, DOC_102 …）で返ってくる（2026-11-20 実測）。
      .order('created_at', { ascending: true }).order('id', { ascending: true });
    if (error) throw error;
    const list = rows || [];
    if (list.length === 0) {
      box.textContent = rgIsPast ? '参加表明はありませんでした。' : 'まだ参加表明はありません。';
      box.className = 'muted';
    } else {
      head.textContent = list.length + '人が参加' + (rgIsPast ? 'しました' : '予定');
      box.className = 'names';
      box.innerHTML = '';
      for (const row of list) {
        // 名前から愛車のページへ行けるようにする。オーナー同士が繋がるための
        // 導線で、ここがこのサイトの本筋（検索流入はあくまで副次的）。
        // 同じタブで開くので、detail 側の戻るボタン（fab-nav.js）でも
        // ブラウザの戻るでも、このイベントページへ帰ってこられる。
        // car_id が 'ADMIN' の行は車両を持たない参加者なのでリンクにしない。
        const linkable = row.car_id && row.car_id !== 'ADMIN';
        const el = document.createElement(linkable ? 'a' : 'span');
        el.className = 'name';
        if (linkable) el.href = '/detail?doc=' + encodeURIComponent(row.car_id);
        el.textContent = row.handle_name || '(名称未設定)';
        box.appendChild(el);
      }
    }
    updateJoinButton(list);
  } catch (err) {
    box.textContent = '参加者の読み込みに失敗しました。';
  }
}

async function toggleJoin(){
  const btn = document.getElementById('joinBtn');
  if (!myCarId) return;   // 車両未登録には上で案内を出しており、ここへは来ない
  btn.disabled = true;
  try {
    const { data: existing } = await supabaseClient.from('event_participants')
      .select('id').eq('event_id', EVENT_ID).eq('car_id', myCarId).maybeSingle();
    if (existing) {
      const { error } = await supabaseClient.from('event_participants').delete().eq('id', existing.id);
      if (error) throw error;
    } else {
      const { error } = await supabaseClient.from('event_participants').insert([
        { event_id: EVENT_ID, car_id: myCarId, handle_name: myCarHandle || 'オーナー' }
      ]);
      if (error) throw error;
    }
    await refreshParticipants();
  } catch (e) {
    // 失敗の理由を握りつぶさない（2026-10-02 参加表明の 42501 が「通信エラー」としか出なかったため）
    console.error(e);
    const code = e && e.code ? String(e.code) : '';
    if (code === '42501') alert('権限が確認できず保存できませんでした。ログインし直してから、もう一度お試しください。解決しない場合は管理者へお知らせください（コード: 42501）');
    else if (code === '23505') alert('すでに参加表明済みです。ページを再読み込みしてください。');
    else if (e instanceof TypeError) alert('通信できませんでした。電波の良い場所で、もう一度お試しください。');
    else alert('通信エラーが発生しました' + (code ? '（コード: ' + code + '）' : ''));
  } finally {
    btn.disabled = false;
  }
}

// 参加者限定の共有（動画・写真）は /event-member.js（refreshMemberVideos）

supabaseClient.auth.onAuthStateChange((event, session) => {
  const user = session ? session.user : null;
  currentUser = user;
  (async () => {
    if (user) await checkMyCar(user); else { myCarId = null; myCarHandle = null; }
    await refreshParticipants();
    if (window.refreshMemberVideos) await refreshMemberVideos();
  })();
});
refreshParticipants();
</script>
