<script>
// 参加表明は変動するので静的に焼かず、表示時に最新を取りに行く。
// event_participants は匿名読み取り可（一覧ページと同じ扱い）。
(async () => {
  const box = document.getElementById('participants');
  try {
    const r = await fetch("https://ttlttclfovuzafvghvaq.supabase.co" + '/rest/v1/event_participants?select=handle_name&event_id=eq.' +
      encodeURIComponent("EVT_1782874721317"), { headers: { apikey: "sb_publishable_YMQjADUCrD6BytxvcMm-lQ_7n8LMEAt" } });
    const rows = await r.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      box.textContent = 'まだ参加表明はありません。';
      return;
    }
    box.className = 'names';
    box.innerHTML = '';
    for (const row of rows) {
      const span = document.createElement('span');
      span.className = 'name';
      span.textContent = row.handle_name || '(名称未設定)';
      box.appendChild(span);
    }
  } catch (err) {
    box.textContent = '参加者の読み込みに失敗しました。';
  }
})();
</script>
