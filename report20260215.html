<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント実施報告</title>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0"></script>
  <style>
    :root {
      --accent: #2cb89a;
      --accent-dark: #1e9e83;
      --bg: #f0faf7;
      --card: #fff;
      --text: #1d3d35;
      --muted: #6b9e94;
      --border: #c5e8e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ログイン画面 */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 20px;
    }
    #loginScreen h2 { color: var(--accent); }
    #loginScreen p { color: var(--muted); font-size: 0.9rem; }
    .btn-login {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 30px; border-radius: 8px; font-size: 1rem;
      cursor: pointer; font-weight: bold;
    }
    .btn-login:hover { background: var(--accent-dark); }

    /* メインコンテンツ */
    #mainContent { display: none; }

    header {
      background: var(--accent);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
    }
    header .label {
      font-size: 0.8rem; letter-spacing: 2px; opacity: 0.85; margin-bottom: 6px;
    }
    header h1 { font-size: 1.6rem; font-weight: bold; line-height: 1.4; }
    header .meta { font-size: 0.9rem; opacity: 0.85; margin-top: 8px; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    .section-title {
      font-size: 1.1rem; font-weight: bold; color: var(--accent);
      border-left: 4px solid var(--accent); padding-left: 10px;
      margin-bottom: 20px;
    }

    /* 管理者ツールバー */
    #adminToolbar {
      display: none;
      background: #e8f8f4; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-bottom: 24px;
    }
    #adminToolbar h4 { font-size: 0.9rem; color: var(--accent-dark); margin-bottom: 10px; }
    .add-form { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-form input {
      flex: 1; min-width: 120px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;
    }
    .btn-add {
      background: var(--accent); color: #fff; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    .btn-add:hover { background: var(--accent-dark); }
    .add-form small { width: 100%; color: var(--muted); font-size: 0.8rem; }

    /* 参加者グリッド */
    .count-badge {
      display: inline-block; background: var(--accent); color: #fff;
      font-size: 0.8rem; padding: 2px 10px; border-radius: 20px;
      margin-left: 8px; vertical-align: middle;
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 8px;
    }

    /* 参加者カード */
    .member-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(44,184,154,0.08);
      transition: box-shadow 0.2s;
    }
    .member-card:hover { box-shadow: 0 4px 16px rgba(44,184,154,0.18); }
    .member-card.excluded { opacity: 0.3; }

    /* カード名前部分 */
    .member-name {
      padding: 10px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .member-name a {
      color: var(--accent); text-decoration: underline;
      font-size: 0.9rem; font-weight: bold;
    }
    .member-name a:hover { color: var(--accent-dark); }
    .member-name span {
      font-size: 0.9rem; font-weight: bold; color: var(--text);
    }

    /* 除外ボタン */
    .btn-exclude {
      background: none; border: none; color: #ccc; cursor: pointer;
      font-size: 0.85rem; padding: 2px 4px; flex-shrink: 0;
    }
    .btn-exclude:hover { color: var(--accent); }

    /* 写真スロット */
    .photo-slot {
      position: relative;
      width: 100%;
      height: 300px;
      background: #e0f5ef;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-slot + .photo-slot {
      border-top: 1px solid var(--border);
    }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }
    .photo-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.8rem; gap: 6px;
    }
    .photo-placeholder-icon { font-size: 1.8rem; opacity: 0.4; }

    /* アップロードボタン（管理者専用・右下固定） */
    .btn-upload-corner {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(44,184,154,0.9); color: #fff;
      border: none; border-radius: 6px;
      padding: 4px 10px; font-size: 0.75rem;
      cursor: pointer; font-weight: bold;
      transition: background 0.15s;
      z-index: 10;
    }
    .btn-upload-corner:hover { background: var(--accent-dark); }
    .btn-upload-corner:disabled { background: rgba(0,0,0,0.3); cursor: default; }
    .upload-input { display: none; }

    /* ローディング */
    #loading {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 0.95rem;
    }

    /* フッター */
    footer {
      text-align: center; padding: 24px;
      color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border);
      margin-top: 16px;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* 写真モーダル */
    #photoModal {
      display: none;
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
    }
    #photoModal.open { display: flex; }
    #photoModal img {
      max-width: 92vw; max-height: 88vh;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    #photoModal .modal-close {
      position: fixed; top: 16px; right: 20px;
      background: none; border: none; color: #fff;
      font-size: 2rem; cursor: pointer; line-height: 1;
    }

    /* 集合写真・主催者メッセージ */
    #headerSection { margin-bottom: 32px; }
    .group-photo-wrap {
      position: relative;
      width: 100%; background: #e0f5ef;
      border-radius: 12px; overflow: hidden;
      margin-bottom: 16px;
    }
    .group-photo-wrap img {
      width: 100%; display: block;
      cursor: zoom-in; border-radius: 12px;
    }
    .group-photo-placeholder {
      width: 100%; height: 200px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.9rem; gap: 8px;
      border: 2px dashed var(--border); border-radius: 12px;
    }
    .organizer-message {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      font-size: 0.95rem; line-height: 1.8; white-space: pre-wrap;
      color: var(--text);
    }
    .organizer-message-placeholder {
      color: var(--muted); font-size: 0.9rem; font-style: italic;
    }
    /* 管理者編集エリア */
    .header-edit-area {
      display: none;
      background: #e8f8f4; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-bottom: 16px;
    }
    .header-edit-area h4 { font-size: 0.9rem; color: var(--accent-dark); margin-bottom: 10px; }
    .header-edit-area textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; resize: vertical;
      min-height: 80px; font-family: inherit;
    }
    .header-edit-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

    /* コミュニティ投稿 */
    #communitySection { margin-top: 40px; }
    .community-upload-area {
      background: var(--card); border: 2px dashed var(--border);
      border-radius: 12px; padding: 20px; text-align: center;
      margin-bottom: 20px; cursor: pointer;
      transition: border-color 0.2s;
    }
    .community-upload-area:hover { border-color: var(--accent); }
    .community-upload-area p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .community-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .community-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(44,184,154,0.08);
    }
    .community-card img {
      width: 100%; display: block; cursor: zoom-in;
      max-height: 260px; object-fit: contain; background: #e0f5ef;
    }
    .community-card-footer {
      padding: 8px 12px; display: flex;
      align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
    }
    .community-card-footer a { color: var(--accent); text-decoration: underline; font-size: 0.85rem; font-weight: bold; }
    .community-card-footer span { color: var(--muted); font-size: 0.8rem; }
    .btn-delete-photo {
      background: none; border: none; color: #ccc;
      cursor: pointer; font-size: 0.8rem; padding: 2px 4px;
    }
    .btn-delete-photo:hover { color: #e74c3c; }

    @media (max-width: 480px) {
      .members-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .community-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

<!-- 写真モーダル -->
<div id="photoModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="" alt="">
</div>

<!-- ログイン画面 -->
<div id="loginScreen">
  <h2>メンバー限定ページ</h2>
  <p>このページを閲覧するにはログインが必要です。</p>
  <button class="btn-login" id="loginBtn">Googleでログイン</button>
</div>

<!-- アクセス拒否画面 -->
<div id="deniedScreen" style="display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:16px; text-align:center; padding:24px;">
  <div style="font-size:2.5rem">🚫</div>
  <h2 style="color:var(--accent)">閲覧権限がありません</h2>
  <p style="color:var(--muted); font-size:0.95rem">このページはイベント参加者限定です。</p>
  <a href="event.html" style="color:var(--accent); font-size:0.9rem">← イベント掲示板に戻る</a>
</div>

<!-- メインコンテンツ -->
<div id="mainContent">

  <header>
    <div class="label">EVENT REPORT</div>
    <h1 id="eventTitle">読み込み中...</h1>
    <div class="meta" id="eventMeta"></div>
  </header>

  <div class="container">
    <div id="loading">データを読み込み中...</div>

    <!-- 集合写真・主催者メッセージ -->
    <div id="headerSection" style="display:none">
      <!-- 管理者編集エリア -->
      <div class="header-edit-area" id="headerEditArea">
        <h4>集合写真・メッセージを編集</h4>
        <div class="header-edit-row">
          <button class="btn-add" onclick="document.getElementById('groupPhotoInput').click()">集合写真をアップロード</button>
          <input type="file" id="groupPhotoInput" class="upload-input" accept="image/*">
          <span id="groupPhotoStatus" style="color:var(--muted);font-size:0.85rem;align-self:center"></span>
        </div>
        <textarea id="messageInput" placeholder="主催者メッセージを入力..." style="margin-top:10px"></textarea>
        <div class="header-edit-row">
          <button class="btn-add" onclick="saveHeaderMessage()">メッセージを保存</button>
        </div>
      </div>
      <!-- 集合写真表示 -->
      <div class="group-photo-wrap" id="groupPhotoWrap">
        <div class="group-photo-placeholder" id="groupPhotoPlaceholder">📷 集合写真準備中</div>
      </div>
      <!-- 主催者メッセージ -->
      <div id="organizerMessage" class="organizer-message" style="display:none"></div>
    </div>

    <!-- 管理者ツールバー -->
    <div id="adminToolbar">
      <h4>管理者メニュー</h4>
      <div class="add-form">
        <input type="text" id="addHandleName" placeholder="ハンドルネーム（必須）">
        <input type="text" id="addCarId" placeholder="car_id（任意・なければ空欄）">
        <button class="btn-add" onclick="addParticipant()">＋ 当日参加者を追加</button>
        <small>※ car_idが空の場合はIDを自動付与します。カードの ✕ で除外（完全非表示）できます。</small>
      </div>
    </div>

    <!-- 参加者 -->
    <div id="membersSection" style="display:none">
      <div class="section-title">
        参加メンバー
        <span class="count-badge" id="countBadge">0名</span>
      </div>
      <div class="members-grid" id="membersGrid"></div>
    </div>
    <!-- コミュニティ投稿 -->
    <div id="communitySection" style="display:none">
      <div class="section-title">みんなの写真</div>
      <div class="community-upload-area" id="communityUploadArea" style="display:none">
        <div style="font-size:2rem">📷</div>
        <p>クリックして写真を投稿する</p>
        <input type="file" id="communityPhotoInput" class="upload-input" accept="image/*">
      </div>
      <div class="community-grid" id="communityGrid"></div>
    </div>
  </div>

  <footer>
    <a href="event.html">← イベント掲示板に戻る</a>
  </footer>

</div>

<script>
  // ============================================================
  // ★★★ ここだけ変更してください ★★★
  // ============================================================
  const EVENT_ID = 'EVT_1767547600299';
  // ============================================================

  // ADMIN_EMAIL は config.js で定義

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const storage = firebase.storage();
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let _isAdmin = false;
  let _baseList = [];
  let _myCarId = null;
  let _myHandleName = null;

  document.getElementById('loginBtn').addEventListener('click', () => {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  });

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
      return;
    }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    await loadReport(user);
  });

  function showDenied() {
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    const d = document.getElementById('deniedScreen');
    d.style.display = 'flex';
  }

  async function loadReport(user) {
    _isAdmin = user.email === ADMIN_EMAIL;

    // 自分のcar_id取得
    await supabaseClient.rpc('link_owner_car');
    const { data: cars } = await supabaseClient
      .from('cars').select('document_id, handle_name').eq('owner_user_id', user.id);
    if (cars && cars.length > 0) {
      _myCarId = cars[0].document_id;
      _myHandleName = cars[0].handle_name;
    }

    // アクセス権チェック（管理者 or イベント参加者のみ）
    if (!_isAdmin) {
      if (!_myCarId) {
        // carsに未登録 → 拒否
        showDenied(); return;
      }
      const { data: participation } = await supabaseClient
        .from('event_participants')
        .select('car_id')
        .eq('event_id', EVENT_ID)
        .eq('car_id', _myCarId)
        .maybeSingle();
      if (!participation) {
        // event_participantsに未登録 → 拒否
        showDenied(); return;
      }
    }

    const { data: events } = await supabaseClient
      .from('events')
      .select(`
        EventName:event_name,
        EventDate:event_date,
        Location:location,
        Participants:event_participants(
          OwnerID:car_id,
          HandleName:handle_name
        )
      `)
      .eq('id', EVENT_ID)
      .single();

    if (!events) {
      document.getElementById('loading').textContent = 'イベントが見つかりませんでした。';
      return;
    }
    document.getElementById('loading').style.display = 'none';

    const d = new Date(events.EventDate);
    const w = ['日','月','火','水','木','金','土'][d.getDay()];
    document.getElementById('eventTitle').textContent = events.EventName;
    document.getElementById('eventMeta').textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 (${w})  ${events.Location}`;

    if (_isAdmin) document.getElementById('adminToolbar').style.display = 'block';

    _baseList = events.Participants || [];

    // 全データ並列取得
    const [
      { data: photos },
      { data: overrides },
      { data: headerData },
      { data: communityPhotos }
    ] = await Promise.all([
      supabaseClient.from('event_report_photos')
        .select('car_id, photo_index, photo_url').eq('event_id', EVENT_ID),
      supabaseClient.from('event_report_overrides')
        .select('type, car_id, handle_name').eq('event_id', EVENT_ID),
      supabaseClient.from('event_report_header')
        .select('group_photo_urls, organizer_message').eq('event_id', EVENT_ID).maybeSingle(),
      supabaseClient.from('event_community_photos')
        .select('id, car_id, handle_name, photo_url, uploaded_at')
        .eq('event_id', EVENT_ID).order('uploaded_at', { ascending: false })
    ]);

    const photoMap = {};
    (photos || []).forEach(p => {
      if (!photoMap[p.car_id]) photoMap[p.car_id] = {};
      photoMap[p.car_id][p.photo_index] = p.photo_url;
    });

    const excludedIds = (overrides || []).filter(o => o.type === 'exclude').map(o => o.car_id);
    const addedMembers = (overrides || []).filter(o => o.type === 'add')
      .map(o => ({ OwnerID: o.car_id, HandleName: o.handle_name }));

    renderHeader(headerData);
    document.getElementById('membersSection').style.display = 'block';
    renderMembers(photoMap, excludedIds, addedMembers);
    renderCommunityPhotos(communityPhotos || []);
  }

  // --- 集合写真・メッセージ ---
  function renderHeader(data) {
    document.getElementById('headerSection').style.display = 'block';
    if (_isAdmin) document.getElementById('headerEditArea').style.display = 'block';

    const groupUrl = data && data.group_photo_urls && data.group_photo_urls[0];
    if (groupUrl) {
      const wrap = document.getElementById('groupPhotoWrap');
      wrap.innerHTML = '';
      const img = document.createElement('img');
      img.src = groupUrl;
      img.alt = '集合写真';
      img.onclick = () => openModal(groupUrl);
      wrap.appendChild(img);
      if (_isAdmin) {
        const btn = document.createElement('button');
        btn.className = 'btn-upload-corner';
        btn.textContent = '変更';
        btn.onclick = () => document.getElementById('groupPhotoInput').click();
        wrap.appendChild(btn);
      }
    } else {
      if (_isAdmin) {
        document.getElementById('groupPhotoPlaceholder').textContent = '集合写真をアップロードしてください';
      }
    }

    const msg = data && data.organizer_message;
    const msgEl = document.getElementById('organizerMessage');
    if (msg) {
      msgEl.textContent = msg;
      msgEl.style.display = 'block';
      if (_isAdmin) document.getElementById('messageInput').value = msg;
    }

    // 集合写真アップロード
    document.getElementById('groupPhotoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('groupPhotoStatus');
      status.textContent = 'アップロード中...';
      try {
        const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
        const ref = storage.ref(`event_reports/${EVENT_ID}/group.${ext}`);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        await supabaseClient.from('event_report_header').upsert({
          event_id: EVENT_ID,
          group_photo_urls: [url],
          organizer_message: document.getElementById('messageInput').value || null
        }, { onConflict: 'event_id' });
        status.textContent = '完了！';
        location.reload();
      } catch (err) {
        status.textContent = 'エラー: ' + err.message;
      }
      e.target.value = '';
    });
  }

  window.saveHeaderMessage = async function() {
    const msg = document.getElementById('messageInput').value.trim();
    if (!msg) return alert('メッセージを入力してください');
    const { error } = await supabaseClient.from('event_report_header').upsert({
      event_id: EVENT_ID,
      organizer_message: msg
    }, { onConflict: 'event_id' });
    if (error) return alert('保存失敗: ' + error.message);
    location.reload();
  };

  // --- コミュニティ投稿 ---
  function renderCommunityPhotos(photos) {
    document.getElementById('communitySection').style.display = 'block';

    // IDありメンバーのみ投稿エリア表示
    if (_myCarId) {
      const uploadArea = document.getElementById('communityUploadArea');
      uploadArea.style.display = 'block';
      uploadArea.querySelector('p').textContent = `${_myHandleName || 'あなた'} として写真を投稿する`;
      uploadArea.onclick = () => document.getElementById('communityPhotoInput').click();
      document.getElementById('communityPhotoInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        uploadArea.querySelector('p').textContent = 'アップロード中...';
        try {
          const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
          const ref = storage.ref(`event_community/${EVENT_ID}/${_myCarId}_${Date.now()}.${ext}`);
          await ref.put(file);
          const url = await ref.getDownloadURL();
          const { error } = await supabaseClient.from('event_community_photos').insert({
            event_id: EVENT_ID,
            car_id: _myCarId,
            handle_name: _myHandleName || _myCarId,
            photo_url: url
          });
          if (error) throw error;
          location.reload();
        } catch (err) {
          alert('投稿失敗: ' + err.message);
          uploadArea.querySelector('p').textContent = `${_myHandleName || 'あなた'} として写真を投稿する`;
        }
        e.target.value = '';
      });
    }

    const grid = document.getElementById('communityGrid');
    grid.innerHTML = '';
    if (photos.length === 0) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.9rem">まだ投稿がありません</p>';
      return;
    }
    photos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'community-card';

      const img = document.createElement('img');
      img.src = p.photo_url;
      img.alt = p.handle_name;
      img.loading = 'lazy';
      img.onclick = () => openModal(p.photo_url);
      card.appendChild(img);

      const footer = document.createElement('div');
      footer.className = 'community-card-footer';
      footer.innerHTML = `<a href="detail.html?doc=${p.car_id}" target="_blank">${esc(p.handle_name)}</a>`;

      // 自分の投稿or管理者は削除可
      if (p.car_id === _myCarId || _isAdmin) {
        const del = document.createElement('button');
        del.className = 'btn-delete-photo';
        del.textContent = '削除';
        del.onclick = async () => {
          if (!confirm('この写真を削除しますか？')) return;
          await supabaseClient.from('event_community_photos').delete().eq('id', p.id);
          location.reload();
        };
        footer.appendChild(del);
      }
      card.appendChild(footer);
      grid.appendChild(card);
    });
  }

  function renderMembers(photoMap, excludedIds, addedMembers) {
    const grid = document.getElementById('membersGrid');
    grid.innerHTML = '';

    const allParticipants = [
      ..._baseList.filter(p => p.OwnerID && p.HandleName && p.OwnerID !== 'undefined'),
      ...addedMembers
    ];

    const visibleParticipants = allParticipants.filter(p => !excludedIds.includes(p.OwnerID));
    document.getElementById('countBadge').textContent = visibleParticipants.length + '名';

    visibleParticipants.forEach(p => {
      const card = document.createElement('div');
      card.className = 'member-card';

      const nameDiv = document.createElement('div');
      nameDiv.className = 'member-name';
      const isManual = p.OwnerID && p.OwnerID.startsWith('MANUAL_');
      const nameLink = (p.OwnerID === 'ADMIN' || isManual)
        ? `<span>${esc(p.HandleName)}</span>`
        : `<a href="detail.html?doc=${p.OwnerID}" target="_blank">${esc(p.HandleName)}</a>`;
      nameDiv.innerHTML = nameLink;

      if (_isAdmin) {
        const btn = document.createElement('button');
        btn.className = 'btn-exclude';
        btn.title = '除外（欠席）';
        btn.textContent = '✕';
        btn.onclick = () => toggleExclude(p.OwnerID);
        nameDiv.appendChild(btn);
      }
      card.appendChild(nameDiv);

      [1, 2].forEach(idx => {
        card.appendChild(createPhotoSlot(p.OwnerID, idx, (photoMap[p.OwnerID] || {})[idx]));
      });

      grid.appendChild(card);
    });
  }

  function createPhotoSlot(carId, photoIndex, photoUrl) {
    const slot = document.createElement('div');
    slot.className = 'photo-slot';
    slot.style.height = photoIndex === 1 ? '300px' : '180px';

    if (photoUrl) {
      const img = document.createElement('img');
      img.src = photoUrl;
      img.alt = `写真${photoIndex}`;
      img.loading = 'lazy';
      img.onclick = () => openModal(photoUrl);
      slot.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'photo-placeholder';
      ph.innerHTML = `<span class="photo-placeholder-icon">📷</span><span>写真${photoIndex}</span>`;
      slot.appendChild(ph);
    }

    if (_isAdmin) {
      const inputId = `upload-${carId}-${photoIndex}`;
      const btn = document.createElement('button');
      btn.className = 'btn-upload-corner';
      btn.textContent = photoUrl ? '変更' : '追加';
      btn.title = `写真${photoIndex}をアップロード`;
      btn.onclick = () => document.getElementById(inputId).click();

      const input = document.createElement('input');
      input.type = 'file';
      input.id = inputId;
      input.className = 'upload-input';
      input.accept = 'image/*';
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) uploadPhoto(carId, photoIndex, file, slot, btn);
        e.target.value = '';
      });

      slot.appendChild(btn);
      slot.appendChild(input);
    }

    return slot;
  }

  async function uploadPhoto(carId, photoIndex, file, slot, btn) {
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
      const path = `event_reports/${EVENT_ID}/${carId}_${photoIndex}.${ext}`;
      const ref = storage.ref(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();

      const { error } = await supabaseClient
        .from('event_report_photos')
        .upsert({
          event_id: EVENT_ID,
          car_id: carId,
          photo_index: photoIndex,
          photo_url: url
        }, { onConflict: 'event_id,car_id,photo_index' });

      if (error) throw error;

      // 写真を差し替え
      const oldImg = slot.querySelector('img');
      const oldPh = slot.querySelector('.photo-placeholder');
      if (oldImg) oldImg.remove();
      if (oldPh) oldPh.remove();

      const img = document.createElement('img');
      img.src = url;
      img.alt = `写真${photoIndex}`;
      img.onclick = () => openModal(url);
      slot.insertBefore(img, slot.firstChild);

      btn.textContent = '変更';
      btn.disabled = false;

    } catch (err) {
      console.error('アップロードエラー:', err);
      alert('アップロードに失敗しました: ' + err.message);
      btn.textContent = '追加';
      btn.disabled = false;
    }
  }

  async function toggleExclude(ownerId) {
    await supabaseClient.from('event_report_overrides').insert({
      event_id: EVENT_ID, type: 'exclude', car_id: ownerId
    });
    location.reload();
  }

  window.addParticipant = async function() {
    const handleName = document.getElementById('addHandleName').value.trim();
    if (!handleName) return alert('ハンドルネームを入力してください');
    const carId = document.getElementById('addCarId').value.trim() || ('MANUAL_' + Date.now());

    const { error } = await supabaseClient.from('event_report_overrides').insert({
      event_id: EVENT_ID, type: 'add', car_id: carId, handle_name: handleName
    });
    if (error) return alert('追加に失敗しました: ' + error.message);
    location.reload();
  };

  function openModal(url) {
    document.getElementById('modalImg').src = url;
    document.getElementById('photoModal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('photoModal').classList.remove('open');
    document.getElementById('modalImg').src = '';
  }
  document.getElementById('photoModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
