<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://www.registro500.com/equipment">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-27SHHC4JYH');

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装備手帳 集計レポート | Registro500 Giappone</title>
  <meta name="description" content="空冷クラシックFiat 500オーナーの装備手帳から集計した、車載品の積載率レポート。工具・パーツ・ケミカル・非常時対応・洗車用品の各項目を、どれだけの人が積んでいるかで比較できます。">

  <link rel="icon" href="logo_horizontal.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.08);
      --text-main: #111827;
      --text-sub: #6b7280;
      --accent: #2856a8;
      --accent-soft: #e6efff;
      --occasional: #7c8db5;
      --radius-lg: 12px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
    @media (min-width: 1025px) { html { font-size: 17px; } }

    body {
      font-family: var(--font-sans); margin: 0; padding: 20px 16px 60px;
      background-color: var(--bg-main); color: var(--text-main); line-height: 1.6;
    }
    .page { max-width: 800px; margin: 0 auto; }

    .back-link {
      display: inline-block; font-size: 0.85rem; color: var(--text-sub);
      text-decoration: none; margin-bottom: 16px;
    }
    .back-link:hover { color: var(--accent); }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header img { height: 40px; width: auto; mix-blend-mode: multiply; margin-bottom: 12px; }
    .brand-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 6px; color: var(--text-main); }
    .brand-header p { font-size: 0.85rem; color: var(--text-sub); margin: 0; }

    #loading { text-align: center; color: var(--text-sub); padding: 40px 0; }

    #content { display: none; }

    .summary-badge {
      display: block; text-align: center; background: var(--accent-soft); color: var(--accent);
      border-radius: var(--radius-lg); font-size: 0.9rem; font-weight: 600;
      padding: 12px 16px; margin-bottom: 20px;
    }

    .cta-band {
      background: var(--card-bg); border: 1px dashed #c2d4ff; border-radius: var(--radius-lg);
      padding: 18px 20px; margin-bottom: 24px; text-align: center;
    }
    .cta-band p { margin: 0 0 12px; font-size: 0.9rem; color: var(--text-sub); }
    .btn-cta {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      border-radius: 8px; padding: 10px 22px; font-weight: 600; font-size: 0.9rem;
    }
    .btn-cta:hover { background: #1d3f8a; }

    /* ===== 母数ゼロ時 ===== */
    .empty-state {
      background: var(--card-bg); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft); padding: 48px 24px; text-align: center;
    }
    .empty-state p { color: var(--text-sub); margin: 0 0 20px; font-size: 0.95rem; }

    /* ===== カテゴリセクション ===== */
    .section {
      background: var(--card-bg); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft); padding: 24px; margin-bottom: 20px;
    }
    .section-title {
      font-size: 1rem; font-weight: 700; color: var(--accent);
      margin: 0 0 4px; padding-bottom: 10px;
      border-bottom: 2px solid var(--accent-soft);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .icon { font-size: 1.1rem; }
    .section-note { font-size: 0.78rem; color: var(--text-sub); margin: 10px 0 16px; }

    .stat-item { margin-bottom: 14px; }
    .stat-item:last-child { margin-bottom: 0; }
    .stat-label { font-size: 0.9rem; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
    .stat-label .name { flex: 1; min-width: 0; overflow-wrap: break-word; }
    .stat-pct { font-weight: 700; color: var(--accent); white-space: nowrap; }
    .bar-track { background: #e5e7eb; border-radius: 4px; height: 10px; overflow: hidden; display: flex; }
    .bar-fill { height: 100%; background: var(--accent); transition: width 0.6s ease; }
    .bar-fill.occasional { background: var(--occasional); }
    .stat-breakdown { font-size: 0.75rem; color: var(--text-sub); margin-top: 3px; }

    /* ===== 公開手帳一覧 ===== */
    .public-list-section { margin-bottom: 24px; }
    .public-list-lead { font-size: 0.82rem; color: var(--text-sub); margin: 0 0 14px; }
    .public-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .public-card {
      display: flex; flex-direction: column; gap: 3px; background: #f8faff;
      border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 14px;
      text-decoration: none; color: var(--text-main);
    }
    .public-card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .public-card-name { font-size: 0.88rem; font-weight: 700; }
    .public-card-model { font-size: 0.78rem; color: var(--text-sub); }
    .public-list-empty { font-size: 0.85rem; color: var(--text-sub); margin: 0; }

    .legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--text-sub); margin: 12px 0 20px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .legend-dot.always { background: var(--accent); }
    .legend-dot.occasional { background: var(--occasional); }

    .page-footer { text-align: center; margin-top: 40px; }
    .page-footer a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  </style>
</head>

<body>
<div class="page">

  <a href="index.html" class="back-link">&larr; ガレージに戻る</a>

  <div class="brand-header">
    <img src="logo_horizontal.png" alt="Registro500 Giappone">
    <h1>装備手帳 集計レポート</h1>
    <p>みんなの車載品、積載率でみる</p>
  </div>

  <div id="loading">読み込み中…</div>

  <div id="content">

    <div id="summary-badge" class="summary-badge"></div>

    <div class="cta-band">
      <p>あなたの装備手帳はまだですか？ 記入すると、この集計にも反映されます。</p>
      <a class="btn-cta" href="equipment-edit.html">装備手帳を書く・更新する →</a>
    </div>

    <div id="public-list-section" class="public-list-section" style="display:none;">
      <div class="section-title"><span class="icon">📖</span> 公開中の手帳</div>
      <p class="public-list-lead">オーナーが公開設定にした装備手帳です。タップすると、その車の車両ページで装備・メモ・経験談を見られます。</p>
      <div id="public-list" class="public-list"></div>
    </div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <p>まだ記録がありません。最初の1件はあなたです。</p>
      <a class="btn-cta" href="equipment-edit.html">装備手帳を書いてみる →</a>
    </div>

    <div id="legend" class="legend" style="display:none;">
      <span class="legend-item"><span class="legend-dot always"></span>常時積んでいる</span>
      <span class="legend-item"><span class="legend-dot occasional"></span>随時（必要な時だけ）</span>
    </div>

    <div id="categories"></div>

  </div><!-- /#content -->

  <div class="page-footer">
    <a href="index.html">← トップページへ戻る</a>
  </div>

</div><!-- /.page -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // カテゴリの表示順（equipment_items.category と一致させる。equipment-edit.html と同じ並び）
  const CATEGORIES = ['工具', 'パーツ', 'ケミカル', '非常時対応', '洗車・その他'];
  const CATEGORY_ICONS = {
    '工具': '🔧', 'パーツ': '⚙️', 'ケミカル': '🧴', '非常時対応': '🚨', '洗車・その他': '🧽'
  };

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function renderEmpty() {
    document.getElementById('summary-badge').style.display = 'none';
    document.querySelector('.cta-band').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
    document.getElementById('categories').innerHTML = '';
    document.getElementById('empty-state').style.display = 'block';
  }

  function renderRows(rows) {
    const totalRecords = rows.length ? Number(rows[0].total_records) : 0;

    if (!totalRecords) {
      renderEmpty();
      return;
    }

    document.getElementById('summary-badge').textContent =
      `${totalRecords}名の装備手帳から集計（複数回答・積載率）`;
    document.getElementById('legend').style.display = 'flex';

    const byCategory = {};
    rows.forEach(r => {
      if (!byCategory[r.category]) byCategory[r.category] = [];
      byCategory[r.category].push(r);
    });

    const container = document.getElementById('categories');
    container.innerHTML = '';

    CATEGORIES.forEach(cat => {
      const items = byCategory[cat];
      if (!items || !items.length) return;

      // 積載率が高い順（0%の項目も含めて表示＝「まだ誰も挙げていない」ことも情報）
      items.sort((a, b) => Number(b.load_rate) - Number(a.load_rate) || a.item_id - b.item_id);

      const section = document.createElement('div');
      section.className = 'section';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = `<span class="icon">${CATEGORY_ICONS[cat] || '📦'}</span> ${esc(cat)}`;
      section.appendChild(title);

      const note = document.createElement('p');
      note.className = 'section-note';
      note.textContent = `${items.length}項目`;
      section.appendChild(note);

      items.forEach(item => {
        const always = Number(item.always_count);
        const occasional = Number(item.occasional_count);
        const pct = Math.round(Number(item.load_rate) * 1000) / 10; // 小数1桁
        const alwaysPct = totalRecords ? (always / totalRecords) * 100 : 0;
        const occasionalPct = totalRecords ? (occasional / totalRecords) * 100 : 0;

        const row = document.createElement('div');
        row.className = 'stat-item';
        row.innerHTML = `
          <div class="stat-label">
            <span class="name">${esc(item.name)}</span>
            <span class="stat-pct">${pct}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${alwaysPct}%"></div>
            <div class="bar-fill occasional" style="width:${occasionalPct}%"></div>
          </div>
          <div class="stat-breakdown">常時 ${always}件・随時 ${occasional}件（母数 ${totalRecords}件）</div>
        `;
        section.appendChild(row);
      });

      container.appendChild(section);
    });
  }

  // ===== 公開手帳一覧 =====
  async function loadPublicRecords() {
    const { data: recs, error } = await supabaseClient
      .from('equipment_records')
      .select('id, vehicle_id, updated_at')
      .eq('is_public', true)
      .order('updated_at', { ascending: false })
      .limit(24);
    if (error) throw error;

    const withVehicle = (recs || []).filter(r => r.vehicle_id);
    if (!withVehicle.length) return [];

    const vehicleIds = [...new Set(withVehicle.map(r => r.vehicle_id))];
    const { data: cars, error: carsError } = await supabaseClient
      .from('cars')
      .select('document_id, handle_name, model_display_a, model_display_b, model_display_c, car_type')
      .in('document_id', vehicleIds);
    if (carsError) throw carsError;

    const carMap = {};
    (cars || []).forEach(c => { carMap[c.document_id] = c; });

    return withVehicle
      .map(r => ({ ...r, car: carMap[r.vehicle_id] }))
      .filter(r => r.car);
  }

  function renderPublicList(list) {
    const section = document.getElementById('public-list-section');
    const host = document.getElementById('public-list');
    section.style.display = 'block';

    if (!list.length) {
      host.innerHTML = '<p class="public-list-empty">まだ公開されている手帳はありません。</p>';
      return;
    }

    host.innerHTML = list.map(r => {
      const car = r.car;
      const carLabel = car.car_type === '126' ? 'FIAT 126' : 'FIAT 500';
      const model = car.model_display_c || [car.model_display_a || carLabel, car.model_display_b || ''].filter(Boolean).join(' ');
      return `
        <a class="public-card" href="detail.html?doc=${encodeURIComponent(car.document_id)}#equipment-notebook">
          <span class="public-card-name">${esc(car.handle_name || '名称未設定')}さん</span>
          <span class="public-card-model">${esc(model)}</span>
        </a>`;
    }).join('');
  }

  async function load() {
    try {
      const [ratesRes, publicList] = await Promise.all([
        supabaseClient.rpc('equipment_item_rates'),
        loadPublicRecords().catch(e => { console.error('公開手帳一覧の読み込みに失敗:', e); return []; })
      ]);
      if (ratesRes.error) throw ratesRes.error;
      renderPublicList(publicList);
      renderRows(ratesRes.data || []);
    } catch (e) {
      console.error(e);
      document.getElementById('loading').textContent = '読み込みに失敗しました。時間をおいて再度お試しください。';
      return;
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  load();
</script>
