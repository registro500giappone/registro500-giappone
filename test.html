<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-27SHHC4JYH');

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <title>【テスト版】Registro500 (二重エンコード確認)</title>
  
  <link rel="icon" href="logo_vertical.png">
  <link rel="manifest" href="manifest.json">
  <script src="config.js"></script>

  <style>
    /* CSS省略（本番と同じ） */
    :root {
      --bg-main: #f4f4f7; --card-bg: #ffffff; --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.08); --text-main: #111827;
      --text-sub: #6b7280; --accent: #2856a8; --accent-soft: #e6efff;
      --accent-border: #c2d4ff; --radius-lg: 12px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
    @media (min-width: 1025px) { html { font-size: 18px; } }
    body {
      font-family: var(--font-sans); margin: 0; padding: 20px 16px 96px;
      background-color: #f0f8ff; /* テスト判別用：薄い青色 */
      color: var(--text-main); font-size: 1rem; line-height: 1.5; overflow-x: hidden;
    }
    .page { max-width: 1200px; margin: 0 auto; }
    .car-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (min-width: 768px) { .car-list { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; } }
    .car-card { background-color: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); overflow: hidden; display: flex; flex-direction: column; }
    .car-image-wrap { position: relative; width: 100%; padding-top: 100%; background: #f3f4f6; overflow: hidden; }
    .car-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .car-main { padding: 12px 14px; }
    .car-model { font-size: 1.05rem; font-weight: 700; margin: 0; }
    .car-owner { font-size: 0.85rem; margin: 5px 0 0 0; color: #666; }
    #loading { text-align:center; padding: 60px; }
  </style>
</head>

<body>

  <div class="page">
    <h1 style="text-align:center; color:blue;">⚡ 軽量化テスト (v2) ⚡</h1>
    <div id="loading">読み込んでいます...</div>
    <div id="carList" class="car-list"></div>
  </div>

<script>
    let carsData = [];
    const CACHE_KEY = 'registro500_local_data'; 

    function initApp() { fetchCars(); }

    async function fetchCars() {
      try {
        const res = await fetch(API_URL + '?mode=index');
        const json = await res.json();
        if (json.success && json.data) {
          carsData = json.data;
          renderCars();
          document.getElementById('loading').style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderCars() {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';
      
      const cars = carsData.slice().reverse(); // 新着順

      cars.forEach(car => {
        const card = document.createElement('article');
        card.className = 'car-card';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'car-image-wrap';
        const img = document.createElement('img');
        img.className = 'car-image';
        
        let photoUrl = (car.PhotoMain && String(car.PhotoMain).trim()) || "https://placehold.co/400?text=No+Data";

        // ▼▼▼ ImageKit連携：二重エンコード修正版 ▼▼▼
        if (photoUrl.includes('firebasestorage.googleapis.com')) {
          try {
             const pathParts = photoUrl.split('/o/');
             if (pathParts.length > 1) {
               const fullPath = pathParts[1]; 
               const splitQ = fullPath.split('?');
               const filePath = splitQ[0]; 
               const queryString = splitQ[1] || 'alt=media';
               
               // ★ここを変更しました：2回 encodeURIComponent を通します★
               // images%2Fphoto.jpg → images%252Fphoto.jpg に変換
               const encodedPath = encodeURIComponent(encodeURIComponent(filePath));
               
               // これで ImageKit がデコードしても %2F が残り、Firebase が正しく認識できます
               photoUrl = `https://ik.imagekit.io/registro500/${encodedPath}?${queryString}&tr=w-400`;
             }
          } catch(e) {
             console.log('変換エラー', e);
          }
        }
        // ▲▲▲ ロジック終わり ▲▲▲

        img.onerror = function() { 
            // 失敗したらわかりやすいエラー画像にする
            this.src = "https://placehold.co/400x400/ff0000/ffffff?text=Still+Error"; 
        };
        img.src = photoUrl;
        img.loading = "lazy";
        
        imgWrap.appendChild(img);
        
        // 詳細情報（テスト用簡易表示）
        const main = document.createElement('div');
        main.className = 'car-main';
        main.innerHTML = `
          <div class="car-model">${car.Model_DisplayC || 'Unknown'}</div>
          <div class="car-owner">${car.HandleName || 'Owner'}</div>
          <div style="font-size:0.7rem; color:#999; margin-top:4px; word-break:break-all;">${photoUrl.substring(0, 50)}...</div>
        `;
        
        card.appendChild(imgWrap);
        card.appendChild(main);
        listEl.appendChild(card);
      });
    }

    initApp();
</script>
</body>
</html>
