<style>
:root{
  --bg:#fffdf8; --ink:#3a352c; --sub:#8d8574; --deep:#2c3a31; --line:#e6e0d4; --card:#fffefb; --accent:#7a6a53;
  --surface-1:#fffdf8; --text-primary:#3a352c; --text-secondary:#8d8574; --grid:#ece7dc;
  --series-a:#2a78d6; --series-b:#eb6834;
  --warn:#8a5a00; --warnbg:#fff4dc; --stop:#8f2a1f; --stopbg:#fdeae6; --info:#3f5a4a; --infobg:#eef2ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 72px}
.topbar{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar a{color:var(--sub);text-decoration:none;font-size:13px}
.topbar a:hover{color:var(--deep)}
h1{font-size:21px;margin:0 0 8px;color:var(--deep);letter-spacing:.04em}
label.row{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub);margin:0 0 8px}
select,input[type=range]{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input[type=range]{padding:0;border:0;background:transparent}
.chips{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button,.btn{appearance:none;flex:none;border:1px solid var(--line);background:#fff;color:var(--deep);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chips button:hover,.btn:hover{border-color:var(--deep)}
.chips button.on{border-color:var(--deep);background:var(--deep);color:#fff}
.free[hidden]{display:none}
.free{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px} .free label{font-size:12px;color:var(--sub)} .free output{color:var(--ink);font-weight:700;margin-left:6px}
.stage{position:relative;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden}
.stage canvas{display:block;width:100%;height:320px}
.stage.flat canvas{height:270px}
.stage .hud{position:absolute;left:10px;top:6px;font-size:12px;color:var(--sub);display:flex;gap:12px}
.stage .hud b{color:var(--ink)}
.stage .ctl{position:absolute;right:8px;top:5px}
.stage .ctl .btn{font-size:12px;padding:3px 10px}
.res{margin:12px 0 2px;font-size:16px;font-weight:700;color:var(--deep);line-height:1.6} .res b{color:var(--series-b)}
.sub{font-size:12px;color:var(--sub);margin:0 0 12px}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cards button{appearance:none;flex:none;width:132px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font:inherit;font-size:11px;color:var(--sub);line-height:1.45;cursor:pointer}
.cards button b{display:block;font-size:14px;color:var(--deep);margin-bottom:2px}
.cards button.on{border:2px solid var(--series-b);padding:7px 9px}
.cards button.dim{opacity:.55}
.cards button.dim.on{opacity:1}
.packWhy{font-size:12px;color:var(--sub);margin:4px 0 0;min-height:1em}
.sec{border:1px solid var(--line);background:var(--card);border-radius:12px;margin-top:8px;padding:0 12px}
.sec>summary{cursor:pointer;font-size:14px;color:var(--deep);padding:9px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'▸';color:var(--sub);font-size:13px}
.sec[open]>summary::after{content:'▾'}
.sec>summary small{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
.sec .body{padding:2px 0 12px;font-size:13px}
label.row.model{margin:12px 0 0}
label.row.model select{padding:9px 12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.key{display:inline-block;width:18px;height:0;border-top:3px solid;border-radius:2px}
.key.a{border-color:var(--series-a)} .key.b{border-color:var(--series-b)}
.eng{font-size:12px;color:var(--ink);background:#faf7f0;border:1px dashed var(--line);border-radius:9px;padding:7px 10px;margin:0 0 10px;line-height:1.5}
.eng .k{color:var(--sub)} .eng a{color:var(--deep);font-size:12px;white-space:nowrap}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 10px}
@media (max-width:420px){.hero{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.tile .cap{font-size:11px;color:var(--sub)} .tile .val{font-size:22px;font-weight:700;color:var(--deep);line-height:1.2;margin-top:2px} .tile .val small{font-size:12px;font-weight:400;color:var(--sub)} .tile .sub{font-size:12px;color:var(--sub);margin-top:2px}
.delta{font-weight:700} .delta.up{color:#1f6e3a} .delta.down{color:var(--stop)}
.story p{margin:6px 0;font-size:14px} .story p:first-child{margin-top:0}
.story .a{color:var(--series-a);font-weight:700} .story .b{color:var(--series-b);font-weight:700}
.chart{position:relative;border:1px solid var(--line);background:var(--surface-1);border-radius:12px;padding:10px 8px 6px;margin-top:4px}
.chart .title{font-size:13px;color:var(--deep);margin:0 4px 4px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary)} .legend span{display:inline-flex;align-items:center;gap:6px}
.chart canvas{display:block;width:100%;height:230px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--text-secondary);box-shadow:0 4px 14px #00000014;display:none;min-width:150px}
.tip b{color:var(--text-primary);font-size:13px} .tip .r{display:flex;justify-content:space-between;gap:10px;align-items:center} .tip .r i{display:inline-block;width:14px;border-top:2px solid;margin-right:6px}
details.inner{margin-top:8px;font-size:12px;color:var(--sub)} details.inner summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px} th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right} th:first-child,td:first-child{text-align:left}
.limits{font-size:13px;color:var(--ink);padding-left:1.2em;margin:6px 0 0} .limits li{margin:4px 0}
.note{font-size:12px;color:var(--sub);margin:10px 0 0}
.busy{opacity:.55;transition:opacity .15s}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a id="toEngine" href="./">← エンジンの画面へ</a><a href="/">トップへ戻る</a></div>
  <h1>坂と加速の妄想</h1>

  <div class="chips" id="scenes"></div>
  <div class="free" id="free" hidden>
    <label>勾配<output id="gOut"></output><input type="range" id="gRange" min="1" max="8" step="0.5"></label>
    <label>長さ<output id="lOut"></output><input type="range" id="lRange" min="500" max="12000" step="500"></label>
  </div>

  <div id="result" class="busy">
    <div class="stage" id="stage">
      <canvas id="stageCv"></canvas>
      <div class="hud" id="hud"></div>
      <div class="ctl"><button type="button" class="btn" id="replay">もう一度</button></div>
    </div>
    <p class="res" id="res"></p>
    <p class="sub" id="resSub"></p>

    <div class="cards" id="packs"></div>
    <p class="packWhy" id="packWhy"></p>

    <label class="row model">土台になる型式<select id="model"></select></label>
    <p class="note" id="modelNote" style="margin-top:2px"></p>

    <details class="sec" id="dFine"><summary>細かく変える<small>エンジン・ミッション・ファイナル・タイヤ</small></summary><div class="body">
      <div class="cols">
        <section class="panel">
          <h3><span class="key a"></span>いま</h3>
          <div class="eng" id="engA"></div>
          <div class="slots" data-side="a"></div>
        </section>
        <section class="panel">
          <h3><span class="key b"></span>変えた後</h3>
          <div class="eng" id="engB"></div>
          <div class="chips"><button type="button" id="copyAB">「いま」と同じ駆動系にする</button></div>
          <div class="slots" data-side="b"></div>
        </section>
      </div>
      <p class="note">乗員は 1人（75kg）で固定。同じ車の2台を同時にスタートさせる。</p>
    </div></details>

    <details class="sec" id="dStory"><summary>走りの中身<small>いちばん落ちた速度・ギア・所要時間</small></summary><div class="body">
      <div class="hero" id="hero"></div>
      <div class="story" id="story"></div>
    </div></details>

    <details class="sec" id="dChart"><summary>速度のグラフ</summary><div class="body">
      <div class="chart" id="chartV">
        <div class="title"><span id="chartTitle">速度の変化（横軸＝距離）</span><span class="legend"><span><i class="key a"></i>いま</span><span><i class="key b"></i>変えた後</span></span></div>
        <canvas></canvas><div class="tip"></div>
      </div>
      <details class="inner"><summary>数値の表</summary><div id="tableV"></div></details>
    </div></details>

    <details class="sec" id="dGear"><summary>ギアと回転</summary><div class="body">
      <div id="gearTable"></div>
      <p class="note">「80km/h の回転」の <b>—</b> は、そのギアでは回転が上限を超えてしまい 80km/h を出せないという意味。</p>
      <details class="inner"><summary>勾配ごとに維持できる速度（4速に限らず、いちばん速く登れるギアで）</summary><div id="gradeTable"></div></details>
    </div></details>

    <details class="sec" id="dLimits"><summary>この道具の限界・出典</summary><div class="body">
      <ul class="limits" id="limits"></ul>
      <p class="note" id="assumed"></p>
    </div></details>
  </div>
  <p class="note" id="status"></p>
</div>

<script type="module">
import { simulate } from './sim.js';
import { MODELS, SLOTS, PACKAGES, DEFAULT_CHOICES, buildSpec, modelById } from './presets.js';
import { GEARBOXES, FINALS, TIRES, DEFAULT_DRIVE_CHOICES, buildVehicle } from './presets_vehicle.js';
import { climbHill, accelerate, steadySpeed, topSpeed, gearTable, rpmAtSpeed, sceneLength, gradeAt, redline } from './vehicle.js';
import { SCENES, sceneById } from './scenes.js';

const $ = (s, r = document) => r.querySelector(s);
const RPM = [1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500];
const SLOT_ORDER = ['disp', 'cr', 'cam', 'head', 'carb', 'exh'];
const DRIVE_SLOTS = { gearbox: GEARBOXES, final: FINALS, tire: TIRES };
const DRIVE_LABEL = { gearbox: 'ミッション（変速比）', final: 'ファイナル（最終減速比）', tire: 'タイヤ' };
const DRIVE_ORDER = ['gearbox', 'final', 'tire'];   // 乗員は 1人固定（2026-09-18 ユーザー確定＝欄を出さない）
const P_DEFAULT = PACKAGES.find(p => p.id === 'p650');
const state = { model: '500F', a: { ...DEFAULT_CHOICES }, b: { ...DEFAULT_CHOICES }, da: { ...DEFAULT_DRIVE_CHOICES }, db: { ...DEFAULT_DRIVE_CHOICES }, scene: 'dangozaka', g: 4, l: 3000 };

// ───── URL ハッシュ（エンジン画面と同じ m/a/b に da/db/s/g/l を足す） ─────
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (![...h.keys()].length) { state.b = { ...DEFAULT_CHOICES, ...P_DEFAULT.choices }; return; }   // 素で開いたら「純正 vs まず650」を見せる
  if (h.get('m') && modelById(h.get('m')).id === h.get('m')) state.model = h.get('m');
  for (const side of ['a', 'b']) {
    const v = h.get(side); if (!v) continue;
    v.split(',').forEach(kv => { const [k, val] = kv.split(':'); if (SLOTS[k] && SLOTS[k].some(o => o.id === val)) state[side][k] = val; });
  }
  for (const side of ['da', 'db']) {
    const v = h.get(side); if (!v) continue;
    v.split(',').forEach(kv => { const [k, val] = kv.split(':'); if (DRIVE_SLOTS[k] && (val === 'stock' || DRIVE_SLOTS[k].some(o => o.id === val))) state[side][k] = val; });
  }
  if (h.get('s') && SCENES.some(s => s.id === h.get('s'))) state.scene = h.get('s');
  if (h.get('g')) state.g = Math.min(8, Math.max(1, +h.get('g') || 4));
  if (h.get('l')) state.l = Math.min(12000, Math.max(500, +h.get('l') || 3000));
}
function writeHash() {
  const enc = (c, order, def) => order.filter(k => c[k] !== def[k]).map(k => `${k}:${c[k]}`).join(',');
  const p = new URLSearchParams(); p.set('m', state.model);
  const ea = enc(state.a, SLOT_ORDER, DEFAULT_CHOICES), eb = enc(state.b, SLOT_ORDER, DEFAULT_CHOICES);
  if (ea) p.set('a', ea); if (eb) p.set('b', eb);
  const dA = enc(state.da, DRIVE_ORDER, DEFAULT_DRIVE_CHOICES), dB = enc(state.db, DRIVE_ORDER, DEFAULT_DRIVE_CHOICES);
  if (dA) p.set('da', dA); if (dB) p.set('db', dB);
  p.set('s', state.scene); if (state.scene === 'free') { p.set('g', state.g); p.set('l', state.l); }
  history.replaceState(null, '', '#' + p.toString());
  // エンジン画面へ戻るリンクにも m/a/b を持たせる
  const q = new URLSearchParams(); q.set('m', state.model); if (ea) q.set('a', ea); if (eb) q.set('b', eb);
  $('#toEngine').href = './#' + q.toString();
}

// ───── 選択肢 ─────
function renderModel() {
  const sel = $('#model'); sel.textContent = '';
  for (const m of MODELS) { const o = document.createElement('option'); o.value = m.id; o.textContent = m.label; sel.append(o); }
  sel.value = state.model;
  sel.addEventListener('change', () => { state.model = sel.value; renderSlots('a'); renderSlots('b'); renderEngines(); renderPacks(); update(); });
}
function stockText(k, base) {
  const o = DRIVE_SLOTS[k].find(x => x.id === base[k]); return o ? `純正のまま（${o.label.replace(/（.*$/, '')}）` : '純正のまま';
}
function renderSlots(side) {
  const box = $(`.slots[data-side="${side}"]`); box.textContent = '';
  const key = side === 'a' ? 'da' : 'db'; const base = buildVehicle(state.model, {}).base;
  for (const k of DRIVE_ORDER) {
    const lab = document.createElement('label'); lab.className = 'row'; lab.textContent = DRIVE_LABEL[k];
    const sel = document.createElement('select');
    const o0 = document.createElement('option'); o0.value = 'stock'; o0.textContent = stockText(k, base); sel.append(o0);
    for (const opt of DRIVE_SLOTS[k]) { const o = document.createElement('option'); o.value = opt.id; o.textContent = opt.label + (opt.assumed ? '　※' : ''); sel.append(o); }
    sel.value = state[key][k];
    sel.addEventListener('change', () => { state[key][k] = sel.value; update(); });
    lab.append(sel); box.append(lab);
  }
}
$('#copyAB').addEventListener('click', () => { state.db = { ...state.da }; renderSlots('b'); update(); });

function engineSummary(built) {
  const parts = SLOT_ORDER.filter(k => built.picks[k].id !== 'stock').map(k => built.picks[k].label.replace(/（.*$/, ''));
  return `${Math.round(built.cc)}cc・圧縮比 ${built.spec.engine.cr}` + (parts.length ? '・' + parts.join('・') : '・純正のまま');
}
// 舞台の札と結果の一文で使う短い名前＝パッケージに一致すればその名前、そうでなければ排気量
function packHit(side) {
  const cur = { ...DEFAULT_CHOICES, ...state[side] };
  return PACKAGES.find(pk => { const c = { ...DEFAULT_CHOICES, ...pk.choices }; return Object.keys(cur).every(k => cur[k] === c[k]); }) || null;
}
function engineName(side, built) {
  const pk = packHit(side); if (pk) return pk.name;
  const stock = SLOT_ORDER.every(k => built.picks[k].id === 'stock');
  return `${Math.round(built.cc)}cc` + (stock ? ' 純正' : '');
}
function renderEngines() {
  const A = buildSpec(state.model, state.a), B = buildSpec(state.model, state.b);
  for (const [id, built] of [['#engA', A], ['#engB', B]]) {
    const el = $(id); el.textContent = '';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = 'エンジン：';
    el.append(k, engineSummary(built), ' ');
    const a = document.createElement('a'); a.textContent = '変える →'; a.href = '#'; a.addEventListener('click', (ev) => { ev.preventDefault(); location.href = $('#toEngine').href; });
    el.append(a);
  }
  const m = modelById(state.model); $('#modelNote').textContent = m.note || '';
}
// 王道パッケージ（エンジンの画面と同じ6枚）＝「変えた後」を1タップで決める
function renderPacks() {
  const m = modelById(state.model); const box = $('#packs'); box.textContent = '';
  for (const pk of PACKAGES) {
    if (pk.families && !pk.families.includes(m.family)) continue;
    const b = document.createElement('button'); b.type = 'button'; b.dataset.id = pk.id;
    const dim = pk.needs126 && m.family === '500';
    if (dim) b.className = 'dim';
    const nm = document.createElement('b'); nm.textContent = pk.name;
    b.append(nm, pk.sub + (dim ? '（126 のケースが要る）' : ''));
    b.addEventListener('click', () => {
      state.b = { ...DEFAULT_CHOICES, ...pk.choices }; renderSlots('b'); renderEngines(); markPack(); update();
      gtag('event', 'drive_sim_package', { model: state.model, package: pk.id });
    });
    box.append(b);
  }
  markPack();
}
function markPack() {
  const hit = packHit('b');
  for (const b of $('#packs').querySelectorAll('button')) b.classList.toggle('on', !!hit && b.dataset.id === hit.id);
  $('#packWhy').textContent = hit ? hit.why : '';
}

// ───── 場面 ─────
function renderScenes() {
  const box = $('#scenes'); box.textContent = '';
  for (const sc of SCENES) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = (sc.region ? sc.region + '・' : '') + sc.short; b.dataset.id = sc.id;
    b.addEventListener('click', () => { state.scene = sc.id; markScene(); update(); });
    box.append(b);
  }
  $('#gRange').value = state.g; $('#lRange').value = state.l;
  const syncFree = () => { $('#gOut').value = state.g + ' %'; $('#lOut').value = (state.l / 1000).toFixed(1) + ' km'; };
  $('#gRange').addEventListener('input', () => { state.g = +$('#gRange').value; syncFree(); update(); });
  $('#lRange').addEventListener('input', () => { state.l = +$('#lRange').value; syncFree(); update(); });
  syncFree(); markScene();
}
function markScene() {
  for (const b of $('#scenes').querySelectorAll('button')) b.classList.toggle('on', b.dataset.id === state.scene);
  $('#free').hidden = !sceneById(state.scene).adjustable;
}
function currentScene() {
  const sc = sceneById(state.scene);
  return sc.adjustable ? { ...sc, gradePct: state.g, length_m: state.l } : sc;
}

// ───── 計算 ─────
let timer = null, last = null;
function update() {
  writeHash(); $('#result').classList.add('busy'); $('#status').textContent = '計算中…';
  clearTimeout(timer);
  timer = setTimeout(() => {
    const A = buildSpec(state.model, state.a), B = buildSpec(state.model, state.b);
    const resA = simulate(A.spec, RPM), resB = simulate(B.spec, RPM);
    const VA = buildVehicle(state.model, state.da), VB = buildVehicle(state.model, state.db);
    const sc = currentScene();
    const run = (res, V) => sc.kind === 'drag' ? accelerate(res, V.vehicle, V.drive, { distance_m: sc.distance_m }) : climbHill(res, V.vehicle, V.drive, sc);
    const rA = run(resA, VA), rB = run(resB, VB);
    last = { A, B, resA, resB, VA, VB, sc, rA, rB, nameA: engineName('a', A), nameB: engineName('b', B) };

  const s1 = document.createElement('span'); s1.innerHTML = `経過 <b>${fmtTime(t)}</b>`;
  const s2 = document.createElement('span'); s2.textContent = `▶ ${animScale.toFixed(0)} 倍速`;
  hud.append(s1, s2);
}

// ───── チャート（速度 vs 距離） ─────
let chartState = null;
function drawChart(root, L) {
  const { sc, rA, rB } = L;
  const cv = $('canvas', root), tip = $('.tip', root);
  const css = getComputedStyle(document.documentElement);
  const colA = css.getPropertyValue('--series-a').trim(), colB = css.getPropertyValue('--series-b').trim();
  const ink = css.getPropertyValue('--text-secondary').trim(), grid = css.getPropertyValue('--grid').trim();
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!W) return;   // 畳まれているときは描かない（開いたときに描く）
  cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const padL = 40, padR = 60, padT = 10, padB = 26;
  const len = sc.kind === 'drag' ? sc.distance_m : sceneLength(sc);
  const ymax = Math.max(40, ...rA.trace.map(p => p.kmh), ...rB.trace.map(p => p.kmh)) * 1.15;
  const X = (x) => padL + (x / len) * (W - padL - padR);
  const Y = (v) => padT + (1 - v / ymax) * (H - padT - padB);
  g.clearRect(0, 0, W, H);
  // 勾配の帯（背景）
  if (sc.profile) { let acc = 0; for (const seg of sc.profile) { g.fillStyle = `rgba(122,106,83,${0.04 + seg.gradePct / 100 * 1.2})`; g.fillRect(X(acc), padT, X(acc + seg.len_m) - X(acc), H - padT - padB); acc += seg.len_m; } }
  g.font = '11px system-ui, sans-serif'; g.fillStyle = ink; g.strokeStyle = grid; g.lineWidth = 1;
  const step = ymax > 90 ? 20 : 10;
  for (let v = 0; v <= ymax; v += step) { g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(W - padR, Y(v)); g.stroke(); g.textAlign = 'right'; g.fillText(v, padL - 6, Y(v) + 4); }
  g.textAlign = 'center'; const tick = len >= 8000 ? 2000 : len >= 3000 ? 1000 : 100;
  for (let x = 0; x <= len + 1; x += tick) g.fillText(x >= 1000 ? `${x / 1000}km` : `${x}m`, X(x), H - 8);
  // 制限速度の線は描かない（理論値＝常に全開・2026-09-18 ユーザー確定）
  const line = (tr, col, label) => {
    g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
    tr.forEach((p, i) => i ? g.lineTo(X(p.x_m), Y(p.kmh)) : g.moveTo(X(p.x_m), Y(p.kmh))); g.stroke();
    const lp = tr[tr.length - 1]; g.fillStyle = col; g.textAlign = 'left'; g.fillText(label, X(lp.x_m) + 6, Y(lp.kmh) + (label === 'いま' ? 14 : -6));
  };
  line(rA.trace, colA, 'いま'); line(rB.trace, colB, '変えた後');
  chartState = { W, H, X, Y, len, colA, colB };
  if (!root.dataset.bound) {
    root.dataset.bound = '1';
    const move = (ev) => {
      if (!chartState || !last) return;
      const rect = cv.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      const { W, H, X, Y, len, colA, colB } = chartState;
      const x = Math.max(0, Math.min(len, (px - padL) / (W - padL - padR) * len));
      drawChart(root, last);
      const g2 = cv.getContext('2d'); g2.strokeStyle = '#b9b1a2'; g2.lineWidth = 1; g2.setLineDash([3, 3]); g2.beginPath(); g2.moveTo(X(x), 8); g2.lineTo(X(x), H - 22); g2.stroke(); g2.setLineDash([]);
      tip.textContent = ''; const h = document.createElement('div'); h.textContent = x >= 1000 ? `${(x / 1000).toFixed(2)} km 地点` : `${x.toFixed(0)} m 地点`; tip.append(h);
      for (const [tr, col, lab] of [[last.rA.trace, colA, 'いま'], [last.rB.trace, colB, '変えた後']]) {
        const p = tr.reduce((m, q) => Math.abs(q.x_m - x) < Math.abs(m.x_m - x) ? q : m, tr[0]);
        g2.beginPath(); g2.arc(X(p.x_m), Y(p.kmh), 4.5, 0, Math.PI * 2); g2.fillStyle = col; g2.fill(); g2.lineWidth = 2; g2.strokeStyle = '#fffdf8'; g2.stroke();
        const r = document.createElement('div'); r.className = 'r'; const l = document.createElement('span'); const ii = document.createElement('i'); ii.style.borderColor = col; l.append(ii, lab);
        const b = document.createElement('b'); b.textContent = `${p.kmh.toFixed(0)} km/h・${p.gear}速`; r.append(l, b); tip.append(r);
      }
      tip.style.display = 'block'; const left = Math.min(Math.max(X(x) + 12, 4), W - tip.offsetWidth - 4); tip.style.left = left + 'px'; tip.style.top = '30px';
    };
    cv.addEventListener('pointermove', move); cv.addEventListener('pointerdown', move);
    cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; if (last) drawChart(root, last); });
  }
}
$('#dChart').addEventListener('toggle', () => { if ($('#dChart').open && last) drawChart($('#chartV'), last); });
function drawTable(L) {
  const { sc, rA, rB } = L; const box = $('#tableV'); box.textContent = '';
  const t = document.createElement('table'); const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>地点</th><th>いま km/h</th><th>ギア</th><th>変えた後 km/h</th><th>ギア</th></tr>'; t.append(thead);
  const tb = document.createElement('tbody'); const len = sc.kind === 'drag' ? sc.distance_m : sceneLength(sc); const stepM = len >= 8000 ? 1000 : len >= 3000 ? 500 : 50;
  for (let x = 0; x <= len; x += stepM) {
    const pa = rA.trace.reduce((m, q) => Math.abs(q.x_m - x) < Math.abs(m.x_m - x) ? q : m, rA.trace[0]), pb = rB.trace.reduce((m, q) => Math.abs(q.x_m - x) < Math.abs(m.x_m - x) ? q : m, rB.trace[0]);
    const tr = document.createElement('tr'); tr.innerHTML = `<td>${x >= 1000 ? (x / 1000).toFixed(1) + ' km' : x + ' m'}</td><td>${pa.kmh.toFixed(0)}</td><td>${pa.gear}</td><td>${pb.kmh.toFixed(0)}</td><td>${pb.gear}</td>`; tb.append(tr);
  }
  t.append(tb); box.append(t);
}
function drawGearTables(L) {
  const { resA, resB, VA, VB } = L;
  const box = $('#gearTable'); box.textContent = '';
  const gtA = gearTable(resA, VA.drive), gtB = gearTable(resB, VB.drive);
  const t = document.createElement('table');
  t.innerHTML = '<thead><tr><th>ギア</th><th>いま km/h／1000rpm</th><th>80km/h の回転</th><th>変えた後 km/h／1000rpm</th><th>80km/h の回転</th></tr></thead>';
  const tb = document.createElement('tbody');
  // ⚠️ 80km/h の回転は、そのギアで回り切れる範囲でだけ出す（1速の 16440rpm のような、実在しない数を出さない）
  const rpm80 = (res, drive, gearRatio) => { const n = rpmAtSpeed(80, gearRatio, drive); return n > redline(res) ? '—' : `${Math.round(n / 10) * 10}`; };
  gtA.forEach((ga, i) => { const gb = gtB[i]; const tr = document.createElement('tr'); tr.innerHTML = `<td>${ga.gear}速（${ga.ratio}）</td><td>${ga.kmhAt1000.toFixed(1)}</td><td>${rpm80(resA, VA.drive, VA.drive.gears[i])}</td><td>${gb.kmhAt1000.toFixed(1)}</td><td>${rpm80(resB, VB.drive, VB.drive.gears[i])}</td>`; tb.append(tr); });
  const ta = topSpeed(resA, VA.vehicle, VA.drive), tbp = topSpeed(resB, VB.vehicle, VB.drive);
  const tr = document.createElement('tr'); tr.innerHTML = `<td>平地の最高速</td><td colspan="2">${ta ? `${ta.kmh.toFixed(0)} km/h（${ta.gear}速・${ta.rpm.toFixed(0)}rpm）` : '—'}</td><td colspan="2">${tbp ? `${tbp.kmh.toFixed(0)} km/h（${tbp.gear}速・${tbp.rpm.toFixed(0)}rpm）` : '—'}</td>`; tb.append(tr);
  t.append(tb); box.append(t);
  const gb2 = $('#gradeTable'); gb2.textContent = '';
  const t2 = document.createElement('table'); t2.innerHTML = '<thead><tr><th>勾配</th><th>いま</th><th>変えた後</th></tr></thead>'; const tb2 = document.createElement('tbody');
  for (const gr of [2, 3, 4, 5, 6, 8]) {
    const sa = steadySpeed(resA, VA.vehicle, VA.drive, gr).best, sb = steadySpeed(resB, VB.vehicle, VB.drive, gr).best;
    const f = (s) => s ? `${s.kmh.toFixed(0)} km/h（${s.gear}速）` : '登れない';
    const r = document.createElement('tr'); r.innerHTML = `<td>${gr}%</td><td>${f(sa)}</td><td>${f(sb)}</td>`; tb2.append(r);
  }
  t2.append(tb2); gb2.append(t2);
}
function drawLimits(L) {
  const { sc } = L;
  const ul = $('#limits'); ul.textContent = '';
  const items = [
    `この場面＝${sc.name}。${sc.facts}` + (sc.src && sc.src !== '—' ? `　出典：${sc.src}` : ''),
    '理論値＝入口から出口まで常に全開で、制限速度は勘案しない（緩い区間では入口速度より伸びる）。運転者の上手さ・半クラッチ・渋滞は扱わない。ギアは回転 5000 で上げ、2500 を割るか力が足りなくなったら下げる。乗員は 1人（75kg）固定。',
    '走行抵抗の係数（空気抵抗 Cd 0.40・前面投影面積 1.7m²・転がり 0.018・伝達効率 0.87）は取説の「満載での最大登坂勾配」と最高速に合わせて 2026-09 に選んだ共通値。実車は 1〜2 割ずれる。',
    'エンジン側の誤差（±5%・改造の効きは控えめ）がそのまま乗る。エンジンの画面の「この道具の限界」も同じ。',
    '坂の勾配の分布は、一次資料で確認できた最急勾配と区間の標高差に合わせた近似。縦断図そのものではない。舞台の絵は勾配を 2 倍に誇張している。',
    '風・気温・標高（空気密度）・路面・タイヤの銘柄差は入れていない。エンジンの疲れ（圧縮抜け）も入れていない＝古い実車はこれより落ちる。',
  ];
  for (const s of items) { const li = document.createElement('li'); li.textContent = s; ul.append(li); }
  const as = [...new Set([...L.VA.assumed, ...L.VB.assumed, ...(L.A.assumed || []), ...(L.B.assumed || [])])];
  $('#assumed').textContent = as.length ? '※ 仮定で計算している所：' + as.join('／') : '';
}
window.addEventListener('resize', () => { if (last) { if ($('#dChart').open) drawChart($('#chartV'), last); drawStage(last, animT); } });

readHash(); renderModel(); renderScenes(); renderSlots('a'); renderSlots('b'); renderEngines(); renderPacks(); update();
