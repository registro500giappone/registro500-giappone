<style>

  --warn:#8a5a00; --warnbg:#fff4dc; --stop:#8f2a1f; --stopbg:#fdeae6; --info:#3f5a4a; --infobg:#eef2ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 72px}
.topbar{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

label.row{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub);margin:0 0 8px}
select,input[type=range]{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}

@media (max-width:640px){.cols{grid-template-columns:1fr}}

.eng{font-size:12px;color:var(--ink);background:#faf7f0;border:1px dashed var(--line);border-radius:9px;padding:7px 10px;margin:0 0 10px;line-height:1.5}
.eng .k{color:var(--sub)} .eng a{color:var(--deep);font-size:12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button,.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--deep);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.chips button:hover,.btn:hover{border-color:var(--deep)}
.chips button.on{border-color:var(--deep);background:var(--deep);color:#fff}

.facts{font-size:12px;color:var(--sub);margin:0 0 6px} .facts b{color:var(--ink)}
.free[hidden]{display:none}
.free{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px} .free label{font-size:12px;color:var(--sub)} .free output{color:var(--ink);font-weight:700;margin-left:6px}
.stage{position:relative;border:1px solid var(--line);background:linear-gradient(#f6f9fc,#fffdf8 70%);border-radius:12px;margin-top:12px;overflow:hidden}

.readout .r .v{font-size:20px;font-weight:700;color:var(--deep);line-height:1.2} .readout .r .v small{font-size:12px;font-weight:400;color:var(--sub)}

@media (max-width:420px){.hero,.readout{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.tile .cap{font-size:11px;color:var(--sub)} .tile .val{font-size:22px;font-weight:700;color:var(--deep);line-height:1.2;margin-top:2px} .tile .val small{font-size:12px;font-weight:400;color:var(--sub)} .tile .sub{font-size:12px;color:var(--sub);margin-top:2px}
.delta{font-weight:700} .delta.up{color:#1f6e3a} .delta.down{color:var(--stop)}
.chart{position:relative;border:1px solid var(--line);background:var(--surface-1);border-radius:12px;padding:10px 8px 6px;margin-top:12px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary)} .legend span{display:inline-flex;align-items:center;gap:6px}
.chart canvas{display:block;width:100%;height:230px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--text-secondary);box-shadow:0 4px 14px #00000014;display:none;min-width:150px}
.tip b{color:var(--text-primary);font-size:13px} .tip .r{display:flex;justify-content:space-between;gap:10px;align-items:center} .tip .r i{display:inline-block;width:14px;border-top:2px solid;margin-right:6px}
details{margin-top:8px;font-size:12px;color:var(--sub)} summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px} th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right} th:first-child,td:first-child{text-align:left}
.story{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-top:10px}
.story p{margin:6px 0;font-size:14px} .story p:first-child{margin-top:0}
.story .a{color:var(--series-a);font-weight:700} .story .b{color:var(--series-b);font-weight:700}
.warns{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.warns li{border-radius:10px;padding:8px 12px;font-size:13px;border:1px solid}
.warns li.info{background:var(--infobg);border-color:#cfdad2;color:var(--info)}
.limits{font-size:13px;color:var(--ink);padding-left:1.2em;margin:6px 0 0} .limits li{margin:4px 0}
.note{font-size:12px;color:var(--sub);margin:10px 0 0}
.busy{opacity:.55;transition:opacity .15s}
</style>

<body>
<div class="wrap">
  <div class="topbar"><a id="toEngine" href="./">← エンジンの画面へ</a><a href="/">トップへ戻る</a></div>
  <h1>坂と加速の妄想</h1>
  <p class="lead">エンジンの画面で選んだ<b>「いま」と「変えた後」</b>のエンジンを同じ車に載せ、ミッション・ファイナル・タイヤ・乗員まで決めて、談合坂やΩカーブの上りを並走させます。<b>差を見る道具</b>です。絶対値の誤差は1〜2割あります（下の「この道具の限界」）。</p>

  <label class="row">土台になる型式<select id="model"></select></label>
  <p class="note" id="modelNote"></p>

  <div class="cols">
    <section class="panel">
      <h3><span class="key a"></span>いま</h3>
      <div class="eng" id="engA"></div>
      <div class="slots" data-side="a"></div>
    </section>
    <section class="panel">
      <h3><span class="key b"></span>変えてみる</h3>
      <div class="eng" id="engB"></div>
      <div class="chips"><button type="button" id="copyAB">「いま」と同じ駆動系にする</button></div>
      <div class="slots" data-side="b"></div>
    </section>
  </div>

  <h2>場面</h2>
  <div class="chips scenes" id="scenes"></div>
  <p class="facts" id="sceneFacts"></p>
  <div class="free" id="free" hidden>
    <label>勾配<output id="gOut"></output><input type="range" id="gRange" min="1" max="8" step="0.5"></label>
    <label>長さ<output id="lOut"></output><input type="range" id="lRange" min="500" max="12000" step="500"></label>
  </div>

  <div id="result" class="busy">
    <div class="stage" id="stage">
      <canvas id="stageCv"></canvas>
      <div class="hud" id="hud"></div>
      <div class="ctl"><button type="button" class="btn" id="replay">もう一度</button></div>
    </div>
    <div class="readout">
      <div class="r a" id="roA"></div>
      <div class="r b" id="roB"></div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="story" id="story"></div>

    <div class="chart" id="chartV">
      <div class="title"><span id="chartTitle">速度の変化（横軸＝距離）</span><span class="legend"><span><i class="key a"></i>いま</span><span><i class="key b"></i>変えた後</span></span></div>
      <canvas></canvas><div class="tip"></div>
    </div>
    <details><summary>数値の表</summary><div id="tableV"></div></details>

    <h2>ギアと回転</h2>
    <div id="gearTable"></div>
    <details><summary>勾配ごとに維持できる速度（4速に限らず、いちばん速く登れるギアで）</summary><div id="gradeTable"></div></details>

    <h2>この道具の限界</h2>
    <ul class="limits" id="limits"></ul>
    <p class="note" id="assumed"></p>
  </div>
  <p class="note" id="status"></p>
</div>

<script type="module">
import { simulate } from './sim.js';
import { MODELS, SLOTS, DEFAULT_CHOICES, buildSpec, modelById } from './presets.js';
import { GEARBOXES, FINALS, TIRES, LOADS, DEFAULT_DRIVE_CHOICES, buildVehicle } from './presets_vehicle.js';
import { climbHill, accelerate, steadySpeed, topSpeed, gearTable, rpmAtSpeed, speedKmh, sceneLength, gradeAt } from './vehicle.js';
import { SCENES, sceneById } from './scenes.js';

const $ = (s, r = document) => r.querySelector(s);
const RPM = [1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500];
const SLOT_ORDER = ['disp', 'cr', 'cam', 'head', 'carb', 'exh'];
const DRIVE_SLOTS = { gearbox: GEARBOXES, final: FINALS, tire: TIRES, load: LOADS };
const DRIVE_LABEL = { gearbox: 'ミッション（変速比）', final: 'ファイナル（最終減速比）', tire: 'タイヤ', load: '乗員・荷物' };
const DRIVE_ORDER = ['gearbox', 'final', 'tire', 'load'];
const state = { model: '500F', a: { ...DEFAULT_CHOICES }, b: { ...DEFAULT_CHOICES }, da: { ...DEFAULT_DRIVE_CHOICES }, db: { ...DEFAULT_DRIVE_CHOICES }, scene: 'dangozaka', g: 4, l: 3000 };

// ───── URL ハッシュ（エンジン画面と同じ m/a/b に da/db/s/g/l を足す） ─────
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('m') && modelById(h.get('m')).id === h.get('m')) state.model = h.get('m');
  for (const side of ['a', 'b']) {
    const v = h.get(side); if (!v) continue;
    v.split(',').forEach(kv => { const [k, val] = kv.split(':'); if (SLOTS[k] && SLOTS[k].some(o => o.id === val)) state[side][k] = val; });
  }
  for (const side of ['da', 'db']) {
    const v = h.get(side); if (!v) continue;
    v.split(',').forEach(kv => { const [k, val] = kv.split(':'); if (DRIVE_SLOTS[k] && (val === 'stock' || DRIVE_SLOTS[k].some(o => o.id === val))) state[side][k] = val; });
  }
  if (h.get('s') && SCENES.some(s => s.id === h.get('s'))) state.scene = h.get('s');
  if (h.get('g')) state.g = Math.min(8, Math.max(1, +h.get('g') || 4));
  if (h.get('l')) state.l = Math.min(12000, Math.max(500, +h.get('l') || 3000));
}
function writeHash() {
  const enc = (c, order, def) => order.filter(k => c[k] !== def[k]).map(k => `${k}:${c[k]}`).join(',');
  const p = new URLSearchParams(); p.set('m', state.model);
  const ea = enc(state.a, SLOT_ORDER, DEFAULT_CHOICES), eb = enc(state.b, SLOT_ORDER, DEFAULT_CHOICES);
  if (ea) p.set('a', ea); if (eb) p.set('b', eb);
  const dA = enc(state.da, DRIVE_ORDER, DEFAULT_DRIVE_CHOICES), dB = enc(state.db, DRIVE_ORDER, DEFAULT_DRIVE_CHOICES);
  if (dA) p.set('da', dA); if (dB) p.set('db', dB);
  p.set('s', state.scene); if (state.scene === 'free') { p.set('g', state.g); p.set('l', state.l); }
  history.replaceState(null, '', '#' + p.toString());
  // エンジン画面へ戻るリンクにも m/a/b を持たせる
  const q = new URLSearchParams(); q.set('m', state.model); if (ea) q.set('a', ea); if (eb) q.set('b', eb);
  $('#toEngine').href = './#' + q.toString();
}

// ───── 選択肢 ─────
function renderModel() {
  const sel = $('#model'); sel.textContent = '';
  for (const m of MODELS) { const o = document.createElement('option'); o.value = m.id; o.textContent = m.label; sel.append(o); }
  sel.value = state.model;
  sel.addEventListener('change', () => { state.model = sel.value; renderSlots('a'); renderSlots('b'); renderEngines(); update(); });
}
function stockText(k, base) {
  const list = DRIVE_SLOTS[k];
  if (k === 'load') return null;
  const o = list.find(x => x.id === base[k]); return o ? `純正のまま（${o.label.replace(/（.*$/, '')}）` : '純正のまま';
}
function renderSlots(side) {
  const box = $(`.slots[data-side="${side}"]`); box.textContent = '';
  const key = side === 'a' ? 'da' : 'db'; const base = buildVehicle(state.model, {}).base;
  for (const k of DRIVE_ORDER) {
    const lab = document.createElement('label'); lab.className = 'row'; lab.textContent = DRIVE_LABEL[k];
    const sel = document.createElement('select');
    if (k !== 'load') { const o = document.createElement('option'); o.value = 'stock'; o.textContent = stockText(k, base); sel.append(o); }
    for (const opt of DRIVE_SLOTS[k]) { const o = document.createElement('option'); o.value = opt.id; o.textContent = opt.label + (opt.assumed ? '　※' : ''); sel.append(o); }
    sel.value = state[key][k];
    sel.addEventListener('change', () => { state[key][k] = sel.value; update(); });
    lab.append(sel); box.append(lab);
  }
}
$('#copyAB').addEventListener('click', () => { state.db = { ...state.da }; renderSlots('b'); update(); });

function engineSummary(built) {
  const parts = SLOT_ORDER.filter(k => built.picks[k].id !== 'stock').map(k => built.picks[k].label.replace(/（.*$/, ''));
  return `${Math.round(built.cc)}cc・圧縮比 ${built.spec.engine.cr}` + (parts.length ? '・' + parts.join('・') : '・純正のまま');
}
function renderEngines() {
  const A = buildSpec(state.model, state.a), B = buildSpec(state.model, state.b);
  for (const [id, built, side] of [['#engA', A, 'a'], ['#engB', B, 'b']]) {
    const el = $(id); el.textContent = '';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = 'エンジン：';
    el.append(k, engineSummary(built), ' ');
    const a = document.createElement('a'); a.textContent = '変える →'; a.href = '#'; a.addEventListener('click', (ev) => { ev.preventDefault(); location.href = $('#toEngine').href; });
    el.append(a);
  }
  const m = modelById(state.model); $('#modelNote').textContent = m.note || '';
}

// ───── 場面 ─────
function renderScenes() {
  const box = $('#scenes'); box.textContent = '';
  for (const sc of SCENES) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = (sc.region ? sc.region + '・' : '') + sc.short; b.dataset.id = sc.id;
    b.addEventListener('click', () => { state.scene = sc.id; markScene(); update(); });
    box.append(b);
  }
  $('#gRange').value = state.g; $('#lRange').value = state.l;
  const syncFree = () => { $('#gOut').value = state.g + ' %'; $('#lOut').value = (state.l / 1000).toFixed(1) + ' km'; };
  $('#gRange').addEventListener('input', () => { state.g = +$('#gRange').value; syncFree(); update(); });
  $('#lRange').addEventListener('input', () => { state.l = +$('#lRange').value; syncFree(); update(); });
  syncFree(); markScene();
}
function markScene() {
  for (const b of $('#scenes').querySelectorAll('button')) b.classList.toggle('on', b.dataset.id === state.scene);
  const sc = sceneById(state.scene);
  const f = $('#sceneFacts'); f.textContent = ''; const nm = document.createElement('b'); nm.textContent = sc.name + '　'; f.append(nm, sc.facts + (sc.src && sc.src !== '—' ? `　出典：${sc.src}` : ''));
  $('#free').hidden = !sc.adjustable;
}
function currentScene() {
  const sc = sceneById(state.scene);
  return sc.adjustable ? { ...sc, gradePct: state.g, length_m: state.l } : sc;
}

// ───── 計算 ─────
let timer = null, last = null;
function update() {
  writeHash(); $('#result').classList.add('busy'); $('#status').textContent = '計算中…';
  clearTimeout(timer);
  timer = setTimeout(() => {
    const A = buildSpec(state.model, state.a), B = buildSpec(state.model, state.b);
    const resA = simulate(A.spec, RPM), resB = simulate(B.spec, RPM);
    const VA = buildVehicle(state.model, state.da), VB = buildVehicle(state.model, state.db);
    const sc = currentScene();
    const run = (res, V) => sc.kind === 'drag' ? accelerate(res, V.vehicle, V.drive, { distance_m: sc.distance_m }) : climbHill(res, V.vehicle, V.drive, sc);
    const rA = run(resA, VA), rB = run(resB, VB);
    last = { A, B, resA, resB, VA, VB, sc, rA, rB };
    render(last); $('#result').classList.remove('busy'); $('#status').textContent = '';
    gtag('event', 'drive_sim_update', { model: state.model, scene: state.scene });
  }, 30);
}

// ───── 描画 ─────
const fmtDelta = (b, a, unit = '', d = 0, lowerIsBetter = false) => { const p = b - a; const good = lowerIsBetter ? p <= -0.5 : p >= 0.5, bad = lowerIsBetter ? p >= 0.5 : p <= -0.5; const el = document.createElement('span'); el.className = 'delta ' + (good ? 'up' : bad ? 'down' : ''); el.textContent = (p > 0 ? '+' : '') + p.toFixed(d) + unit; return el; };
function tile(cap, valText, sub, delta) {
  const t = document.createElement('div'); t.className = 'tile';
  const c = document.createElement('div'); c.className = 'cap'; c.textContent = cap;
  const v = document.createElement('div'); v.className = 'val'; v.textContent = valText; if (delta) { v.append(' '); v.append(delta); }
  const s = document.createElement('div'); s.className = 'sub'; s.textContent = sub;
  t.append(c, v, s); return t;
}
function render(L) {
  const { sc, rA, rB, VA, VB, resA, resB } = L;
  const hero = $('#hero'); hero.textContent = '';
  const story = $('#story'); story.textContent = '';
  if (sc.kind === 'drag') {
    hero.append(tile('0-400m のタイム', `${rA.time_s.toFixed(1)} → ${rB.time_s.toFixed(1)} 秒`, 'いま → 変えた後', fmtDelta(rB.time_s, rA.time_s, ' 秒', 1, true)));
    hero.append(tile('400m 通過時の速度', `${rA.finalKmh.toFixed(0)} → ${rB.finalKmh.toFixed(0)} km/h`, `0-60km/h ${rA.marks[60]?.toFixed(1) ?? '—'} → ${rB.marks[60]?.toFixed(1) ?? '—'} 秒`, fmtDelta(rB.finalKmh, rA.finalKmh, ' km/h')));
    const gap = posAt(rA.trace, rB.time_s); // B がゴールした瞬間の A の位置
    const p1 = document.createElement('p');
    p1.innerHTML = `<span class="b">変えた後</span>が 400m を通過した瞬間、<span class="a">いま</span>は ${Math.max(0, 400 - gap).toFixed(0)} m 後ろ${rB.time_s < rA.time_s ? '' : '（＝先行）'}。`;
    const p2 = document.createElement('p'); p2.textContent = `0-60km/h は ${rA.marks[60]?.toFixed(1) ?? '—'} 秒 → ${rB.marks[60]?.toFixed(1) ?? '—'} 秒。ゴールのギアは ${rA.gear}速 → ${rB.gear}速。`;
    story.append(p1, p2);

    '坂の勾配の分布は、一次資料で確認できた最急勾配と区間の標高差に合わせた近似。縦断図そのものではない。',
    '風・気温・標高（空気密度）・路面・タイヤの銘柄差は入れていない。エンジンの疲れ（圧縮抜け）も入れていない＝古い実車はこれより落ちる。',
  ];
  for (const s of items) { const li = document.createElement('li'); li.textContent = s; ul.append(li); }
  const as = [...new Set([...L.VA.assumed, ...L.VB.assumed, ...(L.A.assumed || []), ...(L.B.assumed || [])])];
  $('#assumed').textContent = as.length ? '※ 仮定で計算している所：' + as.join('／') : '';
}
window.addEventListener('resize', () => { if (last) { drawChart($('#chartV'), last); drawStage(last, animT); } });

// ───── 起動 ─────
readHash(); renderModel(); renderScenes(); renderSlots('a'); renderSlots('b'); renderEngines(); update();
</script>
