<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS動画ダウンロード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .instructions {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
      text-align: left;
      background: #f5f5f7;
      padding: 14px 16px;
      border-radius: 8px;
    }
    .video-item {
      margin-bottom: 28px;
    }
    .video-item:last-child {
      margin-bottom: 0;
    }
    .video-title {
      color: #333;
      font-size: 15px;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: left;
    }
    video {
      width: 100%;
      max-width: 280px;
      border-radius: 10px;
      background: #000;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 SNS用動画</h1>
    <div class="instructions">
      動画を<strong>長押し</strong>して「ビデオを保存」を選ぶと、カメラロール（写真）に保存されます。
    </div>

    <div class="video-item">
      <div class="video-title">エンジン編リール</div>
      <video controls playsinline preload="metadata" src="reel-engine-9x16.mp4"></video>
    </div>

    <div class="video-item">
      <div class="video-title">駆動系編リール</div>
      <video controls playsinline preload="metadata" src="reel-gearbox-9x16.mp4"></video>
    </div>
  </div>
</body>
</html>
