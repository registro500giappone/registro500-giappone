<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SNS動画ダウンロード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .instructions {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
      text-align: left;
      background: #f5f5f7;
      padding: 14px 16px;
      border-radius: 8px;
    }
    .video-item {
      margin-bottom: 28px;
    }
    .video-item:last-child {
      margin-bottom: 0;
    }
    .video-title {
      color: #333;
      font-size: 15px;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: left;
    }
    video {
      width: 100%;
      max-width: 280px;
      border-radius: 10px;
      background: #000;
      display: block;
      margin: 0 auto 14px;
    }
    button {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      font-family: inherit;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.6;
    }
    .status {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 SNS用動画</h1>
    <div class="instructions">
      「共有して保存」を押すと共有シートが開きます。<strong>「ビデオを保存」</strong>を選ぶとカメラロールに保存されます。
    </div>

    <div class="video-item">
      <div class="video-title">エンジン編リール</div>
      <video controls playsinline preload="metadata" src="reel-engine-9x16.mp4"></video>
      <button onclick="shareVideo('reel-engine-9x16.mp4', this)">共有して保存</button>
      <div class="status" id="status-0"></div>
    </div>

    <div class="video-item">
      <div class="video-title">駆動系編リール</div>
      <video controls playsinline preload="metadata" src="reel-gearbox-9x16.mp4"></video>
      <button onclick="shareVideo('reel-gearbox-9x16.mp4', this)">共有して保存</button>
      <div class="status" id="status-1"></div>
    </div>
  </div>

  <script>
    const files = {};
    document.querySelectorAll('button').forEach(btn => {
      const url = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
      const statusEl = btn.nextElementSibling;
      btn.disabled = true;
      statusEl.textContent = '準備中...';
      fetch(url).then(r => r.blob()).then(blob => {
        files[url] = new File([blob], url, { type: 'video/mp4' });
        btn.disabled = false;
        statusEl.textContent = '';
      }).catch(err => { statusEl.textContent = '読み込み失敗: ' + err.message; });
    });

    function shareVideo(url, btn) {
      const statusEl = btn.nextElementSibling;
      const file = files[url];
      if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {
        statusEl.textContent = 'このブラウザは共有に未対応です。Safariで開いてください。';
        return;
      }
      navigator.share({ files: [file] }).catch(err => {
        if (err.name !== 'AbortError') statusEl.textContent = 'エラー: ' + err.message;
      });
    }
  </script>
</body>
</html>
