<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-27SHHC4JYH');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>車両詳細 - Registro500 Giappone</title>
  
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Firebase & Supabase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>  

  <style>
    html { font-size: 16px !important; }
    @media (min-width: 1025px) { html { font-size: 18px !important; } }
    :root {
      --rg-surface: #ffffff; --rg-surface-sub: #f8fafc; --rg-bg: #f4f6f8;
      --rg-border: #e5e7eb; --rg-text: #111827; --rg-muted: #6b7280;
      --rg-accent: #2856a8; --rg-accent-soft: #e6efff; --rg-accent-border: #c2d4ff;
      --rg-radius-card: 1rem;
    }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; line-height: 1.7; color: var(--rg-text); background: var(--rg-bg); padding-bottom: 96px; padding-top: 70px; }
    @media (min-width: 1025px) { body { padding-top: 90px; } }

    .rg-header-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(244, 246, 248, 0.9); backdrop-filter: blur(8px); box-shadow: 0 1px 5px rgba(0,0,0,0.05); height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; }
    .rg-back-link a { text-decoration: none; color: var(--rg-accent); font-weight: 600; font-size: 0.95rem; }
    .rg-header-logo img { height: 32px; width: auto; mix-blend-mode: multiply; display: block; }
    .rg-card { background: var(--rg-surface); border-radius: var(--rg-radius-card); border: 1px solid var(--rg-border); padding: 1.2rem; }
    .rg-photo-square { position: relative; width: 100%; padding-top: 100%; border-radius: 0.9rem; overflow: hidden; background: var(--rg-surface-sub); border: 1px solid var(--rg-border); }
    .rg-photo-square > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .rg-photo-title-main { margin-top: 1rem; font-size: 1.4rem; font-weight: 800; line-height: 1.3; }
    .rg-photo-year { font-size: 0.8em; color: var(--rg-muted); }
    .rg-photo-owner-row { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .rg-photo-pref { margin-left: auto; padding: 0.15rem 0.8rem; border-radius: 999px; background: var(--rg-accent-soft); border: 1px solid var(--rg-accent-border); color: var(--rg-accent); font-size: 0.85rem; }
    .rg-section-title { display: block; margin: 0 0 1rem; font-weight: 700; font-size: 1.15rem; padding: 0.5rem 1rem; background: #eff6ff; border-left: 6px solid var(--rg-accent); color: var(--rg-accent); border-radius: 4px; }
    .rg-spec-grid { display: grid; grid-template-columns: 8.2rem 1fr; border-top: 1px solid var(--rg-border); }
    .rg-spec-grid dt, .rg-spec-grid dd { padding: 0.6rem 0.4rem; border-bottom: 1px solid var(--rg-border); margin: 0; }
    .rg-spec-grid dt { font-weight: 700; color: var(--rg-muted); background: rgba(148,163,184,0.05); font-size: 0.9rem; }
    .rg-gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.8rem; }
    .rg-gallery-thumb { border-radius: 0.6rem; overflow: hidden; position: relative; padding-top: 100%; }
    .rg-gallery-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .rg-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .rg-modal.is-open { display: flex; }
    .rg-modal-inner { max-width: 95vw; max-height: 95vh; position: relative; }
    .btn-contact { background-color: var(--rg-accent); color: white; width: 100%; border-radius: 8px; font-weight: bold; padding: 12px; border:none; margin-top:10px; }
    
    /* マイメニューの調整 */
    .dropdown-menu { border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--rg-border); }
    .dropdown-item { font-size: 0.9rem; padding: 0.7rem 1.2rem; }
  </style>
</head>

<body>
   
   <header class="rg-header-bar">
     <div class="rg-back-link"><a href="index.html">← タイムライン</a></div>
     <div class="rg-header-logo"><img src="logo_horizontal.png" alt="Registro500"></div>
     <div class="rg-header-right" id="ownerMenuArea" style="display:none;">
        <div class="dropdown">
          <button class="btn btn-outline-primary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            マイメニュー
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item fw-bold" href="#" id="editThisCarLink">✏️ この車両を編集</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="edit.html?mode=new">➕ 2台目を登録する</a></li>
            <li><a class="dropdown-item text-muted" href="edit.html">🏠 マイガレージへ</a></li>
          </ul>
        </div>
     </div>
   </header>

   <main class="container-lg py-3">
   <div id="loading" class="text-center py-5">データを読み込んでいます...</div>

   <div id="content" style="display:none;">
      <div class="row g-4">
        
        <!-- 左：写真 -->
        <div class="col-12 col-lg-5">
          <section class="rg-card mb-3 text-center">
            <div class="rg-photo-square">
              <img id="photoMain" src="" data-rg-zoomable onerror="this.src=NO_IMAGE_URL">
            </div>
            <div class="rg-photo-title-main">
              <span id="year" class="rg-photo-year"></span>
              <span id="modelMain" class="rg-photo-model-main"></span>
            </div>
            <div class="rg-photo-owner-row">
              <span id="handleName" class="rg-photo-handle"></span>
              <span id="prefecture" class="rg-photo-pref"></span>
            </div>
          </section>

          <section class="rg-card" id="gallerySection" style="display:none;">
            <div class="rg-gallery-grid" id="galleryGrid"></div>
          </section>
        </div>

        <!-- 右：詳細スペック -->
        <div class="col-12 col-lg-7">
          <section class="rg-card mb-3">
            <h2 class="rg-section-title">ボディスペック</h2>
            <dl class="rg-spec-grid js-auto-hide">
              <dt>ボディカラー</dt><dd id="val_body_color"></dd>
              <dt>全長 (cm)</dt><dd id="val_length_cm"></dd>
              <dt>乗車定員</dt><dd id="val_capacity"></dd>
              <dt>ハンドル</dt><dd id="val_steering"></dd>
            </dl>
          </section>

          <section class="rg-card mb-3">
            <h2 class="rg-section-title">エンジン関係</h2>
            <dl class="rg-spec-grid js-auto-hide">
              <dt>排気量 (cc)</dt><dd id="val_engine_cc"></dd>
              <dt>形式</dt><dd id="val_engine_display"></dd>
              <dt>点火形式</dt><dd id="val_ignition_type"></dd>
              <dt>燃料供給</dt><dd id="val_fuel_injection"></dd>
              <dt>発電機</dt><dd id="val_generator"></dd>
            </dl>
          </section>

          <section class="rg-card mb-3" id="highlightsSection" style="display:none;">
            <h2 class="rg-section-title">こだわりポイント</h2>
            <p id="val_highlights" style="white-space: pre-wrap;"></p>
          </section>

          <section class="rg-card mb-3" id="snsSection" style="display:none;">
            <h2 class="rg-section-title">SNS</h2>
            <dl class="rg-spec-grid" id="snsGrid"></dl>
          </section>

          <section class="rg-card mb-3">
            <h2 class="rg-section-title">共有・連絡</h2>
            <div class="d-flex gap-2 mb-2">
              <button class="btn btn-dark flex-grow-1" onclick="showQRCode()">QR表示</button>
              <a id="shareX" class="btn btn-black text-white flex-grow-1" style="background:#000;" target="_blank">Xシェア</a>
            </div>
            <div id="contactArea" style="display:none;">
               <button class="btn-contact" onclick="openContactForm()">オーナーへ問い合わせ</button>
            </div>
          </section>
        </div>
      </div>
   </div>
   </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const docId = params.get('doc');
    let currentCar = null;

    if (firebase.apps.length === 0) firebase.initializeApp(FIREBASE_CONFIG);

    async function fetchDetail() {
      if (!docId) return;
      const { data, error } = await supabaseClient
        .from('cars')
        .select('*')
        .eq('document_id', docId)
        .single();

      if (data) {
        currentCar = data;
        renderDetail(data);
        checkOwnership(data);
      } else {
        document.getElementById('loading').textContent = "車両が見つかりません";
      }
    }

    function renderDetail(car) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      // 基本
      document.getElementById('year').textContent = car.year ? car.year + '年' : '';
      document.getElementById('modelMain').textContent = (car.model_display_c || 'FIAT 500').replace(/\(\d{4}\)/, '');
      document.getElementById('handleName').textContent = car.handle_name;
      document.getElementById('prefecture').textContent = car.prefecture;
      document.getElementById('photoMain').src = car.photo_main || NO_IMAGE_URL;

      // スペック（snake_caseに対応）
      const fields = ['body_color', 'length_cm', 'capacity', 'steering', 'engine_cc', 'engine_display', 'ignition_type', 'fuel_injection', 'generator'];
      fields.forEach(f => {
        const el = document.getElementById('val_' + f);
        if (el) el.textContent = car[f] || '';
      });

      // 空欄隠し
      document.querySelectorAll('.js-auto-hide').forEach(dl => {
        const dts = dl.querySelectorAll('dt'), dds = dl.querySelectorAll('dd');
        dts.forEach((dt, i) => { if (!dds[i].textContent.trim()) { dt.style.display = 'none'; dds[i].style.display = 'none'; } });
      });

      if (car.highlights) {
        document.getElementById('highlightsSection').style.display = 'block';
        document.getElementById('val_highlights').textContent = car.highlights;
      }

      // ギャラリー
      const gallery = document.getElementById('galleryGrid');
      ['photo_front', 'photo_side', 'photo_rear', 'photo_engine', 'photo_interior'].forEach(k => {
        if (car[k]) {
          const div = document.createElement('div');
          div.className = 'rg-gallery-thumb';
          div.innerHTML = `<img src="${car[k]}" data-rg-zoomable onerror="this.src=NO_IMAGE_URL">`;
          gallery.appendChild(div);
          document.getElementById('gallerySection').style.display = 'block';
        }
      });

      // SNS
      const snsGrid = document.getElementById('snsGrid');
      const snsList = [{k:'x_twitter', l:'X', b:'https://x.com/'}, {k:'instagram', l:'Instagram', b:'https://instagram.com/'}];
      snsList.forEach(s => {
        if (car[s.k]) {
          const val = car[s.k].replace('@','');
          snsGrid.innerHTML += `<dt>${s.l}</dt><dd><a href="${s.b}${val}" target="_blank">${val}</a></dd>`;
          document.getElementById('snsSection').style.display = 'block';
        }
      });

      // Xシェア
      const shareTxt = `Registro500: ${car.year || ''} ${car.model_display_c} (${car.handle_name}さん)`;
      document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareTxt)}&url=${encodeURIComponent(location.href)}`;
    }

    function checkOwnership(car) {
      firebase.auth().onAuthStateChanged(user => {
        if (user && user.email.toLowerCase() === car.owner_email.toLowerCase()) {
          document.getElementById('ownerMenuArea').style.display = 'block';
          document.getElementById('editThisCarLink').href = `edit.html?doc=${car.document_id}`;
        } else if (user && car.accept_inquiry !== false) {
          document.getElementById('contactArea').style.display = 'block';
        }
      });
    }

    function showQRCode() {
      const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(location.href)}`;
      openModal(`<div class="bg-white p-4 rounded text-center"><img src="${url}"><p class="mt-2 small">このページをスマホで開く</p></div>`);
    }

    function openModal(html) {
      const modal = document.createElement('div');
      modal.className = 'rg-modal is-open';
      modal.innerHTML = `<div class="rg-modal-inner"><button class="btn-close btn-close-white position-absolute top-0 end-0 m-2" onclick="this.parentElement.parentElement.remove()"></button>${html}</div>`;
      document.body.appendChild(modal);
      modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
    }

    function openContactForm() {
       alert("問い合わせ機能は準備中です"); // 必要に応じて実装
    }

    fetchDetail();
  </script>
</body>
</html>
