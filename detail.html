<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-27SHHC4JYH');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>車両詳細 - Registro500 Giappone</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>  
  <style>
    /* 既存のCSSスタイル（完全に保持） */
    html { font-size: 16px !important; }
    @media (min-width: 1025px) { html { font-size: 18px !important; } }
    :root { --rg-surface: #ffffff; --rg-surface-sub: #f8fafc; --rg-bg: #f4f6f8; --rg-border: #e5e7eb; --rg-text: #111827; --rg-muted: #6b7280; --rg-accent: #2856a8; --rg-accent-soft: #e6efff; --rg-accent-border: #c2d4ff; --rg-radius-card: 1rem; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; line-height: 1.7; color: var(--rg-text); background: var(--rg-bg); padding-bottom: 96px; padding-top: 70px; }
    .rg-header-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(244, 246, 248, 0.9); backdrop-filter: blur(8px); box-shadow: 0 1px 5px rgba(0,0,0,0.05); height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; }
    .rg-back-link a { text-decoration: none; color: var(--rg-accent); font-weight: 600; font-size: 0.95rem; }
    .rg-header-logo img { height: 32px; width: auto; mix-blend-mode: multiply; display: block; }
    .rg-card { background: var(--rg-surface); border-radius: var(--rg-radius-card); border: 1px solid var(--rg-border); padding: 1.2rem; }
    .rg-photo-square { position: relative; width: 100%; padding-top: 100%; border-radius: 0.9rem; border: 1px solid var(--rg-border); overflow: hidden; background: var(--rg-surface-sub); }
    .rg-photo-square > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .rg-section-title { display: block; margin: 0 0 1rem; font-weight: 700; font-size: 1.15rem; padding: 0.5rem 1rem; background: #eff6ff; border-left: 6px solid var(--rg-accent); color: var(--rg-accent); border-radius: 4px; }
    .rg-spec-grid { display: grid; grid-template-columns: 8.2rem 1fr; column-gap: 0.5rem; border-top: 1px solid var(--rg-border); border-bottom: 1px solid var(--rg-border); }
    .rg-spec-grid dt, .rg-spec-grid dd { padding: 0.6rem 0.4rem; border-top: 1px solid var(--rg-border); margin: 0; font-size: 0.95rem; }
    .rg-spec-grid dt { font-weight: 700; color: var(--rg-muted); background: rgba(148, 163, 184, 0.05); white-space: nowrap; }
    .rg-gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.8rem; }
    .rg-gallery-thumb { border-radius: 0.6rem; overflow: hidden; position: relative; padding-top: 100%; }
    .rg-gallery-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .rg-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .rg-modal.is-open { display: flex; }
    .btn-contact { background-color: var(--rg-accent); color: white; width: 100%; border-radius: 8px; font-weight: bold; padding: 12px; border:none; margin-top:10px; cursor: pointer; }
    .inquiry-input, .inquiry-textarea { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
   <header class="rg-header-bar">
     <div class="rg-back-link"><a href="index.html">← ガレージに戻る</a></div>
     <div class="rg-header-logo"><img src="logo_horizontal.png" alt="Registro500"></div>
     <!-- 右端：マイメニュー -->
     <div class="rg-header-right" id="ownerMenuArea" style="display:none;">
        <div class="dropdown">
          <button class="btn btn-outline-primary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">マイメニュー</button>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><a class="dropdown-item fw-bold" href="#" id="editLink">✏️ この車両を編集</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="edit.html?mode=new">➕ 2台目を登録する</a></li>
            <li><a class="dropdown-item text-muted" href="edit.html">🏠 管理車両一覧へ</a></li>
          </ul>
        </div>
     </div>
   </header>

   <main class="container-lg py-3">
     <div id="loading" class="text-center py-5">読み込み中...</div>
     <div id="content" style="display:none;">
      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-5">
          <section class="rg-card mb-3">
            <div class="rg-photo-square"><img id="photoMain" src="" data-rg-zoomable onerror="this.src=NO_IMAGE_URL"></div>
            <div style="margin-top:1rem; font-size:1.4rem; font-weight:800;"><span id="year"></span> <span id="modelMain"></span></div>
            <div class="d-flex align-items-center mt-2"><span id="handleName" class="fw-bold"></span><span id="prefecture" class="ms-auto badge bg-light text-primary border border-primary-subtle rounded-pill px-3"></span></div>
          </section>
          <section class="rg-card mb-3" id="gallerySection" style="display:none;"><div class="rg-gallery-grid" id="galleryGrid"></div></section>
        </div>
        <div class="col-12 col-lg-7">
          <section class="rg-card mb-3"><h2 class="rg-section-title">ボディスペック</h2><dl class="rg-spec-grid js-auto-hide">
            <dt>ボディカラー</dt><dd id="val_BodyColor"></dd><dt>全長(cm)</dt><dd id="val_Length_cm"></dd><dt>乗車定員</dt><dd id="val_Capacity"></dd><dt>ハンドル</dt><dd id="val_Steering"></dd>
          </dl></section>
          <section class="rg-card mb-3"><h2 class="rg-section-title">エンジン関係</h2><dl class="rg-spec-grid js-auto-hide">
            <dt>排気量(cc)</dt><dd id="val_EngineCC"></dd><dt>エンジン形式</dt><dd id="val_Engine_Display"></dd><dt>点火形式</dt><dd id="val_IgnitionType"></dd><dt>点火製品名</dt><dd id="val_IgnitionSubType"></dd><dt>配電/プラグ</dt><dd id="val_DistPlug"></dd><dt>コイル</dt><dd id="val_CoilName"></dd><dt>供給装置</dt><dd id="val_FuelInjection"></dd><dt>キャブ</dt><dd id="val_CarburetorName"></dd><dt>燃ポン</dt><dd id="val_FuelPump"></dd><dt>電ポン名</dt><dd id="val_ElectricPumpName"></dd><dt>発電機</dt><dd id="val_Generator"></dd><dt>オイルクーラー</dt><dd id="val_OilCooler"></dd>
          </dl></section>
          <section class="rg-card mb-3"><h2 class="rg-section-title">駆動系・足回り</h2><dl class="rg-spec-grid js-auto-hide">
            <dt>ミッション</dt><dd id="val_Transmission"></dd><dt>シンクロ</dt><dd id="val_Synchro"></dd><dt>ジョイント</dt><dd id="val_Joint"></dd><dt>ホイール</dt><dd id="val_Wheel"></dd><dt>リム径</dt><dd id="val_RimDiameter_in"></dd><dt>リム幅</dt><dd id="val_RimWidth_in"></dd><dt>タイヤ形式</dt><dd id="val_TireType"></dd><dt>タイヤサイズ</dt><dd id="val_TireSize"></dd><dt>メーカー</dt><dd id="val_TireBrandName"></dd>
          </dl></section>
          <section class="rg-card mb-3"><h2 class="rg-section-title">オイル・バッテリー</h2><dl class="rg-spec-grid js-auto-hide">
            <dt>エンジンオイル</dt><dd id="val_EngineOil"></dd><dt>周期</dt><dd id="val_EngineOilInterval"></dd><dt>ミッションオイル</dt><dd id="val_TransmissionOil"></dd><dt>周期</dt><dd id="val_TransmissionOilInterval"></dd><dt>バッテリー</dt><dd id="val_Battery"></dd>
          </dl></section>
          <section class="rg-card mb-3" id="highlightsSection" style="display:none;"><h2 class="rg-section-title">こだわり</h2><p id="val_Highlights" style="white-space:pre-wrap;"></p></section>
          <section class="rg-card mb-3" id="snsSection" style="display:none;"><h2 class="rg-section-title">SNS</h2><dl class="rg-spec-grid" id="snsGrid"></dl></section>
          <section class="rg-card mb-3"><h2 class="rg-section-title">共有・連絡</h2>
            <div class="d-flex gap-2 mb-3"><button class="btn btn-dark flex-grow-1" onclick="showQRCode()">QR表示</button><a id="shareX" class="btn btn-black text-white flex-grow-1" style="background:black;" target="_blank">Xシェア</a></div>
            <div id="contactArea" style="display:none;"><button class="btn-contact" onclick="openContactForm()">オーナーへ問い合わせ</button></div>
          </section>
        </div>
      </div>
     </div>
   </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const docId = params.get('doc');
    let currentUser = null, currentCar = null;

    if (firebase.apps.length === 0) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().onAuthStateChanged(user => { currentUser = user; if(currentCar) updateOwnerUI(); });

    async function fetchDetail() {
      if (!docId) return;
      const { data, error } = await supabaseClient.from('cars').select('*').eq('document_id', docId).single();
      if (data) { currentCar = data; renderDetail(data); updateOwnerUI(); }
    }

    function renderDetail(car) {
      document.getElementById('loading').style.display = 'none'; document.getElementById('content').style.display = 'block';
      document.getElementById('year').textContent = car.year ? car.year + '年' : '';
      document.getElementById('modelMain').textContent = (car.model_display_c || '').replace(/\(\d{4}\)/, '');
      document.getElementById('handleName').textContent = car.handle_name;
      document.getElementById('prefecture').textContent = car.prefecture;
      document.getElementById('photoMain').src = car.photo_main || NO_IMAGE_URL;

      const map = {
        'val_BodyColor': car.body_color, 'val_Length_cm': car.length_cm, 'val_Capacity': car.capacity, 'val_Steering': car.steering,
        'val_EngineCC': car.engine_cc, 'val_Engine_Display': car.engine_display, 'val_IgnitionType': car.ignition_type, 'val_IgnitionSubType': car.ignition_sub_type,
        'val_CoilName': car.coil_name, 'val_FuelInjection': car.fuel_injection, 'val_CarburetorName': car.carburetor_name, 'val_FuelPump': car.fuel_pump,
        'val_ElectricPumpName': car.electric_pump_name, 'val_Generator': car.generator, 'val_OilCooler': car.oil_cooler, 'val_Transmission': car.transmission,
        'val_Synchro': car.synchro, 'val_Joint': car.joint, 'val_Wheel': car.wheel, 'val_RimDiameter_in': car.rim_diameter_in, 'val_RimWidth_in': car.rim_width_in,
        'val_TireType': car.tire_type, 'val_TireSize': car.tire_size, 'val_TireBrandName': car.tire_brand_name, 'val_EngineOil': car.engine_oil,
        'val_EngineOilInterval': car.engine_oil_interval, 'val_TransmissionOil': car.transmission_oil, 'val_TransmissionOilInterval': car.transmission_oil_interval, 'val_Battery': car.battery
      };
      for (const [id, val] of Object.entries(map)) { const el = document.getElementById(id); if(el) el.textContent = val || ''; }
      document.getElementById('val_DistPlug').textContent = (car.distribution_type || '') + (car.plug_name ? ' / ' + car.plug_name : '');

      document.querySelectorAll('.js-auto-hide').forEach(dl => {
        const dts = dl.querySelectorAll('dt'), dds = dl.querySelectorAll('dd');
        dts.forEach((dt, i) => { if(!dds[i].textContent.trim() || dds[i].textContent === '/') { dt.style.display = 'none'; dds[i].style.display = 'none'; } });
      });

      if (car.highlights) { document.getElementById('highlightsSection').style.display = 'block'; document.getElementById('val_Highlights').textContent = car.highlights; }

      const gallery = document.getElementById('galleryGrid');
      ['photo_front', 'photo_side', 'photo_rear', 'photo_engine', 'photo_interior', 'photo_steering_cluster'].forEach(k => {
        if (car[k]) {
          gallery.innerHTML += `<div class="rg-gallery-thumb"><img src="${car[k]}" data-rg-zoomable onerror="this.src=NO_IMAGE_URL"></div>`;
          document.getElementById('gallerySection').style.display = 'block';
        }
      });

      const snsGrid = document.getElementById('snsGrid');
      const sns = [{k:'x_twitter', l:'X', b:'https://x.com/'}, {k:'instagram', l:'Instagram', b:'https://instagram.com/'}, {k:'youtube', l:'YouTube', b:'https://youtube.com/'}, {k:'minkara', l:'みんカラ', b:'https://minkara.carview.co.jp/userid/'}];
      sns.forEach(s => { if(car[s.k]) { snsGrid.innerHTML += `<dt>${s.l}</dt><dd><a href="${s.b}${car[s.k].replace('@','')}" target="_blank">${car[s.k]}</a></dd>`; document.getElementById('snsSection').style.display = 'block'; } });

      document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(car.handle_name + 'さんのFiat500')}&url=${encodeURIComponent(location.href)}`;
    }

    function updateOwnerUI() {
      if(!currentCar || !currentUser) return;
      const isOwner = currentUser.email.toLowerCase() === currentCar.owner_email.toLowerCase();
      if(isOwner) {
        document.getElementById('ownerMenuArea').style.display = 'block';
        document.getElementById('editLink').href = `edit.html?doc=${currentCar.document_id}`;
      } else if(currentCar.accept_inquiry !== false) {
        document.getElementById('contactArea').style.display = 'block';
      }
    }

    window.openContactForm = function() {
      if (!currentUser) { alert("ログインが必要です"); return; }
      const html = `<div class="bg-white p-4 rounded shadow" style="max-width:400px; width:90%;"><h3>オーナーへ連絡</h3><p class="small text-muted">メアドは非公開で転送されます。</p><input type="text" id="inqName" class="inquiry-input" placeholder="お名前"><textarea id="inqMsg" class="inquiry-textarea" placeholder="メッセージ"></textarea><button class="btn-contact" onclick="submitInquiry()">送信する</button></div>`;
      openModal(html);
    };

    window.submitInquiry = async function() {
      const name = document.getElementById('inqName').value, msg = document.getElementById('inqMsg').value;
      if(!name || !msg) return;
      try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'inquiry', formData: { targetDocId: currentCar.document_id, senderName: name, senderEmail: currentUser.email, message: msg } }) });
        alert("送信しました"); location.reload();
      } catch(e) { alert("エラー"); }
    };

    function showQRCode() { openModal(`<div class="bg-white p-4 rounded text-center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(location.href)}"><p class="mt-2 small">カメラで読み取ってください</p></div>`); }
    function openModal(html) { const m = document.createElement('div'); m.className = 'rg-modal is-open'; m.innerHTML = `<div class="position-relative">${html}<button class="btn-close btn-close-white position-absolute top-0 end-0 m-2" onclick="this.parentElement.parentElement.remove()"></button></div>`; document.body.appendChild(m); m.onclick = (e) => { if(e.target === m) m.remove(); }; }

    fetchDetail();
  </script>
</body>
</html>
