<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>スクリーンセーバー（試作） ── Registro500 Giappone</title>
<meta name="theme-color" content="#0b0d10">
<!--
  ⚠️ これは【3方式を見比べるための試作】です。実機で眺めて1つに決め、不採用の2つは削ります。
  ⛔ 導線（メニュー・sitemap・他ページからのリンク）は、ユーザーの指示が出るまで付けません（CLAUDE.md の掟）。
     採用が決まった時点で noindex を外し、og:image（1200×630・summary_large_image）を入れます。

  ⭐ 絵の材料は「マイ壁紙」で焼いたものをそのまま使っています。
     wallpaper/dist/sprite.webp   169台＋ロゴ2枚を1枚に焼いたもの（自ドメイン配信）
     wallpaper/dist/manifest.json ids（登録順）と order_color（色順の並び）
     車両情報だけは Supabase から匿名で読みます（⛔ sns_share_optout の車は取らない＝掟）。

  ⭐ 壁紙と違い、ここでは canvas から書き出さない＝canvas が汚染されても構いません。
     そのため Firebase Storage の写真を直接 canvas に描けます（CORS 設定は不要）。
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d10; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #cv { display: block; width: 100%; height: 100%; }

  /* 重ねる文字類。⭐ 画面を放置して眺めるものなので、どれも控えめに、消えるように出す。 */
  .layer {
    position: fixed; inset: 0; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .fade { transition: opacity .8s ease; }

  /* 時計 */
  #clock {
    position: absolute; right: max(24px, 4vmin); bottom: max(22px, 4vmin);
    font-size: clamp(20px, 3.4vmin, 40px); font-weight: 300; letter-spacing: .06em;
    color: rgba(232,234,237,.72); text-shadow: 0 2px 14px rgba(0,0,0,.7);
    font-variant-numeric: tabular-nums;
  }
  /* 車両情報（方式1のフォーカス中／方式2の表示中） */
  #info {
    position: absolute; left: max(24px, 4vmin); bottom: max(22px, 4vmin);
    max-width: min(70vw, 640px); opacity: 0;
    text-shadow: 0 2px 16px rgba(0,0,0,.8);
  }
  #info .yr { font-size: clamp(26px, 5vmin, 60px); font-weight: 300; letter-spacing: .04em; line-height: 1.1; }
  #info .md { font-size: clamp(13px, 2.1vmin, 22px); color: rgba(232,234,237,.78); margin-top: .35em; letter-spacing: .04em; }
  /* 方式1はタイルの真下に出すので、位置をJSから動かす */
  #info.center { left: 50%; transform: translateX(-50%); text-align: center; bottom: auto; }

  /* 方式名バッジ（切り替えた時だけ2秒） */
  #badge {
    position: absolute; top: max(20px, 4vmin); left: 50%; transform: translateX(-50%);
    font-size: clamp(12px, 1.8vmin, 17px); letter-spacing: .12em; opacity: 0;
    padding: .5em 1.1em; border-radius: 999px;
    background: rgba(20,23,28,.72); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  /* 操作の手引き（触ると出て、数秒で消える）
     ⚠️ キーボードの無い端末では、ここが方式を切り替える唯一の手立て＝押せるボタンを必ず置く。 */
  #hint {
    position: absolute; bottom: max(22px, 4vmin); left: 50%; transform: translateX(-50%);
    text-align: center; font-size: clamp(11px, 1.7vmin, 15px); line-height: 1.9;
    color: rgba(232,234,237,.62); opacity: 0; pointer-events: none;
    padding: .8em 1em; border-radius: 16px; max-width: 92vw;
    background: rgba(20,23,28,.66); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #hint.show { opacity: 1; pointer-events: auto; }   /* 見えている時だけ押せる */
  #hint .row { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
  #hint .mb {
    font: inherit; font-size: clamp(12px, 1.9vmin, 16px); letter-spacing: .04em;
    color: rgba(232,234,237,.82); background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
    padding: .55em 1.1em; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  #hint .mb.on { color: #0b0d10; background: rgba(232,234,237,.9); border-color: transparent; font-weight: 600; }
  #hint .row + .row { margin-top: .5em; }
  #hint .mb.rec { color: rgba(232,234,237,.9); background: rgba(255,255,255,.02); border-style: dashed; }
  #hint .sub { margin-top: .7em; font-size: .88em; color: rgba(232,234,237,.45); line-height: 1.8; }
  #hint .k {
    display: inline-block; min-width: 1.5em; padding: .1em .4em; margin: 0 .15em;
    border: 1px solid rgba(255,255,255,.24); border-radius: 5px; font-size: .92em;
  }

  /* 起動前の入口。⭐ 全画面と画面消灯の抑止は「ユーザーが1回触ってから」でないと許可されない。 */
  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.6em; text-align: center;
    background: #0b0d10; z-index: 10; transition: opacity .5s ease;
  }
  #gate h1 { font-size: clamp(19px, 3.2vmin, 30px); font-weight: 400; margin: 0; letter-spacing: .06em; }
  #gate p  { margin: 0; font-size: clamp(12px, 1.9vmin, 16px); color: rgba(232,234,237,.6); line-height: 1.9; }
  #gate button {
    font: inherit; font-size: clamp(14px, 2.1vmin, 18px); letter-spacing: .1em;
    color: #e8eaed; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    padding: .85em 2.4em; cursor: pointer; transition: background .2s;
  }
  #gate button:hover { background: rgba(255,255,255,.13); }
  #gate .sub { font-size: clamp(11px, 1.6vmin, 14px); color: rgba(232,234,237,.38); }
  #gate.gone { opacity: 0; pointer-events: none; }

  body.playing { cursor: none; }
  body.ui      { cursor: default; }

  /* ---- 収録モード -------------------------------------------------------
     ⭐ 画面収録で撮っても、アプリ内で録画しても【同じ絵】になるようにする。
     ⚠️⚠️ canvas.captureStream は canvas の中身しか拾わない＝DOM で描いた文字は録画に写らない。
     だから収録中は DOM の重ね文字を全部消し、クレジットも車両情報も canvas 側に描く。 */
  body.rec .layer { display: none; }
  body.rec { cursor: none; }

  #recui {
    position: fixed; inset: 0; z-index: 5; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 1.2em;
    text-align: center; pointer-events: none;
  }
  #recui.show { display: flex; }
  #recui .box {
    pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1em;
    padding: 1.6em 1.8em; border-radius: 20px; max-width: 86vw;
    background: rgba(20,23,28,.82); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #count { font-size: clamp(60px, 18vmin, 150px); font-weight: 200; line-height: 1;
           color: rgba(255,255,255,.92); text-shadow: 0 4px 30px rgba(0,0,0,.8); }
  #rmsg  { font-size: clamp(12px, 2vmin, 16px); line-height: 1.9; color: rgba(232,234,237,.75); }
  #recui button {
    font: inherit; font-size: clamp(13px, 2vmin, 17px); letter-spacing: .06em;
    color: #e8eaed; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.26); border-radius: 999px;
    padding: .8em 2em; cursor: pointer; white-space: nowrap;
  }
  #recui button.primary { color: #0b0d10; background: rgba(232,234,237,.92); border-color: transparent; font-weight: 600; }
  #recui .row2 { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
  #tags { font-size: clamp(11px, 1.7vmin, 14px); color: rgba(232,234,237,.5); line-height: 1.8; word-break: break-all; }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="layer">
  <div id="info" class="fade"><div class="yr"></div><div class="md"></div></div>
  <div id="clock"></div>
  <div id="badge" class="fade"></div>
  <div id="hint" class="fade"></div>
</div>

<div id="recui">
  <div id="count"></div>
  <div class="box" id="rbox">
    <div id="rmsg"></div>
    <div class="row2">
      <button id="rsave" class="primary" hidden>保存・共有</button>
      <button id="rtag" hidden>ハッシュタグをコピー</button>
      <button id="rexit" hidden>もどる</button>
    </div>
    <div id="tags" hidden></div>
  </div>
</div>

<div id="gate">
  <h1>スクリーンセーバー<span style="opacity:.5">（試作）</span></h1>
  <p id="gstat">読み込んでいます…</p>
  <button id="gbtn" disabled>はじめる</button>
  <p class="sub">3つの方式を切り替えて見比べられます</p>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================ 設定と材料 */

  var DATA     = 'wallpaper/dist/';
  var SUPA_URL = 'https://ttlttclfovuzafvghvaq.supabase.co';
  var SUPA_KEY = 'sb_publishable_YMQjADUCrD6BytxvcMm-lQ_7n8LMEAt';

  var BG = '#0b0d10';           /* 地色。沈める時もこの色へ寄せる */
  var SINK = 0.22;              /* ⭐ 周りを沈める量＝マイ壁紙のハイライトと同じ 22%（思想を揃える） */

  var MAN = null;               /* manifest.json */
  var SPRITE = null;            /* sprite.webp */
  var CARS = {};                /* document_id -> 行 */
  var ORDER = [];               /* 表示順（スプライト上のタイル番号）＝色順・両端にロゴ */
  var CARIDX = [];              /* ORDER のうち車だけ（フォーカス／スライドショーの母集団） */

  var cv, ctx, W = 0, H = 0, DPR = 1;
  var mode = 1, started = false, lastTs = 0;

  /* ⛔「図鑑」は使わない（2026-09-05 ユーザー確定）。「ドリフト」も車のドリフト走行と紛らわしいので外した。 */
  var MODE_NAME = { 1: 'タイル＆ピックアップ', 2: 'スライドショー', 3: '色の川' };

  var $ = function (id) { return document.getElementById(id); };
  function mod(a, b) { return ((a % b) + b) % b; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  /* ============================================================ 読み込み */

  function loadManifest() {
    return fetch(DATA + 'manifest.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('manifest');
      return r.json();
    });
  }

  function loadSprite() {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { reject(new Error('sprite')); };
      im.src = DATA + 'sprite.webp';
    });
  }

  /* ⭐ 車の写真は7種類ある（メインだけではない）。563枚＝メインの3.3倍。 */
  var PHOTO_COLS = ['photo_main', 'photo_front', 'photo_side', 'photo_rear',
                    'photo_engine', 'photo_interior', 'photo_steering_cluster'];

  /* 車両情報。⛔ sns_share_optout の車は取らない（掟）。
     ⭐ supabase-js は読まない＝認証しないので素の REST で足りる（起動を軽くする）。 */
  function loadCars() {
    var q = '/rest/v1/cars?select=document_id,year,model_display_a,car_type,body_color,'
          + PHOTO_COLS.join(',')
          + '&photo_main=not.is.null'
          + '&or=(sns_share_optout.is.null,sns_share_optout.is.false)'
          + '&limit=1000';
    return fetch(SUPA_URL + q, { headers: { apikey: SUPA_KEY } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });   /* 読めなくても絵は出す＝情報だけ出ない */
  }

  /* ============================================================ 並び順 */

  function buildOrder() {
    var color = MAN.order_color && MAN.order_color.length ? MAN.order_color.slice() : null;
    if (!color) { color = []; for (var i = 0; i < MAN.count; i++) color.push(i); }

    /* ⭐ マイ壁紙と同じ「500ロゴを先頭・126ロゴを末尾」＝本の表紙と奥付。
       流れていく絵なので、周回のたびに表紙が通り過ぎる区切りにもなる。 */
    ORDER = [];
    if (MAN.logo && MAN.logo.r500 != null) ORDER.push(MAN.logo.r500);
    ORDER = ORDER.concat(color);
    if (MAN.logo && MAN.logo.r126 != null) ORDER.push(MAN.logo.r126);

    CARIDX = color.slice();   /* ロゴはフォーカスもスライドショーもしない */
  }

  function docOf(spriteIdx) {
    if (spriteIdx == null || spriteIdx >= MAN.count) return null;   /* ロゴ */
    return MAN.ids[spriteIdx] || null;
  }
  function carOf(spriteIdx) {
    var d = docOf(spriteIdx);
    return d ? (CARS[d] || null) : null;
  }

  /* ============================================================ 画面まわり */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    /* ⚠️ H.264 は幅・高さが偶数でないと録れないことがある＝2の倍数へ丸める */
    cv.width  = Math.round(W * DPR / 2) * 2;
    cv.height = Math.round(H * DPR / 2) * 2;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingQuality = 'high';
  }

  /* スプライト上の1枚を描く */
  function drawTile(spriteIdx, x, y, w, h) {
    var t = MAN.tile, c = MAN.cols;
    ctx.drawImage(SPRITE, (spriteIdx % c) * t, Math.floor(spriteIdx / c) * t, t, t, x, y, w, h);
  }

  /* 短辺を基準にタイルの大きさを決める。⭐ 画面の向きが変わっても「壁」の密度を保つ。 */
  function tileSize() { return Math.max(56, Math.round(Math.min(W, H) / 6.5)); }

  /* ============================================================ 方式1 タイル＆ピックアップ */

  var g = {
    scroll: 0,          /* タイル単位の連続オフセット（増えると絵が上へ流れる） */
    focus: null,
    nextAt: 4           /* 起動4秒後に最初のピックアップ */
  };
  /* ⭐ テンポ（2026-09-05 ユーザー指示で2度詰めた）＝1台あたり約10秒周期（初版36秒）。
     内訳＝拡大0.8＋静止3.6＋戻り0.7＋壁だけが流れる5.0 */
  var FOCUS_EVERY = 5.0;
  var F_IN = 0.8, F_HOLD = 3.6, F_OUT = 0.7;

  function gridLayout() {
    var T = tileSize();
    var scols = Math.max(1, Math.ceil(W / T));
    var xpad = (W - scols * T) / 2;         /* はみ出しを左右均等にする */
    var srows = Math.ceil(H / T) + 2;
    return { T: T, scols: scols, srows: srows, xpad: xpad };
  }

  /* 絶対行・列 → ORDER 上の位置 */
  function seqAt(absRow, col, scols) { return mod(absRow * scols + col, ORDER.length); }

  function drawGrid(t, dt) {
    var L = gridLayout(), T = L.T;

    /* フォーカスの進行（0＝通常／1＝完全にフォーカス） */
    var p = 0, f = g.focus;
    if (f) {
      var e = t - f.t0;
      if (e < F_IN) p = easeOut(e / F_IN);
      else if (e < F_IN + F_HOLD) p = 1;
      else if (e < F_IN + F_HOLD + F_OUT) p = 1 - easeOut((e - F_IN - F_HOLD) / F_OUT);
      /* ⭐ 収録中だけ間を詰める＝15秒にちょうど2台が収まる（上の recEnter のコメント参照） */
      else { g.focus = null; f = null; p = 0; g.nextAt = t + (REC.on ? 1.6 : FOCUS_EVERY); hideInfo(); }
    }

    /* ⛔ ピックアップ中も壁を止めない（2026-09-05 ユーザー指示）。
       止めると画面が固まったように見える＝拡大した1台も背景と一緒に流れていく。 */
    g.scroll += dt / 7;                     /* 1タイル約7秒 */

    var baseRow = Math.floor(g.scroll), frac = g.scroll - baseRow;

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    for (var r = 0; r < L.srows; r++) {
      var y = (r - frac) * T - T;
      for (var c = 0; c < L.scols; c++) {
        var idx = ORDER[seqAt(baseRow + r, c, L.scols)];
        drawTile(idx, L.xpad + c * T, y, T, T);
      }
    }

    /* ⭐ 周りを地色へ 22% 寄せるだけ＝マイ壁紙のハイライトと同じ作法（囲み線もオーバーレイも置かない） */
    if (p > 0) {
      ctx.fillStyle = 'rgba(11,13,16,' + (SINK * p) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    /* フォーカスした1台を、その場で大きくする */
    if (f && p > 0) {
      var fy = (f.row - baseRow - frac) * T - T;
      var fx = L.xpad + f.col * T;
      /* 拡大率はタイルの大きさから決める＝縦画面でも横画面でも「短辺の半分」まで大きくなる */
      var kmax = clamp(Math.min(W, H) * 0.5 / T, 2.4, 3.8);
      var k  = 1 + (kmax - 1) * p;
      var cx = fx + T / 2, cy = fy + T / 2;

      /* ⭐ 画面からはみ出す時だけ寄せる（元の位置のまま、壁と一緒に流れていくのが基本）。
         ⛔ 中央へ引き寄せない＝どのタイルが大きくなったのか分からなくなるため。 */
      var m = T * k / 2 + 12;
      var room = 96;                          /* 下に出す文字のぶん空けておく */
      cx += (clamp(cx, m, Math.max(m, W - m)) - cx) * p;
      cy += (clamp(cy, m, Math.max(m, H - m - room)) - cy) * p;

      var s = T * k;

      /* ⚠️ 文字を写真の壁に直に置くと読めない。⛔ 板を敷かず、文字が来る場所だけを丸くぼかして落とす。 */
      var iy = cy + s / 2 + Math.max(16, H * 0.025);
      var gsh = ctx.createRadialGradient(cx, iy + 18, 0, cx, iy + 18, Math.max(170, s * 0.8));
      gsh.addColorStop(0, 'rgba(11,13,16,' + (0.66 * p) + ')');
      gsh.addColorStop(1, 'rgba(11,13,16,0)');
      ctx.fillStyle = gsh; ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.55)';
      ctx.shadowBlur = 40 * p;
      ctx.shadowOffsetY = 10 * p;
      if (!REC.on && f.img && f.img.complete && f.img.naturalWidth) {
        drawCover(f.img, cx - s / 2, cy - s / 2, s, s);   /* 元写真が読めていれば差し替える */
      } else {
        drawTile(f.idx, cx - s / 2, cy - s / 2, s, s);
      }
      ctx.restore();

      if (p > .96) {
        if (REC.on) drawCarText(f.car, cx, iy, 'center');   /* 収録中は canvas 側へ */
        else showInfoAt(f.car, cx, iy);
      }
    }

    if (!f && t > g.nextAt) startFocus(t, L, baseRow, frac);
  }

  function startFocus(t, L, baseRow, frac) {
    /* 画面の内側にある車のタイルから選ぶ（ロゴと、端で切れているものは避ける） */
    var pool = [];
    for (var r = 0; r < L.srows; r++) {
      var y = (r - frac) * L.T - L.T;
      if (y < -L.T * .2 || y + L.T > H + L.T * .2) continue;
      for (var c = 0; c < L.scols; c++) {
        var x = L.xpad + c * L.T;
        if (x < -1 || x + L.T > W + 1) continue;
        var idx = ORDER[seqAt(baseRow + r, c, L.scols)];
        if (idx >= MAN.count) continue;                    /* ロゴは選ばない */
        pool.push({ idx: idx, row: baseRow + r, col: c });
      }
    }
    if (!pool.length) { g.nextAt = t + 4; return; }

    var pick = pool[Math.floor(Math.random() * pool.length)];
    var car = carOf(pick.idx);
    g.focus = { idx: pick.idx, row: pick.row, col: pick.col, car: car, t0: t, img: null };

    /* ⭐ タイルは 256px なので、大きくすると粗い。元写真（長辺1000px）を裏で読んで差し替える。
       ⚠️⚠️ ただし収録中は読まない＝写真を1枚でも描くと canvas が汚染され、録画できなくなる
       （下の freshCanvas のコメントを見ること）。 */
    if (!REC.on && car && car.photo_main) {
      var im = new Image();
      im.onload = function () { if (g.focus && g.focus.idx === pick.idx) g.focus.img = im; };
      im.src = car.photo_main;
    }
  }

  /* ============================================================ 方式2 スライドショー */

  var sh = { list: [], i: -1, t0: 0, cur: null, prev: null };
  var SH_HOLD = 4.6, SH_FADE = 0.9;      /* 1枚あたり約5.5秒（旧 10.3秒） */

  /* ⭐ 並べるのは「車」ではなく「写真」＝7種すべてを1枚ずつ回す（563枚）。
     同じ車のエンジンや内装も出るので、169枚だけの時より遥かに飽きにくい。 */
  function shInit() {
    var l = [];
    for (var i = 0; i < CARIDX.length; i++) {
      var idx = CARIDX[i], car = carOf(idx);
      if (!car) continue;
      for (var j = 0; j < PHOTO_COLS.length; j++) {
        var u = car[PHOTO_COLS[j]];
        if (u) l.push({ url: u, car: car, idx: idx });
      }
    }
    for (var m = l.length - 1; m > 0; m--) {          /* 毎回ちがう順で（飽きないように） */
      var k = Math.floor(Math.random() * (m + 1)); var s = l[m]; l[m] = l[k]; l[k] = s;
    }
    sh.list = l; sh.i = -1; sh.cur = null; sh.prev = null;
  }

  function shNext(t) {
    if (!sh.list.length) return;
    sh.prev = sh.cur;
    sh.i = (sh.i + 1) % sh.list.length;
    var p = sh.list[sh.i];
    sh.cur = { idx: p.idx, car: p.car, img: new Image(), t0: t, seed: Math.random() };
    sh.cur.img.src = p.url;
    sh.t0 = t;
    showInfo(p.car);

    /* 次の1枚を先に読んでおく（切り替わりで待たせない） */
    var nx = sh.list[(sh.i + 1) % sh.list.length];
    if (nx) { var pre = new Image(); pre.src = nx.url; }
  }

  /* 背景用のぼかし。⭐ 写真を極小へ縮めてから画面いっぱいに引き伸ばすだけ＝
     blur フィルタを毎フレームかけるより遥かに軽く、結果は同じようにぼける。 */
  function makeBlurBg(im) {
    var bw = 44, bh = Math.max(8, Math.round(44 * H / W));
    var c = document.createElement('canvas');
    c.width = bw; c.height = bh;
    var x = c.getContext('2d');
    var sw = im.naturalWidth, sh2 = im.naturalHeight;
    var sr = sw / sh2, dr = bw / bh, cw = sw, ch = sh2, cx = 0, cy = 0;
    if (sr > dr) { cw = sh2 * dr; cx = (sw - cw) / 2; } else { ch = sw / dr; cy = (sh2 - ch) / 2; }
    x.drawImage(im, cx, cy, cw, ch, 0, 0, bw, bh);
    c._ar = W / H;
    return c;
  }

  /* ⚠️⚠️ メイン写真は 1000×1000 の正方形（edit.html の cropper がそう切っている）。
     画面いっぱいに cover で入れると iPhone 縦で約1.7倍に引き伸ばされ、ギザギザが出るうえ
     左右が切れて車が画面の外に出る。⭐ だから【写真の全体を収める】＝引き伸ばさない。
     余白は同じ写真のぼかしで埋める（フォトフレームの作法）。 */
  function drawKen(o, t, alpha) {
    if (!o) return;
    var im = o.img;
    var prog = clamp((t - o.t0) / (SH_HOLD + SH_FADE), 0, 1.1);

    ctx.save();
    ctx.globalAlpha = alpha;
    if (!REC.on && im.complete && im.naturalWidth) {   /* ⚠️ 収録中は写真を描かない＝canvas を汚さない */
      if (!o.bg || o.bg._ar !== W / H) o.bg = makeBlurBg(im);
      ctx.drawImage(o.bg, 0, 0, W, H);
      ctx.fillStyle = 'rgba(11,13,16,.42)';      /* 背景を沈めて、写真だけが目に入るようにする */
      ctx.fillRect(0, 0, W, H);

      /* ⭐ 近づいてくる動き（0.97→1.00）＝拡大側へ振らないので、はみ出しも粗さも出ない */
      var k = 0.97 + 0.03 * prog;
      var r = Math.min(W / im.naturalWidth, H / im.naturalHeight) * k;
      var w = im.naturalWidth * r, h = im.naturalHeight * r;
      var dir = o.seed < .5 ? 1 : -1;
      var dx = dir * (W - w) * 0.10 * prog;
      var dy = (o.seed < .25 || o.seed > .75 ? 1 : -1) * (H - h) * 0.10 * prog;
      ctx.drawImage(im, (W - w) / 2 + dx, (H - h) / 2 + dy, w, h);
    } else {
      /* まだ読めていない間は、その車のタイルを引き伸ばして繋ぐ（真っ黒にしない） */
      ctx.filter = 'blur(24px)';
      drawCover(SPRITE, 0, 0, W, H, tileRect(o.idx));
      ctx.filter = 'none';
    }
    ctx.restore();
  }

  function drawShow(t, dt) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    if (!sh.list.length) return;
    if (!sh.cur || t - sh.t0 > SH_HOLD + SH_FADE) shNext(t);

    var e = t - sh.t0;
    if (sh.prev && e < SH_FADE) drawKen(sh.prev, t, 1);
    drawKen(sh.cur, t, sh.prev ? easeInOut(clamp(e / SH_FADE, 0, 1)) : 1);

    /* 下側をわずかに落として文字を読めるようにする（写真の上に板を置かない） */
    var gr = ctx.createLinearGradient(0, H * 0.62, 0, H);
    gr.addColorStop(0, 'rgba(11,13,16,0)');
    gr.addColorStop(1, 'rgba(11,13,16,.62)');
    ctx.fillStyle = gr; ctx.fillRect(0, H * 0.62, W, H * 0.38);

    if (REC.on && sh.cur) {                               /* 収録中は canvas 側へ */
      var b = safeBox();
      drawCarText(sh.cur.car, W / 2, b.bottom - Math.min(W, H) * 0.30, 'center');
    }
  }

  /* ============================================================ 方式3 色の川 */

  var rv = { off: 0 };

  function drawRiver(t, dt) {
    var T = Math.max(52, Math.round(Math.min(W, H) / 5.2));
    var lanes = Math.ceil(H / T) + 1;
    rv.off += dt;

    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    var N = ORDER.length;
    var step = Math.max(1, Math.round(N / lanes));    /* レーン1本ぶんの色の進み */

    /* ⭐ 縦にも流す（2026-09-05 ユーザー指示）。横だけだと配色が画面に貼り付いてしまい、
       「まん中がいつも黄色・青系は下で見切れたまま」になる。縦に送れば全部の色が順に真ん中を通る。
       横より遅くして、斜めに流れる川に見せる。 */
    var vs = rv.off * (T / 14);
    var baseLane = Math.floor(vs / T);
    var vfrac = vs / T - baseLane;

    for (var r = -1; r <= lanes; r++) {               /* 上下に1本ずつ余分に描いて端を埋める */
      var absLane = baseLane + r;
      var speed = (0.62 + 0.11 * mod(absLane, 4)) * T / 6;   /* レーンごとに速さを変える */
      var dir = (mod(absLane, 2) === 0) ? 1 : -1;
      var shift = dir * rv.off * speed;

      /* ⚠️ 開始位置を固定幅（11台ぶん等）でずらすと、どのレーンもほぼ同じ色になり
         「色の川」にならない。色順の全体をレーン数で割って配る。 */
      var start = mod(absLane * step, N);
      var y = (r - vfrac) * T - T * 0.5;

      var first = Math.floor(-shift / T) - 1;
      var count = Math.ceil(W / T) + 2;
      for (var c = 0; c < count; c++) {
        var col = first + c;
        var idx = ORDER[mod(start + col, N)];
        /* ⚠️⚠️ 位置を丸めない。⭐ 丸めると 1px ずつ飛んで動き、遅い流れではカクカクに見える
           （縦は毎秒5px 程度しか進まない）。隙間は【1px 大きく描いて重ねる】ことで防ぐ。 */
        drawTile(idx, col * T + shift, y, T + 1, T + 1);
      }
    }

    /* 上下を軽く落として、帯が画面の外へ溶けるように見せる */
    var gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, 'rgba(11,13,16,.55)');
    gr.addColorStop(.16, 'rgba(11,13,16,0)');
    gr.addColorStop(.84, 'rgba(11,13,16,0)');
    gr.addColorStop(1, 'rgba(11,13,16,.55)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  /* ============================================================ 描画の共通部品 */

  function tileRect(spriteIdx) {
    var t = MAN.tile, c = MAN.cols;
    return { sx: (spriteIdx % c) * t, sy: Math.floor(spriteIdx / c) * t, sw: t, sh: t };
  }

  /* 枠に対して cover（短辺を合わせて中央で切る）で描く */
  function drawCover(im, x, y, w, h, srcRect) {
    var sw = srcRect ? srcRect.sw : im.naturalWidth  || im.width;
    var sh2 = srcRect ? srcRect.sh : im.naturalHeight || im.height;
    var sx = srcRect ? srcRect.sx : 0, sy = srcRect ? srcRect.sy : 0;
    if (!sw || !sh2) return;
    var sr = sw / sh2, dr = w / h, cw = sw, ch = sh2, cx = sx, cy = sy;
    if (sr > dr) { cw = sh2 * dr; cx = sx + (sw - cw) / 2; }
    else         { ch = sw / dr;  cy = sy + (sh2 - ch) / 2; }
    ctx.drawImage(im, cx, cy, cw, ch, x, y, w, h);
  }

  /* ============================================================ 収録モードの描き込み

     ⚠️ SNS（Instagram リール・TikTok）は 9:16。iPhone の画面は 9:19.5 前後なので、
        画面収録した動画は【上下が切られる】。⭐ だから大事な文字は中央 9:16 の内側に置く。
     ⚠️ さらに TikTok は右側にボタン列・下部にキャプションが重なる＝下端ぎりぎりも避ける。 */

  function safeBox() {
    var sh2 = Math.min(H, W * 16 / 9);
    return { top: (H - sh2) / 2, bottom: (H + sh2) / 2, h: sh2 };
  }

  var FONT = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif';

  function drawCredit() {
    var b = safeBox();
    var s = Math.max(13, Math.round(Math.min(W, H) * 0.030));
    ctx.save();
    /* ⚠️ 白い車のタイルの上だと白文字が沈む＝影だけでは足りない。⛔ 板は置かず、下だけ落とす。 */
    var gy = b.bottom - s * 4.2;
    var gr = ctx.createLinearGradient(0, gy, 0, b.bottom + s * 0.6);
    gr.addColorStop(0, 'rgba(11,13,16,0)');
    gr.addColorStop(1, 'rgba(11,13,16,.62)');
    ctx.fillStyle = gr; ctx.fillRect(0, gy, W, b.bottom + s * 0.6 - gy);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 1;
    ctx.font = '600 ' + s + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText('Registro500/126 Giappone', W / 2, b.bottom - s * 2.0);
    ctx.font = '400 ' + Math.round(s * 0.74) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('registro500.com', W / 2, b.bottom - s * 0.75);
    ctx.restore();
  }

  /* 収録中の車両情報は canvas 側に描く（DOM だと録画に写らないため） */
  function drawCarText(car, cx, topY, align) {
    var l = carLine(car);
    if (!l || (!l.yr && !l.md)) return;
    var b = safeBox();
    var s = Math.max(20, Math.round(Math.min(W, H) * 0.055));
    var y = clamp(topY, b.top + s, b.bottom - s * 3.2);
    ctx.save();
    ctx.textAlign = align || 'center';
    ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 2;
    ctx.font = '300 ' + s + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.fillText(l.yr, cx, y + s * 0.85);
    ctx.font = '400 ' + Math.round(s * 0.42) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fillText(l.md, cx, y + s * 1.45);
    ctx.restore();
  }

  /* ============================================================ 重ねる文字 */

  var infoEl = $('info');

  function carLine(car) {
    if (!car) return null;
    var sub = [];
    if (car.model_display_a) sub.push(car.model_display_a);
    if (car.body_color) sub.push(car.body_color);
    if (car.car_type && car.car_type !== '500') sub.push('FIAT ' + car.car_type);
    return { yr: car.year || '', md: sub.join('　／　') };
  }

  function showInfo(car) {
    var l = carLine(car);
    infoEl.classList.remove('center');
    infoEl.style.top = ''; infoEl.style.bottom = ''; infoEl.style.left = '';
    if (!l || (!l.yr && !l.md)) { infoEl.style.opacity = 0; return; }
    infoEl.querySelector('.yr').textContent = l.yr;
    infoEl.querySelector('.md').textContent = l.md;
    infoEl.style.opacity = 1;
  }

  /* 方式1＝大きくなったタイルの真下に置く。
     ⚠️ 横位置もタイルに合わせること（画面中央に固定すると、左端の車を指していても文字だけ真ん中に出る） */
  function showInfoAt(car, cxPx, topPx) {
    var l = carLine(car);
    if (!l || (!l.yr && !l.md)) { infoEl.style.opacity = 0; return; }
    infoEl.classList.add('center');
    infoEl.querySelector('.yr').textContent = l.yr;
    infoEl.querySelector('.md').textContent = l.md;
    var half = Math.min(W * 0.35, 320);
    infoEl.style.left = Math.round(clamp(cxPx, half, W - half)) + 'px';
    infoEl.style.top = Math.round(clamp(topPx, 0, H - 120)) + 'px';
    infoEl.style.bottom = 'auto';
    infoEl.style.opacity = 1;
  }
  function hideInfo() { infoEl.style.opacity = 0; }

  function tickClock() {
    var d = new Date();
    $('clock').textContent = d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  var badgeTimer = null;
  function showBadge(text) {
    var b = $('badge');
    b.textContent = text; b.style.opacity = 1;
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(function () { b.style.opacity = 0; }, 2000);
  }

  var hintTimer = null;
  function showHint() {
    var h = $('hint');
    h.classList.add('show');
    document.body.classList.add('ui'); document.body.classList.remove('playing');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      h.classList.remove('show');
      document.body.classList.add('playing'); document.body.classList.remove('ui');
    }, 9000);   /* ⚠️ 短いと、タップしてボタンを探しているうちに消える */
  }

  /* ⚠️ キーの案内だけにしない＝iPhone には切り替える手立てが無くなる（実機で気づいた）。 */
  function renderHint() {
    var h = $('hint');
    var canFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    var s = '<div class="row">';
    for (var m = 1; m <= 3; m++) {
      s += '<button class="mb' + (m === mode ? ' on' : '') + '" data-m="' + m + '">' + MODE_NAME[m] + '</button>';
    }
    s += '</div>';
    /* ⚠️ 方式2は【オーナー写真そのもの】が主役＝タイルでは代わりにならず、しかも写真を描くと
       canvas が汚れて録画できない。⭐ だから出せないボタンを出さず、理由を1行で言う。 */
    if (mode === 2) {
      s += '<div class="sub">スライドショーは写真そのものを映すので、動画にするには'
         + '<b>端末の画面収録</b>を使ってください</div>';
    } else {
      s += '<div class="row"><button class="mb rec" id="hrec">🎬 ' + REC_SECONDS + '秒の動画を撮る</button></div>';
    }
    s += '<div class="sub">';
    s += 'キーボードなら <span class="k">1</span><span class="k">2</span><span class="k">3</span>'
       + '　／　<span class="k">←</span><span class="k">→</span> 送る';
    if (canFs) s += '　／　<span class="k">F</span> 全画面';
    else       s += '<br>ホーム画面に追加して開くと、上のバーが消えて全画面になります';
    s += '</div>';
    h.innerHTML = s;

    var bs = h.querySelectorAll('.mb[data-m]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].addEventListener('click', function (e) {
        e.stopPropagation();
        setMode(+this.getAttribute('data-m'));
        showHint();
      });
    }
    var rb = $('hrec');
    if (rb) rb.addEventListener('click', function (e) { e.stopPropagation(); recEnter(); });
  }

  /* ============================================================ 全画面・画面の消灯 */

  function toggleFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    }
  }

  /* ⚠️ Wake Lock はユーザーが1回触ってからでないと許可されない。低電力モード中は効かない。 */
  var wakeLock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (s) {
      wakeLock = s;
      s.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { /* 拒否されても絵は動く */ });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !wakeLock) keepAwake();
  });

  /* ============================================================ 収録・録画

     ⭐ ねらい＝Instagram リール / TikTok にそのまま上げられる15秒。
     ⚠️⚠️ iOS Safari は `<a download>` が効かない（既知の罠）＝保存させる道は Web Share だけ。
     ⚠️⚠️ さらに navigator.share は【ユーザー操作から直に呼ばないと拒まれる】。
        だから「録り終えてから、押してもらって共有する」順にする（自動で共有シートを出さない）。
     ⭐ MediaRecorder が無い端末でも、UI が消えた画面は残る＝iOS の画面収録で撮れる。 */

  /* ⚠️⚠️ Instagram は 2025年12月から【5個が上限】（それ以前は30個）＝6個以上入れるとリーチが落ちる。
     公式の推奨も3〜5個。⛔ここを増やさない。⭐126 も入っているので #fiat126 を残す。 */
  var HASHTAGS = '#registro500 #フィアット500 #相棒フィアット #fiat500 #fiat126';

  /* ⚠️⚠️⚠️ 2026-09-05 実測で判明した壁：
     Firebase Storage は CORS ヘッダを返さない（マイ壁紙 HANDOFF §6 と同じ壁）＝
     オーナー写真を1枚でも描いた canvas は【汚染】され、captureStream が
     `SecurityError: Canvas is not origin-clean` で落ちる。⛔ 録画だけが特別ではなく、
     toBlob・getImageData と同じ扱い。「書き出さないから汚染は無害」は録画を足した時点で崩れた。
     ⭐ 汚れは canvas【要素】の一生に紐づくので、収録に入るとき要素ごと作り直せばリセットできる。
     ⭐ そのうえで収録中はスプライト（同一オリジン）だけで描く。 */
  var lastTap = 0;
  function bindCanvas() {
    cv.addEventListener('click', function () {
      if (!started || REC.on) return;      /* 収録中は画面を触っても UI を出さない */
      var now = Date.now();
      if (now - lastTap < 350) { toggleFullscreen(); }   /* ダブルタップで全画面 */
      lastTap = now;
      showHint();
    });
  }
  function freshCanvas() {
    var old = cv, nc = document.createElement('canvas');
    nc.id = 'cv';
    old.parentNode.replaceChild(nc, old);
    cv = nc; ctx = cv.getContext('2d');
    bindCanvas(); resize();
  }

  var REC = { on: false, mr: null, chunks: [], blob: null, name: '', timer: null };
  var REC_SECONDS = 15;

  function pickMime() {
    if (!window.MediaRecorder) return null;
    var list = ['video/mp4;codecs=avc1.42E01E', 'video/mp4',
                'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (var i = 0; i < list.length; i++) {
      try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) {}
    }
    return null;
  }

  function recEnter() {
    REC.on = true; REC.blob = null;
    freshCanvas();                  /* ⭐ 汚染をここでリセットする（上のコメントを見ること） */
    if (g.focus) g.focus.img = null;
    if (sh.cur) sh.cur.bg = null;
    document.body.classList.add('rec');
    document.body.classList.remove('ui', 'playing');
    hideInfo();
    $('hint').classList.remove('show');
    clearTimeout(hintTimer);
    /* ⭐ 15秒の中に2台がきれいに収まるよう頭出しする＝
       撮影開始（数え終わり＝約2.7秒後）から 1.5秒 壁が流れ、そこで1台目。
       周期 0.8+3.6+0.7+1.6＝6.7秒なので、2台目は 8.2秒→13.3秒に終わり、最後は壁で締まる。 */
    if (mode === 1) { g.focus = null; g.nextAt = lastTs + 4.2; }

    $('recui').classList.add('show');
    $('rsave').hidden = true; $('rtag').hidden = true; $('rexit').hidden = true;
    $('tags').hidden = true; $('rbox').style.display = '';

    var n = 3;
    $('count').textContent = n;
    $('rmsg').innerHTML = 'このあと <b>' + REC_SECONDS + '秒</b> 撮ります<br>'
                        + '画面の文字は消してあります';
    REC.timer = setInterval(function () {
      n--;
      if (n > 0) { $('count').textContent = n; return; }
      clearInterval(REC.timer);
      $('count').textContent = '';
      $('recui').classList.remove('show');
      recStart();
    }, 900);
  }

  function recStart() {
    var mime = pickMime();
    if (!mime) {                       /* 録画できない端末＝画面収録用の無地モードとして続ける */
      REC.timer = setTimeout(recDone, REC_SECONDS * 1000);
      return;
    }
    try {
      var stream = cv.captureStream(30);
      REC.chunks = [];
      REC.mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9000000 });
      REC.mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
      REC.mr.onstop = function () {
        REC.blob = new Blob(REC.chunks, { type: mime });
        REC.name = 'registro500-' + Date.now() + (mime.indexOf('mp4') >= 0 ? '.mp4' : '.webm');
        recDone();
      };
      REC.mr.start();
      REC.timer = setTimeout(function () {
        try { REC.mr.stop(); } catch (e) { recDone(); }
      }, REC_SECONDS * 1000);
    } catch (e) {
      REC.timer = setTimeout(recDone, REC_SECONDS * 1000);
    }
  }

  function recDone() {
    $('recui').classList.add('show');
    $('count').textContent = '';
    $('rexit').hidden = false;
    $('rtag').hidden = false; $('rtag').textContent = 'ハッシュタグをコピー';
    $('tags').hidden = false;
    $('tags').textContent = HASHTAGS;

    if (REC.blob && REC.blob.size) {
      $('rsave').hidden = false;
      var mb = (REC.blob.size / 1048576).toFixed(1);
      var webm = REC.name.slice(-5) === '.webm';
      $('rmsg').innerHTML = REC_SECONDS + '秒 撮れました（' + mb + 'MB）'
        + (webm ? '<br>⚠️ この端末では <b>WebM</b> で保存されます。Instagram・TikTok は '
                + 'WebM を受け付けないので、上げる前に MP4 へ変換が要ります。'
                + '<br>iPhone で撮ると MP4 になります。' : '');
    } else {
      $('rsave').hidden = true;
      $('rmsg').innerHTML = 'この端末では、ページの中から動画を保存できません。<br>'
        + '⭐ <b>iPhone の画面収録</b>で撮ってください（文字を消したこの画面のまま撮れます）。';
    }
  }

  function recSave() {
    if (!REC.blob) return;
    var file = null;
    try { file = new File([REC.blob], REC.name, { type: REC.blob.type }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function () {});   /* 押された流れの中で呼ぶ */
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(REC.blob);
    a.download = REC.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }

  function recExit() {
    REC.on = false;
    clearTimeout(REC.timer); clearInterval(REC.timer);
    try { if (REC.mr && REC.mr.state === 'recording') REC.mr.stop(); } catch (e) {}
    REC.mr = null; REC.blob = null;
    document.body.classList.remove('rec');
    $('recui').classList.remove('show');
    $('count').textContent = '';
    showHint();
  }

  /* ============================================================ 進行 */

  function setMode(m) {
    mode = mod(m - 1, 3) + 1;
    hideInfo();
    if (mode === 1) { g.focus = null; g.nextAt = lastTs + 3.5; }   /* lastTs は「秒」 */
    if (mode === 2) { shInit(); sh.cur = null; sh.t0 = -999; }
    showBadge(MODE_NAME[mode]);
    renderHint();
  }

  function frame(ms) {
    var t = ms / 1000;
    var dt = lastTs ? Math.min(0.1, t - lastTs) : 0;   /* タブ復帰で飛ばないよう頭打ち */
    lastTs = t;

    if (mode === 1) drawGrid(t, dt);
    else if (mode === 2) drawShow(t, dt);
    else drawRiver(t, dt);

    /* ⚠️⚠️ captureStream は canvas の中身しか拾わない＝DOM で描いた文字は録画に写らない。
       だからクレジットは canvas に焼き込む。 */
    if (REC.on) drawCredit();

    requestAnimationFrame(frame);
  }

  function start() {
    if (started) return;
    started = true;
    $('gate').classList.add('gone');
    setTimeout(function () { $('gate').style.display = 'none'; }, 600);

    keepAwake();
    setMode(1);
    showHint();
    tickClock(); setInterval(tickClock, 10000);
    requestAnimationFrame(frame);
  }

  /* ---- 操作 ----
     ⚠️ リスナーを張る前に canvas を掴んでおくこと（cv が未定義のまま addEventListener して落ちた） */

  cv = $('cv'); ctx = cv.getContext('2d');
  resize();

  $('rsave').addEventListener('click', recSave);
  $('rexit').addEventListener('click', recExit);
  $('rtag').addEventListener('click', function () {
    var done = function () { $('rtag').textContent = 'コピーしました'; };
    if (navigator.clipboard) navigator.clipboard.writeText(HASHTAGS).then(done, function () {});
    else {
      var ta = document.createElement('textarea');
      ta.value = HASHTAGS; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (REC.on) { if (e.key === 'Escape') recExit(); return; }
    if (!started) { if (e.key === 'Enter' || e.key === ' ') start(); return; }
    var k = e.key;
    if (k === '1' || k === '2' || k === '3') { setMode(+k); showHint(); }
    else if (k === 'ArrowRight') { setMode(mode + 1); showHint(); }
    else if (k === 'ArrowLeft')  { setMode(mode - 1); showHint(); }
    else if (k === 'f' || k === 'F') { toggleFullscreen(); showHint(); }
    else showHint();
  });

  bindCanvas();
  window.addEventListener('mousemove', function () { if (started && !REC.on) showHint(); });
  window.addEventListener('resize', resize);

  /* ---- 起動 ---- */

  Promise.all([loadManifest(), loadSprite(), loadCars()]).then(function (r) {
    MAN = r[0]; SPRITE = r[1];
    var rows = r[2] || [];
    for (var i = 0; i < rows.length; i++) CARS[rows[i].document_id] = rows[i];
    buildOrder();

    $('gstat').textContent = MAN.count + '台　＋　ロゴ2枚';
    $('gbtn').disabled = false;
    $('gbtn').addEventListener('click', start);
  }).catch(function (e) {
    /* ⛔ 黙って何も出さない、をしない（マイ壁紙と同じ作法） */
    $('gstat').innerHTML = '材料を読み込めませんでした。<br>通信の具合かもしれません。少し時間をおいて開き直してください。';
  });

})();
</script>
</body>
</html>
