<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <title>マイガレージ - Registro500 Giappone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <!-- SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <style>
    /* CSSは既存デザインを継承 */
    html { font-size: 16px; }
    :root {
      --rg-surface: #ffffff; --rg-bg: #f4f6f8; --rg-border: #e5e7eb;
      --rg-text: #111827; --rg-muted: #6b7280; --rg-accent: #2856a8;
      --rg-primary-red: #e11d48; --rg-radius-card: 1rem;
      --rg-accent-soft: #e6efff; --rg-accent-border: #c2d4ff;
    }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; line-height: 1.7; color: var(--rg-text); background: var(--rg-bg); padding-top: 80px; padding-bottom: 100px; }
    .rg-header-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(244, 246, 248, 0.95); backdrop-filter: blur(8px); box-shadow: 0 1px 5px rgba(0,0,0,0.05); height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; }
    .rg-back-link a { text-decoration: none; color: var(--rg-accent); font-weight: 600; font-size: 0.95rem; }
    .rg-header-logo img { height: 32px; width: auto; mix-blend-mode: multiply; display: block; }
    .page { max-width: 72rem; margin: 0 auto; padding: 0 12px; }
    .form-card, .intro-card, .selection-card { background: var(--rg-surface); border-radius: var(--rg-radius-card); border: 1px solid var(--rg-border); padding: 1.5rem; margin-bottom: 1rem; }
    .page-title { font-size: 1.4rem; text-align: center; margin: 0 0 0.6rem; }
    .rg-section-title { display: block; margin: 1.5rem 0 1rem; font-weight: 700; font-size: 1.15rem; padding: 0.5rem 1rem; background: #eff6ff; border-left: 6px solid var(--rg-accent); color: var(--rg-accent); border-radius: 4px; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 0.7rem; border-radius: 0.5rem; border: 1px solid #d1d5db; font-size: 1rem; margin-bottom: 0.5rem; box-sizing: border-box; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .photo-upload-box { border: 2px dashed #ccc; border-radius: 8px; padding: 8px; text-align: center; background: #fafafa; cursor: pointer; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .preview-area { width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 4px; overflow: hidden; }
    .preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .submit-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem; background: rgba(255,255,255,0.95); border-top: 1px solid #ccc; text-align: center; z-index: 100; }
    #submitButton { width: 100%; max-width: 600px; padding: 0.8rem; border-radius: 999px; border: none; background: var(--rg-primary-red); color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .car-select-item { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem; border: 1px solid var(--rg-border); border-radius: 12px; margin-bottom: 12px; cursor: pointer; background: #fff; transition: all 0.2s; }
    .car-select-item:hover { border-color: var(--rg-accent); background: var(--rg-accent-soft); }
    #loginOverlay { position: fixed; inset: 0; background: rgba(244, 246, 248, 0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    #loginOverlay.hidden { display: none; }
    .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    .btn-google { background: #4285F4; color: white; border: none; border-radius: 999px; padding: 12px 24px; font-weight: bold; cursor: pointer; width: 100%; }
    #pageLoading, #carSelectionArea, #formContent { display: none; }
    .inline-small { display: flex; gap: 1rem; }
    .inline-small > div { flex: 1; }
  </style>
</head>
<body>

  <header class="rg-header-bar">
    <div class="rg-back-link"><a href="index.html">← ガレージに戻る</a></div>
    <div class="rg-header-logo"><img src="logo_horizontal.png" alt="Registro500"></div>
    <div style="flex:1;"></div>
  </header>

  <div id="loginOverlay" class="hidden">
    <div class="login-card">
      <h2>オーナー認証</h2>
      <p>マイガレージの利用にはログインが必要です。</p>
      <button class="btn-google" id="googleLoginBtn">Googleでログイン</button>
    </div>
  </div>

  <div class="page">
    <section class="intro-card">
      <h1 class="page-title">マイガレージ</h1>
      <p style="text-align:center; font-size:0.9rem; margin:0;">
        <span id="userEmailDisplay">...</span>
        <button id="logoutBtn" style="font-size:0.7rem; margin-left:10px;">ログアウト</button>
      </p>
    </section>

    <div id="pageLoading" style="display:block; text-align:center; padding:3rem;">読み込み中...</div>

    <!-- 所有車両選択 -->
    <section id="carSelectionArea" class="selection-card">
      <h2 style="font-size:1.1rem; margin-top:0;">管理する車両を選択してください</h2>
      <div id="myCarList"></div>
      <button class="btn-google" style="background:var(--rg-accent); margin-top:1.5rem;" onclick="showBlankForm()">＋ 新しく車両を登録する</button>
    </section>

    <!-- フォーム本体 -->
    <section class="form-card" id="formContent">
      <form id="carForm">
        <input type="hidden" id="document_id" name="document_id">
        
        <h2 class="rg-section-title">基本情報</h2>
        <label>ハンドルネーム <span style="color:red">*</span></label>
        <input type="text" name="handle_name" required>
        
        <label>都道府県 <span style="color:red">*</span></label>
        <input type="text" name="prefecture" required>

        <div class="inline-small">
          <div><label>年式 <span style="color:red">*</span></label><input type="text" name="year" required></div>
          <div><label>ボディカラー</label><input type="text" name="body_color"></div>
        </div>

        <label>車両モデル <span style="color:red">*</span></label>
        <select name="model_select_a" id="ModelSelectA" required>
          <option value="">選択してください</option>
          <option value="Nuova500">Nuova500</option>
          <option value="FIAT ABARTH">FIAT ABARTH</option>
          <option value="その他">その他</option>
        </select>

        <label>モデル詳細 <span style="color:red">*</span></label>
        <select name="model_select_b" id="ModelSelectB" required>
          <option value="">選択してください</option>
          <option value="F">F</option><option value="L">L</option><option value="R">R</option><option value="D">D</option>
          <option value="Giardiniera">Giardiniera</option><option value="595">595</option><option value="695">695</option><option value="その他">その他</option>
        </select>

        <h2 class="rg-section-title">こだわりポイント</h2>
        <textarea name="highlights" placeholder="愛車の自慢やカスタム内容など"></textarea>

        <h2 class="rg-section-title">写真登録</h2>
        <div class="photo-grid">
          <!-- メインのみ例示（他は同様に複製可能） -->
          <div class="photo-upload-box js-photo-upload" data-target="photo_main">
            <span class="photo-label">★メイン写真</span>
            <div class="preview-area"><img class="preview-img"></div>
            <input type="hidden" name="photo_main">
            <div class="status-text" style="font-size:0.7rem; color:#888;">タップしてアップロード</div>
          </div>
          <!-- 他の写真項目（photo_front, photo_rear等）も同様に設置可能 -->
        </div>
        <input type="file" id="globalFileInput" accept="image/*" style="display:none;">
      </form>
    </section>
  </div>

  <div class="submit-bar" id="submitBar" style="display:none;">
    <button id="submitButton">変更内容を保存する</button>
  </div>

  <script>
    (function() {
      if (firebase.apps.length === 0) firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth(), storage = firebase.storage();
      const overlay = document.getElementById('loginOverlay'), submitBtn = document.getElementById('submitButton'), carForm = document.getElementById('carForm'), pageLoading = document.getElementById('pageLoading'), formContent = document.getElementById('formContent'), carSelectionArea = document.getElementById('carSelectionArea'), myCarList = document.getElementById('myCarList'), fileInput = document.getElementById('globalFileInput');
      let activeTarget = null;

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          overlay.classList.add('hidden');
          document.getElementById('userEmailDisplay').textContent = user.email;
          const params = new URLSearchParams(window.location.search);
          const docId = params.get('doc');
          const mode = params.get('mode');

          if (mode === 'new') {
            showBlankForm();
          } else if (docId) {
            loadSpecificCar(docId);
          } else {
            detectUserCars(user.email);
          }
        } else {
          overlay.classList.remove('hidden');
          pageLoading.style.display = 'none';
        }
      });

      async function detectUserCars(email) {
        const { data: cars, error } = await supabaseClient
          .from('cars')
          .select('document_id, handle_name, model_display_c')
          .eq('owner_email', email.toLowerCase());

        pageLoading.style.display = 'none';
        if (!cars || cars.length === 0) {
          showBlankForm();
        } else if (cars.length === 1) {
          // 1台の場合は詳細画面へリダイレクト
          window.location.href = `detail.html?doc=${cars[0].document_id}`;
        } else {
          // 複数台の場合は選択画面
          carSelectionArea.style.display = 'block';
          myCarList.innerHTML = cars.map(car => `
            <div class="car-select-item" onclick="location.href='detail.html?doc=${car.document_id}'">
              <div>
                <strong>${car.model_display_c || 'FIAT 500'}</strong><br>
                <small>${car.handle_name} 様</small>
              </div>
              <div style="color:var(--rg-accent)">管理する 〉</div>
            </div>
          `).join('');
        }
      }

      window.showBlankForm = function() {
        pageLoading.style.display = 'none';
        carSelectionArea.style.display = 'none';
        formContent.style.display = 'block';
        document.getElementById('submitBar').style.display = 'block';
        carForm.reset();
        document.getElementById('document_id').value = "";
      };

      async function loadSpecificCar(docId) {
        const { data: car, error } = await supabaseClient
          .from('cars')
          .select('*')
          .eq('document_id', docId)
          .single();

        if (car) {
          pageLoading.style.display = 'none';
          formContent.style.display = 'block';
          document.getElementById('submitBar').style.display = 'block';
          fillForm(car);
        }
      }

      function fillForm(data) {
        Object.keys(data).forEach(key => {
          const el = carForm.querySelector(`[name="${key}"]`);
          if (el) el.value = data[key] || '';
          if (key.startsWith('photo_') && data[key]) {
            const box = document.querySelector(`[data-target="${key}"]`);
            if (box) {
              const img = box.querySelector('.preview-img');
              img.src = data[key];
              img.style.display = 'block';
            }
          }
        });
      }

      // 写真アップロード処理
      document.querySelectorAll('.js-photo-upload').forEach(box => {
        box.onclick = () => { activeTarget = box.dataset.target; fileInput.click(); };
      });

      fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !activeTarget) return;
        const box = document.querySelector(`[data-target="${activeTarget}"]`);
        box.querySelector('.status-text').textContent = "アップ中...";
        
        const path = `images/${auth.currentUser.uid}/${Date.now()}_${activeTarget}.jpg`;
        const ref = storage.ref().child(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        
        box.querySelector('input[type="hidden"]').value = url;
        const img = box.querySelector('.preview-img');
        img.src = url;
        img.style.display = 'block';
        box.querySelector('.status-text').textContent = "完了";
      };

      submitBtn.onclick = async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = "保存中...";
        const formData = new FormData(carForm);
        const data = Object.fromEntries(formData.entries());
        data.owner_email = auth.currentUser.email.toLowerCase();
        data.updated_at = new Date();

        // document_id が空なら新規登録（Supabase側で自動採番される）
        if (!data.document_id) delete data.document_id;

        const { data: savedData, error } = await supabaseClient
          .from('cars')
          .upsert(data, { onConflict: 'document_id' })
          .select();

        if (!error) {
          alert("保存しました");
          window.location.href = `detail.html?doc=${savedData[0].document_id}`;
        } else {
          alert("保存エラー: " + error.message);
          submitBtn.disabled = false;
        }
      };

      document.getElementById('googleLoginBtn').onclick = () => {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      };
      document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => location.reload());
    })();
  </script>
</body>
</html>
