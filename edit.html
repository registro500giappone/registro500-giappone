<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>編集フォーム - Registro500 Giappone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  
  <script src="config.js"></script>

  <style>
    /* ========== 共通CSS + スマホ対応 ========== */
    html { 
      font-size: 16px; 
    }
    @media (min-width: 1025px) { html { font-size: 18px; } }

    :root {
      --rg-surface: #ffffff; --rg-bg: #f4f6f8; --rg-border: #e5e7eb;
      --rg-text: #111827; --rg-muted: #6b7280; --rg-accent: #2856a8;
      --rg-primary-red: #e11d48; --rg-radius-card: 1rem;
    }

    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.7; color: var(--rg-text); background: var(--rg-bg);
      padding: 24px 12px 100px;
    }

    .page { max-width: 72rem; margin: 0 auto; }
    .form-card, .intro-card {
      background: var(--rg-surface); border-radius: var(--rg-radius-card);
      border: 1px solid var(--rg-border); padding: 1rem 1.1rem; margin-bottom: 1rem;
    }
    .page-title { font-size: 1.4rem; text-align: center; margin: 0 0 0.6rem; }

    .rg-section-title {
      position: relative; margin: 0 0 0.6rem; font-weight: 700; font-size: 1rem;
      display: inline-flex; align-items: center; padding: 0.2rem 0.8rem 0.2rem 1.1rem;
      border-radius: 999px; background: linear-gradient(90deg, rgba(40, 86, 168, 0.14), rgba(40, 86, 168, 0.02));
    }
    .rg-section-title::before {
      content: ""; position: absolute; left: 0.4rem; top: 50%; transform: translateY(-50%);
      width: 0.2rem; height: 1.1em; border-radius: 999px; background: var(--rg-accent);
    }

    label { display: block; font-size: 0.9rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.3rem; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid #d1d5db;
      font-size: 1rem; margin-bottom: 0.5rem; box-sizing: border-box;
    }
    textarea { min-height: 6em; resize: vertical; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .radio-group label { margin: 0; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
    .hint { font-size: 0.8rem; color: var(--rg-muted); margin-top: 0.2rem; }
    
    .inline-small { display: flex; gap: 1rem; }
    .inline-small > div { flex: 1; }

    /* 画像UI */
    .photo-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; margin-top: 10px;
    }
    .photo-upload-box {
      border: 2px dashed #ccc; border-radius: 8px; padding: 8px;
      text-align: center; background: #fafafa; position: relative;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      min-height: 160px;
    }
    .photo-upload-box:hover { border-color: var(--rg-accent); background: #f0f7ff; }
    .photo-upload-box.has-image { border-style: solid; border-color: #ddd; padding: 4px; }

    .photo-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: var(--rg-text); }
    
    .preview-area {
      width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 4px;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .placeholder-icon { font-size: 2rem; color: #ccc; }
    
    .upload-status {
      font-size: 0.75rem; color: var(--rg-muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .delete-photo-btn {
      margin-top: 4px; font-size: 0.75rem; color: var(--rg-primary-red);
      background: none; border: 1px solid var(--rg-primary-red);
      border-radius: 4px; padding: 2px 8px; cursor: pointer;
      display: none; 
    }

    .submit-bar {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem;
      background: rgba(255,255,255,0.95); border-top: 1px solid #ccc;
      text-align: center; backdrop-filter: blur(5px); z-index: 100;
    }
    #submitButton {
      width: 100%; max-width: 600px; padding: 0.8rem; border-radius: 999px; border: none;
      background: var(--rg-primary-red); color: white; font-weight: bold; font-size: 1rem;
      cursor: pointer; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3);
    }
    #submitButton:disabled { opacity: 0.5; cursor: not-allowed; }

    #loginOverlay {
      position: fixed; inset: 0; background: rgba(244, 246, 248, 0.98); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; transition: opacity 0.3s;
    }
    #loginOverlay.hidden { opacity: 0; pointer-events: none; }
    .login-card {
      background: white; padding: 40px 30px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%;
    }
    .btn-google {
      display: inline-flex; align-items: center; justify-content: center;
      background: #4285F4; color: white; border: none; border-radius: 999px;
      padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
      margin-top: 1rem;
    }
    
    #pageLoading { text-align: center; padding: 2rem; font-size: 1.2rem; color: #666; }
    #formContent { display: none; }
  </style>
</head>
<body>

      <button class="btn-google" onclick="startPopupLogin()">Googleでログイン</button>
      <div style="margin-top:20px;">
        <a href="index.html" style="color:#666;">キャンセルして戻る</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetDocId = params.get('doc') || ''; 

    if (typeof FIREBASE_CONFIG === 'undefined') {
      alert("config.js が読み込まれていません");
    } else {
      if (firebase.apps.length === 0) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
    }
    
    const auth = firebase.auth();
    const storage = firebase.storage();

    const overlay = document.getElementById('loginOverlay');
    const submitBtn = document.getElementById('submitButton');
    const form = document.getElementById('carForm');
    const loading = document.getElementById('pageLoading');
    const content = document.getElementById('formContent');
    const fileInput = document.getElementById('globalFileInput');

    let activeUploadTarget = null; 

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('userEmailDisplay').textContent = user.email;
        overlay.classList.add('hidden');
        await loadInitialData();
      } else {
        document.getElementById('userEmailDisplay').textContent = '未ログイン';
        overlay.classList.remove('hidden');
      }
    });

    window.startPopupLogin = function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("ログインエラー: " + err.message));
    };

    async function loadInitialData() {
      if (!targetDocId) {
        loading.style.display = 'none';
        content.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で登録する";
        return;
      }

      try {
        loading.textContent = "データを取得中...";
        const res = await fetch(`${API_URL}?mode=edit_init&doc=${targetDocId}`);
        const json = await res.json();

        if (json.success && json.data) {
          fillForm(json.data);
        } else {
          alert("データの取得に失敗しました");
        }
      } catch (e) {
        console.error(e);
        alert("通信エラーが発生しました");
      } finally {
        loading.style.display = 'none';
        content.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = "変更内容を保存する";
      }
    }

    function fillForm(data) {
      document.getElementById('DocumentID').value = data.DocumentID || '';

      Object.keys(data).forEach(key => {
        const val = data[key];
        if (key.startsWith('Photo')) {
          setPhotoPreview(key, val);
          return;
        }
        const el = form.querySelector(`[name="${key}"]`);
        if (!el) return;

        if (el.type === 'radio') {
          const radios = form.querySelectorAll(`input[name="${key}"]`);
          radios.forEach(r => {
            if (String(r.value) === String(val)) r.checked = true;
          });
        } else {
          el.value = (val !== null && val !== undefined) ? val : '';
        }
      });

      updateOthers('ModelSelectA', 'ModelTextAWrapper');
      updateOthers('ModelSelectB', 'ModelTextBWrapper');
      updateOthers('EngineTypeSelect', 'EngineTypeTextWrapper');
    }

    function updateOthers(selId, wrapId) {
      const sel = document.getElementById(selId);
      const wrap = document.getElementById(wrapId);
      if(sel && wrap) {
        wrap.style.display = (sel.value === 'その他') ? 'block' : 'none';
      }
    }

    ['ModelSelectA', 'ModelSelectB', 'EngineTypeSelect'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.addEventListener('change', () => {
          const map = {
            'ModelSelectA': 'ModelTextAWrapper',
            'ModelSelectB': 'ModelTextBWrapper',
            'EngineTypeSelect': 'EngineTypeTextWrapper'
          };
          updateOthers(id, map[id]);
        });
      }
    });

    /* ========== 画像処理・アップロード (高画質版) ========== */
    // ▼▼▼ 画質向上のための変更点: maxWidth=1920, quality=0.95 ▼▼▼
    function compressImage(file, maxWidth = 1920, quality = 0.95) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round(height * (maxWidth / width));
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // ▼▼▼ 変更点: 滑らかな縮小のための設定追加 ▼▼▼
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            ctx.drawImage(img, 0, 0, width, height);
            
            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error('Canvas to Blob failed'));
            }, 'image/jpeg', quality);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }
    
    document.querySelectorAll('.js-photo-upload').forEach(box => {
      box.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-photo-btn')) return;
        activeUploadTarget = box.dataset.target;
        fileInput.value = ''; 
        fileInput.click();
      });

      const delBtn = box.querySelector('.delete-photo-btn');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm("画像を削除しますか？")) {
          setPhotoPreview(box.dataset.target, "");
        }
      });
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeUploadTarget) return;

      const box = document.querySelector(`.js-photo-upload[data-target="${activeUploadTarget}"]`);
      const statusEl = box.querySelector('.upload-status');
      
      statusEl.textContent = "画像を最適化中...";
      
      try {
        const user = auth.currentUser;
        if (!user) throw new Error("認証切れです");

        // 高画質設定で呼び出し
        const compressedBlob = await compressImage(file, 1920, 0.95);
        statusEl.textContent = "アップロード中...";

        const timestamp = Date.now();
        const random = Math.floor(Math.random() * 1000);
        // ファイル名を少し変更（キャッシュ対策）
        const path = `images/${user.uid}/${timestamp}_${random}_hd.jpg`;
        
        const storageRef = storage.ref().child(path);
        await storageRef.put(compressedBlob);
        const url = await storageRef.getDownloadURL();
        
        setPhotoPreview(activeUploadTarget, url);
        statusEl.textContent = "完了 (高画質)";

      } catch (err) {
        console.error(err);
        statusEl.textContent = "エラー: " + err.message;
        alert("アップロード失敗: " + err.message);
      }
    });

    function setPhotoPreview(targetName, url) {
      const box = document.querySelector(`.js-photo-upload[data-target="${targetName}"]`);
      if (!box) return;

      const input = box.querySelector(`input[name="${targetName}"]`);
      const img = box.querySelector('.preview-img');
      const placeholder = box.querySelector('.placeholder-icon');
      const delBtn = box.querySelector('.delete-photo-btn');
      const status = box.querySelector('.upload-status');

      input.value = url || "";

      if (url) {
        img.src = url;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        delBtn.style.display = 'inline-block';
        box.classList.add('has-image');
        status.textContent = "設定済み";
      } else {
        img.src = "";
        img.style.display = 'none';
        placeholder.style.display = 'inline';
        delBtn.style.display = 'none';
        box.classList.remove('has-image');
        status.textContent = "未選択";
      }
    }

    submitBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) { alert("ログインしてください"); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      try {
        const idToken = await user.getIdToken(true);
        const fd = new FormData(form);
        const formData = {};
        fd.forEach((val, key) => { formData[key] = val; });
        
        formData.idToken = idToken;
        formData.DocumentID = targetDocId || document.getElementById('DocumentID').value;

        const action = formData.DocumentID ? 'update' : 'save';
        
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: action,
            formData: formData
          })
        });

        const json = await res.json();

        if (json.success) {
          alert("保存しました！");
          window.location.href = "index.html"; 
        } else {
          alert("エラー: " + json.error);
          submitBtn.disabled = false;
          submitBtn.textContent = "再送信";
        }

      } catch (e) {
        console.error(e);
        alert("送信エラー: " + e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "再送信";
      }
    });
  </script>
</body>
</html>
