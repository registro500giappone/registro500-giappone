<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>編集フォーム - Registro500 Giappone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    /* 共通CSS + フォーム用スタイル */
    html { font-size: 28px; }
    @media (min-width: 1025px) { html { font-size: 18px; } }

    :root {
      --rg-surface: #ffffff; --rg-bg: #f4f6f8; --rg-border: #e5e7eb;
      --rg-text: #111827; --rg-muted: #6b7280; --rg-accent: #2856a8;
      --rg-primary-red: #e11d48; --rg-radius-card: 1rem;
    }

    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.7; color: var(--rg-text); background: var(--rg-bg);
      padding: 24px 12px 100px; /* 下部余白 */
    }

    .page { max-width: 72rem; margin: 0 auto; }
    .form-card, .intro-card {
      background: var(--rg-surface); border-radius: var(--rg-radius-card);
      border: 1px solid var(--rg-border); padding: 1rem 1.1rem; margin-bottom: 1rem;
    }
    .page-title { font-size: 1.6rem; text-align: center; margin: 0 0 0.6rem; }

    /* 見出し */
    .rg-section-title {
      position: relative; margin: 0 0 0.6rem; font-weight: 700; font-size: 0.95rem;
      display: inline-flex; align-items: center; padding: 0.18rem 0.8rem 0.18rem 1.05rem;
      border-radius: 999px; background: linear-gradient(90deg, rgba(40, 86, 168, 0.14), rgba(40, 86, 168, 0.02));
    }
    .rg-section-title::before {
      content: ""; position: absolute; left: 0.4rem; top: 50%; transform: translateY(-50%);
      width: 0.18rem; height: 1.1em; border-radius: 999px; background: var(--rg-accent);
    }

    /* 入力部品 */
    label { display: block; font-size: 0.95rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.3rem; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #d1d5db;
      font-size: 1rem; margin-bottom: 0.5rem; box-sizing: border-box;
    }
    textarea { min-height: 6em; resize: vertical; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .radio-group label { margin: 0; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
    .hint { font-size: 0.8rem; color: var(--rg-muted); margin-top: 0.2rem; }
    
    .inline-small { display: flex; gap: 1rem; }
    .inline-small > div { flex: 1; }

    /* 送信バー */
    .submit-bar {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem;
      background: rgba(255,255,255,0.9); border-top: 1px solid #ccc;
      text-align: center; backdrop-filter: blur(5px); z-index: 100;
    }
    #submitButton {
      width: 100%; max-width: 600px; padding: 0.8rem; border-radius: 999px; border: none;
      background: var(--rg-primary-red); color: white; font-weight: bold; font-size: 1rem;
      cursor: pointer; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3);
    }
    #submitButton:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ログインオーバーレイ */
    #loginOverlay {
      position: fixed; inset: 0; background: rgba(244, 246, 248, 0.98); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; transition: opacity 0.3s;
    }
    #loginOverlay.hidden { opacity: 0; pointer-events: none; }
    .login-card {
      background: white; padding: 40px 30px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%;
    }
    .btn-google {
      display: inline-flex; align-items: center; justify-content: center;
      background: #4285F4; color: white; border: none; border-radius: 999px;
      padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
      margin-top: 1rem;
    }
    
    /* ローディング */
    #pageLoading { text-align: center; padding: 2rem; font-size: 1.2rem; color: #666; }
    #formContent { display: none; }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-card">
      <h2 style="margin-top:0;">オーナー認証</h2>
      <p>編集・登録を行うにはログインが必要です。</p>
      <button class="btn-google" onclick="startPopupLogin()">Googleでログイン</button>
      <div style="margin-top:20px;">
        <a href="index.html" style="color:#666;">キャンセルして戻る</a>
      </div>
    </div>
  </div>

  <div class="page">
    <section class="intro-card">
      <h1 class="page-title">編集フォーム</h1>
      <p style="text-align:center; font-size:0.9rem; margin:0;">
        ログイン中: <span id="userEmailDisplay">確認中...</span>
      </p>
    </section>

    <div id="pageLoading">データを読み込んでいます...</div>

    <section class="form-card" id="formContent">
      <form id="carForm">
        <input type="hidden" id="DocumentID" name="DocumentID">

        <h2 class="rg-section-title">基本情報</h2>
        <label>ハンドルネーム</label>
        <input type="text" name="HandleName">

        <label>都道府県</label>
        <input type="text" name="Prefecture" placeholder="例：神奈川県">

        <label>車両モデル</label>
        <select name="ModelSelectA" id="ModelSelectA">
          <option value="">選択してください</option>
          <option value="Nuova500">Nuova500</option>
          <option value="ABARTH">ABARTH</option>
          <option value="その他">その他</option>
        </select>
        <div id="ModelTextAWrapper" style="display:none;">
          <input type="text" name="ModelTextA" placeholder="その他の車両名">
        </div>

        <label>モデル詳細</label>
        <select name="ModelSelectB" id="ModelSelectB">
          <option value="">選択してください</option>
          <option value="F">F</option>
          <option value="L">L</option>
          <option value="R">R</option>
          <option value="D">D</option>
          <option value="Giardiniera">Giardiniera</option>
          <option value="Sport">Sport</option>
          <option value="N Normale">N Normale</option>
          <option value="Prima Serie">Prima Serie</option>
          <option value="595">595</option>
          <option value="695">695</option>
          <option value="その他">その他</option>
        </select>
        <div id="ModelTextBWrapper" style="display:none;">
          <input type="text" name="ModelTextB" placeholder="その他のモデル名">
        </div>

        <div class="inline-small">
          <div>
            <label>年式</label>
            <input type="number" name="Year" placeholder="1964">
          </div>
          <div>
            <label>ボディカラー</label>
            <input type="text" name="BodyColor">
          </div>
        </div>

        <div class="inline-small">
          <div>
            <label>全長(cm)</label>
            <input type="number" name="Length_cm">
          </div>
          <div>
            <label>乗車定員</label>
            <div class="radio-group">
              <label><input type="radio" name="Capacity" value="4">4人</label>
              <label><input type="radio" name="Capacity" value="5">5人</label>
            </div>
          </div>
        </div>

        <label>ハンドル</label>
        <div class="radio-group">
          <label><input type="radio" name="Steering" value="左">左</label>
          <label><input type="radio" name="Steering" value="右">右</label>
        </div>

        <h2 class="rg-section-title">エンジン関係</h2>
        <label>排気量(cc)</label>
        <input type="number" name="EngineCC">

        <label>エンジン形式</label>
        <select name="EngineTypeSelect" id="EngineTypeSelect">
          <option value="">選択してください</option>
          <option value="110">110</option>
          <option value="110.004">110.004</option>
          <option value="110D.000">110D.000</option>
          <option value="110F.000">110F.000</option>
          <option value="120">120</option>
          <option value="126A.000">126A.000</option>
          <option value="126A1.000">126A1.000</option>
          <option value="126A1.048">126A1.048</option>
          <option value="126A5.000">126A5.000</option>
          <option value="不明">不明</option>
          <option value="その他">その他</option>
        </select>
        <div id="EngineTypeTextWrapper" style="display:none;">
          <input type="text" name="EngineTypeText">
        </div>

        <label>点火形式</label>
        <div class="radio-group">
          <label><input type="radio" name="IgnitionType" value="ポイント">ポイント</label>
          <label><input type="radio" name="IgnitionType" value="セミトラ">セミトラ</label>
          <label><input type="radio" name="IgnitionType" value="フルトラ">フルトラ</label>
        </div>
        <input type="text" name="IgnitionSubType" placeholder="製品名など">

        <label>配電方式</label>
        <div class="radio-group">
          <label><input type="radio" name="DistributionType" value="独立点火">独立点火</label>
          <label><input type="radio" name="DistributionType" value="同時点火">同時点火</label>
        </div>

        <label>コイル</label>
        <input type="text" name="CoilName">
        <label>プラグ</label>
        <input type="text" name="PlugName">

        <label>燃料供給装置</label>
        <div class="radio-group">
          <label><input type="radio" name="FuelInjection" value="キャブレター">キャブレター</label>
          <label><input type="radio" name="FuelInjection" value="インジェクション">インジェクション</label>
        </div>

        <label>キャブレター等</label>
        <input type="text" name="CarburetorName">

        <label>燃料ポンプ</label>
        <div class="radio-group">
          <label><input type="radio" name="FuelPump" value="機械式">機械式</label>
          <label><input type="radio" name="FuelPump" value="電気式">電気式</label>
        </div>
        <input type="text" name="ElectricPumpName" placeholder="電ポン名称">

        <label>発電機</label>
        <div class="radio-group">
          <label><input type="radio" name="Generator" value="ダイナモ">ダイナモ</label>
          <label><input type="radio" name="Generator" value="オルタネーター">オルタネーター</label>
          <label><input type="radio" name="Generator" value="その他">その他</label>
        </div>

        <label>オイルクーラー</label>
        <div class="radio-group">
          <label><input type="radio" name="OilCooler" value="無し">無し</label>
          <label><input type="radio" name="OilCooler" value="機械式">機械式</label>
          <label><input type="radio" name="OilCooler" value="電気式">電気式</label>
        </div>

        <h2 class="rg-section-title">駆動系・足回り</h2>
        <label>ミッション</label>
        <div class="radio-group">
          <label><input type="radio" name="Transmission" value="4速">4速</label>
          <label><input type="radio" name="Transmission" value="5速">5速</label>
        </div>

        <label>シンクロ</label>
        <div class="radio-group">
          <label><input type="radio" name="Synchro" value="ノンシンクロ">ノンシンクロ</label>
          <label><input type="radio" name="Synchro" value="シンクロ">シンクロ</label>
        </div>

        <label>ジョイント</label>
        <div class="radio-group">
          <label><input type="radio" name="Joint" value="ノーマル">ノーマル</label>
          <label><input type="radio" name="Joint" value="CVジョイント">CVジョイント</label>
        </div>
        
        <label>ホイール</label>
        <div class="radio-group">
          <label><input type="radio" name="Wheel" value="純正">純正</label>
          <label><input type="radio" name="Wheel" value="社外">社外</label>
        </div>

        <div class="inline-small">
          <div><label>リム径(inch)</label><input type="number" name="RimDiameter_in"></div>
          <div><label>リム幅(inch)</label><input type="number" name="RimWidth_in" step="0.1"></div>
        </div>

        <label>タイヤ型式</label>
        <div class="radio-group">
          <label><input type="radio" name="TireType" value="チューブ">チューブ</label>
          <label><input type="radio" name="TireType" value="チューブレス">チューブレス</label>
        </div>

        <label>タイヤサイズ</label>
        <input type="text" name="TireSize" placeholder="125R12">
        <label>タイヤメーカー</label>
        <input type="text" name="TireBrandName">

        <h2 class="rg-section-title">オイル・バッテリー他</h2>
        <label>エンジンオイル</label>
        <input type="text" name="EngineOil">
        <label>交換周期</label>
        <input type="text" name="EngineOilInterval">

        <label>ミッションオイル</label>
        <input type="text" name="TransmissionOil">
        <label>交換周期</label>
        <input type="text" name="TransmissionOilInterval">

        <label>バッテリー</label>
        <input type="text" name="Battery">

        <h2 class="rg-section-title">こだわりポイント</h2>
        <textarea name="Highlights"></textarea>

        <h2 class="rg-section-title">SNS / Web</h2>
        <label>X (Twitter)</label>
        <input type="text" name="X_Twitter" placeholder="@...">
        <label>Instagram</label>
        <input type="text" name="Instagram">
        <label>みんカラ</label>
        <input type="text" name="Minkara">
        <label>Facebook</label>
        <input type="text" name="Facebook">
        <label>Threads</label>
        <input type="text" name="Threads">
        <label>ブログ・HP</label>
        <input type="text" name="BlogOrWebsite">

        <h2 class="rg-section-title">写真 (URL)</h2>
        <p class="hint">※現在、画像URLの貼り付けのみ対応しています</p>
        <label>メイン写真</label>
        <input type="text" name="PhotoMain" placeholder="https://...">
        <label>正面</label>
        <input type="text" name="PhotoFront">
        <label>側面</label>
        <input type="text" name="PhotoSide">
        <label>背面</label>
        <input type="text" name="PhotoRear">
        <label>エンジン</label>
        <input type="text" name="PhotoEngine">
        <label>ハンドル/メーター</label>
        <input type="text" name="PhotoSteeringCluster">
        <label>内装</label>
        <input type="text" name="PhotoInterior">

      </form>
    </section>
  </div>

  <div class="submit-bar">
    <button id="submitButton" disabled>ログインを確認中...</button>
  </div>

  <script>
    /* ========== 設定エリア ========== */
    // ★ あなたのGAS API URLを入れてください
    const API_URL = "https://script.google.com/macros/s/AKfycbz0BJpaG-AcK3T6YYtav-nfd3gqGlkEWu3AvpW5uRT52N9jW8pBKLrpLSqvXqyD2ghwCA/exec";
    
    const firebaseConfig = {
      apiKey: "AIzaSyCNCNsu61S3DIQ2pcmK2Ic_vqCINlZB9nk",
      authDomain: "registro500giappone-93f98.firebaseapp.com",
      projectId: "registro500giappone-93f98",
      storageBucket: "registro500giappone-93f98.firebasestorage.app",
      messagingSenderId: "723005462978",
      appId: "1:723005462978:web:e967a16a278f54b278de5b",
      measurementId: "G-ZRBFX1V51B"
    };

    // URLパラメータ取得
    const params = new URLSearchParams(window.location.search);
    const targetDocId = params.get('doc') || ''; // 空なら新規登録

    /* ========== Firebase初期化 ========== */
    if (firebase.apps.length === 0) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    /* ========== DOM要素 ========== */
    const overlay = document.getElementById('loginOverlay');
    const emailDisplay = document.getElementById('userEmailDisplay');
    const submitBtn = document.getElementById('submitButton');
    const form = document.getElementById('carForm');
    const loading = document.getElementById('pageLoading');
    const content = document.getElementById('formContent');

    /* ========== 認証ロジック ========== */
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        // ログイン済み
        document.getElementById('userEmailDisplay').textContent = user.email;
        overlay.classList.add('hidden'); // オーバーレイを消す
        
        // データ読み込み開始
        await loadInitialData();
      } else {
        // 未ログイン
        document.getElementById('userEmailDisplay').textContent = '未ログイン';
        overlay.classList.remove('hidden'); // オーバーレイを表示
      }
    });

    window.startPopupLogin = function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("ログインエラー: " + err.message));
    };

    /* ========== データ取得と表示 ========== */
    async function loadInitialData() {
      // 新規登録なら読み込み不要
      if (!targetDocId) {
        loading.style.display = 'none';
        content.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で登録する";
        return;
      }

      // 編集モード：APIからデータ取得
      try {
        loading.textContent = "データを取得中...";
        const res = await fetch(`${API_URL}?mode=edit_init&doc=${targetDocId}`);
        const json = await res.json();

        if (json.success && json.data) {
          fillForm(json.data);
        } else {
          alert("データの取得に失敗しました");
        }
      } catch (e) {
        console.error(e);
        alert("通信エラーが発生しました");
      } finally {
        loading.style.display = 'none';
        content.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = "変更内容を保存する";
      }
    }

    function fillForm(data) {
      // IDをセット
      document.getElementById('DocumentID').value = data.DocumentID || '';

      Object.keys(data).forEach(key => {
        const val = data[key];
        const el = form.querySelector(`[name="${key}"]`);
        if (!el) return;

        if (el.type === 'radio') {
          // ラジオボタン
          const radios = form.querySelectorAll(`input[name="${key}"]`);
          radios.forEach(r => {
            if (String(r.value) === String(val)) r.checked = true;
          });
        } else {
          // テキスト/セレクト
          el.value = (val !== null && val !== undefined) ? val : '';
        }
      });

      // 「その他」の表示制御
      updateOthers('ModelSelectA', 'ModelTextAWrapper');
      updateOthers('ModelSelectB', 'ModelTextBWrapper');
      updateOthers('EngineTypeSelect', 'EngineTypeTextWrapper');
    }

    // その他入力欄の表示切り替え
    function updateOthers(selId, wrapId) {
      const sel = document.getElementById(selId);
      const wrap = document.getElementById(wrapId);
      if(sel && wrap) {
        wrap.style.display = (sel.value === 'その他') ? 'block' : 'none';
      }
    }

    // イベントリスナー登録
    ['ModelSelectA', 'ModelSelectB', 'EngineTypeSelect'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.addEventListener('change', () => {
          const map = {
            'ModelSelectA': 'ModelTextAWrapper',
            'ModelSelectB': 'ModelTextBWrapper',
            'EngineTypeSelect': 'EngineTypeTextWrapper'
          };
          updateOthers(id, map[id]);
        });
      }
    });

    /* ========== 送信ロジック (POST) ========== */
    submitBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) { alert("ログインしてください"); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      try {
        // IDトークン取得
        const idToken = await user.getIdToken(true);

        // フォームデータ収集
        const fd = new FormData(form);
        const formData = {};
        fd.forEach((val, key) => { formData[key] = val; });
        
        // トークンとIDを追加
        formData.idToken = idToken;
        formData.DocumentID = targetDocId || document.getElementById('DocumentID').value;

        // APIへ送信 (POST)
        const action = formData.DocumentID ? 'update' : 'save';
        
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GASのCORS対策でtext/plain推奨
          body: JSON.stringify({
            action: action,
            formData: formData
          })
        });

        const json = await res.json();

        if (json.success) {
          alert("保存しました！");
          window.location.href = "index.html"; // 一覧へ戻る
        } else {
          alert("エラー: " + json.error);
          submitBtn.disabled = false;
          submitBtn.textContent = "再送信";
        }

      } catch (e) {
        console.error(e);
        alert("送信エラー: " + e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "再送信";
      }
    });
  </script>
</body>
</html>
