  <style>
    html { font-size: 16px; }
    @media (min-width: 1025px) { html { font-size: 18px; } }
    :root {
      --rg-surface: #ffffff; --rg-bg: #f4f6f8; --rg-border: #e5e7eb;
      --rg-text: #111827; --rg-muted: #6b7280; --rg-accent: #2856a8;
      --rg-primary-red: #e11d48; --rg-radius-card: 1rem;
      --rg-accent-soft: #e6efff; --rg-accent-border: #c2d4ff;
    }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; line-height: 1.7; color: var(--rg-text); background: var(--rg-bg); padding-top: 80px; padding-bottom: 100px; }
    .rg-header-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(244, 246, 248, 0.95); backdrop-filter: blur(8px); box-shadow: 0 1px 5px rgba(0,0,0,0.05); height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; }
    .rg-back-link a { text-decoration: none; color: var(--rg-accent); font-weight: 600; white-space: nowrap; font-size: 0.95rem; }
    .rg-header-logo img { height: 32px; width: auto; mix-blend-mode: multiply; display: block; }
    @media (min-width: 1025px) { .rg-header-logo img { height: 54px; } .rg-header-bar { height: 80px; } }
    .page { max-width: 72rem; margin: 0 auto; padding: 0 12px; }
    .form-card, .intro-card, .selection-card { background: var(--rg-surface); border-radius: var(--rg-radius-card); border: 1px solid var(--rg-border); padding: 1.5rem; margin-bottom: 1rem; }
    .page-title { font-size: 1.4rem; text-align: center; margin: 0 0 0.6rem; }
    .rg-section-title { display: block; margin: 1.5rem 0 1rem; font-weight: 700; font-size: 1.15rem; padding: 0.5rem 1rem; background: #eff6ff; border-left: 6px solid var(--rg-accent); border-bottom: 1px solid var(--rg-border); border-radius: 4px; color: var(--rg-accent); }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.3rem; }
    .badge-required { background: var(--rg-primary-red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; font-weight: normal; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 0.7rem; border-radius: 0.5rem; border: 1px solid #d1d5db; font-size: 1rem; margin-bottom: 0.5rem; box-sizing: border-box; }
    textarea { min-height: 6em; resize: vertical; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .radio-group label { margin: 0; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .photo-upload-box { border: 2px dashed #ccc; border-radius: 8px; padding: 8px; text-align: center; background: #fafafa; cursor: pointer; min-height: 160px; display: flex; flex-direction: column; align-items: center; }
    .preview-area { width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .upload-status { font-size: 0.75rem; color: var(--rg-muted); margin-top: 6px; }
    .delete-photo-btn { margin-top: 4px; font-size: 0.75rem; color: var(--rg-primary-red); border: 1px solid var(--rg-primary-red); border-radius: 4px; padding: 2px 8px; background: none; cursor: pointer; }
    .submit-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem; background: rgba(255,255,255,0.95); border-top: 1px solid #ccc; text-align: center; z-index: 100; }
    #submitButton { width: 100%; max-width: 600px; padding: 0.8rem; border-radius: 999px; border: none; background: var(--rg-primary-red); color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    #loginOverlay { position: fixed; inset: 0; background: rgba(244, 246, 248, 0.98); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #loginOverlay.hidden { display: none; }
    .login-card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }

  <script>
    (function() {
      if (firebase.apps.length === 0) firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth(), storage = firebase.storage();
      const overlay = document.getElementById('loginOverlay'), submitBtn = document.getElementById('submitButton'), carForm = document.getElementById('carForm'), pageLoading = document.getElementById('pageLoading'), formContent = document.getElementById('formContent'), carSelectionArea = document.getElementById('carSelectionArea'), myCarList = document.getElementById('myCarList'), fileInput = document.getElementById('globalFileInput');
      let currentIdToken = "", activeTarget = null;

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          overlay.classList.add('hidden');
          document.getElementById('userEmailDisplay').textContent = user.email;
          document.getElementById('logoutBtn').style.display = 'inline-block';
          currentIdToken = await user.getIdToken(true);
          
          const docId = new URLSearchParams(window.location.search).get('doc');
          if (docId) {
            // URLにdocIdがある場合（編集ボタン経由）は、自動転送せずその車のデータを読み込む
            loadSpecificCar(docId); 
          } else {
            // URLにdocIdがない場合（マイガレージ経由）のみ自動判別ロジック
            detectUserCars(); 
          }
        } else {
          overlay.classList.remove('hidden');
          pageLoading.style.display = 'none';
        }
      });

      document.getElementById('googleLoginBtn').onclick = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("ログインエラー: " + e.message));
      };
      document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => window.location.reload());

async function detectUserCars() {
        try {
          // Supabaseから自分の所有車両を検索
          const { data: cars, error } = await supabaseClient
            .from('cars')
            .select('document_id, handle_name, model_select_a')
            .eq('owner_email', auth.currentUser.email.toLowerCase());

          if (error) throw error;
          
          if (!cars || cars.length === 0) {
            showBlankForm(); 
          } else if (cars.length === 1) {
            // 1台ならその車の詳細ページへ
            window.location.href = `detail.html?doc=${cars[0].document_id}`;
          } else {
            // 複数台なら選択画面を表示
            showCarSelection(cars); 
          }
        } catch (e) {
          console.error(e);
          pageLoading.innerHTML = `<div style="color:red; padding:20px;">エラー: ${e.message}</div>`;
        }
      }

      function showCarSelection(cars) {
        pageLoading.style.display = 'none'; carSelectionArea.style.display = 'block';
        myCarList.innerHTML = '';
        cars.forEach(car => {
          const div = document.createElement('div');
          div.className = 'car-select-item';
          div.innerHTML = `<div class="car-select-info">🚗 ${car.model_select_a} (${car.handle_name}様)</div><div style="color:var(--rg-accent)">詳細を表示 〉</div>`;
          div.onclick = () => window.location.href = `detail.html?doc=${car.document_id}`;
          myCarList.appendChild(div);
        });
      }
      
      function showCarSelection(cars) {
        pageLoading.style.display = 'none'; carSelectionArea.style.display = 'block';
        myCarList.innerHTML = '';
        cars.forEach(car => {
          const div = document.createElement('div');
          div.className = 'car-select-item';

          div.onclick = () => window.location.href = `detail.html?doc=${car.DocumentID}`;
          myCarList.appendChild(div);
        });
      }

      window.showBlankForm = function() {
        carSelectionArea.style.display = 'none'; pageLoading.style.display = 'none'; formContent.style.display = 'block';
        submitBtn.disabled = false; submitBtn.textContent = "新しく登録する";
        document.getElementById('DocumentID').value = ""; carForm.reset();
      };

      function fillForm(data) {
        document.getElementById('DocumentID').value = data.DocumentID || '';
        Object.keys(data).forEach(key => {
          const val = data[key];
          if (key.startsWith('Photo')) { setPhotoPreview(key, val); return; }
          const el = carForm.querySelector(`[name="${key}"]`);
          if (!el) return;
          if (el.type === 'radio') {
            const radios = carForm.querySelectorAll(`input[name="${key}"]`);
            radios.forEach(r => { if (String(r.value) === String(val)) r.checked = true; });
          } else { el.value = val || ''; }
        });
        
        ['ModelSelectA', 'ModelSelectB', 'EngineTypeSelect'].forEach(id => {
          const sel = document.getElementById(id);
          const wrap = document.getElementById(id + 'Wrapper') || document.getElementById(id + 'SelectWrapper');
          if (sel && wrap) {
            const options = Array.from(sel.options).map(o => o.value);
            const currentVal = sel.value;
            if (currentVal === 'その他' || (currentVal && !options.includes(currentVal))) {
              sel.value = 'その他'; wrap.style.display = 'block';
            } else {
              wrap.style.display = (sel.value === 'その他') ? 'block' : 'none';
            }
          }
        });
      }

      function setPhotoPreview(target, url) {
        const box = document.querySelector(`.js-photo-upload[data-target="${target}"]`);
        if (!box) return;
        const img = box.querySelector('.preview-img'), placeholder = box.querySelector('.placeholder-icon'), input = box.querySelector(`input[name="${target}"]`), delBtn = box.querySelector('.delete-photo-btn'), status = box.querySelector('.upload-status');
        input.value = url || "";
        if (url) { img.src = url; img.style.display = 'block'; placeholder.style.display = 'none'; delBtn.style.display = 'inline-block'; status.textContent = "設定済み"; }
        else { img.src = ""; img.style.display = 'none'; placeholder.style.display = 'inline'; delBtn.style.display = 'none'; status.textContent = "未選択"; }
      }

      document.querySelectorAll('.js-photo-upload').forEach(box => {
        box.onclick = (e) => { if (e.target.classList.contains('delete-photo-btn')) return; activeTarget = box.dataset.target; fileInput.click(); };
        box.querySelector('.delete-photo-btn').onclick = (e) => { e.stopPropagation(); if (confirm("削除しますか？")) setPhotoPreview(box.dataset.target, ""); };
      });

      fileInput.onchange = async (e) => {
        const file = e.target.files[0]; if (!file || !activeTarget) return;
        const status = document.querySelector(`.js-photo-upload[data-target="${activeTarget}"] .upload-status`);
        status.textContent = "アップ中...";
        try {
          const path = `images/${auth.currentUser.uid}/${Date.now()}_${activeTarget}.jpg`;
          const ref = storage.ref().child(path);
          await ref.put(file);
          const url = await ref.getDownloadURL();
          setPhotoPreview(activeTarget, url);
        } catch (err) { alert("アップロード失敗"); }
      };
