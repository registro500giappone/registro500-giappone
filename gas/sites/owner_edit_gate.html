<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <title>Registro500 Giappone – 車両編集のご案内</title>

  <style>
    :root {
      --rg-surface: #ffffff;
      --rg-bg: #f4f6f8;
      --rg-border: #e5e7eb;
      --rg-text: #111827;
      --rg-muted: #6b7280;

      --rg-accent: #2856a8;
      --rg-accent-soft: #e6efff;
      --rg-radius-card: 1rem;

      /* 互換用 */
      --text-main: var(--rg-text);
      --text-sub: var(--rg-muted);
      --accent: var(--rg-accent);
      --accent-soft: var(--rg-accent-soft);
    }

    * { box-sizing: border-box; }

    html {
      font-size: 28px;
      max-width: 100%;
      overflow-x: hidden;
    }
    @media (min-width:1025px){
      html { font-size:18px; }
    }

    body {
      margin:0;
      min-height:100vh;
      background:var(--rg-bg);
      color:var(--rg-text);
      padding:16px 12px 32px;
      -webkit-text-size-adjust:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    }
    @media(min-width:768px){
      body { padding:32px 24px 40px; }
    }
    @media(min-width:1200px){
      body { display:flex; align-items:center; justify-content:center; }
    }

    .gate-wrapper { width:100%; }
    @media(min-width:1200px){
      .gate-wrapper{ max-width:680px; margin:0 auto; }
    }

    .rg-card {
      background:var(--rg-surface);
      border-radius:var(--rg-radius-card);
      border:1px solid var(--rg-border);
      padding:1rem 1.2rem;
      box-shadow:0 4px 12px rgba(15,23,42,0.10);
    }

    /* --- タイトル --- */
    .gate-title {
      text-align:center;              /* ★中央揃え */
      font-size:1.6rem;
      font-weight:700;
      margin:0 0 12px;
      color:var(--text-main);
    }
    @media(max-width:1024px){
      .gate-title{ font-size:2.0rem; margin-bottom:14px; }
    }

    /* オーナー専用バッジ 削除 */
    .gate-badge { display:none; }

    /* --- サブタイトル --- */
    .gate-subtitle {
      margin:0;
      font-size:1.0rem;
      line-height:1.7;
      color:var(--text-sub);
      text-align:center;
    }
    @media(max-width:1024px){
      .gate-subtitle{ font-size:1.35rem; line-height:1.9; }
    }

    /* --- 見出し（青ピル）--- */
    .rg-section-title{
      position:relative;
      font-size:0.95rem;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      gap:0.35rem;
      padding:0.18rem 0.8rem 0.18rem 1.05rem;
      background:linear-gradient(90deg,rgba(40,86,168,0.14),rgba(40,86,168,0.02));
      border-radius:999px;
      margin:12px 0 10px;
    }
    .rg-section-title::before{
      content:"";
      position:absolute;
      left:0.4rem;
      top:50%;
      transform:translateY(-50%);
      width:0.18rem;
      height:1.1em;
      background:var(--accent);
      border-radius:999px;
    }
    @media(max-width:1024px){
      .rg-section-title{ font-size:1.6rem; }
    }

    /* --- リスト --- */
    .gate-list{
      font-size:0.9rem;
      color:var(--text-sub);
      line-height:1.7;
      padding-left:1rem;
      margin:8px 0 14px;
    }
    @media(max-width:1024px){
      .gate-list{ font-size:1.4rem; line-height:2.0; }
    }

    .gate-list strong { font-weight:600; color:var(--text-main); }

    .gate-note{
      font-size:0.85rem;
      color:#9ca3af;
      margin-top:6px;
      line-height:1.7;
    }
    @media(max-width:1024px){
      .gate-note{ font-size:1.2rem; }
    }

    /* --- ボタン --- */
    .gate-buttons{
      margin-top:20px;
      display:flex;
      flex-direction:column;        /* ★ 縦並びに変更 */
      gap:20px;                     /* ★ ボタン1個分ぐらいの大きな余白 */
    }

    .btn-primary,
    .btn-secondary{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      padding:14px 20px;
      border-radius:999px;
      font-size:1.1rem;
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--accent);
      color:#fff;
      box-shadow:0 10px 22px rgba(37,99,235,0.35);
    }

    .btn-secondary{
      background:#ffffff;
      color:var(--text-main);
      border:1px solid var(--rg-border);
      box-shadow:0 6px 16px rgba(15,23,42,0.10);
    }
  </style>
</head>

<body>
  <div class="gate-wrapper">
    <article class="rg-card">
      <header>
        <h1 class="gate-title">この車両の編集について</h1>

        <p class="gate-subtitle">
          このページでは編集前の確認を行います。<br>
          ログイン後、自動的に編集画面（edit）へ移動します。
        </p>
      </header>

      <section>
        <h2 class="rg-section-title">編集の前にご確認ください</h2>

        <ul class="gate-list">
          <li><strong>編集できるのは登録済みオーナー本人のみ</strong>です。</li>
          <li>ログイン中の Google メールアドレスが、登録済み <code>OwnerEmail</code> と一致した場合のみ保存が反映されます。</li>
          <li>オーナー以外の方は閲覧のみ可能です。</li>
        </ul>

        <p class="gate-note">
          ※ ログイン完了後、自動的に編集画面に移動します。
        </p>

        <div class="gate-buttons">
          <button class="btn-primary" onclick="rgHandleEditLogin()">
            Googleでログインして編集画面へ進む
          </button>

          <a class="btn-secondary" href="<?= scriptUrl ?>?mode=detail&doc=<?= documentId ?>">
            車両の詳細ページに戻る
          </a>
        </div>
      </section>
    </article>
  </div>

  <script>
    /* Firebase 設定 */
    const firebaseConfig = {
      apiKey: "AIzaSyCNCNsu61S3DIQ2pcmK2Ic_vqCINlZB9nk",
      authDomain: "registro500giappone-93f98.firebaseapp.com",
      projectId: "registro500giappone-93f98",
      storageBucket: "registro500giappone-93f98.firebasestorage.app",
      messagingSenderId: "723005462978",
      appId: "1:723005462978:web:e967a16a278f54b278de5b",
      measurementId: "G-ZRBFX1V51B"
    };

    if (firebase.apps.length === 0) {
      firebase.initializeApp(firebaseConfig);
    }

    function rgHandleEditLogin() {
      const auth = firebase.auth();
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    }

    firebase.auth().onAuthStateChanged(function(user){
      if (user) {
        window.location.href =
          "<?= scriptUrl ?>?mode=edit&doc=<?= documentId ?>";
      }
    });
  </script>
</body>
</html>
