<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <title>Registro500 Giappone – 車両編集のご案内</title>

  <style>
    :root {
      --rg-surface: #ffffff;
      --rg-bg: #f4f6f8;
      --rg-border: #e5e7eb;
      --rg-text: #111827;
      --rg-muted: #6b7280;

      --rg-accent: #2856a8;
      --rg-accent-soft: #e6efff;
      --rg-radius-card: 1rem;

      /* 互換用 */
      --text-main: var(--rg-text);
      --text-sub: var(--rg-muted);
      --accent: var(--rg-accent);
      --accent-soft: var(--rg-accent-soft);
      --border-soft: var(--rg-border);
    }

    /* =============================
       ベースタイポグラフィ
       ============================= */
    html {
      font-size: 18px;
    }

    @media (max-width: 768px) {
      html {
        font-size: 28px;
      }
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--rg-bg);
      color: var(--rg-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    }

    .gate-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rg-card {
      background: var(--rg-surface);
      border-radius: var(--rg-radius-card);
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.18);
      padding: 20px 18px 22px;
      max-width: 520px;
      width: 100%;
    }

    @media (min-width: 769px) {
      .rg-card {
        padding: 24px 24px 26px;
      }
    }

    .gate-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .gate-subtitle {
      font-size: 0.9rem;
      color: var(--rg-muted);
      margin: 0 0 18px;
      line-height: 1.7;
      text-align: center;
    }

    .gate-section-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .gate-car-summary {
      background: var(--rg-bg);
      border-radius: 0.75rem;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .car-name {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .car-meta {
      margin: 0;
      font-size: 0.85rem;
      color: var(--rg-muted);
      line-height: 1.6;
    }

    .gate-instruction {
      background: #f9fafb;
      border-radius: 0.75rem;
      padding: 12px 14px;
      border: 1px dashed rgba(148, 163, 184, 0.7);
      margin-bottom: 18px;
    }

    .gate-instruction p {
      margin: 0 0 6px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .gate-instruction p:last-child {
      margin-bottom: 0;
    }

    .gate-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    @media (min-width: 769px) {
      .gate-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease,
      background-color 0.12s ease, border-color 0.12s ease;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .btn-primary:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.45);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--rg-border);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.10);
    }

    .btn-secondary:hover {
      background: #f9fafb;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.16);
    }
  </style>
</head>

<body>
  <div class="gate-wrapper">
    <article class="rg-card">
      <header>
        <h1 class="gate-title">この車両の編集について</h1>

        <p class="gate-subtitle">
          このページでは編集前の確認を行います。<br>
          オーナーの方は Google ログインのうえ、編集画面に進んでください。
        </p>
      </header>

      <section>
        <div class="gate-section-title">対象の車両</div>
        <div class="gate-car-summary">
          <p class="car-name">
            <?= carData && carData.Model_DisplayA ? carData.Model_DisplayA : '車両名未設定' ?>
          </p>
          <p class="car-meta">
            年式：
            <?= carData && carData.Year ? carData.Year : '不明' ?><br>
            ハンドルネーム：
            <?= carData && carData.HandleName ? carData.HandleName : '未登録' ?>
          </p>
        </div>

        <div class="gate-section-title">編集前の確認</div>
        <div class="gate-instruction">
          <p>この車両の編集ができるのは、登録オーナーご本人だけです。</p>
          <p>Google ログイン後、この車両のオーナーである場合に編集画面へ進めます。</p>
        </div>

<div class="gate-buttons">
          <button class="btn-primary" id="btnGoEdit" onclick="rgHandleGateAction()">
            ログイン状態を確認中...
          </button>

          <a class="btn-secondary" href="<?= scriptUrl ?>?mode=detail&doc=<?= documentId ?>">
            車両の詳細ページに戻る
          </a>
        </div>      </section>
    </article>
  </div>

<script>
    /* Firebase 設定 */
    const firebaseConfig = {
      apiKey: "AIzaSyCNCNsu61S3DIQ2pcmK2Ic_vqCINlZB9nk",
      authDomain: "registro500giappone-93f98.firebaseapp.com",
      projectId: "registro500giappone-93f98",
      storageBucket: "registro500giappone-93f98.firebasestorage.app",
      messagingSenderId: "723005462978",
      appId: "1:723005462978:web:e967a16a278f54b278de5b",
      measurementId: "G-ZRBFX1V51B"
    };

    if (firebase.apps.length === 0) {
      firebase.initializeApp(firebaseConfig);
    }

    // ▼▼▼ ここからロジック部分（シンプル版） ▼▼▼
    const btnGoEdit = document.getElementById('btnGoEdit');
    // GAS側で埋め込まれたテンプレート変数を使用
    const targetUrl = "<?= scriptUrl ?>?mode=edit&doc=<?= documentId ?>";
    let isUserLoggedIn = false;

    // ボタンクリック時の挙動
    function rgHandleGateAction() {
      if (isUserLoggedIn) {
        // ログイン済みなら、素の GET リクエストで遷移（403回避）
        window.location.href = targetUrl;
      } else {
        // 未ログインならリダイレクトログインを開始
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
      }
    }

    // ログイン状態の監視とボタン表示の制御
    firebase.auth().onAuthStateChanged(function(user){
      if (user) {
        // ログイン済み
        isUserLoggedIn = true;
        if (btnGoEdit) {
          btnGoEdit.textContent = "編集画面へ進む";
          btnGoEdit.disabled = false;
        }
      } else {
        // 未ログイン
        isUserLoggedIn = false;
        if (btnGoEdit) {
          btnGoEdit.textContent = "Googleでログインして編集画面へ進む";
          btnGoEdit.disabled = false;
        }
      }
    });
  </script></body>
</html>
