  <style>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCNCNsu61S3DIQ2pcmK2Ic_vqCINlZB9nk",
      authDomain: "registro500giappone-93f98.firebaseapp.com",
      projectId: "registro500giappone-93f98",
      storageBucket: "registro500giappone-93f98.firebasestorage.app",
      messagingSenderId: "723005462978",
      appId: "1:723005462978:web:e967a16a278f54b278de5b",
      measurementId: "G-ZRBFX1V51B"
    };

    const INITIAL_CAR_DATA = <?!= JSON.stringify(initialCarData || {}) ?>;
    const INITIAL_DOC_ID   = '<?= initialDocId ?>';

    if (firebase.apps.length === 0) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    const overlay = document.getElementById('loginOverlay');
    const emailDisplay = document.getElementById('userEmailDisplay');
    const submitBtn = document.getElementById('submitButton');
    const form = document.getElementById('carForm');

    // フォームに値を埋める
    function fillForm(record) {
      if (!record) return;
      Object.keys(record).forEach(key => {
        const val = record[key];
        const v = (val !== null && val !== undefined) ? val : '';

        const radios = form.querySelectorAll('input[type="radio"][name="' + key + '"]');
        if (radios.length) {
          radios.forEach(r => { r.checked = String(r.value) === String(v); });
          return;
        }

        const el = form.querySelector(`[name="${key}"]`);
        if (el) el.value = v;
      });

      // その他入力欄の表示制御
      const toggles = [
        {sel:'ModelSelectA', wrap:'ModelTextAWrapper'},
        {sel:'ModelSelectB', wrap:'ModelTextBWrapper'},
        {sel:'EngineTypeSelect', wrap:'EngineTypeTextWrapper'}
      ];
      toggles.forEach(item => {
        const s = document.getElementById(item.sel);
        const w = document.getElementById(item.wrap);
        if(s && w) w.style.display = (s.value === 'その他') ? 'block' : 'none';
      });

      if (INITIAL_DOC_ID) {
        document.getElementById('DocumentID').value = INITIAL_DOC_ID;
      }
    }

    // イベントリスナー設定（その他入力の切り替え）
    ['ModelSelectA', 'ModelSelectB', 'EngineTypeSelect'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.addEventListener('change', function() {
          const wrapId = id === 'ModelSelectA' ? 'ModelTextAWrapper' :
                         id === 'ModelSelectB' ? 'ModelTextBWrapper' :
                         'EngineTypeTextWrapper';
          document.getElementById(wrapId).style.display = (this.value === 'その他') ? 'block' : 'none';
        });
      }
    });

    fillForm(INITIAL_CAR_DATA);

    // 認証状態監視
    auth.onAuthStateChanged(user => {
      if (user) {
        overlay.classList.add('hidden');
        emailDisplay.textContent = user.email;
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で登録";
      } else {
        overlay.classList.remove('hidden');
        emailDisplay.textContent = "未ログイン";
        submitBtn.disabled = true;
        submitBtn.textContent = "ログインが必要です";
      }
    });

    // ポップアップログイン
    window.startPopupLogin = function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        alert("ログイン失敗: " + error.message);
      });
    };

    // 送信処理
    window.handleSubmit = function(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) { alert("ログインしていません"); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      user.getIdToken(true).then(idToken => {
        const fd = new FormData(form);
        const formData = {};
        formData.idToken = idToken;
        
        fd.forEach((val, key) => { formData[key] = val; });

        const isEdit = !!document.getElementById('DocumentID').value;
        const serverFn = isEdit ? 'updateCarFromForm' : 'saveCarFromForm';

        google.script.run
          .withSuccessHandler(res => {
            if (res && res.ok) {
              alert("保存しました！");
              window.location.href = "<?= scriptUrl ?>"; 
            } else {
              alert("エラーが発生しました");
              submitBtn.disabled = false;
              submitBtn.textContent = "この内容で登録";
            }
          })
          .withFailureHandler(err => {
            alert("保存失敗: " + err.message);
            submitBtn.disabled = false;
            submitBtn.textContent = "この内容で登録";
          })
          [serverFn](formData);
      });
    };
  </script>
