<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 登録車両一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #111827;
      --text-sub: #6b7280;
      --button-bg: #9ca3af;
      --button-text: #ffffff;
      --button-hover: #6b7280;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    /* ★モバイル基準：まず「大きい文字」をデフォルトにする */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 18px 12px 26px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 1.5rem; /* モバイルではかなり大きめ */
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
    }

    .page-title {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    .sort-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      color: var(--text-sub);
    }

    .sort-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      font-size: 1.1rem;
      outline: none;
    }

    /* モバイル〜タブレットは 2 列固定 */
    .car-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .car-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    .car-link {
      display: block;
      color: inherit;
      text-decoration: none;
      height: 100%;
    }

    /* 写真枠：スクエア（1:1） */
    .car-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #e5e7eb;
      overflow: hidden;
    }

    .car-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f9fafb;
      transition: transform 0.3s ease;
    }

    .car-card:hover .car-image {
      transform: scale(1.03);
    }

    .car-main {
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ★タイトル（車両名＋年式）をかなり大きく */
    .car-title {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* 年式だけ少し小さくする */
    .car-title-year {
      font-size: 0.8em;
    }

    /* オーナー名（ハンドルネーム）も大きく */
    .car-owner {
      margin: 0;
      font-size: 2.0rem;
      color: var(--text-main);
    }

    .car-owner span {
      font-weight: 600;
      color: var(--text-main);
    }

    /* 都道府県バッジも大きく */
    .badge-pref {
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 1.8rem;
      white-space: nowrap;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--border-soft);
      font-size: 1.2rem;
    }

    .badge-updated {
      color: var(--text-sub);
    }

    /* View Detail は目立たないサイズ（PCと共通） */
    .btn-detail {
      padding: 4px 12px;
      border-radius: 999px;
      border: none;
      background-color: var(--button-bg);
      color: var(--button-text);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-detail:hover {
      background-color: var(--button-hover);
      transform: translateY(-1px);
    }

    /* ★ここから PC 向け：フォントとレイアウトを「小さめ・上品」に戻す */
    @media (min-width: 1024px) {
      body {
        padding: 24px;
        font-size: 1.3rem; /* PC 全体を 1.3 倍 */
      }

      .page-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }

      .page-title {
        font-size: 2.0rem;
      }

      .sort-area {
        font-size: 1.0rem;
      }

      .sort-select {
        font-size: 0.95rem;
      }

      /* PC は 3〜4列レイアウト */
      .car-list {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }

      .car-main {
        padding: 16px 18px 12px;
        gap: 8px;
      }

      .car-title {
        font-size: 1.4rem; /* 以前「ちょうどいい」となったサイズに戻す */
      }

      .car-owner {
        font-size: 1.1rem;
      }

      .badge-pref {
        font-size: 1.0rem; /* 以前の「1.2倍イメージ」に近いサイズ */
        padding: 4px 10px;
      }

      .card-footer {
        padding: 12px 18px 14px;
        font-size: 0.9rem;
      }

      .btn-detail {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <h1 class="page-title">登録車両一覧</h1>

      <div class="sort-area">
        並び替え：
        <select id="sortSelect" class="sort-select">
          <option value="newest">新規登録順（新しい順）</option>
          <option value="oldest">新規登録順（古い順）</option>
          <option value="year_desc">年式が新しい順</option>
          <option value="year_asc">年式が古い順</option>
        </select>
      </div>
    </header>

    <div id="carList" class="car-list">
      <!-- JS でカードを描画 -->
    </div>
  </div>

  <? var jsonCars = JSON.stringify(allCars); ?>

<script>
  const scriptUrl = '<?= scriptUrl ?>';
  const carsData = <?!= jsonCars ?> || [];

  function parseDocNumber(docId) {
    if (!docId) return 0;
    const m = /^DOC_(\d+)$/.exec(String(docId));
    return m ? parseInt(m[1], 10) : 0;
  }

  function parseYear(yearValue) {
    const n = Number(yearValue);
    return Number.isFinite(n) ? n : 0;
  }

  function renderCars(sortType) {
    const listEl = document.getElementById('carList');
    listEl.innerHTML = '';

    const cars = carsData.slice();

    // 並び替え
    switch (sortType) {
      case 'oldest':
        cars.sort((a, b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
        break;
      case 'year_desc':
        cars.sort((a, b) => parseYear(b.Year) - parseYear(a.Year));
        break;
      case 'year_asc':
        cars.sort((a, b) => parseYear(a.Year) - parseYear(b.Year));
        break;
      case 'newest':
      default:
        cars.sort((a, b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));
        break;
    }

    cars.forEach(car => {
      const card = document.createElement('article');
      card.className = 'car-card';

      const link = document.createElement('a');
      link.className = 'car-link';
      link.href = scriptUrl + '?mode=detail&doc=' + encodeURIComponent(car.DocumentID || '');
      // ★ ここが今回のポイント：必ず新しいタブで開く
      link.target = '_blank';
      link.rel = 'noopener';

      // 画像
      const imgWrap = document.createElement('div');
      imgWrap.className = 'car-image-wrap';
      const img = document.createElement('img');
      img.className = 'car-image';
      img.src = car.PhotoMain || '';
      img.alt = (car.Model_DisplayC || '') + 'の写真';
      imgWrap.appendChild(img);

      // 本文
      const main = document.createElement('div');
      main.className = 'car-main';

      // タイトル：Model_DisplayC をそのまま使う（年式はここだけ）
      const titleEl = document.createElement('h2');
      titleEl.className = 'car-title';
      const modelTitle =
        (car.Model_DisplayC && String(car.Model_DisplayC).trim()) ||
        (car.Year ? '(' + car.Year + ')' : '');
      titleEl.textContent = modelTitle;

      // オーナー
      const ownerEl = document.createElement('p');
      ownerEl.className = 'car-owner';
      ownerEl.innerHTML = 'オーナー: <span>' + (car.HandleName || '') + '</span>';

      // メタ（都道府県だけ・※今は本文右に表示）
      const metaRow = document.createElement('div');
      metaRow.className = 'car-meta-row';

      if (car.Prefecture) {
        const pref = document.createElement('span');
        pref.className = 'badge-pref';
        pref.textContent = car.Prefecture;
        metaRow.appendChild(pref);
      }

      main.appendChild(titleEl);
      main.appendChild(ownerEl);
      main.appendChild(metaRow);

      // フッター（更新情報は今は空、ボタンのみ）
      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const updated = document.createElement('span');
      updated.className = 'badge-updated';
      updated.textContent = ''; // createdAt / updatedAt 連携は後で
      footer.appendChild(updated);

      const btn = document.createElement('span');
      btn.className = 'btn-detail';
      btn.textContent = 'View Detail';
      footer.appendChild(btn);

      link.appendChild(imgWrap);
      link.appendChild(main);
      link.appendChild(footer);

      card.appendChild(link);
      listEl.appendChild(card);
    });
  }

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    renderCars(e.target.value);
  });

  // 初期表示：新規登録順（新しい順）
  renderCars(document.getElementById('sortSelect').value);
</script>
</body>

</html>
