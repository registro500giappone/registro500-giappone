<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 日本のクラシック FIAT 500 のオンラインガレージ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #111827;
      --text-sub: #6b7280;

      --accent: #2856a8;
      --accent-soft: #e6efff;
      --accent-border: #c2d4ff;

      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 28px;
    }
    @media (min-width: 1024px) {
      html {
        font-size: 18px;
      }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 18px 12px 26px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== ヘッダー周り ===== */

    .page-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-header-main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .page-section-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .page-section-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .page-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: center;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .goal-pill {
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--accent);
      font-size: 1em;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-right: 4px;
    }

    .page-meta-current {
      font-size: 1em;
      color: var(--accent);
      font-weight: 600;
    }

    .page-header-right {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .sort-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 1.2rem;
      color: var(--text-sub);
      width: 100%;
    }

    .sort-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-label {
      white-space: nowrap; /* ★ 改行させない */
    }

/* ボタンを乗せる帯：淡いブルー */
.sort-right {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  border-radius: 999px;
  background-color: var(--accent-soft); /* ← 薄いブルー */
}
    .sort-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      font-size: 1.1rem;
      outline: none;
    }

/* オーナーページへボタン：白地＋青文字 */
.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--accent-border);
  background-color: #ffffff;      /* ← 白地 */
  color: var(--accent);           /* ← 青文字 */
  font-size: 1.1rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 2px 4px rgba(15, 23, 42, 0.16);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
}
    /* ★オーナーページボタン専用（青地＋白文字） */
    .btn-owner {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent-border);
    }
    .btn-owner:hover {
      background-color: #182f4d;
      color: #ffffff;
    }
    .btn-secondary:hover {
      background-color: var(--accent-soft);
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.25);
      transform: translateY(-1px);
    }

    .btn-secondary:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
    }

    .header-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 1.1rem;
      color: var(--text-sub);
      justify-content: flex-end;
      width: 100%;
    }

    .header-nav a {
      color: var(--text-sub);
      text-decoration: none;
    }

    .header-nav a:hover {
      text-decoration: underline;
    }

    /* ===== 一覧カード ===== */

    .car-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .car-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    .car-link {
      display: block;
      color: inherit;
      text-decoration: none;
      height: 100%;
    }

    .car-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #e5e7eb;
      overflow: hidden;
    }

    .car-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f9fafb;
      transition: transform 0.3s ease;
    }

    .car-card:hover .car-image {
      transform: scale(1.03);
    }

    .car-main {
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .car-title {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
    }

    .car-title-year {
      font-size: 0.75em;
      font-weight: 600;
      color: var(--text-sub);
    }

    .car-title-model {
      font-weight: 800;
    }

    .car-owner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .car-owner {
      margin: 0;
      font-size: 2.0rem;
      color: var(--text-main);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-pref {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent-border);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 16px 10px;
      border-top: none;
      font-size: 1.2rem;
      color: var(--text-sub);
      min-height: 0;
    }

    .badge-updated { }

    @media (min-width: 1024px) {
      body {
        padding: 24px;
        font-size: 1rem;
      }

      .page-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
      }

      .page-header-main {
        flex-direction: column;
        gap: 10px;
      }

      .brand-title {
        font-size: 2.2rem;
      }

      .page-section-title {
        font-size: 1.4rem;
      }

      .page-meta {
        font-size: 1.05rem;
      }

      .page-header-right {
        align-items: flex-end;
      }

      .sort-area {
        font-size: 1.0rem;
      }

      .sort-select {
        font-size: 0.95rem;
      }

      .header-nav {
        justify-content: flex-end;
        font-size: 0.9rem;
      }

      .btn-secondary {
        font-size: 0.95rem;
        padding: 6px 14px;
      }

      .car-list {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }

      .car-main {
        padding: 16px 18px 8px;
        gap: 6px;
      }

      .car-title {
        font-size: 1.4rem;
      }

      .car-owner {
        font-size: 1.1rem;
      }

      .badge-pref {
        font-size: 0.8rem;
        padding: 2px 8px;
      }

      .card-footer {
        padding: 6px 18px 10px;
        font-size: 0.9rem;
      }
    }

    .brand-header {
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 16px 24px;
      text-align: left;
      background-color: #F8F5F0;
      border-radius: 18px;
    }

    .brand-logo {
      display: block;
    }

    .brand-logo-pc {
      height: 80px;
    }

    .brand-logo-sp {
      display: none;
      height: 120px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .brand-header {
        text-align: center;
      }

      .brand-logo-pc {
        display: none;
      }

      .brand-logo-sp {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="brand-header">
    <img
      src="https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Flogo_horizontal.png?alt=media&token=efab9298-5cbb-4dff-b6b8-aa4ab5863bbf"
      alt="Registro500 Giappone ロゴ"
      class="brand-logo brand-logo-pc">

    <img
      src="https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Flogo_vertical.png?alt=media&token=8abb93db-0025-4916-a711-f25d66cedc73"
      alt="Registro500 Giappone ロゴ"
      class="brand-logo brand-logo-sp">
  </div>

  <div class="page">
    <header class="page-header">
      <div class="page-header-main">
        <div class="page-header-left">
          <h1 class="brand-title">REGISTRO500 GIAPPONE</h1>

          <div class="page-section-row">
            <p class="page-section-title">日本のクラシック FIAT 500 のオンラインガレージ</p>
            <div class="page-meta">
              <span class="goal-pill">めざせ500台！</span>
              <span class="page-meta-current">
                現在 <span id="carCountValue">0</span>台
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="page-header-right">
        <div class="sort-area">
          <div class="sort-left">
            <span class="sort-label">並び替え：</span>
            <select id="sortSelect" class="sort-select">
              <option value="newest">新規登録順（新しい順）</option>
              <option value="oldest">新規登録順（古い順）</option>
              <option value="year_desc">年式が新しい順</option>
              <option value="year_asc">年式が古い順</option>
            </select>
          </div>

          <div class="sort-right">
            <a href="<?= ownerAppUrl ?>?mode=owner"
               class="btn-secondary btn-owner"
               id="ownerPageButton"
               target="_blank" rel="noopener">
              オーナーページへ
            </a>
          </div>
        </div>

        <nav class="header-nav">
          <a href="<?= scriptUrl ?>?mode=policy" target="_blank" rel="noopener">
            プライバシーポリシー / 利用規約
          </a>
          <span>｜</span>
          <a href="<?= scriptUrl ?>?mode=howto" target="_blank" rel="noopener">
            はじめての方へ
          </a>
        </nav>
      </div>
    </header>

    <div id="carList" class="car-list"></div>
  </div>

  <? var jsonCars = JSON.stringify(allCars); ?>

  <script>
    const scriptUrl = '<?= scriptUrl ?>';
    const carsData = <?!= jsonCars ?> || [];

    const NO_IMAGE_URL =
      'https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Fno_image_500.png?alt=media&token=6b54ce01-d76a-4b59-b815-f7e250f1fb78';

    function parseDocNumber(docId) {
      if (!docId) return 0;
      const m = /^DOC_(\d+)$/.exec(String(docId));
      return m ? parseInt(m[1], 10) : 0;
    }

    function parseYear(yearValue) {
      const n = Number(yearValue);
      return Number.isFinite(n) ? n : 0;
    }

    function updateCarCount() {
      const countEl = document.getElementById('carCountValue');
      if (!countEl) return;
      const validCars = carsData.filter(car => car.DocumentID && String(car.DocumentID).trim() !== '');
      countEl.textContent = String(validCars.length);
    }

    function renderCars(sortType) {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';

      const cars = carsData.slice();

      switch (sortType) {
        case 'oldest':
          cars.sort((a, b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
          break;
        case 'year_desc':
          cars.sort((a, b) => parseYear(b.Year) - parseYear(a.Year));
          break;
        case 'year_asc':
          cars.sort((a, b) => parseYear(a.Year) - parseYear(b.Year));
          break;
        case 'newest':
        default:
          cars.sort((a, b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));
          break;
      }

      cars.forEach(car => {
        const card = document.createElement('article');
        card.className = 'car-card';

        const link = document.createElement('a');
        link.className = 'car-link';
        link.href = scriptUrl + '?mode=detail&doc=' + encodeURIComponent(car.DocumentID || '');
        link.target = '_blank';
        link.rel = 'noopener';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'car-image-wrap';
        const img = document.createElement('img');
        img.className = 'car-image';
        const photoUrl = (car.PhotoMain && String(car.PhotoMain).trim()) || NO_IMAGE_URL;
        img.src = photoUrl;
        img.alt = (car.Model_DisplayC || '') + 'の写真';
        imgWrap.appendChild(img);

        const main = document.createElement('div');
        main.className = 'car-main';

        const titleEl = document.createElement('h2');
        titleEl.className = 'car-title';

        const yearSpan = document.createElement('span');
        yearSpan.className = 'car-title-year';
        yearSpan.textContent = car.Year ? String(car.Year) + '年' : '';

        const modelSpan = document.createElement('span');
        modelSpan.className = 'car-title-model';
        const rawModel = (car.Model_DisplayC && String(car.Model_DisplayC).trim()) || '';
        modelSpan.textContent = rawModel.replace(/\s*\(\d{4}\)\s*$/, '');

        if (yearSpan.textContent) {
          titleEl.appendChild(yearSpan);
        }
        titleEl.appendChild(modelSpan);

        const ownerRow = document.createElement('div');
        ownerRow.className = 'car-owner-row';

        const ownerName = document.createElement('p');
        ownerName.className = 'car-owner';
        ownerName.textContent = car.HandleName || '';
        ownerRow.appendChild(ownerName);

        if (car.Prefecture) {
          const pref = document.createElement('span');
          pref.className = 'badge-pref';
          pref.textContent = car.Prefecture;
          ownerRow.appendChild(pref);
        }

        main.appendChild(titleEl);
        main.appendChild(ownerRow);

        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const updated = document.createElement('span');
        updated.className = 'badge-updated';
        updated.textContent = '';
        footer.appendChild(updated);

        link.appendChild(imgWrap);
        link.appendChild(main);
        link.appendChild(footer);

        card.appendChild(link);
        listEl.appendChild(card);
      });
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      renderCars(e.target.value);
    });

    renderCars(document.getElementById('sortSelect').value);
    updateCarCount();
  </script>
</body>
</html>
