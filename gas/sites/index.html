<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 登録車両一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #111827;
      --text-sub: #6b7280;

      /* ★ アクセントをネイビー系に変更 */
      --accent: #1f3b63;        /* ほどよいネイビー */
      --accent-soft: #e5effa;   /* ネイビー系の淡い背景 */
      --accent-border: #b3c8eb; /* ネイビー系の淡い枠線 */

      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    /* モバイル基準 */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 18px 12px 26px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 1.5rem; /* モバイルでは大きめ */
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== ヘッダー周り ===== */

    .page-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-header-main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ロゴ風タイトル */
    .brand-title {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .page-section-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .page-section-title {
      margin: 0;
      font-size: 1.9rem;      /* ソートよりはっきり大きく */
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* タイトル右の「めざせ！500台 現在 ○台」 */
    .page-subtitle {
      margin: 0;
      font-size: 1.4rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .page-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .sort-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      color: var(--text-sub);
    }

    .sort-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      font-size: 1.1rem;
      outline: none;
    }

    /* 新規登録ボタン：セレクトと同じ高さ感＋目立ちすぎない */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;              /* ← sort-select と揃え */
      border-radius: 999px;
      border: 1px solid var(--accent-border);
      background-color: var(--accent);
      color: #ffffff;
      font-size: 1.1rem;              /* セレクトとほぼ同じ */
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.16); /* 影は控えめに */
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s ease;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background-color: #182f4d;
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
    }

    .btn-primary-icon {
      margin-right: 0.4em;
      font-size: 1.2rem;
      line-height: 1;
    }

    /* ヘッダー内ナビ（プライバシー・使い方リンク） */
    .header-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 1.1rem;
      color: var(--text-sub);
    }

    .header-nav a {
      color: var(--text-sub);
      text-decoration: none;
    }

    .header-nav a:hover {
      text-decoration: underline;
    }

    /* ===== 一覧カード ===== */

    /* モバイル〜タブレット：2列 */
    .car-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .car-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    .car-link {
      display: block;
      color: inherit;
      text-decoration: none;
      height: 100%;
    }

    /* 写真枠：スクエア（1:1） */
    .car-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #e5e7eb;
      overflow: hidden;
    }

    .car-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f9fafb;
      transition: transform 0.3s ease;
    }

    .car-card:hover .car-image {
      transform: scale(1.03);
    }

    .car-main {
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;          /* 行間を少し詰める */
    }

    /* タイトル：年式・車両名を縦並びに */
    .car-title {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      display: flex;
      flex-direction: column;  /* 年式 → 車両名 の縦並び */
      align-items: flex-start;
      gap: 0.15rem;
    }

    .car-title-year {
      font-size: 0.75em;
      font-weight: 600;
      color: var(--text-sub);
    }

    .car-title-model {
      font-weight: 800;
    }

    /* オーナー＋都道府県：1行 */
    .car-owner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .car-owner {
      margin: 0;
      font-size: 2.0rem;
      color: var(--text-main);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 都道府県バッジ：ハンドルネームより一回り小さく */
    .badge-pref {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent-border);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 1.1rem;
      white-space: nowrap;
    }

    /* フッター（今はほぼ余白だけ） */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 16px 10px;
      border-top: none;
      font-size: 1.2rem;
      color: var(--text-sub);
      min-height: 0;
    }

    .badge-updated { }

    /* ===== PC 向けレイアウト ===== */

    @media (min-width: 1024px) {
      body {
        padding: 24px;
        font-size: 1.3rem;
      }

      .page-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
      }

      .page-header-main {
        flex-direction: column;
        gap: 10px;
      }

      .brand-title {
        font-size: 2.0rem;
      }

      .page-section-title {
        font-size: 1.7rem;
      }

      .page-subtitle {
        font-size: 1.0rem;
      }

      .page-header-right {
        align-items: flex-end;
      }

      .sort-area {
        font-size: 1.0rem;
      }

      .sort-select {
        font-size: 0.95rem;
      }

      .header-nav {
        justify-content: flex-end;
        font-size: 0.9rem;
      }

      .btn-primary {
        font-size: 0.95rem;     /* PC では少しだけ小さめに */
        padding: 6px 14px;      /* 高さもセレクトとほぼ同等に */
      }

      .btn-primary-icon {
        font-size: 1.0rem;
      }

      .car-list {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }

      .car-main {
        padding: 16px 18px 8px;
        gap: 6px;
      }

      .car-title {
        font-size: 1.4rem;
      }

      .car-owner {
        font-size: 1.1rem;
      }

      .badge-pref {
        font-size: 0.8rem;
        padding: 2px 8px;
      }

      .card-footer {
        padding: 6px 18px 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <div class="page-header-main">
        <div class="page-header-left">
          <h1 class="brand-title">REGISTRO500 GIAPPONE</h1>

          <div class="page-section-row">
            <p class="page-section-title">登録車両一覧</p>
            <p class="page-subtitle" id="carCountText">
              めざせ！500台　現在 0台
            </p>
          </div>
        </div>
      </div>

      <div class="page-header-right">
        <div class="sort-area">
          並び替え：
          <select id="sortSelect" class="sort-select">
            <option value="newest">新規登録順（新しい順）</option>
            <option value="oldest">新規登録順（古い順）</option>
            <option value="year_desc">年式が新しい順</option>
            <option value="year_asc">年式が古い順</option>
          </select>

          <!-- ★ 実装前なので href はダミー。あとでフォームURLに差し替え -->
          <a href="#!" class="btn-primary">
            <span class="btn-primary-icon">＋</span>
            新規登録
          </a>
        </div>

        <nav class="header-nav">
          <!-- ここもあとで実ページのURLに差し替え -->
          <a href="#!">プライバシーポリシー / 利用規約</a>
          <span>｜</span>
          <a href="#!">使い方</a>
        </nav>
      </div>
    </header>

    <div id="carList" class="car-list">
      <!-- JS でカードを描画 -->
    </div>
  </div>

  <? var jsonCars = JSON.stringify(allCars); ?>

  <script>
    const scriptUrl = '<?= scriptUrl ?>';
    const carsData = <?!= jsonCars ?> || [];

    // ★ NO IMAGE 画像のURL（Firebase 等に置いた実際の URL に差し替えてください）
    const NO_IMAGE_URL = 'https://example.com/path/to/no-image.png';

    function parseDocNumber(docId) {
      if (!docId) return 0;
      const m = /^DOC_(\d+)$/.exec(String(docId));
      return m ? parseInt(m[1], 10) : 0;
    }

    function parseYear(yearValue) {
      const n = Number(yearValue);
      return Number.isFinite(n) ? n : 0;
    }

    // 登録台数をタイトル横に表示（DocumentID が入っているレコードだけカウント）
    function updateCarCount() {
      const countEl = document.getElementById('carCountText');
      if (!countEl) return;

      const validCars = carsData.filter(car => car.DocumentID && String(car.DocumentID).trim() !== '');
      const count = validCars.length;
      countEl.textContent = `めざせ！500台　現在 ${count}台`;
    }

    function renderCars(sortType) {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';

      const cars = carsData.slice();

      // 並び替え
      switch (sortType) {
        case 'oldest':
          cars.sort((a, b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
          break;
        case 'year_desc':
          cars.sort((a, b) => parseYear(b.Year) - parseYear(a.Year));
          break;
        case 'year_asc':
          cars.sort((a, b) => parseYear(a.Year) - parseYear(b.Year));
          break;
        case 'newest':
        default:
          cars.sort((a, b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));
          break;
      }

      cars.forEach(car => {
        const card = document.createElement('article');
        card.className = 'car-card';

        const link = document.createElement('a');
        link.className = 'car-link';
        link.href = scriptUrl + '?mode=detail&doc=' + encodeURIComponent(car.DocumentID || '');
        link.target = '_blank';
        link.rel = 'noopener';

        // 画像（なければ NO IMAGE にフォールバック）
        const imgWrap = document.createElement('div');
        imgWrap.className = 'car-image-wrap';
        const img = document.createElement('img');
        img.className = 'car-image';
        const photoUrl = (car.PhotoMain && String(car.PhotoMain).trim()) || NO_IMAGE_URL;
        img.src = photoUrl;
        img.alt = (car.Model_DisplayC || '') + 'の写真';
        imgWrap.appendChild(img);

        // 本文
        const main = document.createElement('div');
        main.className = 'car-main';

        // タイトル：年式 + モデル名（Model_DisplayC の末尾 (年式) は削る）
        const titleEl = document.createElement('h2');
        titleEl.className = 'car-title';

        const yearSpan = document.createElement('span');
        yearSpan.className = 'car-title-year';
        yearSpan.textContent = car.Year ? String(car.Year) + '年' : '';

        const modelSpan = document.createElement('span');
        modelSpan.className = 'car-title-model';
        const rawModel = (car.Model_DisplayC && String(car.Model_DisplayC).trim()) || '';
        modelSpan.textContent = rawModel.replace(/\s*\(\d{4}\)\s*$/, '');

        if (yearSpan.textContent) {
          titleEl.appendChild(yearSpan);
        }
        titleEl.appendChild(modelSpan);

        // オーナー＋都道府県（1行）
        const ownerRow = document.createElement('div');
        ownerRow.className = 'car-owner-row';

        const ownerName = document.createElement('p');
        ownerName.className = 'car-owner';
        ownerName.textContent = car.HandleName || '';
        ownerRow.appendChild(ownerName);

        if (car.Prefecture) {
          const pref = document.createElement('span');
          pref.className = 'badge-pref';
          pref.textContent = car.Prefecture;
          ownerRow.appendChild(pref);
        }

        main.appendChild(titleEl);
        main.appendChild(ownerRow);

        // フッター（将来 updatedAt を入れる想定。今は空）
        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const updated = document.createElement('span');
        updated.className = 'badge-updated';
        updated.textContent = '';
        footer.appendChild(updated);

        link.appendChild(imgWrap);
        link.appendChild(main);
        link.appendChild(footer);

        card.appendChild(link);
        listEl.appendChild(card);
      });
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      renderCars(e.target.value);
    });

    // 初期表示：新規登録順（新しい順）＋ 登録台数表示
    renderCars(document.getElementById('sortSelect').value);
    updateCarCount();
  </script>
</body>
</html>
