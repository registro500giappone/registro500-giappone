
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 登録車両一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #111827;
      --text-sub: #6b7280;
      --button-bg: #ef4444;
      --button-text: #ffffff;
      --button-hover: #dc2626;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-title {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
    }

    .sort-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .sort-select {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      font-size: 0.85rem;
      outline: none;
    }

    /* カード一覧レイアウト */
    .car-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .car-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    .car-link {
      display: block;
      color: inherit;
      text-decoration: none;
      height: 100%;
    }

    .car-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 62%; /* 画像比率 */
      background: #e5e7eb;
      overflow: hidden;
    }

    .car-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .car-card:hover .car-image {
      transform: scale(1.03);
    }

    .car-main {
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .car-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      color: var(--text-main);
      line-height: 1.4;
    }

    .car-owner {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .car-owner span {
      font-weight: 600;
      color: var(--text-main);
    }

    .car-meta-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 4px;
      font-size: 0.75rem;
      gap: 6px;
    }

    .badge-pref {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background-color: #eff6ff;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 10px;
      border-top: 1px solid var(--border-soft);
      font-size: 0.75rem;
    }

    .badge-updated {
      color: var(--text-sub);
    }

    .btn-detail {
      padding: 4px 12px;
      border-radius: 999px;
      border: none;
      background-color: var(--button-bg);
      color: var(--button-text);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-detail:hover {
      background-color: var(--button-hover);
      transform: translateY(-1px);
    }

    /* ★スマホ・タブレットでは 2 列固定にする（900px 以下） */
    @media (max-width: 900px) {
      body {
        padding: 16px 10px 20px;
      }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .page-title {
        font-size: 1.3rem;
      }

      .car-list {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 12px !important;
      }

      .car-card {
        border-radius: 14px;
      }

      .car-main {
        padding: 8px 9px 6px;
      }

      .car-title {
        font-size: 0.9rem;
      }

      .car-owner {
        font-size: 0.8rem;
      }

      .card-footer {
        padding: 6px 9px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <h1 class="page-title">登録車両一覧</h1>

      <div class="sort-area">
        並び替え：
        <select id="sortSelect" class="sort-select">
          <option value="newest">新規登録順（新しい順）</option>
          <option value="oldest">新規登録順（古い順）</option>
          <option value="year_desc">年式が新しい順</option>
          <option value="year_asc">年式が古い順</option>
        </select>
      </div>
    </header>

    <div id="carList" class="car-list">
      <!-- JS でカードを描画 -->
    </div>
  </div>

  <? var jsonCars = JSON.stringify(allCars); ?>

  <script>
    const scriptUrl = '<?= scriptUrl ?>';
    const carsData = <?!= jsonCars ?> || [];

    function parseDocNumber(docId) {
      if (!docId) return 0;
      const m = /^DOC_(\d+)$/.exec(String(docId));
      return m ? parseInt(m[1], 10) : 0;
    }

    function parseYear(yearValue) {
      const n = Number(yearValue);
      return Number.isFinite(n) ? n : 0;
    }

    function renderCars(sortType) {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';

      const cars = carsData.slice();

      // 並び替え
      switch (sortType) {
        case 'oldest':
          cars.sort((a, b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
          break;
        case 'year_desc':
          cars.sort((a, b) => parseYear(b.Year) - parseYear(a.Year));
          break;
        case 'year_asc':
          cars.sort((a, b) => parseYear(a.Year) - parseYear(b.Year));
          break;
        case 'newest':
        default:
          cars.sort((a, b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));
          break;
      }

      cars.forEach(car => {
        const card = document.createElement('article');
        card.className = 'car-card';

        const link = document.createElement('a');
        link.className = 'car-link';
        link.href = scriptUrl + '?mode=detail&doc=' + encodeURIComponent(car.DocumentID || '');

        // 画像
        const imgWrap = document.createElement('div');
        imgWrap.className = 'car-image-wrap';
        const img = document.createElement('img');
        img.className = 'car-image';
        img.src = car.PhotoMain || '';
        img.alt = (car.Model_DisplayC || '') + 'の写真';
        imgWrap.appendChild(img);

        // 本文
        const main = document.createElement('div');
        main.className = 'car-main';

        // ★タイトル：Model_DisplayC をそのまま使う（年式はここだけ）
        const titleEl = document.createElement('h2');
        titleEl.className = 'car-title';
        const modelTitle =
          (car.Model_DisplayC && String(car.Model_DisplayC).trim()) ||
          (car.Year ? '(' + car.Year + ')' : '');
        titleEl.textContent = modelTitle;

        // オーナー
        const ownerEl = document.createElement('p');
        ownerEl.className = 'car-owner';
        ownerEl.innerHTML = 'オーナー: <span>' + (car.HandleName || '') + '</span>';

        // メタ（都道府県だけ）
        const metaRow = document.createElement('div');
        metaRow.className = 'car-meta-row';

        if (car.Prefecture) {
          const pref = document.createElement('span');
          pref.className = 'badge-pref';
          pref.textContent = car.Prefecture;
          metaRow.appendChild(pref);
        }

        main.appendChild(titleEl);
        main.appendChild(ownerEl);
        main.appendChild(metaRow);

        // フッター（更新情報は今は空、ボタンのみ）
        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const updated = document.createElement('span');
        updated.className = 'badge-updated';
        updated.textContent = ''; // createdAt / updatedAt 連携は後で
        footer.appendChild(updated);

        const btn = document.createElement('span');
        btn.className = 'btn-detail';
        btn.textContent = 'View Detail';
        footer.appendChild(btn);

        link.appendChild(imgWrap);
        link.appendChild(main);
        link.appendChild(footer);

        card.appendChild(link);
        listEl.appendChild(card);
      });
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      renderCars(e.target.value);
    });

    // 初期表示：新規登録順（新しい順）
    renderCars(document.getElementById('sortSelect').value);
  </script>
</body>
</html>
