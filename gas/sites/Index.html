<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Registro500 Giappone - 車両一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* これまでのCSSはそのまま利用 */
    :root {
      --bg-main: #f4f4f7; --card-bg: #ffffff; --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10); --text-main: #111827;
      --text-sub: #6b7280; --accent: #2856a8; --accent-soft: #e6efff;
      --accent-border: #c2d4ff; --radius-lg: 18px;
    }
    * { box-sizing: border-box; }
    html { font-size: 28px; }
    @media (min-width: 1024px) { html { font-size: 18px; } }
    body {
      font-family: system-ui, -apple-system, sans-serif; margin: 0;
      padding: 18px 12px 26px; background-color: var(--bg-main);
      color: var(--text-main); font-size: 1rem; line-height: 1.6;
    }
    /* レイアウト系 */
    .page { max-width: 1200px; margin: 0 auto; }
    .brand-header {
      max-width: 1200px; margin: 0 auto 24px; padding: 16px 24px;
      background-color: #F8F5F0; border-radius: 18px;
    }
    .brand-logo { display: block; height: 80px; } /* SP用調整は省略 */
    .page-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .brand-title { font-size: 2rem; font-weight: 800; color: var(--accent); margin: 0; }
    .page-section-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .page-meta { font-size: 1.3rem; color: var(--accent); display: flex; gap: 8px; align-items: center; }
    
    /* ソート・リンクエリア */
    .page-header-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .header-nav a { color: var(--text-sub); text-decoration: none; font-size: 1.1rem; }
    .btn-owner {
      background-color: var(--accent); color: #ffffff; padding: 8px 16px;
      border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 1.1rem;
    }

    /* カードリスト */
    .car-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px;
    }
    .car-card {
      background: var(--card-bg); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft); overflow: hidden; transition: transform 0.15s;
      text-decoration: none; color: inherit; display: block;
    }
    .car-card:hover { transform: translateY(-3px); }
    .car-image-wrap { position: relative; width: 100%; padding-top: 100%; background: #e5e7eb; }
    .car-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .car-main { padding: 16px; }
    .car-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 4px; line-height: 1.3; }
    .car-owner { font-size: 1.1rem; color: var(--text-sub); margin: 0; }
    .badge-pref {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: var(--accent-soft); color: var(--accent); font-size: 0.9rem; margin-left: 8px;
    }
    
    /* ローディング表示 */
    #loading { text-align: center; padding: 40px; font-size: 1.2rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="brand-header">
    <h1 style="margin:0; color:var(--accent);">Registro500 Giappone</h1>
  </div>

  <div class="page">
    <header class="page-header">
      <div>
        <h1 class="brand-title">ONLINE GARAGE</h1>
        <p class="page-section-title">日本のクラシック FIAT 500 オンラインガレージ</p>
        <div class="page-meta">
          <span>現在</span>
          <span id="carCountValue" style="font-weight:800;">-</span>
          <span>台</span>
        </div>
      </div>
      
      <div class="page-header-right">
        <a href="owner.html" class="btn-owner">オーナーページへ</a>
        <nav class="header-nav">
          <a href="policy.html">規約・ポリシー</a> | <a href="howto.html">はじめての方へ</a>
        </nav>
      </div>
    </header>

    <div id="loading">データを読み込んでいます...</div>
    <div id="carList" class="car-list"></div>
  </div>

  <script>
// ★ ここに、さっきデータが出た「成功URL」をコピペします
const API_URL = "https://script.google.com/macros/s/AKfycbz0BJpaG-AcK3T6YYtav-nfd3gqGlkEWu3AvpW5uRT52N9jW8pBKLrpLSqvXqyD2ghwCA/exec";
    
    const NO_IMAGE_URL = 'https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Fno_image_500.png?alt=media&token=6b54ce01-d76a-4b59-b815-f7e250f1fb78';

    async function fetchCars() {
      try {
        // モードを指定してAPIを叩く
        const res = await fetch(API_URL + '?mode=index');
        const json = await res.json();

        if (json.success && json.data) {
          renderCars(json.data);
        } else {
          console.error('API Error:', json);
          document.getElementById('loading').textContent = 'データの取得に失敗しました。';
        }
      } catch (e) {
        console.error('Fetch Error:', e);
        document.getElementById('loading').textContent = '通信エラーが発生しました。';
      }
    }

    function renderCars(cars) {
      const listEl = document.getElementById('carList');
      const loadingEl = document.getElementById('loading');
      const countEl = document.getElementById('carCountValue');
      
      loadingEl.style.display = 'none';
      listEl.innerHTML = '';
      countEl.textContent = cars.length;

      // 新しい順にソート（IDの降順）
      cars.sort((a, b) => {
        const idA = parseInt((a.DocumentID || '').replace('DOC_', '')) || 0;
        const idB = parseInt((b.DocumentID || '').replace('DOC_', '')) || 0;
        return idB - idA;
      });

      cars.forEach(car => {
        const card = document.createElement('a');
        card.className = 'car-card';
        // 詳細ページへのリンク（Vercel上の detail.html へクエリパラメータで渡す）
        card.href = `detail.html?doc=${encodeURIComponent(car.DocumentID)}`;

        const photoUrl = car.PhotoMain || NO_IMAGE_URL;
        const modelName = (car.Model_DisplayC || 'Unknown Model').replace(/\s*\(\d{4}\)\s*$/, '');
        const year = car.Year ? `${car.Year}年` : '';

        card.innerHTML = `
          <div class="car-image-wrap">
            <img src="${photoUrl}" class="car-image" alt="${modelName}" loading="lazy">
          </div>
          <div class="car-main">
            <h2 class="car-title">
              <span style="font-size:0.8em; color:#666; display:block;">${year}</span>
              ${modelName}
            </h2>
            <p class="car-owner">
              ${car.HandleName || 'オーナー'}
              ${car.Prefecture ? `<span class="badge-pref">${car.Prefecture}</span>` : ''}
            </p>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 実行
    fetchCars();
  </script>
</body>
</html>
