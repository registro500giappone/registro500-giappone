<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 登録車両一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <!-- 雰囲気用フォント（任意） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-main: #f6f2e9;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #1f2933;
      --text-sub: #6b7280;
      --button-bg: #9ca3af;
      --button-text: #ffffff;
      --button-hover: #6b7280;
      --radius-lg: 18px;
      --accent-red: #b43a3a;
      --accent-green: #47624f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 18px 12px 26px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ヘッダー（雑誌のタイトルバー風） */
    .page-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .header-title-main {
      font-family: "Playfair Display", "Times New Roman", serif;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 2px;
    }

    .header-title-sub {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0;
    }

    .header-caption {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .sort-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .sort-label {
      white-space: nowrap;
    }

    .sort-select {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    /* カード一覧（Bootstrapの row / col を使用） */
    .car-list {
      margin-top: 4px;
    }

    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .car-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.18);
    }

    .car-link {
      display: block;
      color: inherit;
      text-decoration: none;
      height: 100%;
    }

    /* 写真枠：スクエア（1:1）で中身は contain */
    .car-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #e5e7eb;
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    }

    .car-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f9fafb;
      transition: transform 0.3s ease;
    }

    .car-card:hover .car-image {
      transform: scale(1.03);
    }

    .car-noimage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      color: #9ca3af;
      text-transform: uppercase;
    }

    .car-main {
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 上から：年式 + 車両モデル名 */
    .car-header-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .car-year {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-red);
    }

    .car-model {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* ハンドルネーム（強調） */
    .car-owner {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .car-owner span {
      font-weight: 700;
    }

    /* 都道府県（右寄せ）＋その他メタ */
    .car-meta-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-pref {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .badge-engine {
      font-size: 0.75rem;
      color: #4b5563;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 10px;
      border-top: 1px solid var(--border-soft);
      font-size: 0.7rem;
      background: #f9fafb;
      min-height: 28px;
    }

    .badge-updated {
      color: var(--text-sub);
    }

    /* スマホ〜タブレット（デフォルト）は2列 */
    @media (max-width: 767.98px) {
      body {
        font-size: 0.95rem;
      }

      .page-header {
        margin-bottom: 16px;
      }
    }

    /* PC 向け微調整 */
    @media (min-width: 768px) {
      body {
        padding: 24px;
        font-size: 1rem;
      }

      .page-header {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .header-title-sub {
        font-size: 1.6rem;
      }

      .header-caption {
        font-size: 0.85rem;
      }

      .sort-area {
        font-size: 0.85rem;
      }
    }

    @media (min-width: 1024px) {
      .car-main {
        padding: 14px 16px 10px;
      }

      .car-model {
        font-size: 1.15rem;
      }

      .car-owner {
        font-size: 1.05rem;
      }

      .badge-pref {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="page container">
    <header class="page-header">
      <div>
        <div class="header-title-main">REGISTRO500 GIAPPONE</div>
        <h1 class="header-title-sub">登録車両一覧</h1>
        <p class="header-caption">
          国内外のオーナーが登録したクラシック FIAT 500 / 126 のギャラリーです。
        </p>
      </div>

      <div class="sort-area">
        <span class="sort-label">並び替え：</span>
        <select id="sortSelect" class="sort-select">
          <option value="newest">新規登録順（新しい順）</option>
          <option value="oldest">新規登録順（古い順）</option>
          <option value="year_desc">年式が新しい順</option>
          <option value="year_asc">年式が古い順</option>
        </select>
      </div>
    </header>

    <!-- Bootstrap row + col-6（スマホ2列） -->
    <div id="carList" class="row car-list g-3 g-md-4">
      <!-- JS でカードを描画 -->
    </div>
  </div>

  <? var jsonCars = JSON.stringify(allCars); ?>

  <script>
    const scriptUrl = '<?= scriptUrl ?>';
    const carsData = <?!= jsonCars ?> || [];

    function parseDocNumber(docId) {
      if (!docId) return 0;
      const m = /^DOC_(\d+)$/.exec(String(docId));
      return m ? parseInt(m[1], 10) : 0;
    }

    function parseYear(yearValue) {
      const n = Number(yearValue);
      return Number.isFinite(n) ? n : 0;
    }

    function renderCars(sortType) {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';

      const cars = carsData.slice();

      // 並び替え
      switch (sortType) {
        case 'oldest':
          cars.sort((a, b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
          break;
        case 'year_desc':
          cars.sort((a, b) => parseYear(b.Year) - parseYear(a.Year));
          break;
        case 'year_asc':
          cars.sort((a, b) => parseYear(a.Year) - parseYear(b.Year));
          break;
        case 'newest':
        default:
          cars.sort((a, b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));
          break;
      }

      cars.forEach(car => {
        // Bootstrap列：スマホ2列・タブレット3列・PC4列
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3';

        const card = document.createElement('article');
        card.className = 'car-card h-100';

        const link = document.createElement('a');
        link.className = 'car-link';
        link.href = scriptUrl + '?mode=detail&doc=' + encodeURIComponent(car.DocumentID || '');
        // 新しいタブで開く
        link.target = '_blank';
        link.rel = 'noopener';

        // 画像
        const imgWrap = document.createElement('div');
        imgWrap.className = 'car-image-wrap';

        if (car.PhotoMain) {
          const img = document.createElement('img');
          img.className = 'car-image';
          img.src = car.PhotoMain || '';
          img.alt = (car.Model_DisplayC || 'FIAT 500') + ' の写真';
          img.loading = 'lazy';
          imgWrap.appendChild(img);
        } else {
          const noImg = document.createElement('div');
          noImg.className = 'car-noimage';
          noImg.textContent = 'NO PHOTO';
          imgWrap.appendChild(noImg);
        }

        // 本文
        const main = document.createElement('div');
        main.className = 'car-main';

        // 1行目：年式
        const headerBlock = document.createElement('div');
        headerBlock.className = 'car-header-block';

        const yearEl = document.createElement('div');
        yearEl.className = 'car-year';
        yearEl.textContent = car.Year ? (car.Year + '年式') : '';
        headerBlock.appendChild(yearEl);

        // 2行目：車両モデル名（Model_DisplayC）
        const modelEl = document.createElement('div');
        modelEl.className = 'car-model';
        modelEl.textContent =
          (car.Model_DisplayC && String(car.Model_DisplayC).trim()) ||
          ''; // 年式はここには付けない
        headerBlock.appendChild(modelEl);

        // ハンドルネーム
        const ownerEl = document.createElement('p');
        ownerEl.className = 'car-owner';
        ownerEl.innerHTML = 'オーナー: <span>' + (car.HandleName || '') + '</span>';

        // 都道府県（右寄せ）＋その他メタ
        const metaRow = document.createElement('div');
        metaRow.className = 'car-meta-row';

        if (car.Prefecture) {
          const pref = document.createElement('span');
          pref.className = 'badge-pref';
          pref.textContent = car.Prefecture;
          metaRow.appendChild(pref);
        }

        // 必要ならエンジン情報も右寄せ側に（なければ表示しない）
        if (car.Engine_Display) {
          const eng = document.createElement('span');
          eng.className = 'badge-engine';
          eng.textContent = car.Engine_Display;
          metaRow.appendChild(eng);
        }

        main.appendChild(headerBlock);
        main.appendChild(ownerEl);
        main.appendChild(metaRow);

        // フッター（今は更新情報のみ、ボタンはナシ）
        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const updated = document.createElement('span');
        updated.className = 'badge-updated';
        updated.textContent = ''; // createdAt / updatedAt は別途対応予定
        footer.appendChild(updated);

        link.appendChild(imgWrap);
        link.appendChild(main);
        link.appendChild(footer);

        card.appendChild(link);
        col.appendChild(card);
        listEl.appendChild(col);
      });
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      renderCars(e.target.value);
    });

    // 初期表示：新規登録順（新しい順）
    renderCars(document.getElementById('sortSelect').value);
  </script>

  <!-- Bootstrap JS（必要なら） -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"
  ></script>
</body>

</html>
