  <style>

      --bg-main: #f4f4f5;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 4px 12px rgba(15, 23, 42, 0.10);
      --text-main: #111827;
      --text-sub: #6b7280;
      --accent: #2856a8;
      --accent-soft: #e6efff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 28px;
    }
    @media (min-width: 1200px) {
      html {
        font-size: 18px;
      }
    }

    body {
      margin: 0;
      padding: 16px 12px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #e5edff 0, #f4f4f5 42%, #f4f4f5 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: block;
    }

    @media (min-width: 1200px) {
      body {
        padding: 32px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    .owner-wrapper {
      width: 100%;
      margin: 0;
    }
    @media (min-width: 1200px) {
      .owner-wrapper {
        max-width: 520px;
        margin: 0 auto;
      }
    }

    .owner-card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      padding: 20px 16px 22px;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    @media (min-width: 768px) {
      .owner-card {
        padding: 24px 22px 26px;
      }
    }

    .owner-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .owner-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 10px;
    }

    .owner-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
      color: var(--text-main);

      font-size: 0.9rem;

      color: var(--text-sub);

    .owner-section {

    }

    .owner-section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--text-main);
    }

    .owner-note {
      font-size: 0.86rem;
      color: var(--text-sub);
      line-height: 1.7;
      margin: 0 0 4px;
    }

    .owner-note-strong {
      font-weight: 600;
      color: var(--text-main);
    }

    .owner-links {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.86rem;
    }

    .owner-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .owner-links a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .owner-small {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 8px;
      line-height: 1.6;
    }

    .owner-actions {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:active {
      transform: translateY(1px);

    .btn-secondary {

    .btn-secondary:active {
      transform: translateY(1px);
    }

    .btn-secondary span {
      text-decoration: underline;

      font-weight: 500;
    }

    @media (max-width: 1200px) {
      .owner-card {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 32px 20px 28px;
      }

      .owner-label {
        font-size: 0.9rem;
        padding: 4px 14px;
        margin-bottom: 14px;
      }

      .owner-title {

        margin-bottom: 10px;
      }

      .owner-subtitle {

      }

      .owner-section {
        padding-top: 18px;
        margin-top: 18px;
      }

      .owner-section-title {
        font-size: 1.1rem;
        margin-bottom: 10px;
      }

      .owner-note {
        font-size: 1.1rem;
        line-height: 2.0;
        margin-bottom: 4px;
      }

      .owner-links {
        font-size: 1.05rem;
        gap: 6px;
      }

      .owner-small {
        font-size: 0.95rem;
        line-height: 1.8;
        margin-top: 10px;
      }

      .owner-actions {
        margin-top: 26px;
        padding-top: 16px;
        gap: 14px;
      }

      .btn-primary,
      .btn-secondary {
        font-size: 1.15rem;
        padding: 14px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="owner-wrapper">
    <article class="owner-card">
      <header class="owner-header">
        <p class="owner-label">オーナー向け</p>
        <h1 class="owner-title">オーナーページ</h1>
        <p class="owner-subtitle">
          ご自身の車両の登録・編集はこちらから。
        </p>
      </header>

      <section class="owner-section">
        <h2 class="owner-section-title">ご利用前に</h2>
        <p class="owner-note">
          このサービスは、登録されたクラシック FIAT 500 の情報を
          一般公開するオンラインガレージです。
        </p>
        <p class="owner-note">
          登録・編集の前に、必ず次の内容をご確認ください。
        </p>

        <div class="owner-links">
          <a href="<?= scriptUrl ?>?mode=policy" target="_blank" rel="noopener">
            ・利用規約・プライバシーポリシーを読む
          </a>
          <a href="<?= scriptUrl ?>?mode=howto" target="_blank" rel="noopener">
            ・はじめての方へ（登録の流れ）
          </a>
        </div>

        <p class="owner-small" id="rgOwnerStatus">
          まだログインしていません。Google アカウントでログインしてから、
          車両の登録・編集に進みます。
        </p>
      </section>

      <div class="owner-actions">
        <!-- メイン：ログイン or 新規登録へ進む -->
        <button
          type="button"
          class="btn-primary"
          id="rgOwnerPrimaryBtn"
          onclick="rgOwnerPrimaryAction()">
          Googleでログインして進む
        </button>

        <a class="btn-secondary" href="<?= scriptUrl ?>">
          <span>車両一覧に戻る</span>
        </a>
      </div>
    </article>
  </div>

  <script>
    // ★重要：edit.html / editGate と同じ firebaseConfig をここに貼ってください
const firebaseConfig = {
  apiKey: "AIzaSyCNCNsu61S3DIQ2pcmK2Ic_vqCINlZB9nk",
  authDomain: "registro500giappone-93f98.firebaseapp.com",
  projectId: "registro500giappone-93f98",
  storageBucket: "registro500giappone-93f98.firebasestorage.app",
  messagingSenderId: "723005462978",
  appId: "1:723005462978:web:e967a16a278f54b278de5b",
  measurementId: "G-ZRBFX1V51B"
};

    let auth = null;

    function rgInitFirebaseOwner() {
      if (typeof firebase === 'undefined') {
        console.warn('Firebase SDK が読み込まれていません。');
        return;
      }
      if (firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();

      const statusEl = document.getElementById('rgOwnerStatus');
      const primaryBtn = document.getElementById('rgOwnerPrimaryBtn');

      auth.onAuthStateChanged(function(user) {
        if (!statusEl || !primaryBtn) return;

        if (user) {
          const email = user.email || '';
          statusEl.textContent =
            'Google アカウント ' + email + ' でログイン中です。このまま車両の登録・編集に進めます。';
          primaryBtn.textContent = '新しく登録を始める';
        } else {
          statusEl.textContent =
            'まだログインしていません。Google アカウントでログインしてから、車両の登録・編集に進みます。';
          primaryBtn.textContent = 'Googleでログインして進む';
        }
      });
    }

    // ページ読み込み完了後に初期化
    window.addEventListener('load', rgInitFirebaseOwner);

    function rgOwnerPrimaryAction() {
      if (!auth) {
        console.warn('Firebase Auth がまだ初期化されていません。');
        return;
      }
      const user = auth.currentUser;
      if (user) {
        // ログイン済み → 新規登録へ
        const newEditUrl = "<?= scriptUrl ?>?mode=edit";
        window.location.href = newEditUrl;
      } else {
        // 未ログイン → Googleでログイン
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
      }
    }
  </script>
</body>
</html>
