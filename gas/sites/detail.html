<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Registro500Giappone - 車両詳細</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-main: #f4f4f7;
      --card-bg: #ffffff;
      --border-soft: #e5e7eb;
      --shadow-soft: 0 10px 28px rgba(15, 23, 42, 0.16);
      --text-main: #111827;
      --text-sub: #6b7280;
      --accent: #2856a8;
      --accent-soft: #e6efff;
      --accent-border: #c2d4ff;
      --radius-lg: 18px;
    }

    * { box-sizing: border-box; }

    /* モバイル基準で大きめ、PCで少し下げる */
    html {
      font-size: 28px;
    }
    @media (min-width: 1024px) {
      html { font-size: 18px; }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 18px 12px 28px;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 戻るリンク */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 10px;
    }
    .back-link::before {
      content: "←";
    }
    .back-link.bottom {
      margin-top: 20px;
    }

    /* 上部ヘッダー */
    .page-header {
      margin-bottom: 14px;
    }
    .handle-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      margin-bottom: 4px;
    }
    .title-year {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
    }
    .title-model {
      font-size: 1.1rem;
      font-weight: 800;
    }
    .title-pref {
      font-size: 0.9rem;
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      margin-left: auto;
      white-space: nowrap;
    }

    /* メインレイアウト：PCは左右、モバイルは縦積み */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 900px) {
      .layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .photo-column {
        flex: 0 0 48%;
      }
      .info-column {
        flex: 1;
      }
    }

    /* 写真エリア */
    .photo-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .photo-main-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 10px;
    }

    .photo-main-inner {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 正方形 */
      background: #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo-main-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f9fafb;
    }

    .photo-main-caption {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
    }

    .photo-thumbs-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 8px 10px 10px;
    }

    .photo-thumbs-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .photo-thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 6px;
    }

    .thumb-button {
      padding: 0;
      margin: 0;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      overflow: hidden;
      background: #f9fafb;
      cursor: pointer;
    }
    .thumb-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-button.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(40, 86, 168, 0.2);
    }

    .photo-noimage {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* 情報エリア */
    .info-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 14px 16px 16px;
    }

    .card-title {
      font-size: 1.0rem;
      margin: 0 0 6px;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }

    .spec-list {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.9rem;
    }
    .spec-row {
      display: grid;
      grid-template-columns: 7em 1fr;
      gap: 4px 8px;
      padding: 2px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .spec-row:last-child {
      border-bottom: none;
    }
    .spec-label {
      color: var(--text-sub);
      white-space: nowrap;
    }
    .spec-value {
      word-break: break-word;
    }

    .note-text {
      font-size: 0.9rem;
      white-space: pre-wrap;
    }

    /* オーナー向けアクション */
    .owner-actions {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-edit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #e11d48;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(225, 29, 72, 0.35);
    }
    .btn-edit:hover {
      background: #be123c;
    }

    .owner-note {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 0;
    }
  </style>
</head>

<?
  // ---------- サーバ側での表示用変数整形 ----------
  var yearText   = carData.Year ? String(carData.Year) + '年' : '';
  var modelText  = carData.Model_DisplayC || '';
  var handleName = carData.HandleName || '';
  var prefecture = carData.Prefecture || '';
  var engineText = carData.Engine_Display || '';

  var titleText = modelText || '';
  if (yearText && modelText) {
    titleText = yearText + ' ' + modelText;
  } else if (yearText) {
    titleText = yearText;
  }

  var carTitle = (modelText || '') + (handleName ? '（' + handleName + '）' : '');
  var mainAlt  = carTitle ? carTitle + 'の写真' : '車両写真';

  // 写真配列を構築
  var photos = [];
  function addPhoto(label, url, key) {
    if (url && String(url).trim() !== '') {
      photos.push({ label: label, url: url, key: key });
    }
  }
  addPhoto('メイン写真', carData.PhotoMain, 'PhotoMain');
  addPhoto('フロント',   carData.PhotoFront, 'PhotoFront');
  addPhoto('サイド',     carData.PhotoSide, 'PhotoSide');
  addPhoto('リア',       carData.PhotoRear, 'PhotoRear');
  addPhoto('エンジン',   carData.PhotoEngine, 'PhotoEngine');
  addPhoto('インテリア', carData.PhotoInterior, 'PhotoInterior');
  addPhoto('メーター周り', carData.PhotoSteeringCluster, 'PhotoSteeringCluster');

  // 備考テキスト（シートの列名はプロジェクトに合わせて適宜調整）
  var noteText =
    carData.Note ||
    carData.Memo ||
    carData.Comment ||
    '';

  // SNS / Webリンク候補（列名はあとで必要に応じて合わせ込みましょう）
  var snsList = [];
  ['SNS', 'SNS_URL', 'Instagram', 'Twitter', 'Facebook', 'Website', 'Blog', 'YouTube'].forEach(function(key) {
    var v = carData[key];
    if (v && String(v).trim() !== '') {
      snsList.push({ label: key, value: v });
    }
  });
?>

<body>
  <div class="page">

    <a href="<?= scriptUrl ?>" class="back-link">車両一覧に戻る</a>

    <header class="page-header">
      <? if (handleName) { ?>
        <p class="handle-name"><?= handleName ?></p>
      <? } ?>
      <div class="title-row">
        <? if (yearText) { ?>
          <span class="title-year"><?= yearText ?></span>
        <? } ?>
        <? if (modelText) { ?>
          <span class="title-model"><?= modelText ?></span>
        <? } ?>
        <? if (prefecture) { ?>
          <span class="title-pref"><?= prefecture ?></span>
        <? } ?>
      </div>
    </header>

    <main class="layout">
      <!-- 写真エリア -->
      <section class="photo-column">
        <div class="photo-main-box">
          <div class="photo-main-inner">
            <img
              id="mainPhoto"
              src="<?= photos.length ? photos[0].url : 'https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Fno_image_500.png?alt=media&token=6b54ce01-d76a-4b59-b815-f7e250f1fb78' ?>"
              alt="<?= mainAlt ?>">
          </div>
          <p class="photo-main-caption">
            <?= carTitle ? carTitle : '車両写真' ?>
          </p>
        </div>

        <div class="photo-thumbs-box">
          <p class="photo-thumbs-title">ギャラリー</p>
          <? if (photos.length === 0) { ?>
            <p class="photo-noimage">ほかの写真はまだ登録されていません。</p>
          <? } else { ?>
            <div class="photo-thumbs">
              <? for (var i = 0; i < photos.length; i++) {
                   var p = photos[i]; ?>
                <button type="button"
                        class="thumb-button<?= i === 0 ? ' active' : '' ?>"
                        data-index="<?= i ?>">
                  <img src="<?= p.url ?>" alt="<?= p.label ?>">
                </button>
              <? } ?>
            </div>
          <? } ?>
        </div>
      </section>

      <!-- 情報エリア -->
      <section class="info-column">

        <!-- 車両スペック -->
        <section class="card">
          <h2 class="card-title">車両情報</h2>
          <ul class="spec-list">
            <? if (modelText) { ?>
              <li class="spec-row">
                <span class="spec-label">車両名</span>
                <span class="spec-value"><?= modelText ?></span>
              </li>
            <? } ?>
            <? if (yearText) { ?>
              <li class="spec-row">
                <span class="spec-label">年式</span>
                <span class="spec-value"><?= yearText ?></span>
              </li>
            <? } ?>
            <? if (carData.BodyColor) { ?>
              <li class="spec-row">
                <span class="spec-label">ボディカラー</span>
                <span class="spec-value"><?= carData.BodyColor ?></span>
              </li>
            <? } ?>
            <? if (carData.Steering) { ?>
              <li class="spec-row">
                <span class="spec-label">ハンドル</span>
                <span class="spec-value"><?= carData.Steering ?></span>
              </li>
            <? } ?>
            <? if (prefecture) { ?>
              <li class="spec-row">
                <span class="spec-label">都道府県</span>
                <span class="spec-value"><?= prefecture ?></span>
              </li>
            <? } ?>
          </ul>
        </section>

        <!-- エンジン関係 -->
        <section class="card">
          <h2 class="card-title">エンジン関係</h2>
          <ul class="spec-list">
            <? if (engineText) { ?>
              <li class="spec-row">
                <span class="spec-label">概要</span>
                <span class="spec-value"><?= engineText ?></span>
              </li>
            <? } ?>
            <? if (carData.EngineCC) { ?>
              <li class="spec-row">
                <span class="spec-label">排気量</span>
                <span class="spec-value"><?= carData.EngineCC ?> cc</span>
              </li>
            <? } ?>
            <? if (carData.IgnitionType) { ?>
              <li class="spec-row">
                <span class="spec-label">点火方式</span>
                <span class="spec-value"><?= carData.IgnitionType ?></span>
              </li>
            <? } ?>
            <? if (carData.IgnitionSubType) { ?>
              <li class="spec-row">
                <span class="spec-label">点火システム</span>
                <span class="spec-value"><?= carData.IgnitionSubType ?></span>
              </li>
            <? } ?>
            <? if (carData.CoilName) { ?>
              <li class="spec-row">
                <span class="spec-label">コイル</span>
                <span class="spec-value"><?= carData.CoilName ?></span>
              </li>
            <? } ?>
            <? if (carData.PlugName) { ?>
              <li class="spec-row">
                <span class="spec-label">プラグ</span>
                <span class="spec-value"><?= carData.PlugName ?></span>
              </li>
            <? } ?>
            <? if (carData.FuelInjection) { ?>
              <li class="spec-row">
                <span class="spec-label">燃料供給</span>
                <span class="spec-value"><?= carData.FuelInjection ?></span>
              </li>
            <? } ?>
          </ul>
        </section>

        <!-- 備考 -->
        <? if (noteText) { ?>
          <section class="card">
            <h2 class="card-title">備考</h2>
            <p class="note-text"><?= noteText ?></p>
          </section>
        <? } ?>

        <!-- SNS / Webリンク -->
        <? if (snsList.length > 0) { ?>
          <section class="card">
            <h2 class="card-title">SNS / Web</h2>
            <ul class="spec-list">
              <? for (var i = 0; i < snsList.length; i++) {
                   var s = snsList[i];
                   var v = String(s.value);
                   var isUrl = /^https?:\/\//i.test(v); ?>
                <li class="spec-row">
                  <span class="spec-label"><?= s.label ?></span>
                  <span class="spec-value">
                    <? if (isUrl) { ?>
                      <a href="<?= v ?>" target="_blank" rel="noopener"><?= v ?></a>
                    <? } else { ?>
                      <?= v ?>
                    <? } ?>
                  </span>
                </li>
              <? } ?>
            </ul>
          </section>
        <? } ?>

        <!-- オーナー向けアクション -->
        <section class="card">
          <h2 class="card-title">オーナー向け</h2>
          <div class="owner-actions">
            <? if (isOwner) { ?>
              <a href="<?= ownerAppUrl ?>?mode=edit&doc=<?= carData.DocumentID ?>"
                 class="btn-edit" target="_blank" rel="noopener">
                この車両を編集する
              </a>
              <p class="owner-note">
                ※ 編集には Google ログインが必要です。編集後はこの画面に戻ってきます。
              </p>
            <? } else { ?>
              <p class="owner-note">
                この車両の編集は、登録したオーナー本人のみが行えます。
              </p>
            <? } ?>
          </div>
        </section>

      </section>
    </main>

    <a href="<?= scriptUrl ?>" class="back-link bottom">車両一覧に戻る</a>
  </div>

  <script>
    // サムネイルクリックでメイン写真を差し替え
    (function () {
      const photos = <?!= JSON.stringify(photos) ?>;
      const mainImg = document.getElementById('mainPhoto');
      const thumbButtons = document.querySelectorAll('.thumb-button');

      if (!mainImg || !thumbButtons.length || !photos || !photos.length) return;

      thumbButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const index = Number(btn.dataset.index || '0');
          if (!Number.isNaN(index) && photos[index]) {
            mainImg.src = photos[index].url;
            thumbButtons.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
          }
        });
      });
    })();
  </script>
</body>
</html>
