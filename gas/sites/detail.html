<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>車両詳細 - Registro500 Giappone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* detail用のCSS (省略なしで記述) */
    html { font-size: 28px; }
    @media (min-width: 1025px) { html { font-size: 18px; } }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; color: #111827; padding-bottom: 40px;}
    .rg-main { max-width: 72rem; margin: 0 auto; padding: 20px 12px; }
    .rg-back { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;}
    .rg-back a { text-decoration: none; color: #2856a8; font-weight: 600; }
    
    .rg-card { background: #fff; border-radius: 1rem; border: 1px solid #e5e7eb; padding: 1.2rem; margin-bottom: 1rem; }
    .rg-section-title {
      font-weight: 700; font-size: 1.1rem; color: #2856a8; margin-bottom: 0.8rem;
      border-bottom: 2px solid #f0f0f0; padding-bottom: 0.3rem;
    }
    
    /* 写真エリア */
    .rg-photo-square { width: 100%; padding-top: 75%; position: relative; background: #eee; border-radius: 0.8rem; overflow: hidden; }
    .rg-photo-square img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .rg-photo-caption { margin-top: 10px; font-weight: bold; font-size: 1.4rem; }
    .rg-owner-info { color: #666; font-size: 1rem; margin-top: 4px; }

    /* スペック表 */
    .rg-spec-grid { display: grid; grid-template-columns: 10rem 1fr; border-top: 1px solid #eee; }
    .rg-spec-grid dt, .rg-spec-grid dd { padding: 8px; border-bottom: 1px solid #eee; margin: 0; font-size: 0.95rem; }
    .rg-spec-grid dt { background: #f9fafb; color: #555; font-weight: 600; }
    
    /* 編集ボタン */
    .btn-edit {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px;
      border-radius: 999px; background: #e6efff; color: #2856a8; text-decoration: none; font-weight: bold; font-size: 0.9rem;
    }
    .btn-edit:hover { background: #dbeafe; }

    /* ローディング */
    #loading { text-align: center; padding: 50px; font-size: 1.2rem; color: #666; }
    #content { display: none; } /* 読み込み完了まで隠す */
  </style>
</head>
<body>

  <main class="rg-main">
    <div class="rg-back">
      <a href="index.html">← 車両一覧に戻る</a>
      <a id="editBtn" href="#" class="btn-edit" style="display:none;">
        ✏️ この車両のオーナーの方は編集
      </a>
    </div>

    <div id="loading">詳細データを読み込んでいます...</div>

    <div id="content">
      <div class="row g-4">
        <div class="col-12 col-lg-5">
          <section class="rg-card">
            <div class="rg-photo-square">
              <img id="photoMain" src="" alt="Main Photo">
            </div>
            <div class="rg-photo-caption">
              <span id="year"></span> <span id="modelName"></span>
            </div>
            <div class="rg-owner-info">
              Owner: <span id="handleName"></span>
              <span id="prefecture" style="margin-left:8px; padding:2px 6px; background:#e0e7ff; border-radius:4px; font-size:0.8rem;"></span>
            </div>
          </section>
          
          <section class="rg-card">
            <h2 class="rg-section-title">こだわりポイント</h2>
            <p id="highlights" style="white-space: pre-wrap; line-height: 1.8;"></p>
          </section>
        </div>

        <div class="col-12 col-lg-7">
          <section class="rg-card">
            <h2 class="rg-section-title">スペック・仕様</h2>
            <dl class="rg-spec-grid" id="specList">
              </dl>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz0BJpaG-AcK3T6YYtav-nfd3gqGlkEWu3AvpW5uRT52N9jW8pBKLrpLSqvXqyD2ghwCA/exec";
    const NO_IMAGE_URL = 'https://firebasestorage.googleapis.com/v0/b/registro500giappone-93f98.firebasestorage.app/o/assets%2Fno_image_500.png?alt=media&token=6b54ce01-d76a-4b59-b815-f7e250f1fb78';

    // URLパラメータから docID を取得
    const params = new URLSearchParams(window.location.search);
    const docId = params.get('doc');

    async function fetchDetail() {
      if (!docId) {
        document.getElementById('loading').textContent = '車両IDが指定されていません。';
        return;
      }

      try {
        const res = await fetch(API_URL + `?mode=detail&doc=${docId}`);
        const json = await res.json();

        if (json.success && json.data) {
          renderDetail(json.data);
        } else {
          document.getElementById('loading').textContent = 'データの取得に失敗しました。';
        }
      } catch (e) {
        document.getElementById('loading').textContent = '通信エラーが発生しました。';
        console.error(e);
      }
    }

    function renderDetail(car) {
      // ローディングを消してコンテンツを表示
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      // 基本情報セット
      setText('year', car.Year ? car.Year + '年' : '');
      setText('modelName', car.Model_DisplayC);
      setText('handleName', car.HandleName);
      setText('prefecture', car.Prefecture);
      setText('highlights', car.Highlights);

      // 画像セット
      const img = document.getElementById('photoMain');
      img.src = car.PhotoMain || NO_IMAGE_URL;

      // 編集ボタンのリンク設定 (Vercel上の edit.html へ)
      const editBtn = document.getElementById('editBtn');
      editBtn.href = `edit.html?doc=${encodeURIComponent(car.DocumentID)}`;
      editBtn.style.display = 'inline-flex';

      // スペック表の生成（必要な項目を追加してください）
      const specs = [
        { label: 'ボディカラー', val: car.BodyColor },
        { label: '排気量', val: car.EngineCC ? car.EngineCC + ' cc' : '' },
        { label: 'エンジン形式', val: car.Engine_Display },
        { label: 'ミッション', val: car.Transmission },
        { label: 'ホイール', val: car.Wheel },
        { label: 'タイヤ', val: car.TireSize },
        // ... 他の項目もここに追加
      ];

      const specList = document.getElementById('specList');
      specs.forEach(item => {
        if (item.val) {
          specList.innerHTML += `<dt>${item.label}</dt><dd>${item.val}</dd>`;
        }
      });
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text || '';
    }

    fetchDetail();
  </script>
</body>
</html>
