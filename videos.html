    .vp-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;}

  <div class="wrap">
    <div class="vp-head">
      <h1>🎬 クラシックFIAT 500/126 動画ガイド</h1>
      <p class="lead">整備・レストア・チューニングの人気YouTube動画を、箇所別・人気順・日本語解説付きで。</p>

      <div class="vp-search">

  <footer>
    AI生成の日本語解説を含みます。実際の整備は元動画と整備書で必ずご確認ください。<br>
    © Registro500 Giappone
  </footer>

  <script>
  (function(){
    const PAGE = 10;
    const sb = supabaseClient;
    const NOIMG = (typeof NO_IMAGE_URL !== 'undefined') ? NO_IMAGE_URL : 'https://placehold.co/600x338?text=No+Image';

    // 状態（URLから初期化）
    const p = new URLSearchParams(location.search);
    let state = {
      category: p.get('category') || '',
      part: p.get('part') || '',
      vehicle: normVeh(p.get('vehicle') || ''),
      q: p.get('q') || '',
      ja: p.has('ja') ? p.get('ja') === '1' : true,   // 既定ON（日本語解説あり）
      cc: p.get('cc') === '1',
      offset: 0,
    };

    // 整備箇所チップは「車の系統順」で並べる（HANDOFF設計の系統順に準拠）
    const SYSTEM_ORDER = ['valve-clearance','head-topend','oil-seals','carb-tuning','carb-rebuild','ignition-timing','contact-points','spark-plugs','wiring-dynamo-belt','clutch','transmission','brakes','suspension'];

    let masters = { cats: [], parents: [], parts: [], vehicles: [] };
    let catCounts = {};       // 親slug -> 件数
    let currentIds = null;    // フィルタで絞ったid集合（null=制限なし）

    function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function normVeh(v){ if(v==='126')return 'fiat-126'; if(v==='500')return 'fiat-500'; return v; }
    function fmtDur(sec){ if(!sec&&sec!==0)return''; const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; }
    function fmtViews(n){ n=n||0; if(n>=10000)return Math.round(n/1000)/10+'万回'; return n.toLocaleString()+'回'; }

    function syncUrl(){
      const u = new URLSearchParams();
      if(state.category)u.set('category',state.category);
      if(state.part)u.set('part',state.part);
      if(state.vehicle)u.set('vehicle',state.vehicle);
      if(state.q)u.set('q',state.q);
      u.set('ja', state.ja?'1':'0');   // 既定ONのため明示（0で解除を記録）
      if(state.cc)u.set('cc','1');
      const qs=u.toString();
      history.replaceState(null,'',qs?('?'+qs):location.pathname);
    }

    async function loadMasters(){
      const [{data:cats},{data:parts},{data:vehs},{data:vpt},{data:vv},{data:vmeta}] = await Promise.all([
        sb.from('categories').select('id,slug,name_ja,parent_id,sort_order').order('sort_order'),
        sb.from('part_tags').select('id,slug,name_ja'),
        sb.from('vehicles').select('id,slug,name_display'),
        sb.from('video_part_tags').select('video_id,part_tag_id'),
        sb.from('video_vehicles').select('video_id,vehicle_id'),
        sb.from('videos').select('id,category_id'),
      ]);
      masters.cats = cats||[];
      masters.parents = (cats||[]).filter(c=>!c.parent_id);
      masters.parts = parts||[];
      masters.vehicles = vehs||[];
      masters.vpt = vpt||[];      // video_id -> part_tag_id
      masters.vv = vv||[];        // video_id -> vehicle_id
      masters.vmeta = vmeta||[];  // video_id -> category_id
    }

    // 現在のカテゴリ/車種で動画が存在する part_tag_id の集合（チップを文脈連動で出すため）
    function availablePartTagIds(){
      let vidSet = null; // null=制限なし
      if(state.category){
        const cids=new Set(categoryIdsForSlug(state.category));
        vidSet = new Set(masters.vmeta.filter(v=>cids.has(v.category_id)).map(v=>v.id));
      }
      if(state.vehicle){
        const vid=vehId(state.vehicle);
        const s=new Set(masters.vv.filter(r=>r.vehicle_id===vid).map(r=>r.video_id));
        vidSet = vidSet ? new Set([...vidSet].filter(x=>s.has(x))) : s;
      }
      const present=new Set();
      masters.vpt.forEach(r=>{ if(vidSet===null || vidSet.has(r.video_id)) present.add(r.part_tag_id); });
      return present;
    }

    // slug が親なら配下の中区分id群、中区分ならそのid単体を返す（親/子どちらのリンクでも効く）
    function categoryIdsForSlug(slug){
      const node = masters.cats.find(c=>c.slug===slug);
      if(!node) return [];
      if(node.parent_id) return [node.id]; // 中区分そのもの
      return masters.cats.filter(c=>c.parent_id===node.id).map(c=>c.id); // 親→配下
    }
    function childIdsOfParent(parentSlug){
      const parent = masters.cats.find(c=>c.slug===parentSlug && !c.parent_id);
      if(!parent) return [];
      return masters.cats.filter(c=>c.parent_id===parent.id).map(c=>c.id);
    }
    function partId(slug){ const t=masters.parts.find(x=>x.slug===slug); return t?t.id:null; }
    function vehId(slug){ const v=masters.vehicles.find(x=>x.slug===slug); return v?v.id:null; }

    // id集合フィルタ（part / vehicle）。複数あれば積集合。
    async function resolveIdFilter(){
      let sets = [];
      if(state.part){
        const pid = partId(state.part);
        if(pid===null) return [];
        const {data} = await sb.from('video_part_tags').select('video_id').eq('part_tag_id',pid);
        sets.push(new Set((data||[]).map(r=>r.video_id)));
      }
      if(state.vehicle){
        const vid = vehId(state.vehicle);
        if(vid===null) return [];
        const {data} = await sb.from('video_vehicles').select('video_id').eq('vehicle_id',vid);
        sets.push(new Set((data||[]).map(r=>r.video_id)));
      }
      if(sets.length===0) return null; // 制限なし
      // 積集合
      let acc = sets[0];
      for(let i=1;i<sets.length;i++){ acc = new Set([...acc].filter(x=>sets[i].has(x))); }
      return [...acc];
    }

    function buildQuery(forCount){
      let qy = sb.from('videos').select('id,youtube_id,title_ja,title_original,channel_name,duration_seconds,thumbnail_url,view_count,has_captions,embeddable,description_ja', forCount?{count:'exact',head:true}:{});
      if(state.category){ const ids=categoryIdsForSlug(state.category); qy=qy.in('category_id', ids.length?ids:['00000000-0000-0000-0000-000000000000']); }
      if(currentIds!==null){ qy=qy.in('id', currentIds.length?currentIds:['00000000-0000-0000-0000-000000000000']); }
      if(state.q){ const t=state.q.replace(/[%,]/g,' ').trim(); qy=qy.or(`title_ja.ilike.%${t}%,title_original.ilike.%${t}%`); }
      if(state.ja){ qy=qy.not('description_ja','is',null); }
      if(state.cc){ qy=qy.eq('has_captions',true); }
      return qy;
    }

    async function renderCounts(){
      // 親カテゴリの件数（おおまかな器の充実度を見せる）
      catCounts = {};
      await Promise.all(masters.parents.map(async pr=>{
        const ids = childIdsOfParent(pr.slug);
        if(!ids.length){ catCounts[pr.slug]=0; return; }
        const {count} = await sb.from('videos').select('id',{count:'exact',head:true}).in('category_id',ids);
        catCounts[pr.slug]=count||0;
      }));
    }

    function renderControls(){
      // カテゴリタイル
      document.getElementById('catGrid').innerHTML = masters.parents.map(pr=>
        `<button class="vp-cat${state.category===pr.slug?' active':''}" data-cat="${esc(pr.slug)}">${esc(pr.name_ja)}<span class="cnt">${catCounts[pr.slug]||0}本</span></button>`
      ).join('');
      // 箇所チップ（系統順に並べ、選択中カテゴリ/車種に動画がある箇所だけ表示。選択中の箇所は常に残す）
      const present = availablePartTagIds();
      const ordered = SYSTEM_ORDER.map(slug=>masters.parts.find(p=>p.slug===slug)).filter(Boolean);
      masters.parts.forEach(p=>{ if(!SYSTEM_ORDER.includes(p.slug)) ordered.push(p); });
      const visible = ordered.filter(t=> present.has(t.id) || state.part===t.slug);
      const chipsEl = document.getElementById('partChips');
      chipsEl.innerHTML = visible.map(t=>
        `<button class="vp-chip${state.part===t.slug?' active':''}" data-part="${esc(t.slug)}">${esc(t.name_ja)}</button>`
      ).join('') || '<span style="font-size:.82rem;color:var(--muted);">この条件に該当する整備箇所はありません</span>';
      // 車種バー
      document.querySelectorAll('#vehBar button').forEach(b=>b.classList.toggle('active', (b.dataset.veh||'')===state.vehicle));
      // トグル
      document.getElementById('tglJa').checked=state.ja;
      document.getElementById('tglCc').checked=state.cc;
      document.getElementById('searchInput').value=state.q;
      // アクティブ表示
      const parts=[];
      if(state.category){const c=masters.cats.find(x=>x.slug===state.category);if(c)parts.push('カテゴリ：'+c.name_ja);}
      if(state.part){const t=masters.parts.find(x=>x.slug===state.part);if(t)parts.push('箇所：'+t.name_ja);}
      if(state.vehicle){const v=masters.vehicles.find(x=>x.slug===state.vehicle);if(v)parts.push('車種：'+v.name_display);}
      if(state.q)parts.push('検索：'+state.q);
      if(state.cc)parts.push('字幕あり');   // 日本語解説ありは既定ONのためバーには出さない
      const bar=document.getElementById('activeBar');
      if(parts.length){ document.getElementById('activeText').textContent=parts.join(' / '); bar.style.display='flex'; }
      else bar.style.display='none';
    }

    function cardHtml(v){
      const badges=[];
      if(v.description_ja)badges.push('<span class="vp-badge">日本語解説</span>');
      if(v.has_captions)badges.push('<span class="vp-badge cc">字幕</span>');
      return `<a class="vp-card" href="video.html?id=${encodeURIComponent(v.youtube_id)}">
        <div class="vp-thumb"><img src="${esc(v.thumbnail_url||NOIMG)}" alt="${esc(v.title_ja||v.title_original)}" loading="lazy" onerror="this.src='${NOIMG}'">${v.duration_seconds?`<span class="vp-dur">${fmtDur(v.duration_seconds)}</span>`:''}</div>
        <div class="vp-body">
          ${badges.length?`<div class="vp-badges">${badges.join('')}</div>`:''}
          <div class="vp-title">${esc(v.title_ja||v.title_original)}</div>
          <div class="vp-ch">${esc(v.channel_name||'')}</div>
          <div class="vp-metarow"><span>▶ ${fmtViews(v.view_count)}</span></div>
        </div>
      </a>`;
    }

    let total=0;
    async function loadList(reset){
      if(reset){ state.offset=0; document.getElementById('grid').innerHTML=''; }
      document.getElementById('loading').style.display='block';
      document.getElementById('empty').style.display='none';
      document.getElementById('moreWrap').style.display='none';

      if(reset){
        currentIds = await resolveIdFilter();
        const {count} = await buildQuery(true);
        total = count||0;
        document.getElementById('countLabel').textContent = total>0?`${total}本（人気順）`:'';
      }

      const {data,error} = await buildQuery(false)
        .order('view_count',{ascending:false})
        .range(state.offset, state.offset+PAGE-1);

      document.getElementById('loading').style.display='none';
      if(error){ document.getElementById('empty').textContent='読み込みに失敗しました。'; document.getElementById('empty').style.display='block'; return; }

      const rows=data||[];
      if(reset && rows.length===0){ document.getElementById('empty').style.display='block'; document.getElementById('countLabel').textContent=''; return; }
      document.getElementById('grid').insertAdjacentHTML('beforeend', rows.map(cardHtml).join(''));
      state.offset += rows.length;
      document.getElementById('moreWrap').style.display = (state.offset<total)?'block':'none';
    }

    function setAndReload(patch){ Object.assign(state,patch); syncUrl(); renderControls(); loadList(true); }

    // イベント
    document.getElementById('catGrid').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;setAndReload({category: state.category===b.dataset.cat?'':b.dataset.cat});});
    document.getElementById('partChips').addEventListener('click',e=>{const b=e.target.closest('[data-part]');if(!b)return;setAndReload({part: state.part===b.dataset.part?'':b.dataset.part});});
    document.getElementById('vehBar').addEventListener('click',e=>{const b=e.target.closest('[data-veh]');if(!b)return;setAndReload({vehicle:b.dataset.veh||''});});
    document.getElementById('tglJa').addEventListener('change',e=>setAndReload({ja:e.target.checked}));
    document.getElementById('tglCc').addEventListener('change',e=>setAndReload({cc:e.target.checked}));
    document.getElementById('searchBtn').addEventListener('click',()=>setAndReload({q:document.getElementById('searchInput').value.trim()}));
    document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')setAndReload({q:e.target.value.trim()});});
    document.getElementById('clearBtn').addEventListener('click',()=>setAndReload({category:'',part:'',vehicle:'',q:'',ja:true,cc:false}));
    document.getElementById('moreBtn').addEventListener('click',()=>loadList(false));

    (async function init(){
      try{
        await loadMasters();
        await renderCounts();
        renderControls();
        await loadList(true);
      }catch(e){
        console.error(e);
        document.getElementById('loading').style.display='none';
        document.getElementById('empty').textContent='読み込みに失敗しました。時間をおいて再度お試しください。';
        document.getElementById('empty').style.display='block';
      }
    })();
  })();
  </script>
</body>
</html>
