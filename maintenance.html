<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="クラシックFIAT 500・126のオーナーが残した整備の記録を、新しい順に読めます。言葉・型式・箇所で探せます。">
  <link rel="canonical" href="https://www.registro500.com/maintenance">
  <meta property="og:title" content="みんなの整備手帳">
  <meta property="og:description" content="クラシックFIAT 500・126のオーナーが残した整備の記録を、新しい順に読めます。">
  <meta property="og:url" content="https://www.registro500.com/maintenance">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta property="og:site_name" content="Registro500 Giappone">

  <meta name="twitter:card" content="summary_large_image">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SHHC4JYH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-27SHHC4JYH');

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.0" integrity="sha384-NFPmVbJvc91cC9zbheWJA+qZKj0Kod2IEMvGnxVKB5A7wLgRNA6Aobu8neZmQ19J" crossorigin="anonymous"></script>
  <script>const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
  <script src="maint-view.js?v=20261104b"></script>
  <style>
    :root {
      --bg-main: #f5f0e6; --card-bg: #fffefb; --border-soft: #d6c9b0;
      --shadow-soft: 0 2px 8px rgba(70,58,40,.10); --text-main: #2e2a24; --text-sub: #7a705f;
      --accent: #1f5c3d; --accent-soft: #e7efe7;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      --mv-accent: var(--accent); --mv-muted: var(--text-sub); --mv-soft: var(--accent-soft);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #1a1714; --card-bg: #2b2721; --border-soft: #403a30;
        --shadow-soft: 0 2px 10px rgba(0,0,0,.35); --text-main: #ece6d9; --text-sub: #a89e8c;
        --accent: #7fb894; --accent-soft: #24382c;
      }
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }
    body { font-family: var(--font-sans); margin: 0; padding: 20px 16px 60px; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }
    .page { max-width: 680px; margin: 0 auto; }
    .back-link { display: inline-block; font-size: .85rem; color: var(--text-sub); text-decoration: none; margin-bottom: 12px; }
    .back-link:hover { color: var(--accent); }
    h1 { font-size: 1.35rem; margin: .2em 0 .6em; }
    .lead { font-size: .88rem; color: var(--text-sub); margin: 0 0 14px; line-height: 1.8; }
    .lead a { color: var(--accent); }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .filters input, .filters select { font: inherit; font-size: 16px; width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--card-bg); color: var(--text-main); }
    .filters input { grid-column: 1 / -1; }
    .filters select.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--accent); font-weight: 700; }
    .card { background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 4px 14px; box-shadow: var(--shadow-soft); }
    .rec { border-top: 1px solid var(--border-soft); padding: 12px 0; }
    .rec:first-child { border-top: 0; }
    .rec-head { font-size: .78rem; color: var(--text-sub); margin-bottom: 4px; }
    .rec-head a { color: var(--text-sub); }
    .more { display: block; width: 100%; margin-top: 14px; font: inherit; font-size: .9rem; padding: 10px; border: 1px solid var(--accent); border-radius: 10px; background: transparent; color: var(--accent); cursor: pointer; }
    .state { font-size: .88rem; color: var(--text-sub); padding: 14px 0; }
    .shared { margin-bottom: 14px; }
    .shared-lb { font-size: .78rem; font-weight: 700; color: var(--accent); padding-top: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="page">
  <a href="/" class="back-link">&larr; トップに戻る</a>
  <h1>🛠️ みんなの整備手帳</h1>
  <p class="lead">オーナーが残した整備の記録を、作業した日の新しい順に並べています。言葉・型式・箇所で探せます。<br>自分の車の記録は <a href="/my-maintenance">マイ整備手帳</a> から書けます。</p>

  <div class="card shared hidden" id="sharedCard"><div class="shared-lb">共有された記録</div><div id="shared"></div></div>
  <div class="filters">
    <input type="search" id="q" placeholder="🔍 キングピン、キャブ…" aria-label="言葉で探す" enterkeyhint="search">
    <select id="modelSel" aria-label="型式で絞り込む"></select>
    <select id="areaSel" aria-label="箇所で絞り込む"></select>
  </div>
  <div class="card"><div id="list"><p class="state">読み込み中…</p></div></div>
  <button type="button" class="more hidden" id="moreBtn">もっと見る</button>
</div>

<script>
(function () {
  const PAGE = 20;
  const $ = id => document.getElementById(id);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function track(name, params) { try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {} }

  // 整備の記事（オーナーの記事のうち「🔧 整備の記事」にした行）も混ぜる。正本 owner-articles/HANDOFF.md
  // 公開の準備が整うまで止めておく＝URL に ?articles-preview を付けたときだけ出す
  const ARTICLES_ON_MAINT_LIST = true;
  const articlesOn = ARTICLES_ON_MAINT_LIST || new URLSearchParams(location.search).has('articles-preview');

  // 「👍 参考になった」（数は出さない・書いた人に翌朝メール＝2026-11-04）。一覧を描く前に準備を始める
  MaintView.initHelpful(supabaseClient, { track });
  const REC_SELECT = 'id, car_id, title, comment, work_date, odometer_km, worker, areas, video_urls, video_captions, source, minkara_url, created_at, maint_photos(url, thumb_url, caption, sort_order)';
  const onShare = rec => track('maint_share', { from: 'list' });

  let area = null;
  let task = null;   // オイル交換の印（maint_records.tasks）。箇所のプルダウンの下の段から選ぶ
  let model = null;
  let qText = '';
  let modelCarIds = null;   // 型式で絞るときの車の document_id（記録の表と車の表は外部キーでつながっていないので先に引く）
  let offset = 0;    // maint_records の読んだ位置
  let aOffset = 0;   // owner_articles の読んだ位置（2つの表を日付順に混ぜるので位置は別々に持つ）
  let loading = false;
  let seq = 0;
  const carCache = {};

  // 型式の選択肢＝cars の型式の持ち方に合わせて引く（その他の型式は「すべて」で出る）
  const MODELS = [
    ['D', '500 D', q => q.eq('model_display_a', 'Nuova500').eq('model_display_b', 'D')],
    ['F', '500 F', q => q.eq('model_display_a', 'Nuova500').eq('model_display_b', 'F')],
    ['L', '500 L', q => q.eq('model_display_a', 'Nuova500').eq('model_display_b', 'L')],
    ['R', '500 R', q => q.eq('model_display_a', 'Nuova500').eq('model_display_b', 'R')],
    ['G', 'ジャルディニエラ', q => q.eq('model_display_b', 'Giardiniera')],
    ['abarth', 'アバルト', q => q.eq('model_display_a', 'FIAT ABARTH')],
    ['126', '126', q => q.eq('car_type', '126')]
  ];
  const MODEL_BY = Object.fromEntries(MODELS.map(m => [m[0], m]));
  // マイ整備手帳の TASKS と同じ（DB の check と同じ並び）
  const TASKS = [['engine_oil', '🛢 エンジンオイル交換'], ['gear_oil', '⚙️ ミッションオイル交換']];
  const TASK_LABEL = Object.fromEntries(TASKS);

  // 絞り込みは URL に載せる（?q=キャブ&model=F&area=brake で直接開ける・共有したリンクで同じ結果になる）
  const params = new URLSearchParams(location.search);
  if (params.get('area') && MaintView.AREA_LABEL[params.get('area')]) area = params.get('area');
  if (params.get('task') && TASK_LABEL[params.get('task')]) { task = params.get('task'); area = null; }
  if (params.get('model') && MODEL_BY[params.get('model')]) model = params.get('model');
  qText = (params.get('q') || '').trim();

  function fillSelect(sel, head, items, cur) {
    sel.textContent = '';
    [['', head]].concat(items).forEach(([v, label]) => {
      const o = el('option', null, label); o.value = v; if ((cur || '') === v) o.selected = true;
      sel.appendChild(o);
    });
    sel.classList.toggle('on', !!cur);
  }
  function syncUrl() {
    const u = new URL(location.href);
    [['q', qText], ['model', model], ['area', area], ['task', task]].forEach(([k, v]) => { if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); });
    history.replaceState(null, '', u);
  }
  function setupFilters() {
    fillSelect($('modelSel'), '型式：すべて', MODELS.map(m => [m[0], m[1]]), model);
    fillSelect($('areaSel'), '箇所：すべて', MaintView.AREAS, area);
    // 箇所の下に「作業」の段＝オイル交換の印で絞る（箇所とは同時に選べない＝1つのプルダウン）
    const og = el('optgroup'); og.label = '作業';
    TASKS.forEach(([v, label]) => { const o = el('option', null, label); o.value = 'task:' + v; if (task === v) o.selected = true; og.appendChild(o); });
    $('areaSel').appendChild(og);
    $('areaSel').classList.toggle('on', !!(area || task));
    $('q').value = qText;
    $('modelSel').addEventListener('change', () => {
      model = $('modelSel').value || null; modelCarIds = null;
      $('modelSel').classList.toggle('on', !!model);
      track('maint_model', { model: model || 'all' });
      syncUrl(); reload();
    });
    $('areaSel').addEventListener('change', () => {
      const v = $('areaSel').value || '';
      task = v.startsWith('task:') ? v.slice(5) : null;
      area = task ? null : (v || null);
      $('areaSel').classList.toggle('on', !!(area || task));
      track('maint_area', { area: task ? 'task:' + task : (area || 'all') });
      syncUrl(); reload();
    });
    // 打ち終わって少し待ってから探す（1文字ごとに読みに行かない）
    let timer = null;
    const apply = () => {
      clearTimeout(timer);
      const v = $('q').value.trim();
      if (v === qText) return;
      qText = v;
      if (v) track('maint_search', { q: v.slice(0, 40) });
      syncUrl(); reload();
    };
    $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 500); });
    $('q').addEventListener('search', apply);
    $('q').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); apply(); $('q').blur(); } });
  }

  // ilike に渡す語＝PostgREST の or() を壊す記号とワイルドカードは外す。空白（全角も）で区切った語はすべて含むものを探す
  function likeWords() { return qText.replace(/[,()%*\\:"]/g, ' ').split(/[\s　]+/).filter(Boolean).slice(0, 5); }

  async function ensureModelCars() {
    if (!model || modelCarIds) return;
    const { data, error } = await MODEL_BY[model][2](supabaseClient.from('cars').select('document_id'));
    if (error) throw error;
    modelCarIds = (data || []).map(c => c.document_id);
  }

  async function loadCars(ids) {
    const need = ids.filter(id => !(id in carCache));
    if (!need.length) return;
    const { data } = await supabaseClient.from('cars')
      .select('document_id, handle_name, model_display_a, model_display_b, model_display_c').in('document_id', need);
    need.forEach(id => { carCache[id] = null; });
    (data || []).forEach(c => {
      carCache[c.document_id] = {
        name: c.handle_name || '',
        model: c.model_display_c || [c.model_display_a || '', c.model_display_b || ''].filter(Boolean).join(' ')
      };
    });
  }

  function reload() {
    offset = 0; aOffset = 0;
    $('list').textContent = '';
    $('list').appendChild(el('p', 'state', '読み込み中…'));
    $('moreBtn').classList.add('hidden');
    loadPage();
  }

  // 整備の記事の1行＝題名がそのまま記事へのリンク（本文・写真は持たない）
  function renderArticle(a) {
    if (MaintView.injectCss) MaintView.injectCss();
    const wrap = el('div', 'mv-item');
    const row = el('div', 'mv-row');
    const txt = el('div');
    txt.style.minWidth = '0';
    const link = el('a', 'mv-title', '📝 ' + a.title + ' ↗');
    if (/^https:\/\//.test(a.url || '')) link.href = a.url;
    link.target = '_blank'; link.rel = 'noopener noreferrer nofollow ugc';
    link.addEventListener('click', () => track('maint_open', { from: 'list', kind: 'article' }));
    txt.appendChild(link);
    txt.appendChild(el('div', 'mv-meta', (a.site_name ? a.site_name + ' の記事' : '記事')));
    if ((a.areas || []).length) {
      const box = el('div', 'mv-chips');
      a.areas.forEach(v => { if (MaintView.AREA_LABEL[v]) box.appendChild(el('span', 'mv-chip', MaintView.AREA_LABEL[v])); });
      txt.appendChild(box);
    }
    row.appendChild(txt);
    wrap.appendChild(row);
    return wrap;
  }

  // 日付と車（持ち主の名前・型式）の見出し
  function recHead(date, carId) {
    const head = el('div', 'rec-head');
    head.appendChild(document.createTextNode(MaintView.fmtDate(date) + '　'));
    const car = carCache[carId];
    if (car) {
      const a = el('a', null, (car.name ? car.name + 'さん' : '') + (car.model ? '（' + car.model + '）' : ''));
      a.href = '/detail?doc=' + encodeURIComponent(carId) + '#history';
      head.appendChild(a);
    }
    return head;
  }

  // ?r=<記録id>＝「シェア」で共有された1件。一覧の上に開いた状態で出す
  // 非公開・消された記録は RLS で返らない＝見られない旨だけ出す
  async function loadShared(id) {
    $('sharedCard').classList.remove('hidden');
    const { data, error } = await supabaseClient.from('maint_records').select(REC_SELECT)
      .eq('id', id).eq('is_public', true).not('work_date', 'is', null).maybeSingle();
    $('shared').textContent = '';
    if (error || !data) {
      $('shared').appendChild(el('p', 'state', 'この記録は見られません（非公開になったか、消された可能性があります）。'));
      return;
    }
    await loadCars([data.car_id]);
    const item = el('div', 'rec');
    item.appendChild(recHead(data.work_date, data.car_id));
    const it = MaintView.renderItem(data, { emoji: '🔧', onOpen: rec => track('maint_open', { from: 'shared' }), onShare });
    item.appendChild(it);
    $('shared').appendChild(item);
    if (it.open) it.open();
    track('maint_shared_view');
  }

  async function loadPage() {
    if (loading) return;
    loading = true;
    const my = ++seq;
    try { await ensureModelCars(); } catch (e) {
      console.error('[maintenance]', e);
      if (my === seq) { $('list').textContent = ''; $('list').appendChild(el('p', 'state', '読み込みに失敗しました。再読み込みしてください。')); }
      loading = false; return;
    }
    if (my !== seq) { loading = false; return; }
    const words = likeWords();
    // 公開で作業日のある記録だけ（RLS でも同じ条件。ログイン中の本人の非公開分はここでは出さない）
    let q = supabaseClient.from('maint_records')
      .select(REC_SELECT)
      .eq('is_public', true).not('work_date', 'is', null)
      // 同じ作業日は入力した順（車両ページの歩みと同じ）
      .order('work_date', { ascending: false }).order('created_at', { ascending: true })
      .range(offset, offset + PAGE);
    if (area) q = q.contains('areas', [area]);
    if (task) q = q.contains('tasks', [task]);
    words.forEach(w => { q = q.or(`title.ilike.*${w}*,comment.ilike.*${w}*`); });
    if (model) q = q.in('car_id', modelCarIds.length ? modelCarIds : ['-']);
    // 整備の記事。伏せた行は本人にも RLS で返るので、ここでは明示的に外す
    let qa = null;
    // 記事は印を持たないので、印で絞るときは混ぜない
    if (articlesOn && !task) {
      qa = supabaseClient.from('owner_articles')
        .select('id, car_id, title, url, site_name, published_on, areas, created_at')
        .eq('is_maintenance', true).eq('is_hidden', false)
        .order('published_on', { ascending: false }).order('created_at', { ascending: true })
        .range(aOffset, aOffset + PAGE);
      if (area) qa = qa.contains('areas', [area]);
      words.forEach(w => { qa = qa.ilike('title', `%${w}%`); });
      if (model) qa = qa.in('car_id', modelCarIds.length ? modelCarIds : ['-']);
    }
    const [res, resA] = await Promise.all([q, qa || Promise.resolve({ data: [] })]);
    if (my !== seq) { loading = false; return; }
    if (offset === 0 && aOffset === 0) $('list').textContent = '';
    const error = res.error || resA.error;
    if (error) {
      console.error('[maintenance]', error);
      $('list').appendChild(el('p', 'state', '読み込みに失敗しました。再読み込みしてください。'));
      loading = false; return;
    }
    // 2つの表を「日付の新しい順・同じ日は入力した順」で混ぜ、先頭から PAGE 件だけ出す。
    // 各表は PAGE+1 件読んでいるので、混ぜた結果が PAGE を超えれば続きがある
    const merged = res.data.map(r => ({ kind: 'maint', date: r.work_date, at: r.created_at, r }))
      .concat((resA.data || []).map(r => ({ kind: 'article', date: r.published_on, at: r.created_at, r })))
      .sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : (x.at < y.at ? -1 : x.at > y.at ? 1 : 0)));
    const rows = merged.slice(0, PAGE);
    await loadCars([...new Set(rows.map(x => x.r.car_id))]);
    if (my !== seq) { loading = false; return; }
    if (offset === 0 && aOffset === 0 && !rows.length) {
      $('list').appendChild(el('p', 'state', (qText || model || area || task)
        ? '条件に合う記録はありません。言葉を短くするか、型式・箇所を「すべて」に戻してみてください。'
        : 'まだ記録がありません。'));
    }
    rows.forEach(({ kind, date, r }) => {
      const item = el('div', 'rec');
      item.appendChild(recHead(date, r.car_id));
      item.appendChild(kind === 'article' ? renderArticle(r)
        : MaintView.renderItem(r, { emoji: '🔧', onOpen: rec => track('maint_open', { from: 'list' }), onShare }));
      $('list').appendChild(item);
      if (kind === 'article') aOffset++; else offset++;
    });
    $('moreBtn').classList.toggle('hidden', merged.length <= PAGE);
    loading = false;
  }
  $('moreBtn').addEventListener('click', loadPage);

  setupFilters();
  const sharedId = new URLSearchParams(location.search).get('r');
  if (sharedId && /^[0-9a-f-]{36}$/i.test(sharedId)) loadShared(sharedId).catch(e => console.error('[maintenance]', e));
  reload();
})();
</script>
</body>
</html>
