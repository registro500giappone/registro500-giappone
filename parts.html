<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiat 500 Parts Hub - Registro500</title>
    <style>
        :root { --fiat-red: #c30010; --accent-blue: #007bff; --bg-gray: #f0f2f5; }
        body { font-family: sans-serif; margin: 0; background: var(--bg-gray); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: white; padding: 15px; border-bottom: 3px solid var(--fiat-red); z-index: 1000; }
        .controls { display: flex; gap: 10px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        #search-input { flex: 2; min-width: 200px; }
        .search-btn { background: var(--fiat-red); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        #filter-tags { max-width: 1200px; margin: 10px auto 5px; display: flex; gap: 8px; overflow-x: auto; padding: 5px 10px; min-height: 45px; align-items: center; }
        .tag-btn { background: white; border: 1px solid #ccc; padding: 6px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tag-btn.active { background: var(--fiat-red); color: white; border-color: var(--fiat-red); }

        .content { display: flex; flex: 1; overflow: hidden; }
        /* 表示崩れ対策：カードが潰れないように設定 */
        #results { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; align-content: start; }

        .card { background: white; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; overflow: hidden; min-height: 380px; height: auto; }
        .card-img-box { width: 100%; height: 160px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; flex-shrink: 0; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        
        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .name-jp { font-weight: bold; font-size: 16px; color: #000; margin-bottom: 5px; line-height: 1.4; display: block !important; }
        .name-en { font-size: 11px; color: #666; margin-bottom: 10px; display: block !important; }
        .target-tag { font-size: 11px; color: var(--fiat-red); font-weight: bold; margin-bottom: 5px; }

        .card-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: #fafafa; border-top: 1px solid #eee; flex-shrink: 0; }
        .shop-btn { text-decoration: none; padding: 10px 5px; border-radius: 8px; font-size: 12px; text-align: center; border: 2px solid var(--accent-blue); color: var(--accent-blue); font-weight: bold; display: block; }
        .keep-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }

        .sidebar { width: 340px; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-h { padding: 20px; background: #212529; color: white; font-weight: bold; }
        #keep-list { flex: 1; overflow-y: auto; padding: 15px; }
        .total-box { padding: 20px; background: #f8f9fa; border-top: 3px solid #212529; }
        .total-jpy { font-size: 26px; font-weight: bold; color: var(--fiat-red); }

        @media (max-width: 900px) { .sidebar { width: 100%; height: 250px; } .content { flex-direction: column; } }
    </style>
</head>
<body>

<header>
    <div class="controls">
        <select id="car-select">
            <option value="">すべての適合パーツを表示</option>
            <optgroup label="登録済みの自車" id="my-cars-group"></optgroup>
            <optgroup label="モデル別選択">
                <option value="500 N">500 N</option><option value="500 D">500 D</option>
                <option value="500 F">500 F</option><option value="500 L">500 L</option>
                <option value="500 R">500 R</option>
            </optgroup>
        </select>
        <input type="text" id="search-input" placeholder="パーツ名（例: ヘッドライト）">
        <button onclick="search()" class="search-btn">検索</button>
    </div>
    <div id="filter-tags"></div>
</header>

<div class="content">
    <div id="results"></div>
    <aside class="sidebar">
        <div class="sidebar-h">検討リスト</div>
        <div id="keep-list"></div>
        <div class="total-box">
            <div style="display:flex; justify-content:space-between;"><span>合計 (€)</span><span id="total-eur">€0.00</span></div>
            <div style="display:flex; justify-content:space-between; align-items:baseline;"><span>日本円換算</span><span id="total-jpy" class="total-jpy">¥0</span></div>
        </div>
    </aside>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let jpyRate = 165;
    let currentUser = null;
    let lastSearchResults = [];

    firebase.auth().onAuthStateChanged(user => {
        if (user) { currentUser = user; loadMyCars(); loadKeepList(); }
    });

    async function loadMyCars() {
        const { data } = await _supabase.from('cars').select('model_display_c, handle_name').eq('owner_email', currentUser.email);
        const group = document.getElementById('my-cars-group');
        group.innerHTML = "";
        data?.forEach(car => {
            const opt = document.createElement('option');
            opt.value = car.model_display_c;
            opt.textContent = `${car.handle_name || '自車'} (${car.model_display_c})`;
            group.appendChild(opt);
        });
    }

    async function search(filterKeyword = null) {
        const query = document.getElementById('search-input').value.trim();
        const modelValue = document.getElementById('car-select').value;
        const resultsDiv = document.getElementById('results');
        
        if (!filterKeyword) {
            resultsDiv.innerHTML = "<div style='grid-column:1/-1; text-align:center; padding:50px;'>検索中...</div>";
            let dbQuery = _supabase.from('parts').select('*');
            if (query) dbQuery = dbQuery.or(`name_jp.ilike.%${query}%,name_en.ilike.%${query}%,oem_no.ilike.%${query}%`);
            const { data } = await dbQuery.limit(200);
            lastSearchResults = data || [];
            generateFilterTags(lastSearchResults);
        }

        let displayData = lastSearchResults;
        if (modelValue) {
            const typeKey = modelValue.split(" ").pop();
            displayData = displayData.filter(p => (p.target_cars || "").includes(typeKey) || p.target_cars === "");
        }

        if (filterKeyword && filterKeyword !== "すべて") {
            const keywords = ["ボルト", "ネジ", "パッキン", "ゴム", "バルブ", "電球", "リム", "レンズ"];
            if (filterKeyword === "その他") {
                displayData = displayData.filter(p => !keywords.some(k => (p.name_jp || "").includes(k)));
            } else {
                displayData = displayData.filter(p => (p.name_jp || "").includes(filterKeyword));
            }
        }

        resultsDiv.innerHTML = "";
        displayData.forEach(part => {
            const isAxel = part.shop_name?.includes('Axel');
            const price = isAxel ? (part.price_euro / 1.19) : part.price_euro;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img-box"><img src="${part.image_url || NO_IMAGE_URL}" onerror="this.src='${NO_IMAGE_URL}'"></div>
                <div class="card-body">
                    <div class="target-tag">${part.target_cars || '全車共通'}</div>
                    <div class="name-jp">${part.name_jp || '名称なし'}</div>
                    <div class="name-en">${part.name_en || ''}</div>
                </div>
                <div class="card-footer">
                    <a href="${part.page_url}" target="_blank" class="shop-btn"><span>${part.shop_name}</span><br>€${price.toFixed(2)}</a>
                    <button onclick="keepPart(this, ${part.id}, '${part.shop_name}')" class="keep-btn">リストに追加</button>
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function generateFilterTags(data) {
        const tagArea = document.getElementById('filter-tags');
        const keywords = ["ボルト", "ネジ", "パッキン", "ゴム", "バルブ", "電球", "リム", "レンズ"];
        const found = [];
        let categorizedIds = new Set();

        keywords.forEach(k => {
            const matched = data.filter(p => (p.name_jp || "").includes(k));
            if (matched.length > 0) {
                found.push({k, count: matched.length});
                matched.forEach(p => categorizedIds.add(p.id));
            }
        });

        tagArea.innerHTML = `<button class="tag-btn active" onclick="applyTag(this, 'すべて')">すべて (${data.length})</button>`;
        found.forEach(item => {
            tagArea.innerHTML += `<button class="tag-btn" onclick="applyTag(this, '${item.k}')">${item.k} (${item.count})</button>`;
        });
        
        const otherCount = data.length - categorizedIds.size;
        if (otherCount > 0) {
            tagArea.innerHTML += `<button class="tag-btn" onclick="applyTag(this, 'その他')">その他 (${otherCount})</button>`;
        }
    }

    function applyTag(btn, k) {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        search(k);
    }

    async function keepPart(btn, partId, shopName) {
        const { error } = await _supabase.from('user_selections').insert([
            { user_id: currentUser.uid, part_id: parseInt(partId), shop_name: shopName }
        ]);
        if (error) {
            alert("エラー詳細: " + error.message);
        } else {
            btn.innerText = "追加済み";
            btn.style.background = "#28a745";
            loadKeepList();
        }
    }

    async function loadKeepList() {
        const { data: selections } = await _supabase.from('user_selections').select('*, parts:part_id(*)').eq('user_id', currentUser.uid);
        const listDiv = document.getElementById('keep-list');
        listDiv.innerHTML = "";
        let total = 0;
        selections?.forEach(s => {
            if (s.parts) {
                const price = s.shop_name.includes('Axel') ? (s.parts.price_euro/1.19) : s.parts.price_euro;
                total += price;
                listDiv.innerHTML += `<div>${s.parts.name_jp} - €${price.toFixed(2)}</div>`;
            }
        });
        document.getElementById('total-eur').innerText = `€${total.toFixed(2)}`;
        document.getElementById('total-jpy').innerText = `¥${Math.round(total * 165).toLocaleString()}`;
    }
</script>
</body>
</html>
