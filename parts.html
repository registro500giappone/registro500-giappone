<!-- 【検証モード】parts.html (主要部分のみ抜粋、全文差し替え推奨) -->
<style>
    /* ホバーや隠し要素をすべて止め、全情報をフラットに出す */
    .card { background: #fff; border: 2px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .debug-info { background: #eee; padding: 5px; font-size: 11px; border-radius: 4px; color: #d00; font-weight: bold; }
    .card-img-box { height: 120px; }
    .card-img-box img { max-height: 100%; }
</style>

<!-- JSのカード生成部分をこのように書き換えます -->
<script>
    // search関数内の生成ロジックを透明化
    resultsDiv.innerHTML = "";
    displayData.forEach(part => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="debug-info">
                DB-ID: ${part.id} | Shop: ${part.shop_name}
            </div>
            <div class="card-img-box">
                <img src="${part.image_url || NO_IMAGE_URL}">
            </div>
            <div>
                <strong>OEM/品番: ${part.oem_no || '不明'}</strong><br>
                <small>日本語名: ${part.name_jp}</small><br>
                <small>英語名: ${part.name_en}</small>
            </div>
            <div style="font-size: 18px; color: var(--fiat-red); font-weight: bold;">
                €${part.price_euro}
            </div>
            <div style="border-top: 1px solid #ccc; padding-top: 10px;">
                <a href="${part.page_url}" target="_blank" style="display:block; text-align:center; background:var(--accent-blue); color:#fff; text-decoration:none; padding:10px; border-radius:5px;">
                    このデータのリンク先を開く
                </a>
            </div>
        `;
        resultsDiv.appendChild(card);
    });
</script>
