  <style>
    /* ========== ベース設定 ========== */
    :root {
      --bg-main: #f4f4f7;

    html { font-size: 16px; max-width: 100%; overflow-x: hidden; }

    .page { max-width: 1200px; margin: 0 auto; }

    .logo-pc { display: none; }
    
    .brand-text-group { display: flex; flex-direction: column; gap: 6px; }
    .brand-title { display: none; }
    .page-subtitle { margin: 0; font-size: 0.85rem; font-weight: 500; color: var(--text-main); line-height: 1.4; }
    .page-meta { margin: 0; font-size: 0.85rem; color: var(--accent); font-weight: 600; }
    .goal-pill { margin-right: 6px; }

    /* ===== 右側操作エリア ===== */
    .page-header-right { display: flex; flex-direction: column; gap: 16px; }
    .sort-area { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }

    .search-box { position: relative; width: 100%; }
    .search-input {
      padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border-soft);
      background-color: #ffffff; font-size: 0.9rem; width: 100%; outline: none; transition: all 0.2s ease;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    
    @media (min-width: 768px) { .search-box { width: auto; } .search-input { width: 220px; } }

    .sort-left { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-sub); }

    }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 18px; border-radius: 999px; border: 1px solid var(--accent-border);
      background-color: #ffffff; color: var(--accent); font-size: 0.9rem; font-weight: 600;

  <button class="refresh-button" onclick="forceReload()">↻ 更新</button>

  <script>
    let carsData = [];
    const CACHE_KEY = 'registro500_local_data';

    (function() {
      const RELOAD_THRESHOLD = 10 * 60 * 1000;
      let lastVisibilityChange = new Date().getTime();
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          const now = new Date().getTime();
          if (now - lastVisibilityChange > RELOAD_THRESHOLD) { window.location.reload(true); }
          lastVisibilityChange = now;
        }
      });
    })();

    function forceReload() { window.location.reload(true); }

    function shareSite() {
      const shareData = { title: 'Registro500 Giappone', text: '日本のチンクエチェント・オーナー名鑑。', url: 'https://www.registro500.com/' };
      if (navigator.share) { navigator.share(shareData).catch(() => {}); }
      else { navigator.clipboard.writeText(shareData.url); alert('URLをコピーしました！'); }
    }

    async function initApp() {
      const localData = localStorage.getItem(CACHE_KEY);
      if (localData) {
        try {
          carsData = JSON.parse(localData);
          renderCars(document.getElementById('sortSelect').value);
          updateCarCount();
          document.getElementById('loading').style.display = 'none';
        } catch (e) { console.error(e); }
      }
      fetchCars();
      checkNewsBadge();
      initAuth();
    }

async function fetchCars() {
    try {
      const { data, error } = await supabaseClient
        .from('cars')
        .select(`
          PhotoMain:photo_main,
          Model_DisplayC:model_display_c,
          Year:year,
          Prefecture:prefecture,
          HandleName:handle_name,
          DocumentID:document_id,
          updatedAt:updated_at,
          last_update_date
        `);

      if (error) throw error;

      if (data) {
        carsData = data;
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        renderCars(document.getElementById('sortSelect').value);
        updateCarCount();
      }
      document.getElementById('loading').style.display = 'none';
    } catch (e) {
      console.error("Supabase読込エラー:", e);
      document.getElementById('loading').innerText = "エラー: データの取得に失敗しました。";
    }
  }

async function checkNewsBadge() {
      try {
        const { data, error } = await supabaseClient
          .from('news')
          .select('date')
          .order('date', { ascending: false })
          .limit(1);

        if (!error && data && data.length > 0) {
          const latestDate = new Date(data[0].date);
          const diff = Math.ceil((new Date() - latestDate) / (1000 * 60 * 60 * 24));
          if (diff <= 7) document.getElementById('newsBadge').style.display = 'block';
        }
      } catch (e) {}
    }
    function parseDocNumber(id) { const m = /^DOC_(\d+)$/.exec(String(id)); return m ? parseInt(m[1], 10) : 0; }

    // ログインユーザー情報
    let currentUser = { uid: null, docId: null };
    let userRelations = {}; // { "DOC_123": "want", "DOC_456": "met" }
    let isAuthInitialized = false; // 認証初期化完了フラグ

    // 認証初期化 (Firebase Auth)
    async function initAuth() {
      console.log("initAuth started (Firebase)");
      try {
        auth.onAuthStateChanged(async (user) => {
          console.log("AuthStateChanged:", user ? "Logged in" : "Logged out");
          await setSession(user);
          isAuthInitialized = true;
        });
      } catch (e) {
        console.error("initAuth exception:", e);
        isAuthInitialized = true;
      }
    }

    // ログイン処理
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        console.error("Login failed:", error);
        alert("ログインに失敗しました: " + error.message);
      });
    }

    // ログアウト処理
    function logout() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    async function setSession(user) {
      const loginBtn = document.getElementById('menuLoginBtn');
      const logoutBtn = document.getElementById('menuLogoutBtn');
      const userInfo = document.getElementById('menuUserInfo');

      if (user) {
        console.log("User logged in:", user.uid);
        currentUser.uid = user.uid;
        currentUser.email = user.email;
        
        // メニュー表示更新
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
        if(userInfo) {
          userInfo.style.display = 'block';
          userInfo.textContent = user.email;
        }

        await initUserRelations();
      } else {
        console.log("User not logged in");
        currentUser = { uid: null, docId: null };
        userRelations = {};
        
        // メニュー表示更新
        if(loginBtn) loginBtn.style.display = 'block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        if(userInfo) userInfo.style.display = 'none';

        updateStatusSummary();
        const sortVal = document.getElementById('sortSelect').value;
        if (carsData.length > 0) renderCars(sortVal);
      }
    }

    async function initUserRelations() {
      if (!currentUser.uid) return;

      try {
        // 1. ユーザー関係データの取得
        const { data: relations, error: relError } = await supabaseClient
          .from('user_relations')
          .select('target_car_id, status')
          .eq('user_id', currentUser.uid);
          
        if (relError) {
          console.error("Relations fetch error:", relError);
          // テーブルが存在しない場合などのエラーハンドリング
          if (relError.code === '42P01') { // undefined_table
             console.warn("Table 'user_relations' does not exist.");
          }
        }

        if (relations) {
          userRelations = {};
          relations.forEach(item => {
            userRelations[item.target_car_id] = item.status;
          });
        }

        // 2. 自分の車IDを取得
        const { data: myCars, error: carError } = await supabaseClient
          .from('cars')
          .select('document_id')
          .eq('owner_email', currentUser.email.toLowerCase())
          .limit(1);

        if (myCars && myCars.length > 0) {
          currentUser.docId = myCars[0].document_id;
        }

        updateStatusSummary();
        renderCars(document.getElementById('sortSelect').value);
      } catch (e) { 
        console.error("User data load error:", e); 
      }
    }

    function renderCars(sortType) {
      const listEl = document.getElementById('carList');
      listEl.innerHTML = '';
      const cars = [...carsData];
      
      // ソートロジック
      if (sortType === 'oldest') cars.sort((a,b) => parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID));
      else if (sortType === 'updated_desc') cars.sort((a,b) => new Date(b.updatedAt||0) - new Date(a.updatedAt||0));
      else if (sortType === 'year_desc') cars.sort((a,b) => (Number(b.Year)||0) - (Number(a.Year)||0));
      else if (sortType === 'year_asc') cars.sort((a,b) => (Number(a.Year)||0) - (Number(b.Year)||0));
      else if (sortType === 'status_priority') {
        // ステータス順: want > met > none
        const score = (status) => {
          if (status === 'want') return 3;
          if (status === 'met') return 2;
          return 1;
        };
        cars.sort((a,b) => {
          const scoreA = score(userRelations[a.DocumentID]);
          const scoreB = score(userRelations[b.DocumentID]);
          if (scoreA !== scoreB) return scoreB - scoreA; // 降順
          return parseDocNumber(a.DocumentID) - parseDocNumber(b.DocumentID);
        });
      }
      else cars.sort((a,b) => parseDocNumber(b.DocumentID) - parseDocNumber(a.DocumentID));

      const now = new Date();
      cars.forEach(car => {
        const card = document.createElement('article');
        card.className = 'car-card';

        // 更新バッジ判定 (7日以内)
        let updateBadgeHtml = '';
        if (car.last_update_date) {
          const lastDate = new Date(car.last_update_date);
          const diffDays = (now - lastDate) / (1000 * 60 * 60 * 24);
          if (diffDays <= 7) {
            updateBadgeHtml = `<div class="badge-update-dot"></div>`;
          }
        }

        // 自分の車かどうか判定
        const isMyCar = (currentUser.docId && car.DocumentID === currentUser.docId);
        const currentStatus = userRelations[car.DocumentID]; // 'want' or 'met' or undefined

        const modelClean = (car.Model_DisplayC||'').replace(/\s*\(\d{4}\)\s*$/, '');
        
        // ステータスボタンエリアの生成
        let statusActionHtml = '';
        if (!isMyCar) {
           const wantActive = currentStatus === 'want' ? 'active' : '';
           const metActive = currentStatus === 'met' ? 'active' : '';
           
           statusActionHtml = `
           <div class="status-action-area" onclick="event.preventDefault(); event.stopPropagation();">
             <button class="status-btn ${wantActive}" onclick="toggleStatus(this, 'want', '${car.DocumentID}')">
               <span>⭐️</span><span class="status-label">気になる</span>
             </button>
             <button class="status-btn ${metActive}" onclick="toggleStatus(this, 'met', '${car.DocumentID}')">
               <span>🤝</span><span class="status-label">挨拶済</span>
             </button>
           </div>`;
        }

        card.innerHTML = `
          ${updateBadgeHtml}
          <a href="detail.html?doc=${encodeURIComponent(car.DocumentID)}" class="car-link" title="【${car.Prefecture||'-'}】 ${car.HandleName} / ${car.Model_DisplayC}">
            <div class="car-image-wrap">
              <img src="${car.PhotoMain || NO_IMAGE_URL}" class="car-image" loading="lazy" onerror="this.src=NO_IMAGE_URL">
            </div>
            <div class="car-main">
              <div class="car-meta-row">
                <span class="car-year">${car.Year ? car.Year+'年' : ''}</span>
                ${car.Prefecture ? `<span class="car-pref">${car.Prefecture}</span>` : ''}
              </div>
              <h3 class="car-model">${modelClean}</h3>
              <p class="car-owner">${car.HandleName || ''}</p>
            </div>
          </a>
          ${statusActionHtml}`;
        listEl.appendChild(card);
      });
      applySearchFilter();
      updateStatusSummary();
    }

    // ステータス集計更新
    function updateStatusSummary() {
      let wantCount = 0;
      let metCount = 0;
      Object.values(userRelations).forEach(status => {
        if (status === 'want') wantCount++;
        if (status === 'met') metCount++;
      });
      document.getElementById('countWant').textContent = wantCount;
      document.getElementById('countMet').textContent = metCount;
    }

    function applySearchFilter() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.car-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        const linkTitle = card.querySelector('.car-link').title.toLowerCase();
        card.style.display = (text.includes(term) || linkTitle.includes(term)) ? '' : 'none';
      });
    }

    document.getElementById('searchInput').addEventListener('input', applySearchFilter);
    document.getElementById('sortSelect').addEventListener('change', e => renderCars(e.target.value));

    let viewMode = 'card'; // 'card', 'list', 'mosaic'
    function toggleViewMode() {
      const listEl = document.getElementById('carList');
      const btnEl = document.getElementById('viewToggleBtn');
      const sortStatusOpt = document.getElementById('sortStatusOption');
      const summaryBar = document.getElementById('statusSummary');
      
      if (viewMode === 'card') {
        viewMode = 'list';
        listEl.classList.remove('view-mosaic');
        listEl.classList.add('view-list');
        btnEl.textContent = '▦ モザイク表示';
        sortStatusOpt.style.display = 'block';
        summaryBar.style.display = 'flex'; // 集計バー表示
      } else if (viewMode === 'list') {
        viewMode = 'mosaic';
        listEl.classList.remove('view-list');
        listEl.classList.add('view-mosaic');
        btnEl.textContent = '📄 カード表示';
        sortStatusOpt.style.display = 'none';
        summaryBar.style.display = 'none'; // 集計バー非表示
        if(document.getElementById('sortSelect').value === 'status_priority') {
           document.getElementById('sortSelect').value = 'newest';
           renderCars('newest');
        }
      } else {
        viewMode = 'card';
        listEl.classList.remove('view-mosaic');
        listEl.classList.remove('view-list');
        btnEl.textContent = '📋 リスト表示';
        sortStatusOpt.style.display = 'none';
        summaryBar.style.display = 'none'; // 集計バー非表示
        if(document.getElementById('sortSelect').value === 'status_priority') {
           document.getElementById('sortSelect').value = 'newest';
           renderCars('newest');
        }
      }
    }

    async function toggleStatus(btn, type, docId) {
      if (!isAuthInitialized) {
        alert("認証情報を読み込み中です。しばらく待ってから再度お試しください。");
        return;
      }

      if (!currentUser.uid) {
        alert(`この機能を使うにはログインが必要です。\n(Debug: UID is null)`);
        return;
      }

      // 現在の状態を確認
      const currentStatus = userRelations[docId];
      let newStatus = type;

      // 同じボタンを再度押した場合は解除 (null)
      if (currentStatus === type) {
        newStatus = null;
      }

      // UIを先行更新 (Optimistic UI)
      userRelations[docId] = newStatus;
      
      // ボタンの見た目を更新
      const parent = btn.parentElement;
      const wantBtn = parent.querySelector('button:nth-child(1)');
      const metBtn = parent.querySelector('button:nth-child(2)');
      
      wantBtn.classList.remove('active');
      metBtn.classList.remove('active');
      
      if (newStatus === 'want') wantBtn.classList.add('active');
      if (newStatus === 'met') metBtn.classList.add('active');

      updateStatusSummary();

      // Supabaseへ保存
      try {
        if (newStatus) {
          // Upsert (Insert or Update)
          const { error } = await supabaseClient
            .from('user_relations')
            .upsert({ 
              user_id: currentUser.uid, 
              target_car_id: docId, 
              status: newStatus,
              updated_at: new Date()
            }, { onConflict: 'user_id, target_car_id' });
            
          if (error) throw error;
        } else {
          // Delete (解除の場合)
          const { error } = await supabaseClient
            .from('user_relations')
            .delete()
            .eq('user_id', currentUser.uid)
            .eq('target_car_id', docId);
            
          if (error) throw error;
        }
      } catch (e) {
        console.error("Save error:", e);
        alert(`保存に失敗しました。\nError: ${e.message || e.error_description || JSON.stringify(e)}`);
        // ロールバック処理が必要ならここに記述
      }
    }

    function updateCarCount() {
      const countEl = document.getElementById('carCountValue');
      if (countEl) countEl.textContent = carsData.filter(c => c.DocumentID).length;
    }
    initApp();
  </script>
</body>
